<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Moderation Dashboard — Aspinora Journals</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,400;0,9..144,500;0,9..144,600;0,9..144,700;1,9..144,400;1,9..144,500&family=Plus+Jakarta+Sans:ital,wght@0,400;0,500;0,600;0,700;0,800;1,500&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  color-scheme: dark;
  /* Dark administration console palette. Warm-neutral charcoal, not pure
     black/grey — keeps a trace of the brand without reading as consumer/social. */
  --cream:        #17140F;   /* page background (kept var name for minimal diff) */
  --cream-deep:   #1D1912;   /* hover / deep surface */
  --paper:        #211D16;   /* card / panel surface */
  --paper-raised: #2A251C;   /* raised surface (topbar, drawers) */
  --ink:          #F1EBDF;   /* primary text */
  --ink-soft:     #B4AB99;   /* secondary text */
  --ink-faint:    #7C7360;   /* tertiary / label text */

  --orange:       #F1751B;   /* primary accent — Journals brand */
  --orange-deep:  #FF8F40;
  --orange-soft:  rgba(241,117,27,.16);
  --sky:          #7FB8D9;   /* neutral information */
  --sky-soft:     rgba(127,184,217,.14);
  --lavender:     #B0A2E0;   /* neutral information (secondary) */
  --lavender-soft:rgba(176,162,224,.14);
  --mint:         #5FC08F;   /* success / restored / resolved */
  --mint-soft:    rgba(95,192,143,.14);
  --gold:         #E8B93F;   /* warning / pending */
  --gold-soft:    rgba(232,185,63,.14);
  --red:          #E4615F;   /* destructive only */
  --red-soft:     rgba(228,97,95,.14);

  --line:         rgba(241,235,223,0.08);
  --line-strong:  rgba(241,235,223,0.16);
  --shadow-soft:  0 4px 20px rgba(0,0,0,.28);
  --shadow-mid:   0 12px 34px rgba(0,0,0,.36);
  --shadow-deep:  0 24px 60px rgba(0,0,0,.5);

  --font-display: 'Fraunces', Georgia, serif;
  --font-body:    'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
  --font-mono:    'Space Mono', 'SFMono-Regular', monospace;

  --radius-sm: 8px;
  --radius-md: 12px;
  --radius-lg: 16px;
  --ease: cubic-bezier(.22,.9,.32,1);
  --sidebar-w: 250px;
}
*,*::before,*::after{ box-sizing:border-box; }
[hidden]{ display:none !important; }
html,body{ margin:0; padding:0; height:100%; }
body{
  background:
    radial-gradient(1200px 700px at 106% -10%, rgba(241,117,27,.06) 0%, transparent 58%),
    radial-gradient(1000px 640px at -10% 108%, rgba(176,162,224,.05) 0%, transparent 55%),
    linear-gradient(180deg, var(--cream) 0%, #120F0A 100%);
  background-attachment:fixed, fixed, fixed;
  color:var(--ink);
  font-family:var(--font-body);
  font-size:15px;
  line-height:1.55;
}
h1,h2,h3,h4{ font-family:var(--font-display); font-weight:600; margin:0; color:var(--ink); }
button{ font-family:inherit; cursor:pointer; }
a{ color:inherit; }
::selection{ background:var(--orange-soft); }

/* ---------- preview / role switcher strip ---------- */
.preview-strip{
  background:#0E0C08; color:var(--gold); font-size:12.5px; font-weight:600;
  padding:7px 18px; display:flex; align-items:center; justify-content:center; gap:14px;
  letter-spacing:.02em; position:sticky; top:0; z-index:60; border-bottom:1px solid rgba(232,185,63,.25); flex-wrap:wrap;
}
.preview-strip .dot{ width:7px;height:7px;border-radius:50%;background:var(--gold); }
.role-toggle{ display:inline-flex; background:rgba(255,255,255,.06); border-radius:999px; padding:3px; gap:2px; flex-wrap:wrap; }
.role-toggle button{
  border:none; background:transparent; color:var(--ink-soft); font-size:11.5px; font-weight:700;
  padding:5px 12px; border-radius:999px; opacity:.75; transition:all .18s var(--ease); white-space:nowrap;
}
.role-toggle button.active{ background:var(--orange); opacity:1; color:#fff; }

/* ---------- shell layout ---------- */
.dash-shell{ display:flex; min-height:calc(100vh - 34px); }
.sidebar{
  width:var(--sidebar-w); flex:none; background:var(--paper); border-right:1px solid var(--line);
  display:flex; flex-direction:column; padding:20px 14px; position:sticky; top:34px; height:calc(100vh - 34px); z-index:40;
  transition:transform .25s var(--ease);
}
.sb-brand{ display:flex; align-items:center; gap:10px; padding:6px 8px 20px; }
.sb-brand .mark{ width:34px;height:34px;border-radius:10px; background:linear-gradient(135deg,var(--orange),var(--orange-deep)); display:flex;align-items:center;justify-content:center; color:#fff; font-family:var(--font-display); font-weight:700; font-size:17px; box-shadow:var(--shadow-soft); }
.sb-brand .txt{ display:flex; flex-direction:column; line-height:1.15; }
.sb-brand .txt b{ font-family:var(--font-display); font-size:15px; }
.sb-brand .txt span{ font-size:11px; color:var(--ink-faint); font-weight:600; letter-spacing:.03em; text-transform:uppercase; }

.sb-nav{ display:flex; flex-direction:column; gap:2px; flex:1; overflow-y:auto; }
.sb-section-label{ font-size:10.5px; font-weight:800; letter-spacing:.08em; text-transform:uppercase; color:var(--ink-faint); margin:14px 10px 6px; }
.sb-link{
  display:flex; align-items:center; gap:10px; padding:9px 10px; border-radius:var(--radius-sm);
  border:none; background:transparent; color:var(--ink-soft); font-size:13.5px; font-weight:600; text-align:left; width:100%;
  transition:background .15s var(--ease), color .15s var(--ease);
}
.sb-link .ic{ width:18px; text-align:center; font-size:15px; }
.sb-link:hover{ background:var(--cream-deep); color:var(--ink); }
.sb-link.active{ background:var(--orange-soft); color:var(--orange-deep); }
.sb-link .cnt{ margin-left:auto; background:var(--orange); color:#17140F; font-size:10.5px; font-weight:700; padding:1px 7px; border-radius:999px; }
.sb-link.active .cnt{ background:var(--orange-deep); }
.sb-lock{ margin-left:auto; opacity:.4; font-size:11px; }

.sb-profile{
  border-top:1px solid var(--line); padding-top:14px; margin-top:10px; display:flex; align-items:center; gap:10px;
}
.sb-profile .av{ width:36px;height:36px;border-radius:50%; background:var(--lavender-soft); color:var(--lavender); display:flex; align-items:center; justify-content:center; font-weight:800; font-family:var(--font-display); font-size:15px; flex:none; }
.sb-profile .meta b{ display:block; font-size:13px; }
.sb-profile .meta span{ font-size:11px; color:var(--ink-faint); font-weight:600; text-transform:uppercase; letter-spacing:.03em; }

/* ---------- main ---------- */
.main{ flex:1; min-width:0; display:flex; flex-direction:column; }
.topbar{
  position:sticky; top:34px; z-index:30; background:rgba(23,20,15,.85); backdrop-filter:blur(10px) saturate(1.4);
  border-bottom:1px solid var(--line); padding:14px 26px; display:flex; align-items:center; gap:16px;
}
.mobile-menu-btn{ display:none; border:1px solid var(--line-strong); background:var(--paper); border-radius:10px; width:36px; height:36px; align-items:center; justify-content:center; font-size:16px; }
.topbar h1{ font-size:20px; flex:none; }
.gsearch{ position:relative; flex:1; max-width:460px; }
.gsearch input{
  width:100%; padding:9px 14px 9px 34px; border-radius:999px; border:1px solid var(--line-strong); background:var(--paper);
  font-family:inherit; font-size:13px; color:var(--ink);
}
.gsearch svg{ position:absolute; left:12px; top:50%; transform:translateY(-50%); opacity:.5; }
.gsearch-results{
  position:absolute; top:calc(100% + 8px); left:0; right:0; background:var(--paper); border:1px solid var(--line);
  border-radius:var(--radius-md); box-shadow:var(--shadow-deep); max-height:420px; overflow-y:auto; z-index:80; padding:8px;
}
.gsearch-group-label{ font-size:10.5px; font-weight:800; letter-spacing:.06em; text-transform:uppercase; color:var(--ink-faint); padding:8px 8px 4px; }
.gsearch-item{ display:flex; align-items:center; gap:10px; padding:8px; border-radius:10px; cursor:pointer; }
.gsearch-item:hover{ background:var(--cream-deep); }
.gsearch-item .t{ font-size:13px; font-weight:600; }
.gsearch-item .s{ font-size:11.5px; color:var(--ink-faint); }
.topbar .spacer{ flex:1; }
.topbar-right{ display:flex; align-items:center; gap:10px; margin-left:auto; }

.view-root{ padding:24px 26px 60px; flex:1; }

/* ---------- cards / grid ---------- */
.stat-grid{ display:grid; grid-template-columns:repeat(4,1fr); gap:14px; margin-bottom:22px; }
.stat-card{
  background:var(--paper); border:1px solid var(--line); border-radius:var(--radius-md); padding:16px 18px;
  box-shadow:var(--shadow-soft); position:relative; overflow:hidden;
}
.stat-card .tag{ position:absolute; top:0; left:0; width:4px; height:100%; }
.stat-card b{ display:block; font-size:26px; font-family:var(--font-display); line-height:1.1; margin-top:2px; }
.stat-card .lbl{ font-size:11.5px; font-weight:700; color:var(--ink-faint); text-transform:uppercase; letter-spacing:.04em; }
.stat-card .sub{ font-size:11.5px; color:var(--ink-soft); margin-top:4px; }

.panel{ background:var(--paper); border:1px solid var(--line); border-radius:var(--radius-lg); box-shadow:var(--shadow-soft); padding:20px; margin-bottom:20px; }
.panel-head{ display:flex; align-items:center; justify-content:space-between; margin-bottom:14px; gap:10px; flex-wrap:wrap; }
.panel-head h3{ font-size:16px; }

.two-col{ display:grid; grid-template-columns:1.6fr 1fr; gap:18px; }
.two-col.even{ grid-template-columns:1fr 1fr; }

/* ---------- tables ---------- */
.dtable{ width:100%; border-collapse:collapse; font-size:13px; }
.table-scroll{ overflow-x:auto; -webkit-overflow-scrolling:touch; }
.panel:has(> table.dtable), .panel:has(> .dtable){ overflow-x:auto; -webkit-overflow-scrolling:touch; }
.dtable th{ text-align:left; font-size:10.5px; text-transform:uppercase; letter-spacing:.05em; color:var(--ink-faint); font-weight:800; padding:8px 10px; border-bottom:1px solid var(--line-strong); white-space:nowrap; }
.dtable td{ padding:10px; border-bottom:1px solid var(--line); vertical-align:middle; }
.dtable tbody tr{ cursor:pointer; transition:background .12s var(--ease); }
.dtable tbody tr:hover{ background:var(--cream-deep); }
.caseid{ font-family:var(--font-mono); font-size:11.5px; color:var(--ink-soft); }
.muted{ color:var(--ink-faint); font-size:12px; }
.checkbox-cell{ width:30px; }

/* ---------- badges / pills ---------- */
.badge{ display:inline-flex; align-items:center; gap:4px; font-size:10.5px; font-weight:800; padding:3px 9px; border-radius:999px; text-transform:uppercase; letter-spacing:.03em; white-space:nowrap; }
.badge.orange{ background:var(--orange-soft); color:var(--orange-deep); }
.badge.sky{ background:var(--sky-soft); color:var(--sky); }
.badge.mint{ background:var(--mint-soft); color:var(--mint); }
.badge.lav{ background:var(--lavender-soft); color:var(--lavender); }
.badge.gold{ background:var(--gold-soft); color:var(--gold); }
.badge.red{ background:var(--red-soft); color:var(--red); }
.badge.grey{ background:var(--cream-deep); color:var(--ink-soft); }
.badge.ink{ background:var(--ink); color:var(--cream); }

/* ---------- filters ---------- */
.filter-row{ display:flex; gap:8px; flex-wrap:wrap; margin-bottom:16px; align-items:center; }
.chip{ border:1px solid var(--line-strong); background:var(--paper); padding:6px 13px; border-radius:999px; font-size:12.5px; font-weight:700; color:var(--ink-soft); transition:all .15s var(--ease); }
.chip.active{ background:var(--ink); border-color:var(--ink); color:var(--cream); }
.search-mini{ border:1px solid var(--line-strong); background:var(--paper); color:var(--ink); border-radius:999px; padding:6px 14px; font-size:12.5px; min-width:200px; margin-left:auto; font-family:inherit; }
.search-mini::placeholder{ color:var(--ink-faint); }
.field-label{ display:block; font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:.03em; color:var(--ink-faint); margin-bottom:5px; }
.duration-row{ display:flex; gap:8px; margin-bottom:10px; flex-wrap:wrap; }
.radio-pill{ display:inline-flex; align-items:center; gap:6px; border:1px solid var(--line-strong); border-radius:999px; padding:6px 13px; font-size:12.5px; font-weight:600; cursor:pointer; }
.radio-pill input{ accent-color:var(--orange); }
input[type="checkbox"], input[type="radio"]{ accent-color:var(--orange); }

/* ---------- buttons ---------- */
.btn{ display:inline-flex; align-items:center; gap:6px; border:none; border-radius:999px; padding:9px 18px; font-weight:700; font-size:13px; transition:all .15s var(--ease); }
.btn.primary{ background:var(--orange); color:#fff; box-shadow:0 6px 18px rgba(241,117,27,.28); }
.btn.primary:hover{ background:var(--orange-deep); }
.btn.ghost{ background:transparent; border:1px solid var(--line-strong); color:var(--ink); }
.btn.ghost:hover{ background:var(--cream-deep); }
.btn.danger{ background:var(--red); color:#fff; }
.btn.danger:hover{ background:#C9524F; }
.btn.soft{ background:var(--cream-deep); color:var(--ink); }
.btn.sm{ padding:6px 13px; font-size:12px; }
.btn:disabled{ opacity:.45; cursor:not-allowed; }
.iconbtn{ border:1px solid var(--line-strong); background:var(--paper); width:32px; height:32px; border-radius:9px; display:inline-flex; align-items:center; justify-content:center; font-size:14px; }
.iconbtn:hover{ background:var(--cream-deep); }

/* ---------- empty/loading/error/no-results ---------- */
.state-box{ text-align:center; padding:46px 20px; color:var(--ink-faint); }
.state-box .ic{ font-size:30px; margin-bottom:10px; }
.state-box h4{ font-size:15px; color:var(--ink-soft); margin-bottom:4px; }
.state-box p{ font-size:12.5px; margin:0 0 12px; }
.skel{ background:linear-gradient(90deg,var(--cream-deep) 25%, var(--paper) 37%, var(--cream-deep) 63%); background-size:400% 100%; animation:skel 1.4s ease infinite; border-radius:8px; }
@keyframes skel{ 0%{background-position:100% 0} 100%{background-position:0 0} }
.skel-row{ height:38px; margin-bottom:8px; }
.skel-card{ height:78px; }

/* ---------- drawer / modal ---------- */
.drawer-scrim{ position:fixed; inset:0; background:rgba(43,36,28,.4); z-index:200; display:none; align-items:stretch; justify-content:flex-end; }
.drawer-scrim.open{ display:flex; }
.drawer{ width:min(560px,94vw); background:var(--cream); height:100%; overflow-y:auto; box-shadow:var(--shadow-deep); animation:drawer-in .25s var(--ease); padding:22px 24px 60px; }
@keyframes drawer-in{ from{transform:translateX(30px); opacity:0;} to{transform:translateX(0); opacity:1;} }
.drawer-close{ float:right; }
.modal-scrim{ position:fixed; inset:0; background:rgba(43,36,28,.5); z-index:300; display:none; align-items:center; justify-content:center; padding:20px; }
.modal-scrim.open{ display:flex; }
.modal-box{ width:min(440px,94vw); background:var(--paper); border-radius:var(--radius-lg); box-shadow:var(--shadow-deep); padding:22px; }
.modal-box h3{ font-size:17px; margin-bottom:6px; }
.modal-box p.sub{ font-size:12.5px; color:var(--ink-soft); margin:0 0 14px; }
textarea{ width:100%; min-height:80px; border:1px solid var(--line-strong); border-radius:var(--radius-sm); padding:10px; font-family:inherit; font-size:13px; resize:vertical; background:var(--paper); color:var(--ink); }
textarea::placeholder{ color:var(--ink-faint); }
.modal-actions{ display:flex; justify-content:flex-end; gap:8px; margin-top:16px; }

/* ---------- misc detail ---------- */
.kv{ display:grid; grid-template-columns:120px 1fr; gap:6px 10px; font-size:12.5px; margin:14px 0; }
.kv b{ color:var(--ink-faint); font-weight:700; font-size:11px; text-transform:uppercase; letter-spacing:.03em; }
.content-preview-box{ background:var(--cream-deep); border-radius:var(--radius-sm); padding:14px; font-size:13px; color:var(--ink-soft); margin:12px 0; border-left:3px solid var(--orange); }
.divider{ border:none; border-top:1px solid var(--line); margin:18px 0; }
.timeline{ border-left:2px solid var(--line-strong); padding-left:16px; display:flex; flex-direction:column; gap:16px; }
.timeline .tl-item{ position:relative; }
.timeline .tl-item::before{ content:""; position:absolute; left:-21px; top:3px; width:9px; height:9px; border-radius:50%; background:var(--orange); }
.timeline .tl-time{ font-size:11px; color:var(--ink-faint); font-weight:700; }
.timeline .tl-body{ font-size:13px; margin-top:2px; }
.note-item{ background:var(--gold-soft); border:1px dashed var(--gold); border-radius:var(--radius-sm); padding:10px 12px; margin-bottom:8px; font-size:12.5px; }
.note-item .who{ font-weight:700; font-size:11px; color:var(--gold); text-transform:uppercase; letter-spacing:.03em; margin-bottom:2px; }
.notif-preview{ background:var(--paper); border:1px solid var(--line); border-radius:var(--radius-md); padding:14px 16px; max-width:380px; box-shadow:var(--shadow-soft); }
.notif-preview .from{ font-size:11px; font-weight:700; color:var(--ink-faint); text-transform:uppercase; letter-spacing:.03em; margin-bottom:6px; }
.notif-preview .msg{ font-size:13px; margin-bottom:8px; }
.notif-preview .meta{ font-size:11px; color:var(--ink-faint); }
.immutable-note{ display:flex; align-items:center; gap:8px; font-size:11.5px; color:var(--ink-faint); font-weight:700; background:var(--cream-deep); padding:8px 12px; border-radius:999px; margin-bottom:14px; }
.linked-item{ display:flex; flex-direction:column; gap:2px; padding:9px 12px; border:1px solid var(--line); border-radius:var(--radius-sm); margin-bottom:6px; cursor:pointer; transition:background .12s var(--ease); }
.linked-item:hover{ background:var(--cream-deep); }
.linked-item b{ font-size:12.5px; }
.linked-item .muted{ font-size:12px; }
.bulk-bar{ position:sticky; top:0; background:var(--orange); color:#fff; border-radius:var(--radius-md); padding:10px 16px; display:flex; align-items:center; gap:12px; margin-bottom:14px; }
.bulk-bar b{ font-family:var(--font-body); }
.expiring{ color:var(--red); font-weight:700; }

/* ---------- avatar ---------- */
.mini-av{ width:28px;height:28px;border-radius:50%; background:var(--sky-soft); color:var(--sky); display:inline-flex; align-items:center; justify-content:center; font-weight:800; font-size:12px; flex:none; }
.name-cell{ display:flex; align-items:center; gap:8px; }

/* ---------- toast ---------- */
.toast-stack{ position:fixed; bottom:22px; left:50%; transform:translateX(-50%); z-index:500; display:flex; flex-direction:column; gap:10px; align-items:center; }
.toast{ background:var(--paper-raised); color:var(--ink); border:1px solid var(--line-strong); padding:11px 18px; border-radius:999px; font-size:13px; font-weight:600; box-shadow:var(--shadow-deep); display:flex; align-items:center; gap:10px; animation:toast-in .25s var(--ease); }
.toast.success{ background:#1C6B47; color:#fff; border-color:transparent; }
.toast.error{ background:var(--red); color:#fff; border-color:transparent; }
@keyframes toast-in{ from{opacity:0; transform:translateY(10px);} to{opacity:1; transform:translateY(0);} }

/* ---------- responsive ---------- */
@media (max-width:980px){
  .sidebar{ position:fixed; left:0; top:34px; transform:translateX(-100%); z-index:100; box-shadow:var(--shadow-deep); }
  .sidebar.open{ transform:translateX(0); }
  .mobile-menu-btn{ display:inline-flex; }
  .stat-grid{ grid-template-columns:repeat(2,1fr); }
  .two-col{ grid-template-columns:1fr; }
  .two-col.even{ grid-template-columns:1fr; }
  .gsearch{ max-width:220px; }
}
@media (max-width:620px){
  .stat-grid{ grid-template-columns:1fr; }
  .topbar h1{ font-size:16px; }
  .view-root{ padding:16px; }
  .topbar{ flex-wrap:wrap; height:auto; padding:10px 16px; gap:10px; }
  .gsearch{ max-width:none; width:100%; order:3; }
  .drawer{ width:100vw; padding:18px 16px 60px; }
  .modal-box{ padding:18px 16px; }
  .filter-row{ gap:6px; }
  .search-mini{ margin-left:0; width:100%; }
  .panel-head{ flex-wrap:wrap; gap:8px; }
  /* touch targets: keep every tappable control at least 40px tall on
     small screens, per the mobile bug-pass requirement. */
  .btn, .btn.sm, .chip, .iconbtn, .radio-pill{ min-height:40px; }
  .sb-link{ min-height:44px; }
  .dtable td, .dtable th{ padding:10px 8px; }
  .dtable{ font-size:12.5px; }
}
#gate-screen{ position:fixed; inset:0; z-index:9999; background:var(--cream); display:flex; flex-direction:column; align-items:center; justify-content:center; gap:14px; color:var(--ink-soft); font-weight:600; font-size:14px; text-align:center; padding:24px; }
.gate-spin{ width:30px; height:30px; border-radius:50%; border:3px solid var(--line); border-top-color:var(--orange-deep); animation:gate-spin .8s linear infinite; }
#gate-screen.is-error .gate-spin{ display:none; }
@keyframes gate-spin{ to{ transform:rotate(360deg); } }
.staff-pick{ display:block; width:100%; text-align:left; background:var(--paper); border:1px solid var(--line); border-radius:10px; padding:9px 12px; margin-top:6px; font-size:13px; color:var(--ink); cursor:pointer; font-family:inherit; }
.staff-pick:hover, .staff-pick.is-picked{ border-color:var(--orange); background:var(--orange-soft); }
</style>
</head>
<body>

<div id="gate-screen">
  <div class="gate-spin"></div>
  <div id="gate-msg">Checking your access…</div>
</div>

// can(permission) — the ONLY function views/nav should call to decide
// what to show. Admin always passes. Moderators are checked against
// their own record's resolved permissions (defaults minus anything an
// Admin has revoked for them individually in Staff → Permissions).
function can(perm){
  const me = currentModerator();
  if(me.role === 'admin') return true;
  return (me.permissions || []).includes(perm);
}

/* ============================================================
   CASES — computed live from Reports, Restrictions, Appeals,
   Copyright claims, Privacy requests and Grievances that share a
   caseId, so this view can never drift out of sync with the
   underlying queues. Nothing here is stored separately.
   ============================================================ */
function getCaseSummaries(){
  const ids = new Set([
    ...REPORTS.map(r=>r.caseId), ...RESTRICTIONS.map(x=>x.caseId), ...APPEALS.map(a=>a.caseId),
    ...COPYRIGHT_CLAIMS.map(c=>c.caseId), ...PRIVACY_REQUESTS.map(p=>p.caseId), ...GRIEVANCES.map(g=>g.caseId),
  ]);
  return [...ids].map(caseId=>{
    const report = REPORTS.find(r=>r.caseId===caseId);
    const restriction = RESTRICTIONS.find(x=>x.caseId===caseId);
    const appeal = APPEALS.find(a=>a.caseId===caseId);
    const copyright = COPYRIGHT_CLAIMS.find(c=>c.caseId===caseId);
    const privacy = PRIVACY_REQUESTS.find(p=>p.caseId===caseId);
    const grievance = GRIEVANCES.find(g=>g.caseId===caseId);
    const types = [];
    if(report) types.push('Report');
    if(restriction) types.push('Restriction');
    if(appeal) types.push('Appeal');
    if(copyright) types.push('Copyright');
    if(privacy) types.push('Privacy');
    if(grievance) types.push('Grievance');
    let status = 'Resolved';
    if((report&&report.status==='New') || (copyright&&copyright.status==='New') || (privacy&&privacy.status==='New') || (grievance&&grievance.status==='New')) status='Open';
    else if((report&&report.status==='Under Review') || (appeal&&(appeal.status==='Pending'||appeal.status==='Under Review')) || (restriction&&restriction.status==='active') || (copyright&&copyright.status==='Under Review') || (privacy&&privacy.status==='In Progress') || (grievance&&grievance.status==='Assigned')) status='In Progress';
    const assignedTo = (report&&report.assignedTo) || (grievance&&grievance.assignedTo) || (restriction&&restriction.moderatorId) || (copyright&&copyright.reviewedBy) || (privacy&&privacy.resolvedBy) || null;
    const priority = (report&&report.priority) || (copyright?'High':null) || 'Normal';
    const openedAt = (report&&report.createdAt) || (copyright&&copyright.submittedAt) || (privacy&&privacy.submittedAt) || (grievance&&grievance.submittedAt) || (restriction&&restriction.start);
    const title = (report&&report.reason) || (copyright&&'Copyright claim') || (privacy&&privacy.type) || (grievance&&('Grievance: '+grievance.against)) || (restriction&&restriction.type) || 'Case';
    return {caseId, types, status, assignedTo, priority, openedAt, title, report, restriction, appeal, copyright, privacy, grievance};
  }).sort((a,b)=> new Date(b.openedAt||0) - new Date(a.openedAt||0));
}

// Restriction scopes a restriction can apply to, and the three duration
// modes the spec calls for. Used by the restriction modal, the
// Restrictions table, and restrictUser() below.
const RESTRICTION_SCOPES = [
  {id:'comments',   label:'Comments',      verb:'Comment restriction'},
  {id:'posts',      label:'Posts',         verb:'Posting restricted'},
  {id:'publishing', label:'Publishing',    verb:'Publishing throttled'},
  {id:'wall',       label:'Wall',          verb:'Wall posting suspended'},
  {id:'messaging',  label:'Messaging',     verb:'Messaging disabled'},
  {id:'account',    label:'Full account',  verb:'Account suspended'},
];
const DURATION_TYPES = [
  {id:'temporary',  label:'Temporary'},
  {id:'indefinite', label:'Indefinite'},
  {id:'permanent',  label:'Permanent'},
];
function scopeMeta(id){ return RESTRICTION_SCOPES.find(s=>s.id===id) || RESTRICTION_SCOPES[1]; }
function durationLabel(x){
  if(x.durationType==='temporary') return `${x.days||'\u2014'} days`;
  if(x.durationType==='indefinite') return 'Indefinite';
  if(x.durationType==='permanent') return 'Permanent';
  return '\u2014';
}

function restrictUser({userId, caseId, scope, durationType, days, reason}){
  const start = new Date();
  const expiry = durationType==='temporary' ? new Date(start.getTime()+(days||1)*86400000) : null;
  const sc = scopeMeta(scope);
  const r = {id:'x'+(RESTRICTIONS.length+1)+Math.random().toString(36).slice(2,5), caseId, userId, scope, type:sc.verb, durationType, days:durationType==='temporary'?days:null,
    reason, moderatorId:state.currentModeratorId, start:start.toISOString(), expiry: expiry?expiry.toISOString():null, status:'active'};
  RESTRICTIONS.unshift(r);
  const u = userById(userId); if(u) u.status = scope==='account' ? 'suspended' : 'restricted';
  logAction({caseId, action:'User restricted', targetUserId:userId, targetContentId:null, reason,
    duration: durationType==='temporary' ? days+' days' : DURATION_TYPES.find(d=>d.id===durationType).label,
    expiry: expiry?expiry.toISOString():null, result:sc.verb});
  return r;
}

// The one place a restriction gets created anywhere in the dashboard —
// from a report, a user profile, or the Restrictions page's own
// "Issue restriction" button. Always asks for scope + duration + reason
// instead of a fixed hardcoded duration.
function openRestrictionModal({userId, caseId, defaultScope='posts', onDone}){
  const u = userById(userId);
  openModal(`
    <h3>Restrict @${esc(u.username)}?</h3>
    <p class="sub">Choose what\u2019s restricted, for how long, and why. The user is notified without your identity being shown.</p>
    <label class="field-label">Restriction scope</label>
    <select class="search-mini" style="width:100%; margin-bottom:10px;" id="restrict-scope">
      ${RESTRICTION_SCOPES.map(s=>`<option value="${s.id}" ${s.id===defaultScope?'selected':''}>${esc(s.label)}</option>`).join('')}
    </select>
    <label class="field-label">Duration</label>
    <div class="duration-row" id="duration-row">
      ${DURATION_TYPES.map((d,i)=>`<label class="radio-pill"><input type="radio" name="duration-type" value="${d.id}" ${i===0?'checked':''}>${esc(d.label)}</label>`).join('')}
    </div>
    <input type="number" min="1" value="14" id="restrict-days" class="search-mini" style="width:100%; margin-bottom:10px;" placeholder="Number of days">
    <textarea id="reason-input" placeholder="Reason for this action (required, visible in the moderation log)…"></textarea>
    <div id="reason-err" style="color:var(--red); font-size:11.5px; margin-top:4px; display:none;">A reason is required before you can confirm.</div>
    <div class="modal-actions">
      <button class="btn ghost sm" data-action="close-modal">Cancel</button>
      <button class="btn danger sm" id="modal-confirm-btn">Apply restriction</button>
    </div>
  `);
  const daysInput = $('#restrict-days');
  const syncDaysVisibility = ()=>{
    const dt = document.querySelector('input[name="duration-type"]:checked').value;
    daysInput.style.display = dt==='temporary' ? '' : 'none';
  };
  syncDaysVisibility();
  $$('input[name="duration-type"]').forEach(r=> r.addEventListener('change', syncDaysVisibility));
  $('#modal-confirm-btn').onclick = ()=>{
    const reason = $('#reason-input').value.trim();
    if(!reason){ $('#reason-err').style.display='block'; return; }
    const scope = $('#restrict-scope').value;
    const durationType = document.querySelector('input[name="duration-type"]:checked').value;
    const days = parseInt(daysInput.value,10) || 1;
    closeModal();
    const r = restrictUser({userId, caseId: caseId||nextCaseId(), scope, durationType, days, reason});
    onDone && onDone(r);
  };
}

function topReportedCategory(){
  const counts = {};
  CONTENT.forEach(c=>{ counts[c.type] = (counts[c.type]||0) + (c.reports||0); });
  const top = Object.entries(counts).sort((a,b)=>b[1]-a[1])[0];
  return top && top[1]>0 ? `${top[0]} (${top[1]} reports)` : '\u2014';
}

function emptyState(title, sub){ return `<div class="state-box"><div class="ic">\uD83D\uDCED</div><h4>${esc(title)}</h4><p>${esc(sub)}</p></div>`; }
function noResultsState(){ return `<div class="state-box"><div class="ic">\uD83D\uDD0D</div><h4>No matches</h4><p>Try a different filter or search term.</p></div>`; }
function errorState(title, sub, retry){

  setTimeout(()=>{ const b=document.getElementById(id); if(b) b.onclick=retry; });

/* ============================================================
   BADGES
   ============================================================ */
function priorityBadge(p){
  const map = {Urgent:'red', High:'gold', Normal:'grey'};
  return `<span class="badge ${map[p]||'grey'}">${esc(p)}</span>`;
}
function statusBadge(s){
  const map = {New:'orange', 'Under Review':'sky', 'Action Taken':'mint', Dismissed:'grey',
    active:'mint', removed:'red', under_review:'sky',
    Pending:'orange', 'In Review':'sky', Approved:'mint', Rejected:'red',
    Active:'mint', Expired:'grey', Cancelled:'grey',
    restricted:'gold', suspended:'red',
    Open:'orange', 'In Progress':'sky', Resolved:'mint', Assigned:'sky',
    Fulfilled:'mint', Denied:'red', 'Content Removed':'red', Upheld:'mint',
    Draft:'grey', Scheduled:'gold', Published:'mint'};
  const label = typeof s==='string' ? s.replace(/_/g,' ') : s;
  return `<span class="badge ${map[s]||'grey'}">${esc(label)}</span>`;
}
function roleBadge(m){
  return `<span class="badge ${m.role==='admin'?'ink':'sky'}">${esc(roleMeta(m.role).short)}</span>`;
}

const REPORT_FILTERS = ['All','New','Under Review','Action Taken','Dismissed','High Priority','Unassigned','Assigned to me'];

function filteredReports(){
  let list = [...REPORTS];
  const f = state.reportFilter;
  if(f==='High Priority') list = list.filter(r=>r.priority==='High'||r.priority==='Urgent');
  else if(f==='Unassigned') list = list.filter(r=>!r.assignedTo);
  else if(f==='Assigned to me') list = list.filter(r=>r.assignedTo===state.currentModeratorId);
  else if(f!=='All') list = list.filter(r=>r.status===f);
  if(state.reportSearch){
    const q = state.reportSearch.toLowerCase();
    list = list.filter(r=> r.caseId.toLowerCase().includes(q) || contentById(r.contentId).title.toLowerCase().includes(q) || userById(r.reportedUser).username.toLowerCase().includes(q));
  }
  list.sort((a,b)=> state.reportSort==='newest' ? new Date(b.createdAt)-new Date(a.createdAt) : new Date(a.createdAt)-new Date(b.createdAt));
  return list;
}

function handleReportAction(reportId, act){
  const r = (STAFF_CACHE.reports||[]).find(x=>x.id===reportId);
  if(!r) return;
  if(act==='assign'){
    sb.rpc('assign_case',{p_kind:'report',p_id:reportId}).then(({error})=>{
      if(error){ toast(error.message,'error'); return; }
      toast('Case assigned to you.','success');
      renderReportDetail(reportId);
      if(state.view==='reports') renderReports();
    });
    return;
  }
  if(act==='restrict'){
    openRestrictionModalForUser({userId:r.reported_user_id, caseId:r.case_id, onDone:()=>{ closeDrawer(); toast('Restriction issued.','success'); if(state.view==='reports') renderReports(); }});
    return;
  }
  const cfg = {
    dismiss:{title:'Dismiss this report?', confirmLabel:'Dismiss', destructive:false},
    warn:{title:'Warn this user?', body:'They will be notified.', confirmLabel:'Send warning', destructive:false},
    remove_content:{title:'Remove this content?', body:'The content will be hidden and the author notified.', confirmLabel:'Remove content', destructive:true},
  }[act];
  if(!cfg) return;
  confirmAction({...cfg, onConfirm: async (reason)=>{
    try{
      const { error } = act==='dismiss'
        ? await sb.rpc('dismiss_case', {p_kind:'report', p_id:reportId, p_reason:reason})
        : await sb.rpc('resolve_report', {p_report_id:reportId, p_action:act, p_reason:reason});
      if(error) throw error;
      toast('Done.','success');
      closeDrawer();
      if(state.view==='reports') renderReports();
    }catch(err){ toast((err&&err.message)||'Could not complete that action.','error'); }
  }});
}

async function openRestrictionModalForUser({userId, caseId, defaultScope, onDone}){
  let brief = null;
  try{ const { data } = await sb.rpc('get_user_brief', {p_user:userId}); brief = (data&&data[0])||null; }catch(e){}
  const label = brief ? '@'+brief.username : 'this user';
  openModal(`

    <p class="sub">Choose what\u2019s restricted, for how long, and why. The user is notified.</p>

      ${RESTRICTION_SCOPES.map(sc=>`<option value="${sc.id}">${esc(sc.label)}</option>`).join('')}
    </select>
    <label class="field-label">Duration</label>
    <div class="duration-row" id="duration-row">
      ${DURATION_TYPES.map((d,i)=>`<label class="radio-pill"><input type="radio" name="duration-type" value="${d.id}" ${i===0?'checked':''}>${esc(d.label)}</label>`).join('')}
    </div>
    <input type="number" min="1" value="14" id="restrict-days" class="search-mini" style="width:100%; margin-bottom:10px;" placeholder="Number of days">
    <textarea id="reason-input" placeholder="Reason for this action (required, visible in the moderation log)\u2026"></textarea>
    <div id="reason-err" style="color:var(--red); font-size:11.5px; margin-top:4px; display:none;">A reason is required before you can confirm.</div>
    <div class="modal-actions">
      <button class="btn ghost sm" data-action="close-modal">Cancel</button>
      <button class="btn danger sm" id="modal-confirm-btn">Apply restriction</button>
    </div>
  `);
  if(defaultScope && $('#restrict-scope')) $('#restrict-scope').value = defaultScope;
  const daysInput = $('#restrict-days');
  const sync = ()=>{ daysInput.style.display = document.querySelector('input[name="duration-type"]:checked').value==='temporary'?'':'none'; };
  sync();
  $$('input[name="duration-type"]').forEach(elx=>elx.addEventListener('change', sync));
  $('#modal-confirm-btn').onclick = async ()=>{
    const reason = $('#reason-input').value.trim();
    if(!reason){ $('#reason-err').style.display='block'; return; }
    const scope = $('#restrict-scope').value;
    const durationType = document.querySelector('input[name="duration-type"]:checked').value;
    const days = durationType==='temporary' ? (parseInt(daysInput.value,10)||1) : null;
    try{
      const { error } = await sb.rpc('apply_restriction', {
        p_user:userId, p_scope:scope, p_type: scope+'_restriction', p_duration_type:durationType, p_days:days, p_reason:reason, p_case:caseId||null
      });
      if(error) throw error;
      closeModal();
      onDone && onDone();
    }catch(err){
      $('#reason-err').textContent = (err&&err.message)||'Could not apply restriction.';
      $('#reason-err').style.display='block';
    }
  };
}

function handleUserAction(userId, act){
  const u = (STAFF_CACHE.users||[]).find(x=>x.id===userId);
  const label = u && u.username ? '@'+u.username : 'this user';
  const refresh = ()=>{ renderUserDetail(userId); if(state.view==='users') renderUsers(); };
  if(act==='restrict' || act==='suspend'){
    openRestrictionModalForUser({
      userId, caseId:null, defaultScope: act==='suspend'?'account':'posts',
      onDone:()=>{ toast(act==='suspend'?'User suspended.':'User restriction created.','success');
        // cache is stale until the list is re-read; drop it so the drawer refetches fresh counts
        STAFF_CACHE.users = null; refresh(); }
    });
    return;
  }
  confirmAction({title:`Lift all restrictions on ${label}?`, confirmLabel:'Lift restrictions', destructive:false, requireReason:true, onConfirm: async (reason)=>{
    try{
      const { data, error } = await sb.rpc('list_restrictions');
      if(error) throw error;
      const active = (data||[]).filter(x=>x.user_id===userId && x.active);
      for(const x of active){
        const { error: e2 } = await sb.rpc('lift_restriction', {p_restriction_id:x.id, p_reason:reason||'Lifted by staff'});
        if(e2) throw e2;
      }
      toast(active.length ? 'Restrictions lifted.' : 'No active restrictions to lift.','success');
      STAFF_CACHE.users = null;
      refresh();
    }catch(err){ toast((err&&err.message)||'Could not lift restrictions.','error'); }
  }});
}

  `);
  const input = $('#mod-search'), box = $('#mod-search-results'), send = $('#confirm-add-mod');
  const skip = new Set(STAFF_ROWS.map(r=>r.user_id)); // current staff + people with a pending invite
  input.focus();
  input.oninput = ()=>{
    clearTimeout(timer); picked = null; send.disabled = true;
    // usernames are lowercase letters, digits and underscores only
    const q = input.value.trim().toLowerCase().replace(/[^a-z0-9_]/g,'');
    if(q.length < 2){ box.innerHTML = ''; return; }
    timer = setTimeout(async ()=>{
      const mine = ++seq;
      try{
        const { data, error } = await sb.from('profiles').select('id, username, display_name').ilike('username', '%'+q+'%').limit(8);
        if(error) throw error;
        if(mine !== seq) return; // a newer search is already running
        const list = (data||[]).filter(u=>!skip.has(u.id));
        box.innerHTML = list.length
          ? list.map(u=>`<button type="button" class="staff-pick" data-pick="${esc(u.id)}" data-un="${esc(u.username)}">@${esc(u.username)} \u2014 ${esc(u.display_name||'')}</button>`).join('')
          : '<p class="sub">No matching members (staff and pending invites are hidden).</p>';
        box.querySelectorAll('.staff-pick').forEach(b=>{
          b.onclick = ()=>{
            box.querySelectorAll('.staff-pick').forEach(x=>x.classList.remove('is-picked'));
            b.classList.add('is-picked');
            picked = { id: b.dataset.pick, username: b.dataset.un };
            send.disabled = false;
          };
        });
      }catch(err){ box.innerHTML = `<p class="sub">Search failed: ${esc((err && err.message)||'try again')}</p>`; }
    }, 250);
  };
  send.onclick = async ()=>{
    if(!picked) return;
    send.disabled = true;
    try{
      const { error } = await sb.rpc('invite_moderator', { target_user_id: picked.id });
      if(error) throw error;
      toast(`Invite sent to @${picked.username}.`, 'success');
      closeModal();
      renderModerators();
    }catch(err){
      toast((err && err.message) || 'Could not send the invite.', 'error');
      send.disabled = false;
    }
  };
}

const CASE_FILTERS = ['All','Open','In Progress','Resolved'];
function renderCases(){
  if(state.caseFilter===undefined) state.caseFilter='All';
  if(state.caseSearch===undefined) state.caseSearch='';

  let list = getCaseSummaries();
  if(state.caseFilter!=='All') list = list.filter(c=>c.status===state.caseFilter);
  if(state.caseSearch){
    const q = state.caseSearch.toLowerCase();
    list = list.filter(c=> c.caseId.toLowerCase().includes(q) || (c.title||'').toLowerCase().includes(q));
  }
  root.innerHTML = `
    <div class="filter-row">
      ${CASE_FILTERS.map(f=>`<button class="chip ${state.caseFilter===f?'active':''}" data-case-filter="${f}">${esc(f)}</button>`).join('')}
      <input class="search-mini" id="case-search" placeholder="Search case ID or title…" value="${esc(state.caseSearch)}">
    </div>
    <div class="table-scroll"><div class="panel" style="padding:8px 12px;">
    ${list.length ? `<table class="dtable"><thead><tr><th>Case</th><th>Type(s)</th><th>Title</th><th>Priority</th><th>Assignee</th><th>Status</th><th>Opened</th></tr></thead><tbody>

function renderCaseWorkspace(caseId){
  const all = getCaseSummaries();
  const c = all.find(x=>x.caseId===caseId);
  if(!c){ toast('That case no longer exists.','error'); return; }
  const notes = INTERNAL_NOTES[caseId] || [];
  const entries = AUDIT_LOG.filter(l=>l.caseId===caseId).sort((a,b)=>new Date(a.at)-new Date(b.at));
  const linkRows = [];
  if(c.report) linkRows.push(['Report', c.report.reason, 'data-open-report', c.report.id]);
  if(c.restriction) linkRows.push(['Restriction', c.restriction.type, 'data-open-restriction', c.restriction.id]);
  if(c.appeal) linkRows.push(['Appeal', c.appeal.originalAction, 'data-open-appeal', c.appeal.id]);
  if(c.copyright) linkRows.push(['Copyright claim', c.copyright.description, 'data-open-copyright', c.copyright.id]);
  if(c.privacy) linkRows.push(['Privacy request', c.privacy.type, 'data-open-privacy', c.privacy.id]);
  if(c.grievance) linkRows.push(['Grievance', c.grievance.against, 'data-open-grievance', c.grievance.id]);

  openDrawer(`
    <button class="iconbtn drawer-close" data-action="close-drawer">\u2715</button>
    <h2 style="font-size:19px;">Case ${esc(c.caseId)}</h2>
    <div class="kv">
      <b>Types</b><span>${c.types.map(t=>`<span class="badge grey" style="margin-right:2px;">${esc(t)}</span>`).join('')}</span>
      <b>Title</b><span>${esc(c.title)}</span>
      <b>Priority</b><span>${priorityBadge(c.priority)}</span>
      <b>Status</b><span>${statusBadge(c.status)}</span>
      <b>Opened</b><span>${c.openedAt?fmtDate(c.openedAt):'\u2014'}</span>
    </div>
    ${can('cases.assign') ? `<div style="margin:12px 0;">
      <b style="font-size:11.5px; text-transform:uppercase; color:var(--ink-faint); display:block; margin-bottom:6px;">Assigned moderator</b>
      <select class="search-mini" style="width:100%;" id="case-assign-select">
        <option value="">Unassigned</option>
        ${MODERATORS.filter(m=>m.status==='active').map(m=>`<option value="${m.id}" ${c.assignedTo===m.id?'selected':''}>${esc(m.displayName)}</option>`).join('')}
      </select>
    </div>` : ''}
    <hr class="divider">
    <h4 style="font-size:13px; margin-bottom:8px;">Linked items</h4>
    ${linkRows.length ? linkRows.map(([label,desc,attr,id])=>`
      <div class="linked-item" ${attr}="${esc(id)}"><b>${esc(label)}</b><span class="muted">${esc(desc||'')}</span></div>
    `).join('') : '<p class="muted" style="font-size:12px;">No linked items.</p>'}
    <hr class="divider">
    <h4 style="font-size:13px; margin-bottom:8px;">Case timeline</h4>
    ${entries.length ? `<div class="timeline">${entries.map(l=>`<div class="tl-item"><div class="tl-time">${fmtDate(l.at)}</div><div class="tl-body"><b>${esc(l.action)}</b> by ${esc(modById(l.moderatorId).displayName)}<br><span class="muted">${esc(l.reason||'')}</span></div></div>`).join('')}</div>` : '<p class="muted" style="font-size:12px;">No log entries for this case yet.</p>'}
    <hr class="divider">
    <h4 style="font-size:13px; margin-bottom:8px;">Internal notes <span class="muted" style="font-weight:500;">(staff only)</span></h4>
    ${notes.map(n=>`<div class="note-item"><div class="who">${esc(n.author)} \u00b7 ${timeAgo(n.at)}</div>${esc(n.text)}</div>`).join('') || '<p class="muted" style="font-size:12px;">No internal notes yet.</p>'}
    <div style="display:flex; gap:8px; margin-top:8px;">
      <input class="search-mini" style="flex:1;" id="case-note-input" placeholder="Add an internal note…">
      <button class="btn soft sm" id="case-add-note-btn">Add</button>
    </div>
  `);
  const assignSel = $('#case-assign-select');
  if(assignSel) assignSel.onchange = ()=>{
    const modId = assignSel.value || null;
    if(c.report) c.report.assignedTo = modId;
    if(c.grievance) c.grievance.assignedTo = modId;
    logAction({caseId, action:'Case reassigned', targetUserId:null, targetContentId:null, reason:modId?`Reassigned to ${modById(modId).displayName}`:'Unassigned', result:'Assignment updated'});
    toast('Assignment updated.','success');
    renderCaseWorkspace(caseId);
  };
  $('#case-add-note-btn').onclick = ()=>{
    const v = $('#case-note-input').value.trim();
    if(!v) return;
    addNote(caseId, currentModerator().displayName, v);
    toast('Internal note added.','success');
    renderCaseWorkspace(caseId);
  };
}

/* ============================================================
   RENDER: RISK SIGNALS  (computed from live data)
   ============================================================ */
function renderRiskSignals(){
  const root = $('#view-root');
  const now = Date.now();
  const last7 = REPORTS.filter(r=> now-new Date(r.createdAt) < 7*86400000).length;
  const prev7 = REPORTS.filter(r=>{ const d=now-new Date(r.createdAt); return d>=7*86400000 && d<14*86400000; }).length;
  const trend = prev7===0 ? (last7>0?'up':'flat') : (last7>prev7?'up':last7<prev7?'down':'flat');
  const activeRestrictionUsers = new Set(RESTRICTIONS.filter(x=>x.status==='active').map(x=>x.userId)).size;
  const reasonCounts = {};
  REPORTS.forEach(r=> reasonCounts[r.reason]=(reasonCounts[r.reason]||0)+1);
  const topReason = Object.entries(reasonCounts).sort((a,b)=>b[1]-a[1])[0];
  const flagged = USERS.map(u=>{
    const restrCount = RESTRICTIONS.filter(x=>x.userId===u.id).length;
    const reportCount = REPORTS.filter(r=>r.reportedUser===u.id).length;
    return {u, score: restrCount*2 + reportCount};
  }).filter(x=>x.score>0).sort((a,b)=>b.score-a.score).slice(0,6);

  root.innerHTML = `
    <div class="stat-grid">
      ${statCard('Reports, last 7 days', last7, trend==='up'?'trending up vs prior week':trend==='down'?'trending down vs prior week':'flat vs prior week', 'var(--orange)')}
      ${statCard('Users with active restrictions', activeRestrictionUsers, 'currently limited in some way', 'var(--gold)')}
      ${statCard('Top report reason', topReason?topReason[1]:0, topReason?topReason[0]:'\u2014', 'var(--red)')}
      ${statCard('Flagged users', flagged.length, 'elevated risk score', 'var(--lavender)')}
    </div>
    <div class="panel">
      <div class="panel-head"><h3>Highest risk-score users</h3></div>
      ${flagged.length ? `<table class="dtable"><thead><tr><th>User</th><th>Restrictions</th><th>Reports against</th><th>Risk score</th></tr></thead><tbody>
      ${flagged.map(f=>`<tr data-open-user="${f.u.id}">
        <td>@${esc(f.u.username)}</td>
        <td class="muted">${RESTRICTIONS.filter(x=>x.userId===f.u.id).length}</td>
        <td class="muted">${REPORTS.filter(r=>r.reportedUser===f.u.id).length}</td>
        <td><span class="badge ${f.score>=5?'red':f.score>=3?'gold':'sky'}">${f.score}</span></td>
      </tr>`).join('')}</tbody></table>` : emptyState('No elevated-risk users', 'Users with repeated reports or restrictions will surface here.')}
    </div>
  `;
}

/* ============================================================
   RENDER: REPEAT OFFENDERS  (computed from live data)
   ============================================================ */
function renderRepeatOffenders(){
  const root = $('#view-root');
  const list = USERS.map(u=>{
    const restrictions = RESTRICTIONS.filter(x=>x.userId===u.id);
    const reports = REPORTS.filter(r=>r.reportedUser===u.id);
    return {u, restrictions, reports};
  }).filter(x=>x.restrictions.length>=2 || x.reports.length>=2)
    .sort((a,b)=> (b.restrictions.length+b.reports.length) - (a.restrictions.length+a.reports.length));

  root.innerHTML = `
    <div class="table-scroll"><div class="panel" style="padding:8px 12px;">
    ${list.length ? `<table class="dtable"><thead><tr><th>User</th><th>Status</th><th>Total restrictions</th><th>Active now</th><th>Total reports</th><th>Last incident</th></tr></thead><tbody>
    ${list.map(x=>{
      const lastAt = [...x.restrictions.map(r=>r.start), ...x.reports.map(r=>r.createdAt)].sort().reverse()[0];
      return `<tr data-open-user="${x.u.id}">
        <td>@${esc(x.u.username)}</td>
        <td>${statusBadge(x.u.status)}</td>
        <td class="muted">${x.restrictions.length}</td>
        <td class="muted">${x.restrictions.filter(r=>r.status==='active').length}</td>
        <td class="muted">${x.reports.length}</td>
        <td class="muted">${lastAt?fmtDate(lastAt):'\u2014'}</td>
      </tr>`;
    }).join('')}</tbody></table>` : emptyState('No repeat offenders', 'Users with two or more restrictions or reports will show up here.')}
    </div></div>
  `;
}

  </div>`;
  root.querySelectorAll('[data-audit-del]').forEach(btn=> btn.onclick = ()=> confirmAction({
    title:'Delete this audit entry?', destructive:true, requireReason:false, confirmLabel:'Delete',

function goto(view){
  const item = NAV.find(n=>n.id===view);
  if(item && !navVisible(item)){ toast('You don\u2019t have access to that section.','error'); return; }
  state.view = view;
  state.bulkSelection.clear();
  $('#view-title').textContent = VIEW_TITLES[view] || view;
  renderSidebar();
  if(view!=='overview') refreshStaffCounts();
  (VIEW_RENDERERS[view]||renderOverview)();
  $('#sidebar').classList.remove('open');
}

    confirmAction({
      title:`${action==='dismiss'?'Dismiss':'Remove'} ${ids.length} selected ${kind}?`,
      destructive:true, confirmLabel:'Confirm bulk action',
      onConfirm:(reason)=>{
        ids.forEach(id=>{
          if(kind==='reports'){
            const r = reportById(id);
            if(action==='dismiss') setReportStatus(r,'Dismissed',reason,{actionLabel:'Report dismissed (bulk)', result:'No action, report closed'});
            if(action==='remove'){ const c = contentById(r.contentId); removeContent(c, reason); setReportStatus(r,'Action Taken',reason,{actionLabel:'Content removed (bulk)', result:'Content removed'}); }
          } else {
            const c = contentById(id);
            if(!c.caseId) c.caseId = nextCaseId();

  if(!e.target.closest('.gsearch')) $('#gsearch-results').hidden = true;
});

function waitForSession(){
  return new Promise(resolve=>{
    let done = false;
    const finish = sess => { if(done) return; done = true; resolve(sess); };
    sb.auth.onAuthStateChange((ev, sess)=>{
      if(ev==='INITIAL_SESSION' || ev==='SIGNED_IN' || ev==='SIGNED_OUT') finish(sess);
    });
    // Same safeguard as the main app: no event in time is not "signed out".
    setTimeout(()=> sb.auth.getSession().then(r=>finish(r && r.data ? r.data.session : null)).catch(()=>finish(null)), 4000);
  });
}
function gateMessage(msg){
  const g = $('#gate-screen'); if(!g) return;
  g.classList.add('is-error');
  $('#gate-msg').innerHTML = esc(msg) + '<br><a class="btn ghost sm" href="">Reload</a> <a class="btn ghost sm" href="/userpostlogin.html">Back to Journals</a>';
}
async function bootWithAuth(){
  try{
    if(!window.supabase){ gateMessage('Could not load the sign-in library. Check your connection and reload.'); return; }
    sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
    const session = await waitForSession();
    if(!session || !session.user){ location.replace('/index.html'); return; }
    // The server decides who is staff; this page hides itself from everyone else.
    const { data: role, error } = await sb.rpc('get_my_role');
    if(error) throw error;
    if(role !== 'admin' && role !== 'moderator'){ location.replace('/userpostlogin.html'); return; }

    let prof = null;
    try{
      const r = await sb.from('profiles').select('username, display_name').eq('id', session.user.id).maybeSingle();
      prof = r.data;
    }catch(e){}
    const displayName = (prof && (prof.display_name || prof.username)) || 'You';
    MODERATORS.push({
      id:'me', username:(prof && prof.username) || '', displayName, role, status:'active',
      dateAppointed:new Date().toISOString(),
      permissions: role==='admin' ? undefined : ROLE_PERMISSIONS.moderator.slice()
    });
    state.currentModeratorId = 'me';
    state.role = role;
    $('#preview-note').textContent = `Signed in as ${displayName} (${roleMeta(role).label}). Live sections: Overview, Reports, Content, Users, Restrictions, Appeals, Copyright, Privacy, Grievances, Moderators and the logs. Sections not listed still show sample data and nothing there is saved.`;
    sb.auth.onAuthStateChange(ev=>{ if(ev==='SIGNED_OUT') location.replace('/index.html'); });
    $('#gate-screen').remove();
    goto('overview');
  }catch(err){
    console.warn('Dashboard access check failed:', err);
    gateMessage('We couldn\u2019t verify your access just now. Please reload and try again.');
  }
}

function handleModAction(modId, act){
  const m = modById(modId);
  if(m.role==='admin'){ toast('Admin accounts can\u2019t be modified from this dashboard.','error'); return; }
  confirmAction({
    title: `${act[0].toUpperCase()+act.slice(1)} ${m.displayName}?`, requireReason:false,
    destructive: act!=='reinstate', confirmLabel: act[0].toUpperCase()+act.slice(1),
    onConfirm:()=>{
      if(act==='suspend') m.status='suspended';
      if(act==='remove'){ const i=MODERATORS.indexOf(m); if(i>-1) MODERATORS.splice(i,1); }
      if(act==='reinstate') m.status='active';
      toast('Moderator status updated.','success');
      renderModerators();
    }
  });
}

function renderGlobalSearchResults(q){
  const box = $('#gsearch-results');

  if(!res){ box.hidden = true; return; }
  const groups = [];
  if(res.users.length) groups.push(['Users', res.users.map(u=>`<div class="gsearch-item" data-gs-open="user" data-gs-id="${u.id}"><span class="mini-av">${esc(u.displayName[0])}</span><span><span class="t">${esc(u.displayName)}</span><br><span class="s">@${esc(u.username)}</span></span></div>`).join('')]);
  if(res.content.length) groups.push(['Content', res.content.map(c=>`<div class="gsearch-item" data-gs-open="content" data-gs-id="${c.id}"><span>\uD83D\uDCC4</span><span><span class="t">${esc(c.title)}</span><br><span class="s">${esc(c.type)}</span></span></div>`).join('')]);
  if(res.reports.length) groups.push(['Reports', res.reports.map(r=>`<div class="gsearch-item" data-gs-open="report" data-gs-id="${r.id}"><span>\uD83D\uDEA9</span><span><span class="t">${esc(r.caseId)}</span><br><span class="s">${esc(r.reason)}</span></span></div>`).join('')]);
  if(res.cases.length) groups.push(['Case IDs', res.cases.map(c=>`<div class="gsearch-item" data-gs-open="case" data-gs-id="${c}"><span>\uD83D\uDDC2\uFE0F</span><span class="t caseid">${esc(c)}</span></div>`).join('')]);
  if(res.mods.length) groups.push(['Moderators', res.mods.map(m=>`<div class="gsearch-item" data-gs-open="mod" data-gs-id="${m.id}"><span class="mini-av">${esc(m.displayName[0])}</span><span class="t">${esc(m.displayName)}</span></div>`).join('')]);
  box.innerHTML = groups.length ? groups.map(([label,html])=>`<div class="gsearch-group-label">${label}</div>${html}`).join('') : `<div style="padding:14px; text-align:center; color:var(--ink-faint); font-size:12.5px;">No matches for "${esc(q)}"</div>`;

}

    renderSettings();
  };
  $$('[data-remove-category]').forEach(el=> el.onclick = ()=>{ s.reportCategories.splice(parseInt(el.dataset.removeCategory,10),1); renderSettings(); });
  $('#notify-action').onchange = e=>{ s.notifyOnAction = e.target.checked; toast('Notification setting saved.','success'); };
  $('#notify-appeal').onchange = e=>{ s.notifyOnAppealUpdate = e.target.checked; toast('Notification setting saved.','success'); };
  $('#require-evidence').onchange = e=>{ s.requireEvidenceForCopyright = e.target.checked; toast('Safety setting saved.','success'); };
  $('#platform-lockdown').onchange = e=>{
    s.platformLockdown = e.target.checked;
    toast(e.target.checked ? 'Platform lockdown enabled (mock).' : 'Platform lockdown disabled.', e.target.checked?'error':'success');
    SYSTEM_AUDIT_LOG.unshift({id:'sa'+(SYSTEM_AUDIT_LOG.length+1), at:new Date().toISOString(), actorId:state.currentModeratorId, event:'Platform lockdown '+(e.target.checked?'enabled':'disabled'), detail:'Toggled from Settings.', severity: e.target.checked?'warning':'info'});
  };
}

function runGlobalSearch(q){
  q = q.toLowerCase().trim();
  if(!q) return null;
  const users = USERS.filter(u=>u.username.toLowerCase().includes(q)||u.displayName.toLowerCase().includes(q)).slice(0,4);
  const content = CONTENT.filter(c=>c.title.toLowerCase().includes(q)).slice(0,4);
  const reports = REPORTS.filter(r=>r.caseId.toLowerCase().includes(q)).slice(0,4);
  const cases = [...new Set([...REPORTS.map(r=>r.caseId), ...RESTRICTIONS.map(x=>x.caseId), ...APPEALS.map(a=>a.caseId), ...COPYRIGHT_CLAIMS.map(c=>c.caseId), ...PRIVACY_REQUESTS.map(p=>p.caseId), ...GRIEVANCES.map(g=>g.caseId)])].filter(c=>c.toLowerCase().includes(q)).slice(0,4);
  const mods = MODERATORS.filter(m=>m.username.toLowerCase().includes(q)||m.displayName.toLowerCase().includes(q)).slice(0,4);
  return {users, content, reports, cases, mods};
}

bootWithAuth();

})();
</script>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Moderation Dashboard — Aspinora Journals</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,400;0,9..144,500;0,9..144,600;0,9..144,700;1,9..144,400;1,9..144,500&family=Plus+Jakarta+Sans:ital,wght@0,400;0,500;0,600;0,700;0,800;1,500&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  color-scheme: dark;
  /* Dark administration console palette. Warm-neutral charcoal, not pure
     black/grey — keeps a trace of the brand without reading as consumer/social. */
  --cream:        #17140F;   /* page background (kept var name for minimal diff) */
  --cream-deep:   #1D1912;   /* hover / deep surface */
  --paper:        #211D16;   /* card / panel surface */
  --paper-raised: #2A251C;   /* raised surface (topbar, drawers) */
  --ink:          #F1EBDF;   /* primary text */
  --ink-soft:     #B4AB99;   /* secondary text */
  --ink-faint:    #7C7360;   /* tertiary / label text */

  --orange:       #F1751B;   /* primary accent — Journals brand */
  --orange-deep:  #FF8F40;
  --orange-soft:  rgba(241,117,27,.16);
  --sky:          #7FB8D9;   /* neutral information */
  --sky-soft:     rgba(127,184,217,.14);
  --lavender:     #B0A2E0;   /* neutral information (secondary) */
  --lavender-soft:rgba(176,162,224,.14);
  --mint:         #5FC08F;   /* success / restored / resolved */
  --mint-soft:    rgba(95,192,143,.14);
  --gold:         #E8B93F;   /* warning / pending */
  --gold-soft:    rgba(232,185,63,.14);
  --red:          #E4615F;   /* destructive only */
  --red-soft:     rgba(228,97,95,.14);

  --line:         rgba(241,235,223,0.08);
  --line-strong:  rgba(241,235,223,0.16);
  --shadow-soft:  0 4px 20px rgba(0,0,0,.28);
  --shadow-mid:   0 12px 34px rgba(0,0,0,.36);
  --shadow-deep:  0 24px 60px rgba(0,0,0,.5);

  --font-display: 'Fraunces', Georgia, serif;
  --font-body:    'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
  --font-mono:    'Space Mono', 'SFMono-Regular', monospace;

  --radius-sm: 8px;
  --radius-md: 12px;
  --radius-lg: 16px;
  --ease: cubic-bezier(.22,.9,.32,1);
  --sidebar-w: 250px;
}
*,*::before,*::after{ box-sizing:border-box; }
[hidden]{ display:none !important; }
html,body{ margin:0; padding:0; height:100%; }
body{
  background:
    radial-gradient(1200px 700px at 106% -10%, rgba(241,117,27,.06) 0%, transparent 58%),
    radial-gradient(1000px 640px at -10% 108%, rgba(176,162,224,.05) 0%, transparent 55%),
    linear-gradient(180deg, var(--cream) 0%, #120F0A 100%);
  background-attachment:fixed, fixed, fixed;
  color:var(--ink);
  font-family:var(--font-body);
  font-size:15px;
  line-height:1.55;
}
h1,h2,h3,h4{ font-family:var(--font-display); font-weight:600; margin:0; color:var(--ink); }
button{ font-family:inherit; cursor:pointer; }
a{ color:inherit; }
::selection{ background:var(--orange-soft); }

/* ---------- preview / role switcher strip ---------- */
.preview-strip{
  background:#0E0C08; color:var(--gold); font-size:12.5px; font-weight:600;
  padding:7px 18px; display:flex; align-items:center; justify-content:center; gap:14px;
  letter-spacing:.02em; position:sticky; top:0; z-index:60; border-bottom:1px solid rgba(232,185,63,.25); flex-wrap:wrap;
}
.preview-strip .dot{ width:7px;height:7px;border-radius:50%;background:var(--gold); }
.role-toggle{ display:inline-flex; background:rgba(255,255,255,.06); border-radius:999px; padding:3px; gap:2px; flex-wrap:wrap; }
.role-toggle button{
  border:none; background:transparent; color:var(--ink-soft); font-size:11.5px; font-weight:700;
  padding:5px 12px; border-radius:999px; opacity:.75; transition:all .18s var(--ease); white-space:nowrap;
}
.role-toggle button.active{ background:var(--orange); opacity:1; color:#fff; }

/* ---------- shell layout ---------- */
.dash-shell{ display:flex; min-height:100vh; }
.sidebar{
  width:var(--sidebar-w); flex:none; background:var(--paper); border-right:1px solid var(--line);
  display:flex; flex-direction:column; padding:20px 14px; position:sticky; top:0; height:100vh; height:100dvh; z-index:40; overflow:hidden;
  transition:transform .25s var(--ease);
}
.sb-brand{ display:flex; align-items:center; gap:10px; padding:6px 8px 20px; }
.sb-brand .mark{ width:34px;height:34px;border-radius:10px; background:linear-gradient(135deg,var(--orange),var(--orange-deep)); display:flex;align-items:center;justify-content:center; color:#fff; font-family:var(--font-display); font-weight:700; font-size:17px; box-shadow:var(--shadow-soft); }
.sb-brand .txt{ display:flex; flex-direction:column; line-height:1.15; }
.sb-brand .txt b{ font-family:var(--font-display); font-size:15px; }
.sb-brand .txt span{ font-size:11px; color:var(--ink-faint); font-weight:600; letter-spacing:.03em; text-transform:uppercase; }

.sb-nav{ display:flex; flex-direction:column; gap:2px; flex:1 1 auto; min-height:0; overflow-y:auto; overscroll-behavior:contain; -webkit-overflow-scrolling:touch; touch-action:pan-y; }
.sb-brand, .sb-profile{ flex:none; }
.sb-section-label{ font-size:10.5px; font-weight:800; letter-spacing:.08em; text-transform:uppercase; color:var(--ink-faint); margin:14px 10px 6px; }
.sb-link{
  display:flex; align-items:center; gap:10px; padding:9px 10px; border-radius:var(--radius-sm);
  border:none; background:transparent; color:var(--ink-soft); font-size:13.5px; font-weight:600; text-align:left; width:100%;
  transition:background .15s var(--ease), color .15s var(--ease);
}
.sb-link .ic{ width:18px; text-align:center; font-size:15px; }
.sb-link:hover{ background:var(--cream-deep); color:var(--ink); }
.sb-link.active{ background:var(--orange-soft); color:var(--orange-deep); }
.sb-link .cnt{ margin-left:auto; background:var(--orange); color:#17140F; font-size:10.5px; font-weight:700; padding:1px 7px; border-radius:999px; }
.sb-link.active .cnt{ background:var(--orange-deep); }
.sb-lock{ margin-left:auto; opacity:.4; font-size:11px; }

.sb-profile{
  border-top:1px solid var(--line); padding-top:14px; margin-top:10px; display:flex; align-items:center; gap:10px;
}
.sb-profile .av{ width:36px;height:36px;border-radius:50%; background:var(--lavender-soft); color:var(--lavender); display:flex; align-items:center; justify-content:center; font-weight:800; font-family:var(--font-display); font-size:15px; flex:none; }
.sb-profile .meta b{ display:block; font-size:13px; }
.sb-profile .meta span{ font-size:11px; color:var(--ink-faint); font-weight:600; text-transform:uppercase; letter-spacing:.03em; }

/* ---------- main ---------- */
.main{ flex:1; min-width:0; display:flex; flex-direction:column; }
.topbar{
  position:sticky; top:0; z-index:30; background:rgba(23,20,15,.85); backdrop-filter:blur(10px) saturate(1.4);
  border-bottom:1px solid var(--line); padding:14px 26px; display:flex; align-items:center; gap:16px;
}
.mobile-menu-btn{ display:none; border:1px solid var(--line-strong); background:var(--paper); border-radius:10px; width:36px; height:36px; align-items:center; justify-content:center; font-size:16px; }
.topbar h1{ font-size:20px; flex:none; }
.gsearch{ position:relative; flex:1; max-width:460px; }
.gsearch input{
  width:100%; padding:9px 14px 9px 34px; border-radius:999px; border:1px solid var(--line-strong); background:var(--paper);
  font-family:inherit; font-size:13px; color:var(--ink);
}
.gsearch svg{ position:absolute; left:12px; top:50%; transform:translateY(-50%); opacity:.5; }
.gsearch-results{
  position:absolute; top:calc(100% + 8px); left:0; right:0; background:var(--paper); border:1px solid var(--line);
  border-radius:var(--radius-md); box-shadow:var(--shadow-deep); max-height:420px; overflow-y:auto; z-index:80; padding:8px;
}
.gsearch-group-label{ font-size:10.5px; font-weight:800; letter-spacing:.06em; text-transform:uppercase; color:var(--ink-faint); padding:8px 8px 4px; }
.gsearch-item{ display:flex; align-items:center; gap:10px; padding:8px; border-radius:10px; cursor:pointer; }
.gsearch-item:hover{ background:var(--cream-deep); }
.gsearch-item .t{ font-size:13px; font-weight:600; }
.gsearch-item .s{ font-size:11.5px; color:var(--ink-faint); }
.topbar .spacer{ flex:1; }
.topbar-right{ display:flex; align-items:center; gap:10px; margin-left:auto; }

.view-root{ padding:24px 26px 60px; flex:1; }

/* ---------- cards / grid ---------- */
.stat-grid{ display:grid; grid-template-columns:repeat(4,1fr); gap:14px; margin-bottom:22px; }
.stat-card{
  background:var(--paper); border:1px solid var(--line); border-radius:var(--radius-md); padding:16px 18px;
  box-shadow:var(--shadow-soft); position:relative; overflow:hidden;
}
.stat-card .tag{ position:absolute; top:0; left:0; width:4px; height:100%; }
.stat-card b{ display:block; font-size:26px; font-family:var(--font-display); line-height:1.1; margin-top:2px; }
.stat-card .lbl{ font-size:11.5px; font-weight:700; color:var(--ink-faint); text-transform:uppercase; letter-spacing:.04em; }
.stat-card .sub{ font-size:11.5px; color:var(--ink-soft); margin-top:4px; }

.panel{ background:var(--paper); border:1px solid var(--line); border-radius:var(--radius-lg); box-shadow:var(--shadow-soft); padding:20px; margin-bottom:20px; }
.panel-head{ display:flex; align-items:center; justify-content:space-between; margin-bottom:14px; gap:10px; flex-wrap:wrap; }
.panel-head h3{ font-size:16px; }

.two-col{ display:grid; grid-template-columns:1.6fr 1fr; gap:18px; }
.two-col.even{ grid-template-columns:1fr 1fr; }

/* ---------- tables ---------- */
.dtable{ width:100%; border-collapse:collapse; font-size:13px; }
.table-scroll{ overflow-x:auto; -webkit-overflow-scrolling:touch; }
.panel:has(> table.dtable), .panel:has(> .dtable){ overflow-x:auto; -webkit-overflow-scrolling:touch; }
.dtable th{ text-align:left; font-size:10.5px; text-transform:uppercase; letter-spacing:.05em; color:var(--ink-faint); font-weight:800; padding:8px 10px; border-bottom:1px solid var(--line-strong); white-space:nowrap; }
.dtable td{ padding:10px; border-bottom:1px solid var(--line); vertical-align:middle; }
.dtable tbody tr{ cursor:pointer; transition:background .12s var(--ease); }
.dtable tbody tr:hover{ background:var(--cream-deep); }
.caseid{ font-family:var(--font-mono); font-size:11.5px; color:var(--ink-soft); }
.muted{ color:var(--ink-faint); font-size:12px; }
.checkbox-cell{ width:30px; }

/* ---------- badges / pills ---------- */
.badge{ display:inline-flex; align-items:center; gap:4px; font-size:10.5px; font-weight:800; padding:3px 9px; border-radius:999px; text-transform:uppercase; letter-spacing:.03em; white-space:nowrap; }
.badge.orange{ background:var(--orange-soft); color:var(--orange-deep); }
.badge.sky{ background:var(--sky-soft); color:var(--sky); }
.badge.mint{ background:var(--mint-soft); color:var(--mint); }
.badge.lav{ background:var(--lavender-soft); color:var(--lavender); }
.badge.gold{ background:var(--gold-soft); color:var(--gold); }
.badge.red{ background:var(--red-soft); color:var(--red); }
.badge.grey{ background:var(--cream-deep); color:var(--ink-soft); }
.badge.ink{ background:var(--ink); color:var(--cream); }

/* ---------- filters ---------- */
.filter-row{ display:flex; gap:8px; flex-wrap:wrap; margin-bottom:16px; align-items:center; }
.chip{ border:1px solid var(--line-strong); background:var(--paper); padding:6px 13px; border-radius:999px; font-size:12.5px; font-weight:700; color:var(--ink-soft); transition:all .15s var(--ease); }
.chip.active{ background:var(--ink); border-color:var(--ink); color:var(--cream); }
.search-mini{ border:1px solid var(--line-strong); background:var(--paper); color:var(--ink); border-radius:999px; padding:6px 14px; font-size:12.5px; min-width:200px; margin-left:auto; font-family:inherit; }
.search-mini::placeholder{ color:var(--ink-faint); }
.field-label{ display:block; font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:.03em; color:var(--ink-faint); margin-bottom:5px; }
.duration-row{ display:flex; gap:8px; margin-bottom:10px; flex-wrap:wrap; }
.radio-pill{ display:inline-flex; align-items:center; gap:6px; border:1px solid var(--line-strong); border-radius:999px; padding:6px 13px; font-size:12.5px; font-weight:600; cursor:pointer; }
.radio-pill input{ accent-color:var(--orange); }
input[type="checkbox"], input[type="radio"]{ accent-color:var(--orange); }

/* ---------- buttons ---------- */
.btn{ display:inline-flex; align-items:center; gap:6px; border:none; border-radius:999px; padding:9px 18px; font-weight:700; font-size:13px; transition:all .15s var(--ease); }
.btn.primary{ background:var(--orange); color:#fff; box-shadow:0 6px 18px rgba(241,117,27,.28); }
.btn.primary:hover{ background:var(--orange-deep); }
.btn.ghost{ background:transparent; border:1px solid var(--line-strong); color:var(--ink); }
.btn.ghost:hover{ background:var(--cream-deep); }
.btn.danger{ background:var(--red); color:#fff; }
.btn.danger:hover{ background:#C9524F; }
.btn.soft{ background:var(--cream-deep); color:var(--ink); }
.btn.sm{ padding:6px 13px; font-size:12px; }
.btn:disabled{ opacity:.45; cursor:not-allowed; }
.iconbtn{ border:1px solid var(--line-strong); background:var(--paper); width:32px; height:32px; border-radius:9px; display:inline-flex; align-items:center; justify-content:center; font-size:14px; }
.iconbtn:hover{ background:var(--cream-deep); }

/* ---------- empty/loading/error/no-results ---------- */
.state-box{ text-align:center; padding:46px 20px; color:var(--ink-faint); }
.state-box .ic{ font-size:30px; margin-bottom:10px; }
.state-box h4{ font-size:15px; color:var(--ink-soft); margin-bottom:4px; }
.state-box p{ font-size:12.5px; margin:0 0 12px; }
.skel{ background:linear-gradient(90deg,var(--cream-deep) 25%, var(--paper) 37%, var(--cream-deep) 63%); background-size:400% 100%; animation:skel 1.4s ease infinite; border-radius:8px; }
@keyframes skel{ 0%{background-position:100% 0} 100%{background-position:0 0} }
.skel-row{ height:38px; margin-bottom:8px; }
.skel-card{ height:78px; }

/* ---------- drawer / modal ---------- */
.drawer-scrim{ position:fixed; inset:0; background:rgba(43,36,28,.4); z-index:200; display:none; align-items:stretch; justify-content:flex-end; }
.drawer-scrim.open{ display:flex; }
.drawer{ width:min(560px,94vw); background:var(--cream); height:100%; overflow-y:auto; box-shadow:var(--shadow-deep); animation:drawer-in .25s var(--ease); padding:22px 24px 60px; }
@keyframes drawer-in{ from{transform:translateX(30px); opacity:0;} to{transform:translateX(0); opacity:1;} }
.drawer-close{ float:right; }
.modal-scrim{ position:fixed; inset:0; background:rgba(43,36,28,.5); z-index:300; display:none; align-items:center; justify-content:center; padding:20px; }
.modal-scrim.open{ display:flex; }
.modal-box{ width:min(440px,94vw); background:var(--paper); border-radius:var(--radius-lg); box-shadow:var(--shadow-deep); padding:22px; }
.modal-box h3{ font-size:17px; margin-bottom:6px; }
.modal-box p.sub{ font-size:12.5px; color:var(--ink-soft); margin:0 0 14px; }
textarea{ width:100%; min-height:80px; border:1px solid var(--line-strong); border-radius:var(--radius-sm); padding:10px; font-family:inherit; font-size:13px; resize:vertical; background:var(--paper); color:var(--ink); }
textarea::placeholder{ color:var(--ink-faint); }
.modal-actions{ display:flex; justify-content:flex-end; gap:8px; margin-top:16px; }

/* ---------- misc detail ---------- */
.kv{ display:grid; grid-template-columns:120px 1fr; gap:6px 10px; font-size:12.5px; margin:14px 0; }
.kv b{ color:var(--ink-faint); font-weight:700; font-size:11px; text-transform:uppercase; letter-spacing:.03em; }
.content-preview-box{ background:var(--cream-deep); border-radius:var(--radius-sm); padding:14px; font-size:13px; color:var(--ink-soft); margin:12px 0; border-left:3px solid var(--orange); }
.divider{ border:none; border-top:1px solid var(--line); margin:18px 0; }
.timeline{ border-left:2px solid var(--line-strong); padding-left:16px; display:flex; flex-direction:column; gap:16px; }
.timeline .tl-item{ position:relative; }
.timeline .tl-item::before{ content:""; position:absolute; left:-21px; top:3px; width:9px; height:9px; border-radius:50%; background:var(--orange); }
.timeline .tl-time{ font-size:11px; color:var(--ink-faint); font-weight:700; }
.timeline .tl-body{ font-size:13px; margin-top:2px; }
.note-item{ background:var(--gold-soft); border:1px dashed var(--gold); border-radius:var(--radius-sm); padding:10px 12px; margin-bottom:8px; font-size:12.5px; }
.note-item .who{ font-weight:700; font-size:11px; color:var(--gold); text-transform:uppercase; letter-spacing:.03em; margin-bottom:2px; }
.notif-preview{ background:var(--paper); border:1px solid var(--line); border-radius:var(--radius-md); padding:14px 16px; max-width:380px; box-shadow:var(--shadow-soft); }
.notif-preview .from{ font-size:11px; font-weight:700; color:var(--ink-faint); text-transform:uppercase; letter-spacing:.03em; margin-bottom:6px; }
.notif-preview .msg{ font-size:13px; margin-bottom:8px; }
.notif-preview .meta{ font-size:11px; color:var(--ink-faint); }
.immutable-note{ display:flex; align-items:center; gap:8px; font-size:11.5px; color:var(--ink-faint); font-weight:700; background:var(--cream-deep); padding:8px 12px; border-radius:999px; margin-bottom:14px; }
.linked-item{ display:flex; flex-direction:column; gap:2px; padding:9px 12px; border:1px solid var(--line); border-radius:var(--radius-sm); margin-bottom:6px; cursor:pointer; transition:background .12s var(--ease); }
.linked-item:hover{ background:var(--cream-deep); }
.linked-item b{ font-size:12.5px; }
.linked-item .muted{ font-size:12px; }
.bulk-bar{ position:sticky; top:0; background:var(--orange); color:#fff; border-radius:var(--radius-md); padding:10px 16px; display:flex; align-items:center; gap:12px; margin-bottom:14px; }
.bulk-bar b{ font-family:var(--font-body); }
.expiring{ color:var(--red); font-weight:700; }

/* ---------- avatar ---------- */
.mini-av{ position:relative; overflow:hidden; }
.mini-av img, .sb-profile .av img{ position:absolute; inset:0; width:100%; height:100%; object-fit:cover; border-radius:50%; }
.sb-profile .av{ position:relative; overflow:hidden; }
#refresh-btn .rf-ic{ display:inline-block; }
#refresh-btn.spinning .rf-ic{ animation:rf-spin .7s linear infinite; }
@keyframes rf-spin{ to{ transform:rotate(360deg); } }
.mini-av{ width:28px;height:28px;border-radius:50%; background:var(--sky-soft); color:var(--sky); display:inline-flex; align-items:center; justify-content:center; font-weight:800; font-size:12px; flex:none; }
.name-cell{ display:flex; align-items:center; gap:8px; }

/* ---------- toast ---------- */
.toast-stack{ position:fixed; bottom:22px; left:50%; transform:translateX(-50%); z-index:500; display:flex; flex-direction:column; gap:10px; align-items:center; }
.toast{ background:var(--paper-raised); color:var(--ink); border:1px solid var(--line-strong); padding:11px 18px; border-radius:999px; font-size:13px; font-weight:600; box-shadow:var(--shadow-deep); display:flex; align-items:center; gap:10px; animation:toast-in .25s var(--ease); }
.toast.success{ background:#1C6B47; color:#fff; border-color:transparent; }
.toast.error{ background:var(--red); color:#fff; border-color:transparent; }
@keyframes toast-in{ from{opacity:0; transform:translateY(10px);} to{opacity:1; transform:translateY(0);} }

.sb-brand{ position:sticky; top:0; z-index:3; flex-direction:column; align-items:flex-start; gap:2px; background:inherit; }
.sb-logo{ height:34px; width:auto; display:block; }
.sb-brand .sb-sub{ font-size:10.5px; color:var(--ink-faint); font-weight:700; letter-spacing:.08em; text-transform:uppercase; padding-left:2px; }
.bulk-bar{ position:sticky; top:0; z-index:5; display:flex; align-items:center; gap:8px; flex-wrap:wrap; padding:10px 12px; margin-bottom:8px; background:var(--paper); border:1.5px solid var(--orange); border-radius:12px; box-shadow:var(--shadow-deep); }
.bulk-bar[hidden]{ display:none; }
.bulk-cb, .bulk-all{ width:16px; height:16px; cursor:pointer; }
#sb-backdrop{ display:none; }
/* ---------- responsive ---------- */
@media (max-width:980px){
  .sidebar{ position:fixed; left:0; top:0; bottom:0; height:100vh; height:100dvh; max-width:86vw; transform:translateX(-100%); z-index:100; box-shadow:var(--shadow-deep); }
  body.sb-lock{ overflow:hidden; }
  .sidebar.open{ transform:translateX(0); }
  #sb-backdrop.show{ display:block; position:fixed; inset:0; background:rgba(0,0,0,.55); z-index:90; }
  .mobile-menu-btn{ display:inline-flex; }
  .stat-grid{ grid-template-columns:repeat(2,1fr); }
  .two-col{ grid-template-columns:1fr; }
  .two-col.even{ grid-template-columns:1fr; }
  .gsearch{ max-width:220px; }
}
@media (max-width:620px){
  .stat-grid{ grid-template-columns:1fr; }
  .topbar h1{ font-size:16px; }
  .view-root{ padding:16px; }
  .topbar{ flex-wrap:wrap; height:auto; padding:10px 16px; gap:10px; }
  .gsearch{ max-width:none; width:100%; order:3; }
  .drawer{ width:100vw; padding:18px 16px 60px; }
  .modal-box{ padding:18px 16px; }
  .filter-row{ gap:6px; }
  .search-mini{ margin-left:0; width:100%; }
  .panel-head{ flex-wrap:wrap; gap:8px; }
  /* touch targets: keep every tappable control at least 40px tall on
     small screens, per the mobile bug-pass requirement. */
  .btn, .btn.sm, .chip, .iconbtn, .radio-pill{ min-height:40px; }
  .sb-link{ min-height:44px; }
  .dtable td, .dtable th{ padding:10px 8px; }
  .dtable{ font-size:12.5px; }
}
#gate-screen{ position:fixed; inset:0; z-index:9999; background:var(--cream); display:flex; flex-direction:column; align-items:center; justify-content:center; gap:14px; color:var(--ink-soft); font-weight:600; font-size:14px; text-align:center; padding:24px; }
.gate-spin{ width:30px; height:30px; border-radius:50%; border:3px solid var(--line); border-top-color:var(--orange-deep); animation:gate-spin .8s linear infinite; }
#gate-screen.is-error .gate-spin{ display:none; }
@keyframes gate-spin{ to{ transform:rotate(360deg); } }
.staff-pick{ display:block; width:100%; text-align:left; background:var(--paper); border:1px solid var(--line); border-radius:10px; padding:9px 12px; margin-top:6px; font-size:13px; color:var(--ink); cursor:pointer; font-family:inherit; }
.staff-pick:hover, .staff-pick.is-picked{ border-color:var(--orange); background:var(--orange-soft); }
</style>
</head>

<script>
/* ============================================================
   MOCK DATA LAYER — isolated so it can later be swapped for
   real Supabase queries without touching the render/UI layer.
   ============================================================ */
(function(){
'use strict';

// Same public (publishable) key the main app already ships to browsers.
// It grants nothing by itself: every read/write below is enforced by
// row-level security and SECURITY DEFINER functions on the server.
const SUPABASE_URL = window.JOURNAL_CONFIG.SUPABASE_URL;
const SUPABASE_ANON_KEY = window.JOURNAL_CONFIG.SUPABASE_ANON_KEY;
let sb = null;
let STAFF_ROWS = [];
let STAFF_COUNTS = {};
function sc(k){ return Number(STAFF_COUNTS[k])||0; }
let countsTimer = null;
async function refreshStaffCounts(){
  if(typeof sb==='undefined' || !sb) return;
  try{
    const { data } = await sb.rpc('get_staff_overview');
    if(data){ STAFF_COUNTS = data; renderSidebar(); if(Number(data.media_pending)>0) purgeOrphanMedia(); }
  }catch(e){}
}
function refreshStaffCountsSoon(){ clearTimeout(countsTimer); countsTimer = setTimeout(refreshStaffCounts, 700); }
let STAFF_CACHE = {}; // live rows fetched per view (reports/copyright/privacy/grievances/restrictions/appeals), keyed for detail lookups

const $ = (s,r)=> (r||document).querySelector(s);
const $$ = (s,r)=> Array.from((r||document).querySelectorAll(s));
const esc = s => String(s==null?'':s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmtDate = d => new Date(d).toLocaleString('en-US',{month:'short',day:'numeric',year:'numeric',hour:'numeric',minute:'2-digit'});
const timeAgo = d => {
  const s = Math.floor((Date.now()-new Date(d).getTime())/1000);
  if(s<60) return s+'s ago'; const m=Math.floor(s/60); if(m<60) return m+'m ago';
  const h=Math.floor(m/60); if(h<24) return h+'h ago'; const dd=Math.floor(h/24); return dd+'d ago';
};

/* ============================================================
   ROLE / PERMISSION MODEL  (spec sections 1, 3, 4)

   *** SECURITY NOTE — READ BEFORE WIRING TO SUPABASE ***
   Everything in this block is a CLIENT-SIDE PREVIEW ONLY. The role
   toggle in the top strip lets you preview what each role sees; it
   is not — and must never become — the authorization boundary.
   Per spec section 2, when this connects to Supabase:
     - role + permissions must be read from a server-trusted table
       (e.g. user_roles / role_permissions), never from client state
       or user-editable profile metadata.
     - every mutating action below (restrictUser, removeContent,
       handleModAction, etc.) must be re-checked and actually
       enforced by RLS policies and/or a privileged RPC/Edge
       Function — the checks here only hide/disable UI.
     - self-promotion, role changes, and any action targeting an
       Admin account must be rejected server-side even if a client
       is modified to skip the checks below.
   ============================================================ */

const ROLES = [
  {id:'admin',     label:'Admin',     short:'Admin',     level:100},
  {id:'moderator', label:'Moderator', short:'Moderator', level:40},
];
function roleMeta(id){ return ROLES.find(r=>r.id===id) || ROLES[1]; }

// Full permission catalog. Admin implicitly has every one of these
// regardless of individual grants (see can()). Moderators get the full
// set by default too — Admin can then revoke individual permissions per
// moderator from Staff → Permissions, which is what makes the catalog
// worth keeping even though there's only one non-admin role.
const PERMISSIONS = [

let PURGING = false;
async function purgeOrphanMedia(){
  if(PURGING) return;
  PURGING = true;
  try{
    for(let i=0;i<10;i++){
      const pk = await sb.rpc('peek_media_purge', {p_limit:20});
      const urls = pk.data;
      if(pk.error || !Array.isArray(urls) || !urls.length) break;
      const { data, error } = await sb.functions.invoke('upload-image', {method:'DELETE', body:{urls, purge:true}});
      if(error) break;
      const results = (data && data.results) || {};
      const done = urls.filter(u=> !String(results[u]||'failed').startsWith('failed'));
      if(!done.length) break;
      await sb.rpc('ack_media_purge', {p_urls:done});
      if(done.length < urls.length) break;
    }
  }catch(e){}
  PURGING = false;
}
function confirmTyped({title, body, word='DELETE', confirmLabel='Delete', onConfirm}){

    <input class="search-mini" style="width:100%;" id="typed-confirm-input" autocomplete="off">
    <div class="modal-actions">
      <button class="btn ghost sm" data-action="close-modal">Cancel</button>

    </div>`);
  const inp = $('#typed-confirm-input'), btn = $('#typed-confirm-btn');
  inp.oninput = ()=>{ btn.disabled = inp.value.trim() !== word; };

const BULK = {content:new Set(), reports:new Set()};
function wireBulk(kind, host, actions){
  const set = BULK[kind]; set.clear();
  const old = host.querySelector('.bulk-bar'); if(old) old.remove();
  const bar = document.createElement('div'); bar.className = 'bulk-bar'; bar.hidden = true;
  host.prepend(bar);
  const boxes = [...host.querySelectorAll('.bulk-cb')];
  const all = host.querySelector('.bulk-all');
  const sync = ()=>{
    bar.hidden = set.size===0;
    if(all) all.checked = boxes.length>0 && set.size===boxes.length;
    if(set.size===0){ bar.innerHTML=''; return; }
    bar.innerHTML = `<b>${set.size} selected</b>` + actions.map((a,i)=>`<button class="btn ${a.cls} sm" data-bulk-i="${i}" type="button">${esc(a.label)}</button>`).join('') + `<button class="btn ghost sm" data-bulk-clear type="button">Clear</button>`;
    bar.querySelectorAll('[data-bulk-i]').forEach(b=> b.onclick = ()=> actions[+b.dataset.bulkI].run([...set]));
    bar.querySelector('[data-bulk-clear]').onclick = ()=>{ set.clear(); boxes.forEach(x=>x.checked=false); sync(); };
  };
  boxes.forEach(cb=> cb.onchange = ()=>{ cb.checked ? set.add(cb.value) : set.delete(cb.value); sync(); });
  if(all) all.onchange = ()=>{ boxes.forEach(cb=>{ cb.checked = all.checked; all.checked ? set.add(cb.value) : set.delete(cb.value); }); sync(); };
}
function confirmAction({title, body, requireReason=true, destructive=false, confirmLabel='Confirm', onConfirm}){
  openModal(`
    <h3>${esc(title)}</h3>
    ${body?`<p class="sub">${esc(body)}</p>`:''}
    ${requireReason?`<textarea id="reason-input" placeholder="Reason for this action (required, visible in the moderation log)…"></textarea>
    <div id="reason-err" style="color:var(--red); font-size:11.5px; margin-top:4px; display:none;">A reason is required before you can confirm.</div>`:''}
    <div class="modal-actions">
      <button class="btn ghost sm" data-action="close-modal">Cancel</button>
      <button class="btn ${destructive?'danger':'primary'} sm" id="modal-confirm-btn">${esc(confirmLabel)}</button>
    </div>
  `);
  $('#modal-confirm-btn').onclick = ()=>{
    let reason = '';
    if(requireReason){
      reason = $('#reason-input').value.trim();
      if(!reason){ $('#reason-err').style.display='block'; return; }
    }
    closeModal();
    onConfirm(reason);
  };
}

        const { data, error } = await sb.rpc('bulk_resolve_reports', {p_report_ids:ids, p_action:action, p_reason:reason});

        toast(`Handled ${data.done} case${data.done===1?'':'s'}${data.skipped?` (${data.skipped} already handled or skipped)`:''}.`, data.done?'success':'error');
        if(state.view==='reports') renderReports();
      }catch(err){ toast((err&&err.message)||'Bulk action failed.','error'); }
    }});
    if(can('reports.resolve') && can('content.remove')) acts.push({label:'Delete reported content', cls:'danger', run: runBulk('remove_content','Delete the content in {n} selected report(s)?','Each reported item is permanently deleted from the database and its author notified. This can\u2019t be undone.','Delete content',true)});
    if(can('reports.dismiss')) acts.push({label:'Dismiss selected', cls:'soft', run: runBulk('dismiss','Dismiss {n} selected report(s)?','The reports are closed with no action on the content.','Dismiss',false)});
    if(acts.length) wireBulk('reports', root.firstElementChild, acts);
  }
}

function handleReportAction(reportId, act){
  const r = (STAFF_CACHE.reports||[]).find(x=>x.id===reportId);
  if(!r) return;
  if(act==='assign'){
    sb.rpc('assign_case',{p_kind:'report',p_id:reportId}).then(({error})=>{
      if(error){ toast(error.message,'error'); return; }
      toast('Case assigned to you.','success');
      renderReportDetail(reportId);
      if(state.view==='reports') renderReports();
    });
    return;
  }
  if(act==='restrict'){
    openRestrictionModalForUser({userId:r.reported_user_id, caseId:r.case_id, onDone:()=>{ closeDrawer(); toast('Restriction issued.','success'); if(state.view==='reports') renderReports(); }});
    return;
  }
  const cfg = {
    dismiss:{title:'Dismiss this report?', confirmLabel:'Dismiss', destructive:false},
    warn:{title:'Warn this user?', body:'They will be notified.', confirmLabel:'Send warning', destructive:false},
    remove_content:{title:'Permanently delete this content?', body:'It is deleted from the database for good and the author is notified. This can\u2019t be undone.', confirmLabel:'Delete content', destructive:true},
  }[act];
  if(!cfg) return;
  confirmAction({...cfg, onConfirm: async (reason)=>{
    try{
      const { error } = act==='dismiss'
        ? await sb.rpc('dismiss_case', {p_kind:'report', p_id:reportId, p_reason:reason})
        : await sb.rpc('resolve_report', {p_report_id:reportId, p_action:act, p_reason:reason});
      if(error) throw error;
      toast('Done.','success');
      closeDrawer();
      if(state.view==='reports') renderReports();
    }catch(err){ toast((err&&err.message)||'Could not complete that action.','error'); }
  }});
}
function wireCaseNotes(caseId){

async function openRestrictionModalForUser({userId, caseId, defaultScope, onDone}){
  if(!STAFF_CACHE.settings){ try{ const sr = await sb.rpc('get_settings'); if(sr.data) STAFF_CACHE.settings = sr.data; }catch(e){} }
  const defDays = Math.max(1, parseInt((STAFF_CACHE.settings||{}).defaultRestrictionDays,10) || 14);
  let brief = null;
  try{ const { data } = await sb.rpc('get_user_brief', {p_user:userId}); brief = (data&&data[0])||null; }catch(e){}
  const label = brief ? '@'+brief.username : 'this user';
  openModal(`
    <h3>Restrict ${esc(label)}?</h3>
    <p class="sub">Choose what\u2019s restricted, for how long, and why. The user is notified.</p>
    <label class="field-label">Restriction scope</label>
    <select class="search-mini" style="width:100%; margin-bottom:10px;" id="restrict-scope">
      ${RESTRICTION_SCOPES.map(sc=>`<option value="${sc.id}">${esc(sc.label)}</option>`).join('')}
    </select>
    <label class="field-label">Duration</label>
    <div class="duration-row" id="duration-row">
      ${DURATION_TYPES.map((d,i)=>`<label class="radio-pill"><input type="radio" name="duration-type" value="${d.id}" ${i===0?'checked':''}>${esc(d.label)}</label>`).join('')}
    </div>
    <input type="number" min="1" value="${defDays}" id="restrict-days" class="search-mini" style="width:100%; margin-bottom:10px;" placeholder="Number of days">
    <textarea id="reason-input" placeholder="Reason for this action (required, visible in the moderation log)\u2026"></textarea>
    <div id="reason-err" style="color:var(--red); font-size:11.5px; margin-top:4px; display:none;">A reason is required before you can confirm.</div>
    <div class="modal-actions">
      <button class="btn ghost sm" data-action="close-modal">Cancel</button>
      <button class="btn danger sm" id="modal-confirm-btn">Apply restriction</button>
    </div>
  `);
  if(defaultScope && $('#restrict-scope')) $('#restrict-scope').value = defaultScope;
  const daysInput = $('#restrict-days');
  const sync = ()=>{ daysInput.style.display = document.querySelector('input[name="duration-type"]:checked').value==='temporary'?'':'none'; };
  sync();
  $$('input[name="duration-type"]').forEach(elx=>elx.addEventListener('change', sync));
  $('#modal-confirm-btn').onclick = async ()=>{
    const reason = $('#reason-input').value.trim();
    if(!reason){ $('#reason-err').style.display='block'; return; }
    const scope = $('#restrict-scope').value;
    const durationType = document.querySelector('input[name="duration-type"]:checked').value;
    const days = durationType==='temporary' ? (parseInt(daysInput.value,10)||1) : null;
    try{
      const { error } = await sb.rpc('apply_restriction', {
        p_user:userId, p_scope:scope, p_type: scope+'_restriction', p_duration_type:durationType, p_days:days, p_reason:reason, p_case:caseId||null
      });
      if(error) throw error;
      closeModal();
      onDone && onDone();
    }catch(err){
      $('#reason-err').textContent = (err&&err.message)||'Could not apply restriction.';
      $('#reason-err').style.display='block';
    }
  };
}

function handleUserAction(userId, act){
  const u = (STAFF_CACHE.users||[]).find(x=>x.id===userId);
  const label = u && u.username ? '@'+u.username : 'this user';
  const refresh = ()=>{ renderUserDetail(userId); if(state.view==='users') renderUsers(); };
  if(act==='restrict' || act==='suspend'){
    openRestrictionModalForUser({
      userId, caseId:null, defaultScope: act==='suspend'?'account':'posts',
      onDone:()=>{ toast(act==='suspend'?'User suspended.':'User restriction created.','success');
        // cache is stale until the list is re-read; drop it so the drawer refetches fresh counts
        STAFF_CACHE.users = null; refresh(); }
    });
    return;
  }
  if(act==='wipe'){
    confirmAction({title:`Permanently delete everything ${label} has posted?`, body:'Every Work, story, article and comment by this account is deleted from the database for good, with its likes, reports and stored images. This can\u2019t be undone.', destructive:true, confirmLabel:'Delete everything', onConfirm: async (reason)=>{
      try{
        const { data, error } = await sb.rpc('remove_all_user_content', {p_user:userId, p_reason:reason});
        if(error) throw error;
        toast(`Deleted ${data.journals} post${data.journals===1?'':'s'}, ${data.stories} stor${data.stories===1?'y/article':'ies/articles'} and ${data.comments} comment${data.comments===1?'':'s'}.`,'success');
        STAFF_CACHE.users = null; refresh();
      }catch(err){ toast((err&&err.message)||'Could not delete this account\u2019s content.','error'); }
    }});
    return;
  }
  confirmAction({title:`Lift all restrictions on ${label}?`, confirmLabel:'Lift restrictions', destructive:false, requireReason:true, onConfirm: async (reason)=>{
    try{
      const { data, error } = await sb.rpc('list_restrictions');
      if(error) throw error;
      const active = (data||[]).filter(x=>x.user_id===userId && x.active);
      for(const x of active){
        const { error: e2 } = await sb.rpc('lift_restriction', {p_restriction_id:x.id, p_reason:reason||'Lifted by staff'});
        if(e2) throw e2;
      }
      toast(active.length ? 'Restrictions lifted.' : 'No active restrictions to lift.','success');
      STAFF_CACHE.users = null;
      refresh();
    }catch(err){ toast((err&&err.message)||'Could not lift restrictions.','error'); }
  }});
}

const CONTENT_ACTION_COPY = {

function openAddModeratorModal(){
  let picked = null, timer = null, seq = 0;
  openModal(`
    <h3>Add a moderator</h3>
    <p class="sub">Search by username. They\u2019ll get a notification and only become a moderator if they accept.</p>
    <input class="search-mini" style="width:100%;" id="mod-search" placeholder="Search username\u2026" autocomplete="off">
    <div id="mod-search-results" style="margin-top:6px;"></div>
    <p class="sub" style="margin-top:10px;">Admin can only be granted through the Supabase console, never from this dashboard.</p>
    <div class="modal-actions">
      <button class="btn ghost sm" data-action="close-modal">Cancel</button>
      <button class="btn primary sm" id="confirm-add-mod" disabled>Send invite</button>
    </div>
  `);
  const input = $('#mod-search'), box = $('#mod-search-results'), send = $('#confirm-add-mod');
  const skip = new Set(STAFF_ROWS.map(r=>r.user_id)); // current staff + people with a pending invite
  input.focus();
  input.oninput = ()=>{
    clearTimeout(timer); picked = null; send.disabled = true;
    // usernames are lowercase letters, digits and underscores only
    const q = input.value.trim().toLowerCase().replace(/[^a-z0-9_]/g,'');
    if(q.length < 2){ box.innerHTML = ''; return; }
    timer = setTimeout(async ()=>{
      const mine = ++seq;
      try{
        const { data, error } = await sb.from('profiles').select('id, username, display_name').ilike('username', '%'+q+'%').limit(8);
        if(error) throw error;
        if(mine !== seq) return; // a newer search is already running
        const list = (data||[]).filter(u=>!skip.has(u.id));
        box.innerHTML = list.length
          ? list.map(u=>`<button type="button" class="staff-pick" data-pick="${esc(u.id)}" data-un="${esc(u.username)}">@${esc(u.username)} \u2014 ${esc(u.display_name||'')}</button>`).join('')
          : '<p class="sub">No matching members (staff and pending invites are hidden).</p>';
        box.querySelectorAll('.staff-pick').forEach(b=>{
          b.onclick = ()=>{
            box.querySelectorAll('.staff-pick').forEach(x=>x.classList.remove('is-picked'));
            b.classList.add('is-picked');
            picked = { id: b.dataset.pick, username: b.dataset.un };
            send.disabled = false;
          };
        });
      }catch(err){ box.innerHTML = `<p class="sub">Search failed: ${esc((err && err.message)||'try again')}</p>`; }
    }, 250);
  };
  send.onclick = async ()=>{
    if(!picked) return;
    send.disabled = true;
    try{
      const { error } = await sb.rpc('invite_moderator', { target_user_id: picked.id });
      if(error) throw error;
      toast(`Invite sent to @${picked.username}.`, 'success');
      closeModal();
      renderModerators();
    }catch(err){
      toast((err && err.message) || 'Could not send the invite.', 'error');
      send.disabled = false;
    }
  };
}

async function openLinked(kind, id){
  const k = LINKED_KINDS[kind];
  if(!k){ return; }
  try{
    const { data, error } = await sb.rpc(k.rpc);
    if(error) throw error;
    STAFF_CACHE[k.key] = data||[];
  }catch(err){ toast((err&&err.message)||'Could not open that item.','error'); return; }
  if(!(STAFF_CACHE[k.key]||[]).some(x=>x.id===id)){ toast('That item has already been resolved.','error'); return; }
  k.open(id);
}

async function renderCaseWorkspace(caseId){
  let c, staff = [];
  try{
    const [d, s] = await Promise.all([sb.rpc('get_case_detail', {p_case_id:caseId}), sb.rpc('list_staff')]);
    if(d.error) throw d.error;
    c = d.data;
    staff = (s.data||[]).filter(r=>r.staff_role==='admin'||r.staff_role==='moderator');
  }catch(err){ toast((err&&err.message)||'Could not load this case.','error'); return; }
  if(!c){ toast('Could not load this case.','error'); return; }
  const items = c.items||[], notes = c.notes||[], log = c.log||[];
  const assignable = items.filter(i=>['Report','Copyright','Privacy','Grievance'].includes(i.kind) && i.bucket!=='Resolved');
  const cur = c.assignee ? c.assignee.id : '';
  openDrawer(`
    <button class="iconbtn drawer-close" data-action="close-drawer">\u2715</button>
    <h2 style="font-size:19px;">Case ${esc(c.case_id)}</h2>
    <div class="kv">
      <b>Types</b><span>${(c.types||[]).length ? c.types.map(t=>`<span class="badge grey" style="margin-right:2px;">${esc(t)}</span>`).join('') : '\u2014'}</span>

      <b>Priority</b><span>${priorityBadge(c.priority||'Normal')}</span>

    </div>
    ${c.status==='Resolved' && !items.length ? '<p class="muted" style="font-size:12px; margin-top:8px;">This case is resolved. Its history is below.</p>' : ''}
    ${assignable.length && (can('cases.assign')||can('grievances.assign')) ? `<div style="margin:12px 0;">
      <b style="font-size:11.5px; text-transform:uppercase; color:var(--ink-faint); display:block; margin-bottom:6px;">Assign to</b>
      <div style="display:flex; gap:8px;">
        <select class="search-mini" style="flex:1;" id="case-assign-select">
          ${staff.map(m=>`<option value="${esc(m.user_id)}" ${cur===m.user_id?'selected':''}>${esc(m.display_name||m.username||'Unnamed')}${m.staff_role==='admin'?' (admin)':''}</option>`).join('')}
        </select>
        <button class="btn soft sm" id="case-assign-btn" type="button">Assign</button>
      </div>
    </div>` : ''}
    <hr class="divider">
    <h4 style="font-size:13px; margin-bottom:8px;">Linked items</h4>
    ${items.length ? items.map(i=>`<div class="linked-item" data-open-linked="${esc(i.kind+':'+i.id)}" style="cursor:pointer;"><b>${esc(i.kind)}</b><span class="muted">${esc(i.title||'')} \u00b7 ${esc(i.bucket)}</span></div>`).join('') : '<p class="muted" style="font-size:12px;">No open items.</p>'}
    <hr class="divider">
    <h4 style="font-size:13px; margin-bottom:8px;">Case timeline</h4>
    ${log.length ? `<div class="timeline">${log.map(l=>`<div class="tl-item"><div class="tl-time">${fmtDate(l.at)}</div><div class="tl-body"><b>${esc(String(l.action||'').replace(/_/g,' '))}</b>${l.moderator_name?' by '+esc(l.moderator_name):''}<br><span class="muted">${esc(l.reason||'')}</span></div></div>`).join('')}</div>` : '<p class="muted" style="font-size:12px;">No log entries for this case yet.</p>'}
    <hr class="divider">
    <h4 style="font-size:13px; margin-bottom:8px;">Internal notes <span class="muted" style="font-weight:500;">(staff only)</span></h4>
    ${notes.map(n=>`<div class="note-item"><div class="who">${esc(n.author_name)} \u00b7 ${timeAgo(n.at)}</div>${esc(n.text)}</div>`).join('') || '<p class="muted" style="font-size:12px;">No internal notes yet.</p>'}
    ${items.length || notes.length ? `<div style="display:flex; gap:8px; margin-top:8px;">
      <input class="search-mini" style="flex:1;" id="case-note-input" maxlength="1000" placeholder="Add an internal note\u2026">
      <button class="btn soft sm" id="case-add-note-btn" type="button">Add</button>
    </div>` : ''}
  `);
  const ab = $('#case-assign-btn');
  if(ab) ab.onclick = async ()=>{
    const to = $('#case-assign-select').value; if(!to) return;
    ab.disabled = true;
    try{
      for(const i of assignable){
        const { error } = await sb.rpc('assign_case', {p_kind:i.kind.toLowerCase(), p_id:i.id, p_to:to});

      toast('Internal note added.','success');
      renderCaseWorkspace(caseId);
    }catch(err){ nb.disabled = false; toast((err&&err.message)||'Could not add the note.','error'); }
  };

          <b style="font-size:11.5px; text-transform:uppercase; color:var(--ink-faint); display:block; margin-bottom:6px;">Preview</b>
          <div id="notif-preview-box"></div>
        </div>
        <div style="margin-top:14px;"><button class="btn primary sm" id="notif-send-btn">Send notification</button></div>
      </div>
      <div class="panel">
        <div class="panel-head"><h3>Notification history</h3></div>
        ${history.length ? `<div class="timeline">${history.map(n=>`<div class="tl-item"><div class="tl-time">${fmtDate(n.sent_at)}${n.sent_by_name?' \u00b7 '+esc(n.sent_by_name):''}</div><div class="tl-body"><b>${esc(n.subject)}</b> \u2192 ${n.to_username?esc(n.to_username):'\u2014'}${(n.recipient_count>1)?' <span class="badge grey">'+n.recipient_count+' people</span>':''}<br><span class="muted">${esc(n.message)}</span></div></div>`).join('')}</div>` : emptyState('No notifications sent', 'Notifications you send to users will be logged here.')}
      </div>
    </div>`;
  const audSel = $('#notif-audience'), search = $('#notif-user-search'), tplSel = $('#notif-template'), subj = $('#notif-subject'), msg = $('#notif-message');
  const picked = new Map();            // id -> username
  let found = [];
  const mode = ()=> audSel.value;
  const audLabel = ()=>{
    if(mode()==='all') return 'Every user';
    if(mode()==='writers') return 'All writers';
    if(mode()==='staff') return 'All staff';
    const names = [...picked.values()].slice(0,3).map(u=>'@'+u);
    return picked.size ? names.join(', ') + (picked.size>3 ? ' +'+(picked.size-3)+' more' : '') : 'Recipients';
  };
  const firstName = ()=> picked.size ? [...picked.values()][0] : 'username';
  let countSeq = 0;
  const syncCount = async ()=>{
    const el = $('#notif-count'); const my = ++countSeq;
    if(mode()==='selected'){ el.textContent = picked.size ? `Will be sent to ${picked.size} ${picked.size===1?'person':'people'}.` : 'Pick at least one user.'; return; }
    el.textContent = 'Counting recipients\u2026';
    try{
      const { data, error } = await sb.rpc('notice_audience_count', {p_mode:mode(), p_ids:null});
      if(error) throw error; if(my!==countSeq) return;
      el.textContent = `Will be sent to ${data} ${data===1?'person':'people'} (you are not included).`;
    }catch(e){ if(my===countSeq) el.textContent = ''; }
  };
  const syncPreview = ()=>{
    const filled = (t)=> String(t||'').replace(/\{\{\s*username\s*\}\}/g, firstName());
    $('#notif-preview-box').innerHTML = notifPreviewCustom(audLabel(), filled(subj.value)||'Subject', filled(msg.value)||'Your message will appear here.');
  };
  const renderChips = ()=>{
    $('#notif-chips').innerHTML = [...picked.entries()].map(([id,u])=>`<button type="button" class="chip active" data-unpick="${esc(id)}">@${esc(u)} \u2715</button>`).join('');
    $('#notif-chips').querySelectorAll('[data-unpick]').forEach(b=> b.onclick = ()=>{ picked.delete(b.dataset.unpick); renderChips(); renderResults(); syncCount(); syncPreview(); });
  };
  const renderResults = ()=>{
    const box = $('#notif-results');
    box.innerHTML = found.length ? found.map(u=>`<button type="button" class="staff-pick ${picked.has(u.id)?'is-picked':''}" data-pick="${esc(u.id)}">${picked.has(u.id)?'\u2713 ':''}@${esc(u.username)} \u2014 ${esc(u.display_name||'')}</button>`).join('') : '<p class="sub">No users found.</p>';
    box.querySelectorAll('[data-pick]').forEach(b=> b.onclick = ()=>{
      const u = found.find(x=>x.id===b.dataset.pick); if(!u) return;
      if(picked.has(u.id)) picked.delete(u.id); else picked.set(u.id, u.username);
      renderChips(); renderResults(); syncCount(); syncPreview();
    });
  };
  const applyTemplate = ()=>{
    const t = templates.find(x=>x.id===tplSel.value);
    subj.value = t ? t.subject : '';
    msg.value = t ? t.body : '';
    syncPreview();
  };
  let timer = null, seq = 0;
  const loadUsers = async (q)=>{
    const my = ++seq;
    try{
      const { data, error } = await sb.rpc('list_users_for_staff', {p_search:q||null, p_limit:20, p_offset:0});
      if(error) throw error;
      if(my!==seq) return;
      found = (data||[]).filter(u=>u.username);
      renderResults();
    }catch(e){ $('#notif-results').innerHTML = '<p class="sub">Couldn\u2019t search users.</p>'; }
  };
  const syncMode = ()=>{ $('#notif-pick-wrap').style.display = mode()==='selected' ? '' : 'none'; syncCount(); syncPreview(); };
  audSel.onchange = syncMode;
  search.oninput = ()=>{ clearTimeout(timer); timer = setTimeout(()=>loadUsers(search.value.trim()), 250); };
  tplSel.onchange = applyTemplate;
  [subj, msg].forEach(el=> el.addEventListener('input', syncPreview));
  const doSend = async (subject, message)=>{
    const btn = $('#notif-send-btn'); btn.disabled = true;
    try{
      const { data, error } = await sb.rpc('send_notice_multi', {p_mode:mode(), p_user_ids: mode()==='selected' ? [...picked.keys()] : null, p_subject:subject, p_message:message});
      if(error) throw error;
      toast(`Notification sent to ${data} ${data===1?'person':'people'}.`,'success');
      renderNotifications();
    }catch(err){ btn.disabled = false; toast((err&&err.message)||'Could not send the notification.','error'); }
  };
  $('#notif-send-btn').onclick = ()=>{
    const subject = subj.value.trim(), message = msg.value.trim();
    if(mode()==='selected' && !picked.size){ toast('Pick at least one recipient first.','error'); return; }
    if(!subject || !message){ toast('Subject and message are required.','error'); return; }
    const left = (subject+' '+message).match(/\{\{\s*\w+\s*\}\}/g);
    const bad = (left||[]).filter(x=>!/^\{\{\s*username\s*\}\}$/.test(x));
    if(bad.length){ toast('Fill in '+[...new Set(bad)].join(', ')+' before sending.','error'); return; }
    if(mode()==='selected' && picked.size===1){ doSend(subject, message); return; }
    confirmAction({title:'Send to '+audLabel()+'?', body:'This will notify '+(mode()==='selected'?picked.size+' people':$('#notif-count').textContent.replace(/^Will be sent to /,'').replace(/\.$/,''))+' right away. It can\u2019t be recalled.', requireReason:false, confirmLabel:'Send now', onConfirm:()=>doSend(subject, message)});
  };
  loadUsers('');
  syncMode();
  if(prefill){ tplSel.value = prefill; applyTemplate(); } else syncPreview();
}
function notifPreviewCustom(from, subject, message){
  return `<div class="notif-preview">
    <div class="from">From: Admin \u00b7 To: ${esc(from)}</div>
    <div class="msg"><b>${esc(subject)}</b><br>${esc(message)}</div>
    <div class="meta">Preview \u2014 not yet sent</div>
  </div>`;
}

let PERM_SEQ = 0;
async function renderPermissions(){
  const root = $('#view-root');
  if(!isAdmin()){ root.innerHTML = emptyState('Admins only', 'Only Admins can view or edit moderator permissions.'); return; }
  const mine = ++PERM_SEQ;
  root.innerHTML = `<div class="panel" style="padding:18px;"><span class="muted">Loading permissions\u2026</span></div>`;
  let staff, permRows;
  try{
    const [a, b] = await Promise.all([sb.rpc('list_staff'), sb.rpc('list_staff_permissions')]);
    if(a.error) throw a.error;
    if(b.error) throw b.error;
    staff = (a.data||[]).filter(r=>r.staff_role==='moderator');
    permRows = b.data||[];
  }catch(err){
    if(mine!==PERM_SEQ || state.view!=='permissions') return;
    root.innerHTML = emptyState('Couldn\u2019t load permissions', (err&&err.message)||'Please try again.');
    return;
  }
  if(mine!==PERM_SEQ || state.view!=='permissions') return;

  STAFF_CACHE.permStaff = staff; STAFF_CACHE.permMap = map;
  root.innerHTML = `
    <p class="sub" style="margin-bottom:14px;">Every moderator starts with the full permission set. Untick anything a moderator shouldn\u2019t be able to do. Actions (removing content, restricting users, resolving cases and so on) are enforced on the server, so changes take effect on their next action. Section \u201cview\u201d permissions currently hide the page in the dashboard but don\u2019t block direct data reads.</p>
    <div class="table-scroll"><div class="panel" style="padding:8px 12px;">
    ${staff.length ? `<table class="dtable"><thead><tr><th>Moderator</th><th>Permissions granted</th><th></th></tr></thead><tbody>
    ${staff.map(m=>{
      const name = m.display_name || m.username || 'Unnamed';
      const custom = Object.prototype.hasOwnProperty.call(map, m.user_id);
      return `<tr>
        <td class="name-cell">${avatarHTML(m.avatar_url, name)}<span><b>${esc(name)}</b><br><span class="muted">@${esc(m.username||'')}</span></span></td>

function renderPermissionsEditor(userId){
  const m = (STAFF_CACHE.permStaff||[]).find(x=>x.user_id===userId);
  if(!m) return;
  const map = STAFF_CACHE.permMap||{};
  const perms = new Set(Object.prototype.hasOwnProperty.call(map,userId) ? map[userId] : PERMISSIONS);
  const name = m.display_name || m.username || 'Unnamed';
  openDrawer(`
    <button class="iconbtn drawer-close" data-action="close-drawer">\u2715</button>
    <h2 style="font-size:18px;">Permissions \u2014 ${esc(name)}</h2>
    <p class="sub" style="margin-bottom:8px;">Untick anything this moderator shouldn\u2019t have access to.</p>
    <div style="display:flex; gap:8px; margin-bottom:12px;"><button class="btn ghost sm" id="perm-all-btn" type="button">Select all</button><button class="btn ghost sm" id="perm-none-btn" type="button">Clear all</button></div>
    ${PERMISSION_GROUPS.map(g=>`
      <div style="margin-bottom:14px;">
        <b style="font-size:11.5px; text-transform:uppercase; color:var(--ink-faint); display:block; margin-bottom:6px;">${esc(g.label)}</b>
        ${g.perms.map(p=>`<label class="radio-pill" style="display:flex; margin-bottom:6px; width:100%; box-sizing:border-box;"><input type="checkbox" class="perm-check" value="${p}" ${perms.has(p)?'checked':''}> ${esc(p)}</label>`).join('')}
      </div>
    `).join('')}
    <div class="modal-actions" style="justify-content:flex-start;">
      <button class="btn primary sm" id="save-perms-btn">Save permissions</button>
    </div>
  `);
  $('#perm-all-btn').onclick = ()=> $$('.perm-check').forEach(c=>c.checked=true);
  $('#perm-none-btn').onclick = ()=> $$('.perm-check').forEach(c=>c.checked=false);
  $('#save-perms-btn').onclick = async ()=>{
    const btn = $('#save-perms-btn');
    const checked = $$('.perm-check').filter(c=>c.checked).map(c=>c.value);
    btn.disabled = true;
    try{
      const { error } = await sb.rpc('set_staff_permissions', {p_user:userId, p_permissions:checked});
      if(error) throw error;
      toast('Permissions updated.','success');
      closeDrawer();
      if(state.view==='permissions') renderPermissions();
    }catch(err){ btn.disabled = false; toast((err&&err.message)||'Could not save permissions.','error'); }
  };
}

}

function goto(view){
  const item = NAV.find(n=>n.id===view);
  if(item && !navVisible(item)){ toast('You don\u2019t have access to that section.','error'); return; }
  state.view = view;
  state.bulkSelection.clear();
  $('#view-title').textContent = VIEW_TITLES[view] || view;
  renderSidebar();
  if(view!=='overview') refreshStaffCounts();
  (VIEW_RENDERERS[view]||renderOverview)();
  setSidebar(false);
}

/* ============================================================
   EVENT WIRING (delegated)
   ============================================================ */
document.addEventListener('click', (e)=>{
  const nav = e.target.closest('[data-nav]');
  if(nav){ goto(nav.dataset.nav); return; }

  if(e.target.closest('[data-action="close-drawer"]')){ closeDrawer(); return; }
  if(e.target.closest('[data-action="close-modal"]')){ closeModal(); return; }
  if(e.target===$('#drawer-scrim')){ closeDrawer(); return; }
  if(e.target===$('#modal-scrim')){ closeModal(); return; }

  const openReport = e.target.closest('[data-open-report]');
  if(openReport){ renderReportDetail(openReport.dataset.openReport); return; }
  const openLinkedEl = e.target.closest('[data-open-linked]');
  if(openLinkedEl){ const [k,...rest] = openLinkedEl.dataset.openLinked.split(':'); openLinked(k, rest.join(':')); return; }
  const openUser = e.target.closest('[data-open-user]');
  if(openUser){ renderUserDetail(openUser.dataset.openUser); return; }
  const openContent = e.target.closest('[data-open-content]');
  if(openContent){ renderContentDetail(openContent.dataset.openContent); return; }
  const openAppeal = e.target.closest('[data-open-appeal]');
  if(openAppeal){ renderAppealDetail(openAppeal.dataset.openAppeal); return; }
  const openCase = e.target.closest('[data-open-case]');
  if(openCase){ renderCaseTimeline(openCase.dataset.openCase); return; }
  const openRestriction = e.target.closest('[data-open-restriction]');
  if(openRestriction){ renderRestrictionDetail(openRestriction.dataset.openRestriction); return; }
  const openCaseFull = e.target.closest('[data-open-case-full]');
  if(openCaseFull){ renderCaseWorkspace(openCaseFull.dataset.openCaseFull); return; }
  const openCopyright = e.target.closest('[data-open-copyright]');
  if(openCopyright){ renderCopyrightDetail(openCopyright.dataset.openCopyright); return; }
  const openPrivacy = e.target.closest('[data-open-privacy]');
  if(openPrivacy){ renderPrivacyDetail(openPrivacy.dataset.openPrivacy); return; }
  const openGrievance = e.target.closest('[data-open-grievance]');
  if(openGrievance){ renderGrievanceDetail(openGrievance.dataset.openGrievance); return; }
  const openTemplate = e.target.closest('[data-open-template]');
  if(openTemplate){ renderTemplateDetail(openTemplate.dataset.openTemplate); return; }
  const openAnnouncement = e.target.closest('[data-open-announcement]');
  if(openAnnouncement){ renderAnnouncementDetail(openAnnouncement.dataset.openAnnouncement); return; }
  const openPolicy = e.target.closest('[data-open-policy]');
  if(openPolicy){ renderPolicyDetail(openPolicy.dataset.openPolicy); return; }
  const editPerms = e.target.closest('[data-edit-perms]');
  if(editPerms){ renderPermissionsEditor(editPerms.dataset.editPerms); return; }

  const restrictionFilter = e.target.closest('[data-restriction-filter]');
  if(restrictionFilter){ state.restrictionFilter = restrictionFilter.dataset.restrictionFilter; renderRestrictions(); return; }
  const caseFilter = e.target.closest('[data-case-filter]');
  if(caseFilter){ state.caseFilter = caseFilter.dataset.caseFilter; renderCases(); return; }
  const copyrightFilter = e.target.closest('[data-copyright-filter]');
  if(copyrightFilter){ state.copyrightFilter = copyrightFilter.dataset.copyrightFilter; renderCopyright(); return; }
  const privacyFilter = e.target.closest('[data-privacy-filter]');
  if(privacyFilter){ state.privacyFilter = privacyFilter.dataset.privacyFilter; renderPrivacy(); return; }
  const grievanceFilter = e.target.closest('[data-grievance-filter]');
  if(grievanceFilter){ state.grievanceFilter = grievanceFilter.dataset.grievanceFilter; renderGrievances(); return; }
  const reportFilter = e.target.closest('[data-report-filter]');
  if(reportFilter){ state.reportFilter = reportFilter.dataset.reportFilter; renderReports(); return; }
  const contentFilter = e.target.closest('[data-content-filter]');
  if(contentFilter){ state.contentFilter = contentFilter.dataset.contentFilter; renderContent(); return; }

  const linkedItem = e.target.closest('.linked-item');
  if(linkedItem){
    if(linkedItem.hasAttribute('data-open-report')) renderReportDetail(linkedItem.getAttribute('data-open-report'));
    else if(linkedItem.hasAttribute('data-open-restriction')) renderRestrictionDetail(linkedItem.getAttribute('data-open-restriction'));
    else if(linkedItem.hasAttribute('data-open-appeal')) renderAppealDetail(linkedItem.getAttribute('data-open-appeal'));
    else if(linkedItem.hasAttribute('data-open-copyright')) renderCopyrightDetail(linkedItem.getAttribute('data-open-copyright'));
    else if(linkedItem.hasAttribute('data-open-privacy')) renderPrivacyDetail(linkedItem.getAttribute('data-open-privacy'));
    else if(linkedItem.hasAttribute('data-open-grievance')) renderGrievanceDetail(linkedItem.getAttribute('data-open-grievance'));
    return;
  }

  const reportAct = e.target.closest('[data-report-act]');
  if(reportAct){ handleReportAction(reportAct.dataset.reportId, reportAct.dataset.reportAct); return; }
  const userAct = e.target.closest('[data-user-act]');
  if(userAct){ handleUserAction(userAct.dataset.userId, userAct.dataset.userAct); return; }
  const contentAct = e.target.closest('[data-content-act]');
  if(contentAct){ handleContentAction(contentAct.dataset.contentId, contentAct.dataset.contentAct); return; }
  const appealAct = e.target.closest('[data-appeal-act]');
  if(appealAct){ handleAppealAction(appealAct.dataset.appealId, appealAct.dataset.appealAct); return; }
  const copyrightAct = e.target.closest('[data-copyright-act]');
  if(copyrightAct){ handleCopyrightAction(copyrightAct.dataset.copyrightId, copyrightAct.dataset.copyrightAct); return; }
  const privacyAct = e.target.closest('[data-privacy-act]');
  if(privacyAct){ handlePrivacyAction(privacyAct.dataset.privacyId, privacyAct.dataset.privacyAct); return; }
  const grievanceAct = e.target.closest('[data-grievance-act]');
  if(grievanceAct){ handleGrievanceAction(grievanceAct.dataset.grievanceId, grievanceAct.dataset.grievanceAct); return; }
  const announcementAct = e.target.closest('[data-announcement-act]');
  if(announcementAct){ handleAnnouncementAction(announcementAct.dataset.announcementId, announcementAct.dataset.announcementAct); return; }

  const gsItem = e.target.closest('[data-gs-open]');
  if(gsItem){
    const kind = gsItem.dataset.gsOpen, id = gsItem.dataset.gsId;
    $('#gsearch-results').hidden = true; $('#gsearch-input').value='';
    if(kind==='user'){ goto('users'); renderUserDetail(id); }
    else if(kind==='content'){ if(can('content.view')){ goto('content'); openContentByKey(id, gsItem.dataset.gsTitle); } else toast('You don\u2019t have access to Content.','error'); }
    else if(kind==='case'){ if(can('cases.view')) goto('cases'); renderCaseWorkspace(id); }
    else if(kind==='mod'){ if(can('moderators.view')) goto('moderators'); }
    return;
  }

  if(!e.target.closest('.gsearch')) $('#gsearch-results').hidden = true;
});

/* ============================================================
   INIT
   ============================================================ */
function waitForSession(){
  return new Promise(resolve=>{
    let done = false;
    const finish = sess => { if(done) return; done = true; resolve(sess); };
    sb.auth.onAuthStateChange((ev, sess)=>{
      if(ev==='INITIAL_SESSION' || ev==='SIGNED_IN' || ev==='SIGNED_OUT') finish(sess);
    });
    // Same safeguard as the main app: no event in time is not "signed out".
    setTimeout(()=> sb.auth.getSession().then(r=>finish(r && r.data ? r.data.session : null)).catch(()=>finish(null)), 4000);
  });
}
function gateMessage(msg){
  const g = $('#gate-screen'); if(!g) return;
  g.classList.add('is-error');
  $('#gate-msg').innerHTML = esc(msg) + '<br><a class="btn ghost sm" href="">Reload</a> <a class="btn ghost sm" href="/userpostlogin.html">Back to Journals</a>';
}
async function bootWithAuth(){
  try{
    if(!window.supabase){ gateMessage('Could not load the sign-in library. Check your connection and reload.'); return; }
    sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
    const session = await waitForSession();
    if(!session || !session.user){ location.replace('/index.html'); return; }
    // The server decides who is staff; this page hides itself from everyone else.
    const { data: role, error } = await sb.rpc('get_my_role');
    if(error) throw error;
    if(role !== 'admin' && role !== 'moderator'){ location.replace('/userpostlogin.html'); return; }

    let prof = null;
    try{
      const r = await sb.from('profiles').select('username, display_name, avatar_url').eq('id', session.user.id).maybeSingle();
      prof = r.data;
    }catch(e){}
    const displayName = (prof && (prof.display_name || prof.username)) || 'You';
    MODERATORS.push({
      id:'me', username:(prof && prof.username) || '', displayName, avatarUrl:(prof && prof.avatar_url) || null, role, status:'active',
      dateAppointed:new Date().toISOString(),
      permissions: role==='admin' ? undefined : ROLE_PERMISSIONS.moderator.slice()
    });
    if(role==='moderator'){
      try{
        const pr = await sb.rpc('get_my_permissions');
        if(!pr.error && Array.isArray(pr.data)) MODERATORS[MODERATORS.length-1].permissions = pr.data;
      }catch(e){}
    }
    state.currentModeratorId = 'me';
    state.role = role;
    sb.auth.onAuthStateChange(ev=>{ if(ev==='SIGNED_OUT') location.replace('/index.html'); });
    $('#gate-screen').remove();
    goto('overview');
  }catch(err){
    console.warn('Dashboard access check failed:', err);
    gateMessage('We couldn\u2019t verify your access just now. Please reload and try again.');
  }
}

function renderCaseTimeline(caseId){ return renderCaseWorkspace(caseId); }

let GS_SEQ = 0;
async function renderGlobalSearchResults(q){
  const box = $('#gsearch-results');
  q = (q||'').trim();
  const mine = ++GS_SEQ;
  if(q.length < 2){ box.hidden = true; return; }
  let res;
  try{
    const { data, error } = await sb.rpc('staff_global_search', {p_q:q});
    if(error) throw error;
    res = data;
  }catch(err){
    if(mine!==GS_SEQ) return;
    box.hidden = false;
    box.innerHTML = `<div style="padding:14px; text-align:center; color:var(--ink-faint); font-size:12.5px;">Search isn\u2019t available right now.</div>`;
    return;
  }
  if(mine!==GS_SEQ) return;
  if(!res){ box.hidden = true; return; }
  const groups = [];
  if((res.users||[]).length) groups.push(['Users', res.users.map(u=>`<div class="gsearch-item" data-gs-open="user" data-gs-id="${esc(u.id)}">${avatarHTML(u.avatar_url, u.display_name||u.username)}<span><span class="t">${esc(u.display_name||u.username||'Unnamed')}</span><br><span class="s">${u.username?'@'+esc(u.username):''}</span></span></div>`).join('')]);
  if((res.content||[]).length) groups.push(['Content', res.content.map(c=>`<div class="gsearch-item" data-gs-open="content" data-gs-id="${esc(c.key)}" data-gs-title="${esc(c.title||'')}"><span>\uD83D\uDCC4</span><span><span class="t">${esc(c.title||'(untitled)')}</span><br><span class="s">${esc(c.category||'')}${c.username?' \u00b7 @'+esc(c.username):''}</span></span></div>`).join('')]);
  if((res.cases||[]).length) groups.push(['Case IDs', res.cases.map(c=>`<div class="gsearch-item" data-gs-open="case" data-gs-id="${esc(c)}"><span>\uD83D\uDDC2\uFE0F</span><span class="t caseid">${esc(c)}</span></div>`).join('')]);
  if((res.staff||[]).length) groups.push(['Staff', res.staff.map(m=>`<div class="gsearch-item" data-gs-open="mod" data-gs-id="${esc(m.id)}">${avatarHTML(m.avatar_url, m.display_name||m.username)}<span class="t">${esc(m.display_name||m.username||'Unnamed')}</span></div>`).join('')]);
  box.hidden = false;
  box.innerHTML = groups.length ? groups.map(([label,html])=>`<div class="gsearch-group-label">${label}</div>${html}`).join('') : `<div style="padding:14px; text-align:center; color:var(--ink-faint); font-size:12.5px;">No matches for \u201c${esc(q)}\u201d</div>`;
}
async function openContentByKey(key, title){
  try{
    const { data, error } = await sb.rpc('list_content_for_staff', {p_filter:'all', p_search:title||null, p_limit:50, p_offset:0});
    if(error) throw error;
    STAFF_CACHE.content = data||[];
  }catch(err){ toast((err&&err.message)||'Could not open that Work.','error'); return; }
  renderContentDetail(key);
}

let SETTINGS_SEQ = 0;
async function saveSetting(patch, okMsg){
  try{
    const { data, error } = await sb.rpc('update_settings', {p_patch:patch});
    if(error) throw error;
    if(data) STAFF_CACHE.settings = data;
    toast(okMsg||'Setting saved.','success');
    return true;
  }catch(err){
    toast((err&&err.message)||'Could not save this setting.','error');
    return false;
  }
}
async function renderSettings(){
  const root = $('#view-root');
  if(!isAdmin()){ root.innerHTML = emptyState('Admins only', 'You don\u2019t have access to this section.'); return; }
  const mine = ++SETTINGS_SEQ;
  root.innerHTML = `<div class="panel" style="padding:18px;"><span class="muted">Loading settings\u2026</span></div>`;
  let s, guidelinesVersion = '\u2014';
  try{
    const { data, error } = await sb.rpc('get_settings');
    if(error) throw error;
    if(!data) throw new Error('Settings not found.');
    s = data;
    try{
      const pr = await sb.rpc('list_policies');
      const g = (pr.data||[]).find(x=>/community guidelines/i.test(x.title));
      if(g) guidelinesVersion = g.current_version;
    }catch(e){}
  }catch(err){
    if(mine!==SETTINGS_SEQ || state.view!=='settings') return;
    root.innerHTML = errorState('Couldn\u2019t load settings', (err&&err.message)||'Please try again.', renderSettings);
    return;
  }
  if(mine!==SETTINGS_SEQ || state.view!=='settings') return;
  STAFF_CACHE.settings = s;
  const cats = Array.isArray(s.reportCategories) ? s.reportCategories : [];
  root.innerHTML = `<div class="two-col even">
    <div class="panel">
      <h3 style="font-size:15px; margin-bottom:6px;">Community Guidelines</h3>
      <p class="muted" style="font-size:12.5px; margin-bottom:12px;">Current published version: <b>${esc(guidelinesVersion)}</b>. Full editing lives in Policies.</p>
      <button class="btn ghost sm" data-nav="policies">Go to Policies</button>
    </div>
    <div class="panel">
      <h3 style="font-size:15px; margin-bottom:6px;">Moderation Rules</h3>
      <p class="muted" style="font-size:12.5px; margin-bottom:8px;">Auto-flag a Work as under review after this many different people report it:</p>
      <input type="number" min="1" max="50" class="search-mini" style="width:100%;" id="set-threshold" value="${esc(s.autoFlagThreshold)}">
      <div style="margin-top:10px;"><button class="btn primary sm" id="set-threshold-save">Save</button></div>
    </div>
    <div class="panel">
      <h3 style="font-size:15px; margin-bottom:6px;">Report Categories</h3>
      <div style="display:flex; flex-wrap:wrap; gap:6px; margin-bottom:10px;">${cats.map((c,i)=>`<span class="badge grey" style="display:inline-flex; align-items:center; gap:5px;">${esc(c)} <span data-remove-category="${i}" style="cursor:pointer;">\u2715</span></span>`).join('')}</div>
      <div style="display:flex; gap:8px;"><input class="search-mini" style="flex:1;" id="new-category-input" maxlength="60" placeholder="Add a category\u2026"><button class="btn soft sm" id="add-category-btn">Add</button></div>
    </div>
    <div class="panel">
      <h3 style="font-size:15px; margin-bottom:6px;">Restriction Durations</h3>
      <p class="muted" style="font-size:12.5px; margin-bottom:8px;">Default temporary restriction length (days), pre-filled when issuing a restriction:</p>
      <input type="number" min="1" max="3650" class="search-mini" style="width:100%;" id="set-duration" value="${esc(s.defaultRestrictionDays)}">
      <div style="margin-top:10px;"><button class="btn primary sm" id="set-duration-save">Save</button></div>
    </div>
    <div class="panel">
      <h3 style="font-size:15px; margin-bottom:6px;">Notification Settings</h3>
      <label class="radio-pill" style="display:flex; width:100%; box-sizing:border-box; margin-bottom:8px;"><input type="checkbox" id="notify-action" ${s.notifyOnAction?'checked':''}> Notify users when action is taken on their content</label>
      <label class="radio-pill" style="display:flex; width:100%; box-sizing:border-box;"><input type="checkbox" id="notify-appeal" ${s.notifyOnAppealUpdate?'checked':''}> Notify users on appeal status changes</label>
    </div>
    <div class="panel">
      <h3 style="font-size:15px; margin-bottom:6px;">Platform Safety Settings</h3>
      <label class="radio-pill" style="display:flex; width:100%; box-sizing:border-box; margin-bottom:4px;"><input type="checkbox" id="require-evidence" ${s.requireEvidenceForCopyright?'checked':''}> Require evidence before a copyright takedown</label>
      <p class="muted" style="font-size:11.5px; margin:0 0 8px 4px;">Saved as a policy preference; not yet enforced on incoming claims.</p>
      <label class="radio-pill" style="display:flex; width:100%; box-sizing:border-box; border-color:var(--red);"><input type="checkbox" id="platform-lockdown" ${s.platformLockdown?'checked':''}> Emergency lockdown (blocks all new posts platform-wide)</label>
    </div>
  </div>`;
  const intField = (id, key, min, max, label)=>{
    $(id+'-save').onclick = async ()=>{
      const v = parseInt($(id).value,10);
      if(!Number.isFinite(v) || v<min || v>max){ toast(`Enter a whole number from ${min} to ${max}.`,'error'); return; }
      if(await saveSetting({[key]:v}, label)) renderSettings();
    };
  };
  intField('#set-threshold','autoFlagThreshold',1,50,'Moderation rule saved.');
  intField('#set-duration','defaultRestrictionDays',1,3650,'Default duration saved.');
  $('#add-category-btn').onclick = async ()=>{
    const v = $('#new-category-input').value.trim();
    if(!v) return;
    if(cats.some(c=>c.toLowerCase()===v.toLowerCase())){ toast('That category already exists.','error'); return; }
    if(cats.length>=25){ toast('You can have at most 25 categories.','error'); return; }
    if(await saveSetting({reportCategories:[...cats, v]}, 'Category added.')) renderSettings();
  };
  $$('[data-remove-category]').forEach(el=> el.onclick = async ()=>{
    if(cats.length<=1){ toast('Keep at least one report category.','error'); return; }
    const next = cats.filter((c,i)=>i!==parseInt(el.dataset.removeCategory,10));
    if(await saveSetting({reportCategories:next}, 'Category removed.')) renderSettings();
  });
  const toggle = (id, key, msg)=>{ $(id).onchange = async e=>{ if(!(await saveSetting({[key]:e.target.checked}, msg))) renderSettings(); }; };
  toggle('#notify-action','notifyOnAction','Notification setting saved.');
  toggle('#notify-appeal','notifyOnAppealUpdate','Notification setting saved.');
  toggle('#require-evidence','requireEvidenceForCopyright','Safety setting saved.');
  $('#platform-lockdown').onchange = e=>{
    const on = e.target.checked;
    confirmAction({
      title: on ? 'Turn on emergency lockdown?' : 'Turn off emergency lockdown?',
      body: on ? 'Nobody except staff will be able to publish anything until you turn this off. Existing published Works stay visible.' : 'Publishing will open up again for everyone.',
      requireReason:false, destructive:on, confirmLabel: on ? 'Turn on lockdown' : 'Turn off lockdown',
      onConfirm: async ()=>{
        const ok = await saveSetting({platformLockdown:on}, on ? 'Lockdown is on. Publishing is paused.' : 'Lockdown is off.');
        renderSettings();
      }
    });
    // if the modal is dismissed without confirming, put the checkbox back
    const scrim = $('#modal-scrim');
    setTimeout(function chk(){ if(scrim.classList.contains('open')) return setTimeout(chk,300); if(state.view==='settings' && $('#platform-lockdown') && $('#platform-lockdown').checked!==!!(STAFF_CACHE.settings||{}).platformLockdown) $('#platform-lockdown').checked = !!(STAFF_CACHE.settings||{}).platformLockdown; }, 300);
  };
}

let REFRESHING = false;
async function refreshCurrentView(){
  if(REFRESHING) return;
  REFRESHING = true;
  const btn = $('#refresh-btn');
  if(btn){ btn.classList.add('spinning'); btn.disabled = true; }
  const started = Date.now();
  try{
    const fn = VIEW_RENDERERS[state.view] || renderOverview;
    await Promise.resolve(fn());
    await refreshStaffCounts();
  }catch(e){ toast('Couldn\u2019t refresh just now.','error'); }
  const wait = Math.max(0, 500-(Date.now()-started));
  setTimeout(()=>{ REFRESHING = false; const b=$('#refresh-btn'); if(b){ b.classList.remove('spinning'); b.disabled=false; } }, wait);
}
document.addEventListener('click', e=>{ if(e.target.closest('#refresh-btn')) refreshCurrentView(); });
let lastHidden = 0;
document.addEventListener('visibilitychange', ()=>{
  if(document.hidden){ lastHidden = Date.now(); return; }
  if(lastHidden && Date.now()-lastHidden > 60000){ refreshStaffCounts(); toast('Tip: press Refresh to update this page.'); }
});

bootWithAuth();

})();

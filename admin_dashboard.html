<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Moderation Dashboard — Aspinora Journals</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,400;0,9..144,500;0,9..144,600;0,9..144,700;1,9..144,400;1,9..144,500&family=Plus+Jakarta+Sans:ital,wght@0,400;0,500;0,600;0,700;0,800;1,500&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  --cream:        #FBF5EA;
  --cream-deep:   #F4EBDA;
  --paper:        #FFFDF8;
  --ink:          #2B241C;
  --ink-soft:     #5B5347;
  --ink-faint:    #948B7C;

  --orange:       #F1631B;
  --orange-deep:  #D3510F;
  --orange-soft:  #FCEADC;
  --sky:          #7FB8D9;
  --sky-soft:     #E4F1F7;
  --lavender:     #A79BD1;
  --lavender-soft:#EDE9F7;
  --mint:         #7FC8A9;
  --mint-soft:    #E4F4EC;
  --gold:         #F0B429;
  --red:          #D64545;
  --red-soft:     #FBE4E4;

  --line:         rgba(43,36,28,0.10);
  --line-strong:  rgba(43,36,28,0.18);
  --shadow-soft:  0 4px 24px rgba(43,36,28,0.06);
  --shadow-mid:   0 12px 40px rgba(43,36,28,0.10);
  --shadow-deep:  0 24px 60px rgba(43,36,28,0.16);

  --font-display: 'Fraunces', Georgia, serif;
  --font-body:    'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
  --font-mono:    'Space Mono', 'SFMono-Regular', monospace;

  --radius-sm: 10px;
  --radius-md: 16px;
  --radius-lg: 22px;
  --ease: cubic-bezier(.22,.9,.32,1);
  --sidebar-w: 248px;
}
*,*::before,*::after{ box-sizing:border-box; }
[hidden]{ display:none !important; }
html,body{ margin:0; padding:0; height:100%; }
body{
  background:
    radial-gradient(1100px 650px at 108% -8%, var(--orange-soft) 0%, transparent 58%),
    radial-gradient(950px 620px at -8% 106%, var(--lavender-soft) 0%, transparent 55%),
    linear-gradient(180deg, var(--cream) 0%, var(--cream-deep) 100%);
  background-attachment:fixed, fixed, fixed;
  color:var(--ink);
  font-family:var(--font-body);
  font-size:15px;
  line-height:1.55;
}
h1,h2,h3,h4{ font-family:var(--font-display); font-weight:600; margin:0; color:var(--ink); }
button{ font-family:inherit; cursor:pointer; }
a{ color:inherit; }
::selection{ background:var(--orange-soft); }

/* ---------- preview / role switcher strip ---------- */
.preview-strip{
  background:var(--ink); color:var(--cream); font-size:12.5px; font-weight:600;
  padding:7px 18px; display:flex; align-items:center; justify-content:center; gap:14px;
  letter-spacing:.02em; position:sticky; top:0; z-index:60;
}
.preview-strip .dot{ width:7px;height:7px;border-radius:50%;background:var(--gold); }
.role-toggle{ display:inline-flex; background:rgba(255,255,255,.1); border-radius:999px; padding:3px; gap:2px; }
.role-toggle button{
  border:none; background:transparent; color:var(--cream); font-size:12px; font-weight:700;
  padding:5px 14px; border-radius:999px; opacity:.65; transition:all .18s var(--ease);
}
.role-toggle button.active{ background:var(--orange); opacity:1; color:#fff; }

/* ---------- shell layout ---------- */
.dash-shell{ display:flex; min-height:calc(100vh - 34px); }
.sidebar{
  width:var(--sidebar-w); flex:none; background:var(--paper); border-right:1px solid var(--line);
  display:flex; flex-direction:column; padding:20px 14px; position:sticky; top:34px; height:calc(100vh - 34px); z-index:40;
  transition:transform .25s var(--ease);
}
.sb-brand{ display:flex; align-items:center; gap:10px; padding:6px 8px 20px; }
.sb-brand .mark{ width:34px;height:34px;border-radius:10px; background:linear-gradient(135deg,var(--orange),var(--orange-deep)); display:flex;align-items:center;justify-content:center; color:#fff; font-family:var(--font-display); font-weight:700; font-size:17px; box-shadow:var(--shadow-soft); }
.sb-brand .txt{ display:flex; flex-direction:column; line-height:1.15; }
.sb-brand .txt b{ font-family:var(--font-display); font-size:15px; }
.sb-brand .txt span{ font-size:11px; color:var(--ink-faint); font-weight:600; letter-spacing:.03em; text-transform:uppercase; }

.sb-nav{ display:flex; flex-direction:column; gap:2px; flex:1; overflow-y:auto; }
.sb-section-label{ font-size:10.5px; font-weight:800; letter-spacing:.08em; text-transform:uppercase; color:var(--ink-faint); margin:14px 10px 6px; }
.sb-link{
  display:flex; align-items:center; gap:10px; padding:9px 10px; border-radius:var(--radius-sm);
  border:none; background:transparent; color:var(--ink-soft); font-size:13.5px; font-weight:600; text-align:left; width:100%;
  transition:background .15s var(--ease), color .15s var(--ease);
}
.sb-link .ic{ width:18px; text-align:center; font-size:15px; }
.sb-link:hover{ background:var(--cream-deep); color:var(--ink); }
.sb-link.active{ background:var(--orange-soft); color:var(--orange-deep); }
.sb-link .cnt{ margin-left:auto; background:var(--ink); color:#fff; font-size:10.5px; font-weight:700; padding:1px 7px; border-radius:999px; }
.sb-link.active .cnt{ background:var(--orange-deep); }
.sb-lock{ margin-left:auto; opacity:.4; font-size:11px; }

.sb-profile{
  border-top:1px solid var(--line); padding-top:14px; margin-top:10px; display:flex; align-items:center; gap:10px;
}
.sb-profile .av{ width:36px;height:36px;border-radius:50%; background:var(--lavender-soft); color:var(--lavender); display:flex; align-items:center; justify-content:center; font-weight:800; font-family:var(--font-display); font-size:15px; flex:none; }
.sb-profile .meta b{ display:block; font-size:13px; }
.sb-profile .meta span{ font-size:11px; color:var(--ink-faint); font-weight:600; text-transform:uppercase; letter-spacing:.03em; }

/* ---------- main ---------- */
.main{ flex:1; min-width:0; display:flex; flex-direction:column; }
.topbar{
  position:sticky; top:34px; z-index:30; background:rgba(251,245,234,.88); backdrop-filter:blur(10px) saturate(1.4);
  border-bottom:1px solid var(--line); padding:14px 26px; display:flex; align-items:center; gap:16px;
}
.mobile-menu-btn{ display:none; border:1px solid var(--line-strong); background:var(--paper); border-radius:10px; width:36px; height:36px; align-items:center; justify-content:center; font-size:16px; }
.topbar h1{ font-size:20px; flex:none; }
.gsearch{ position:relative; flex:1; max-width:460px; }
.gsearch input{
  width:100%; padding:9px 14px 9px 34px; border-radius:999px; border:1px solid var(--line-strong); background:var(--paper);
  font-family:inherit; font-size:13px; color:var(--ink);
}
.gsearch svg{ position:absolute; left:12px; top:50%; transform:translateY(-50%); opacity:.5; }
.gsearch-results{
  position:absolute; top:calc(100% + 8px); left:0; right:0; background:var(--paper); border:1px solid var(--line);
  border-radius:var(--radius-md); box-shadow:var(--shadow-deep); max-height:420px; overflow-y:auto; z-index:80; padding:8px;
}
.gsearch-group-label{ font-size:10.5px; font-weight:800; letter-spacing:.06em; text-transform:uppercase; color:var(--ink-faint); padding:8px 8px 4px; }
.gsearch-item{ display:flex; align-items:center; gap:10px; padding:8px; border-radius:10px; cursor:pointer; }
.gsearch-item:hover{ background:var(--cream-deep); }
.gsearch-item .t{ font-size:13px; font-weight:600; }
.gsearch-item .s{ font-size:11.5px; color:var(--ink-faint); }
.topbar .spacer{ flex:1; }
.topbar-right{ display:flex; align-items:center; gap:10px; margin-left:auto; }

.view-root{ padding:24px 26px 60px; flex:1; }

/* ---------- cards / grid ---------- */
.stat-grid{ display:grid; grid-template-columns:repeat(4,1fr); gap:14px; margin-bottom:22px; }
.stat-card{
  background:var(--paper); border:1px solid var(--line); border-radius:var(--radius-md); padding:16px 18px;
  box-shadow:var(--shadow-soft); position:relative; overflow:hidden;
}
.stat-card .tag{ position:absolute; top:0; left:0; width:4px; height:100%; }
.stat-card b{ display:block; font-size:26px; font-family:var(--font-display); line-height:1.1; margin-top:2px; }
.stat-card .lbl{ font-size:11.5px; font-weight:700; color:var(--ink-faint); text-transform:uppercase; letter-spacing:.04em; }
.stat-card .sub{ font-size:11.5px; color:var(--ink-soft); margin-top:4px; }

.panel{ background:var(--paper); border:1px solid var(--line); border-radius:var(--radius-lg); box-shadow:var(--shadow-soft); padding:20px; margin-bottom:20px; }
.panel-head{ display:flex; align-items:center; justify-content:space-between; margin-bottom:14px; gap:10px; flex-wrap:wrap; }
.panel-head h3{ font-size:16px; }

.two-col{ display:grid; grid-template-columns:1.6fr 1fr; gap:18px; }

/* ---------- tables ---------- */
.dtable{ width:100%; border-collapse:collapse; font-size:13px; }
.dtable th{ text-align:left; font-size:10.5px; text-transform:uppercase; letter-spacing:.05em; color:var(--ink-faint); font-weight:800; padding:8px 10px; border-bottom:1px solid var(--line-strong); white-space:nowrap; }
.dtable td{ padding:10px; border-bottom:1px solid var(--line); vertical-align:middle; }
.dtable tbody tr{ cursor:pointer; transition:background .12s var(--ease); }
.dtable tbody tr:hover{ background:var(--cream-deep); }
.dtable .caseid{ font-family:var(--font-mono); font-size:11.5px; color:var(--ink-soft); }
.dtable .muted{ color:var(--ink-faint); font-size:12px; }
.checkbox-cell{ width:30px; }

/* ---------- badges / pills ---------- */
.badge{ display:inline-flex; align-items:center; gap:4px; font-size:10.5px; font-weight:800; padding:3px 9px; border-radius:999px; text-transform:uppercase; letter-spacing:.03em; white-space:nowrap; }
.badge.orange{ background:var(--orange-soft); color:var(--orange-deep); }
.badge.sky{ background:var(--sky-soft); color:#2A6E93; }
.badge.mint{ background:var(--mint-soft); color:#2E7A57; }
.badge.lav{ background:var(--lavender-soft); color:#6C5FA3; }
.badge.gold{ background:#FCF1D6; color:#93720E; }
.badge.red{ background:var(--red-soft); color:#A5312F; }
.badge.grey{ background:var(--cream-deep); color:var(--ink-soft); }
.badge.ink{ background:var(--ink); color:#fff; }

/* ---------- filters ---------- */
.filter-row{ display:flex; gap:8px; flex-wrap:wrap; margin-bottom:16px; align-items:center; }
.chip{ border:1px solid var(--line-strong); background:var(--paper); padding:6px 13px; border-radius:999px; font-size:12.5px; font-weight:700; color:var(--ink-soft); transition:all .15s var(--ease); }
.chip.active{ background:var(--ink); border-color:var(--ink); color:#fff; }
.search-mini{ border:1px solid var(--line-strong); background:var(--paper); border-radius:999px; padding:6px 14px; font-size:12.5px; min-width:200px; margin-left:auto; }

/* ---------- buttons ---------- */
.btn{ display:inline-flex; align-items:center; gap:6px; border:none; border-radius:999px; padding:9px 18px; font-weight:700; font-size:13px; transition:all .15s var(--ease); }
.btn.primary{ background:var(--orange); color:#fff; box-shadow:0 6px 18px rgba(241,99,27,.28); }
.btn.primary:hover{ background:var(--orange-deep); }
.btn.ghost{ background:transparent; border:1px solid var(--line-strong); color:var(--ink); }
.btn.ghost:hover{ background:var(--cream-deep); }
.btn.danger{ background:var(--red); color:#fff; }
.btn.danger:hover{ background:#B93737; }
.btn.soft{ background:var(--cream-deep); color:var(--ink); }
.btn.sm{ padding:6px 13px; font-size:12px; }
.btn:disabled{ opacity:.45; cursor:not-allowed; }
.iconbtn{ border:1px solid var(--line-strong); background:var(--paper); width:32px; height:32px; border-radius:9px; display:inline-flex; align-items:center; justify-content:center; font-size:14px; }
.iconbtn:hover{ background:var(--cream-deep); }

/* ---------- empty/loading/error/no-results ---------- */
.state-box{ text-align:center; padding:46px 20px; color:var(--ink-faint); }
.state-box .ic{ font-size:30px; margin-bottom:10px; }
.state-box h4{ font-size:15px; color:var(--ink-soft); margin-bottom:4px; }
.state-box p{ font-size:12.5px; margin:0 0 12px; }
.skel{ background:linear-gradient(90deg,var(--cream-deep) 25%, var(--paper) 37%, var(--cream-deep) 63%); background-size:400% 100%; animation:skel 1.4s ease infinite; border-radius:8px; }
@keyframes skel{ 0%{background-position:100% 0} 100%{background-position:0 0} }
.skel-row{ height:38px; margin-bottom:8px; }
.skel-card{ height:78px; }

/* ---------- drawer / modal ---------- */
.drawer-scrim{ position:fixed; inset:0; background:rgba(43,36,28,.4); z-index:200; display:none; align-items:stretch; justify-content:flex-end; }
.drawer-scrim.open{ display:flex; }
.drawer{ width:min(560px,94vw); background:var(--cream); height:100%; overflow-y:auto; box-shadow:var(--shadow-deep); animation:drawer-in .25s var(--ease); padding:22px 24px 60px; }
@keyframes drawer-in{ from{transform:translateX(30px); opacity:0;} to{transform:translateX(0); opacity:1;} }
.drawer-close{ float:right; }
.modal-scrim{ position:fixed; inset:0; background:rgba(43,36,28,.5); z-index:300; display:none; align-items:center; justify-content:center; padding:20px; }
.modal-scrim.open{ display:flex; }
.modal-box{ width:min(440px,94vw); background:var(--paper); border-radius:var(--radius-lg); box-shadow:var(--shadow-deep); padding:22px; }
.modal-box h3{ font-size:17px; margin-bottom:6px; }
.modal-box p.sub{ font-size:12.5px; color:var(--ink-soft); margin:0 0 14px; }
.modal-box textarea{ width:100%; min-height:80px; border:1px solid var(--line-strong); border-radius:var(--radius-sm); padding:10px; font-family:inherit; font-size:13px; resize:vertical; }
.modal-actions{ display:flex; justify-content:flex-end; gap:8px; margin-top:16px; }

/* ---------- misc detail ---------- */
.kv{ display:grid; grid-template-columns:120px 1fr; gap:6px 10px; font-size:12.5px; margin:14px 0; }
.kv b{ color:var(--ink-faint); font-weight:700; font-size:11px; text-transform:uppercase; letter-spacing:.03em; }
.content-preview-box{ background:var(--cream-deep); border-radius:var(--radius-sm); padding:14px; font-size:13px; color:var(--ink-soft); margin:12px 0; border-left:3px solid var(--orange); }
.divider{ border:none; border-top:1px solid var(--line); margin:18px 0; }
.timeline{ border-left:2px solid var(--line-strong); padding-left:16px; display:flex; flex-direction:column; gap:16px; }
.timeline .tl-item{ position:relative; }
.timeline .tl-item::before{ content:""; position:absolute; left:-21px; top:3px; width:9px; height:9px; border-radius:50%; background:var(--orange); }
.timeline .tl-time{ font-size:11px; color:var(--ink-faint); font-weight:700; }
.timeline .tl-body{ font-size:13px; margin-top:2px; }
.note-item{ background:#FFF9E9; border:1px dashed var(--gold); border-radius:var(--radius-sm); padding:10px 12px; margin-bottom:8px; font-size:12.5px; }
.note-item .who{ font-weight:700; font-size:11px; color:#93720E; text-transform:uppercase; letter-spacing:.03em; margin-bottom:2px; }
.notif-preview{ background:var(--paper); border:1px solid var(--line); border-radius:var(--radius-md); padding:14px 16px; max-width:380px; box-shadow:var(--shadow-soft); }
.notif-preview .from{ font-size:11px; font-weight:700; color:var(--ink-faint); text-transform:uppercase; letter-spacing:.03em; margin-bottom:6px; }
.notif-preview .msg{ font-size:13px; margin-bottom:8px; }
.notif-preview .meta{ font-size:11px; color:var(--ink-faint); }
.immutable-note{ display:flex; align-items:center; gap:8px; font-size:11.5px; color:var(--ink-faint); font-weight:700; background:var(--cream-deep); padding:8px 12px; border-radius:999px; margin-bottom:14px; }
.bulk-bar{ position:sticky; top:0; background:var(--ink); color:#fff; border-radius:var(--radius-md); padding:10px 16px; display:flex; align-items:center; gap:12px; margin-bottom:14px; }
.bulk-bar b{ font-family:var(--font-body); }
.expiring{ color:#A5312F; font-weight:700; }

/* ---------- avatar ---------- */
.mini-av{ width:28px;height:28px;border-radius:50%; background:var(--sky-soft); color:#2A6E93; display:inline-flex; align-items:center; justify-content:center; font-weight:800; font-size:12px; flex:none; }
.name-cell{ display:flex; align-items:center; gap:8px; }

/* ---------- toast ---------- */
.toast-stack{ position:fixed; bottom:22px; left:50%; transform:translateX(-50%); z-index:500; display:flex; flex-direction:column; gap:10px; align-items:center; }
.toast{ background:var(--ink); color:var(--cream); padding:11px 18px; border-radius:999px; font-size:13px; font-weight:600; box-shadow:var(--shadow-deep); display:flex; align-items:center; gap:10px; animation:toast-in .25s var(--ease); }
.toast.success{ background:#2E7A57; }
.toast.error{ background:var(--red); }
@keyframes toast-in{ from{opacity:0; transform:translateY(10px);} to{opacity:1; transform:translateY(0);} }

/* ---------- responsive ---------- */
@media (max-width:980px){
  .sidebar{ position:fixed; left:0; top:34px; transform:translateX(-100%); z-index:100; box-shadow:var(--shadow-deep); }
  .sidebar.open{ transform:translateX(0); }
  .mobile-menu-btn{ display:inline-flex; }
  .stat-grid{ grid-template-columns:repeat(2,1fr); }
  .two-col{ grid-template-columns:1fr; }
  .gsearch{ max-width:220px; }
}
@media (max-width:620px){
  .stat-grid{ grid-template-columns:1fr; }
  .topbar h1{ font-size:16px; }
  .view-root{ padding:16px; }
}
</style>
</head>
<body>

<div class="preview-strip">
  <span class="dot"></span> MOCK PREVIEW — no backend connected, nothing here is saved permanently
  <div class="role-toggle" id="role-toggle">
    <button data-role="admin">Admin view</button>
    <button data-role="moderator">Moderator view</button>
  </div>
</div>

<div class="dash-shell">
  <aside class="sidebar" id="sidebar">
    <div class="sb-brand">
      <div class="mark">A</div>
      <div class="txt"><b>Journals</b><span>Moderation</span></div>
    </div>
    <nav class="sb-nav" id="sb-nav"></nav>
    <div class="sb-profile" id="sb-profile"></div>
  </aside>

  <div class="main">
    <div class="topbar">
      <button class="mobile-menu-btn" id="mobile-menu-btn">☰</button>
      <h1 id="view-title">Overview</h1>
      <div class="gsearch">
        <svg width="15" height="15" viewBox="0 0 20 20" fill="none"><circle cx="9" cy="9" r="6" stroke="currentColor" stroke-width="1.6"/><path d="M14 14l4 4" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
        <input type="text" id="gsearch-input" placeholder="Search users, content, reports, case IDs…" autocomplete="off">
        <div class="gsearch-results" id="gsearch-results" hidden></div>
      </div>
      <div class="spacer"></div>
      <div class="topbar-right">
        <span class="badge ink" id="topbar-role-badge">ADMIN</span>
      </div>
    </div>
    <div class="view-root" id="view-root"></div>
  </div>
</div>

<div class="drawer-scrim" id="drawer-scrim"><div class="drawer" id="drawer-body"></div></div>
<div class="modal-scrim" id="modal-scrim"><div class="modal-box" id="modal-body"></div></div>
<div class="toast-stack" id="toast-stack"></div>

<script>
/* ============================================================
   MOCK DATA LAYER — isolated so it can later be swapped for
   real Supabase queries without touching the render/UI layer.
   ============================================================ */
(function(){
'use strict';

const $ = (s,r)=> (r||document).querySelector(s);
const $$ = (s,r)=> Array.from((r||document).querySelectorAll(s));
const esc = s => String(s==null?'':s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmtDate = d => new Date(d).toLocaleString('en-US',{month:'short',day:'numeric',year:'numeric',hour:'numeric',minute:'2-digit'});
const timeAgo = d => {
  const s = Math.floor((Date.now()-new Date(d).getTime())/1000);
  if(s<60) return s+'s ago'; const m=Math.floor(s/60); if(m<60) return m+'m ago';
  const h=Math.floor(m/60); if(h<24) return h+'h ago'; const dd=Math.floor(h/24); return dd+'d ago';
};

let caseCounter = 421;
function nextCaseId(){ caseCounter++; return `CASE-2026-${String(caseCounter).padStart(6,'0')}`; }

const CATEGORIES = ['Journals','Stories','Poetry','Shayari','Thoughts','Articles','The Wall','Updates'];

const USERS = [
  {id:'u1', username:'meera.writes', displayName:'Meera Kapoor', joinDate:'2025-11-02', status:'active'},
  {id:'u2', username:'kabir.thoughts', displayName:'Kabir Sen', joinDate:'2025-09-14', status:'active'},
  {id:'u3', username:'ananya.p', displayName:'Ananya Prasad', joinDate:'2026-01-20', status:'restricted'},
  {id:'u4', username:'r.iyer', displayName:'Rohan Iyer', joinDate:'2025-07-03', status:'active'},
  {id:'u5', username:'noorjahan_', displayName:'Noor Jahan', joinDate:'2026-02-11', status:'suspended'},
  {id:'u6', username:'devsharma', displayName:'Dev Sharma', joinDate:'2025-12-29', status:'active'},
  {id:'u7', username:'lyra.k', displayName:'Lyra Krishnan', joinDate:'2026-03-01', status:'active'},
  {id:'u8', username:'arjun_writes', displayName:'Arjun Mehta', joinDate:'2025-08-19', status:'active'},
];

/* ============================================================
   TOAST
   ============================================================ */
function toast(msg, kind){
  const stack = $('#toast-stack');
  const el = document.createElement('div');
  el.className = 'toast'+(kind?(' '+kind):'');
  el.textContent = msg;
  stack.appendChild(el);
  setTimeout(()=>{ el.style.opacity='0'; el.style.transition='opacity .3s'; setTimeout(()=>el.remove(),300); }, 2600);
}

/* ============================================================
   MODAL — generic confirm w/ required reason
   ============================================================ */
function openModal(html){ $('#modal-body').innerHTML = html; $('#modal-scrim').classList.add('open'); }
function closeModal(){ $('#modal-scrim').classList.remove('open'); $('#modal-body').innerHTML=''; }

function confirmAction({title, body, requireReason=true, destructive=false, confirmLabel='Confirm', onConfirm}){
  openModal(`
    <h3>${esc(title)}</h3>
    ${body?`<p class="sub">${esc(body)}</p>`:''}
    ${requireReason?`<textarea id="reason-input" placeholder="Reason for this action (required, visible in the moderation log)…"></textarea>
    <div id="reason-err" style="color:var(--red); font-size:11.5px; margin-top:4px; display:none;">A reason is required before you can confirm.</div>`:''}
    <div class="modal-actions">
      <button class="btn ghost sm" data-action="close-modal">Cancel</button>
      <button class="btn ${destructive?'danger':'primary'} sm" id="modal-confirm-btn">${esc(confirmLabel)}</button>
    </div>
  `);
  $('#modal-confirm-btn').onclick = ()=>{
    let reason = '';
    if(requireReason){
      reason = $('#reason-input').value.trim();
      if(!reason){ $('#reason-err').style.display='block'; return; }
    }
    closeModal();
    onConfirm(reason);
  };
}

/* ============================================================
   AUDIT / ACTIONS
   ============================================================ */
function logAction({caseId, action, targetUserId, targetContentId, reason, duration, expiry, result}){
  AUDIT_LOG.unshift({
    id:'l'+(AUDIT_LOG.length+1)+Math.random().toString(36).slice(2,5),
    caseId, moderatorId: state.currentModeratorId, action, targetUserId, targetContentId, reason,
    at:new Date().toISOString(), duration:duration||null, expiry:expiry||null, result
  });
}

function setReportStatus(report, status, reason, extra){
  report.status = status;
  logAction({caseId:report.caseId, action:extra&&extra.actionLabel||status, targetUserId:report.reportedUser, targetContentId:report.contentId, reason, duration:extra&&extra.duration, expiry:extra&&extra.expiry, result:extra&&extra.result||status});
}

function restrictUser(userId, caseId, type, reason, days){
  const start = new Date();
  const expiry = new Date(start.getTime()+days*86400000);
  const r = {id:'x'+(RESTRICTIONS.length+1), caseId, userId, type, reason, moderatorId:state.currentModeratorId, start:start.toISOString(), expiry:expiry.toISOString(), status:'active'};
  RESTRICTIONS.unshift(r);
  const u = userById(userId); if(u) u.status='restricted';
  logAction({caseId, action:'User restricted', targetUserId:userId, targetContentId:null, reason, duration:days+' days', expiry:expiry.toISOString(), result:type});
  return r;
}

function removeContent(content, reason){
  content.status = 'removed';
  logAction({caseId:content.caseId, action:'Content removed', targetUserId:content.author, targetContentId:content.id, reason, result:'Content removed'});
}
function restoreContent(content, reason){
  content.status = 'active';
  logAction({caseId:content.caseId, action:'Content restored', targetUserId:content.author, targetContentId:content.id, reason, result:'Content restored'});
}

function statCard(label, value, sub, color){
  return `<div class="stat-card"><div class="tag" style="background:${color}"></div><span class="lbl">${label}</span><b>${value}</b>${sub?`<div class="sub">${sub}</div>`:''}</div>`;
}
function skeletonStats(){ return `<div class="stat-grid">${Array(4).fill('<div class="stat-card skel skel-card"></div>').join('')}</div>`; }

function renderOverview(){
  const root = $('#view-root');
  if(!state.overviewLoaded){
    root.innerHTML = skeletonStats() + `<div class="panel skel skel-card" style="height:220px;"></div>`;
    setTimeout(()=>{ state.overviewLoaded = true; renderOverview(); }, 550);
    return;
  }

  const pending = REPORTS.filter(r=>r.status==='New'||r.status==='Under Review').length;
  const highPriority = REPORTS.filter(r=>(r.priority==='High'||r.priority==='Urgent') && r.status!=='Dismissed' && r.status!=='Action Taken').length;
  const activeRestr = RESTRICTIONS.filter(x=>x.status==='active').length;
  const expiringSoon = RESTRICTIONS.filter(x=>x.status==='active' && (new Date(x.expiry)-Date.now()) < 3*86400000).length;
  const pendingAppeals = APPEALS.filter(a=>a.status==='Pending'||a.status==='Under Review').length;
  const removedContent = CONTENT.filter(c=>c.status==='removed').length;
  const recentActions = AUDIT_LOG.slice(0,6);
  const recentReports = [...REPORTS].sort((a,b)=>new Date(b.createdAt)-new Date(a.createdAt)).slice(0,5);

  root.innerHTML = `
    <div class="stat-grid">
      ${statCard('Pending reports', pending, `${REPORTS.filter(r=>r.status==='New').length} unassigned`, 'var(--orange)')}
      ${statCard('High priority', highPriority, 'needs attention', 'var(--red)')}
      ${statCard('Active restrictions', activeRestr, `${expiringSoon} expiring within 3 days`, 'var(--lavender)')}
      ${statCard('Pending appeals', pendingAppeals, `${APPEALS.filter(a=>a.status==='Pending').length} awaiting first review`, 'var(--mint)')}
    </div>
    <div class="two-col">
      <div class="panel">
        <div class="panel-head"><h3>Recent reports</h3><button class="btn ghost sm" data-nav="reports">View all</button></div>
        ${recentReports.length ? `<table class="dtable"><thead><tr><th>Case</th><th>Content</th><th>Reason</th><th>Priority</th><th>Status</th></tr></thead><tbody>
          ${recentReports.map(r=>`<tr data-open-report="${r.id}"><td class="caseid">${r.caseId}</td><td>${esc(contentById(r.contentId).title)}</td><td>${esc(r.reason)}</td><td>${priorityBadge(r.priority)}</td><td>${statusBadge(r.status)}</td></tr>`).join('')}
        </tbody></table>` : emptyState('No reports yet', 'New reports from readers will show up here.')}
      </div>
      <div class="panel">
        <div class="panel-head"><h3>Recent moderation actions</h3><button class="btn ghost sm" data-nav="log">Full log</button></div>
        ${recentActions.length ? `<div class="timeline">${recentActions.map(l=>`
          <div class="tl-item"><div class="tl-time">${timeAgo(l.at)} \u2014 ${esc(modById(l.moderatorId).displayName)}</div><div class="tl-body"><b>${esc(l.action)}</b> \u00b7 ${esc(l.caseId)} <span class="muted">\u2014 ${esc(l.reason||'')}</span></div></div>
        `).join('')}</div>` : emptyState('No actions yet', 'Moderation actions will appear here as they happen.')}
      </div>
    </div>
    <div class="two-col">
      <div class="panel">
        <div class="panel-head"><h3>Content removal statistics</h3></div>
        <div class="kv"><b>Removed</b><span>${removedContent} of ${CONTENT.length} tracked items</span>
        <b>Under review</b><span>${CONTENT.filter(c=>c.status==='under_review').length} items</span>
        <b>Most-reported category</b><span>${topReportedCategory()}</span></div>
      </div>
      <div class="panel">
        <div class="panel-head"><h3>User restriction statistics</h3></div>
        <div class="kv"><b>Active</b><span>${RESTRICTIONS.filter(x=>x.status==='active').length}</span>
        <b>Expired</b><span>${RESTRICTIONS.filter(x=>x.status==='expired').length}</span>
        <b>Cancelled</b><span>${RESTRICTIONS.filter(x=>x.status==='cancelled').length}</span></div>
      </div>
    </div>
    <div style="text-align:center; margin-top:6px;">
      <button class="btn ghost sm" id="demo-error-btn" style="opacity:.55;">Simulate error state (demo only)</button>
    </div>
  `;
  $('#demo-error-btn').onclick = ()=>{
    root.innerHTML = errorState('Couldn\u2019t load dashboard data', 'This is a simulated failure for demo purposes.', ()=>{ state.overviewLoaded=false; renderOverview(); });
  };
}
function topReportedCategory(){
  const counts = {};
  CONTENT.forEach(c=>{ counts[c.type] = (counts[c.type]||0) + (c.reports||0); });
  const top = Object.entries(counts).sort((a,b)=>b[1]-a[1])[0];
  return top && top[1]>0 ? `${top[0]} (${top[1]} reports)` : '\u2014';
}

/* ============================================================
   BADGES
   ============================================================ */
function priorityBadge(p){
  const map = {Urgent:'red', High:'gold', Normal:'grey'};
  return `<span class="badge ${map[p]||'grey'}">${esc(p)}</span>`;
}
function statusBadge(s){
  const map = {New:'orange', 'Under Review':'sky', 'Action Taken':'mint', Dismissed:'grey',
    active:'mint', removed:'red', under_review:'sky',
    Pending:'orange', 'In Review':'sky', Approved:'mint', Rejected:'red',
    Active:'mint', Expired:'grey', Cancelled:'grey',
    restricted:'gold', suspended:'red'};
  const label = typeof s==='string' ? s.replace(/_/g,' ') : s;
  return `<span class="badge ${map[s]||'grey'}">${esc(label)}</span>`;
}

const REPORT_FILTERS = ['All','New','Under Review','Action Taken','Dismissed','High Priority','Unassigned','Assigned to me'];

function filteredReports(){
  let list = [...REPORTS];
  const f = state.reportFilter;
  if(f==='High Priority') list = list.filter(r=>r.priority==='High'||r.priority==='Urgent');
  else if(f==='Unassigned') list = list.filter(r=>!r.assignedTo);
  else if(f==='Assigned to me') list = list.filter(r=>r.assignedTo===state.currentModeratorId);
  else if(f!=='All') list = list.filter(r=>r.status===f);
  if(state.reportSearch){
    const q = state.reportSearch.toLowerCase();
    list = list.filter(r=> r.caseId.toLowerCase().includes(q) || contentById(r.contentId).title.toLowerCase().includes(q) || userById(r.reportedUser).username.toLowerCase().includes(q));
  }
  list.sort((a,b)=> state.reportSort==='newest' ? new Date(b.createdAt)-new Date(a.createdAt) : new Date(a.createdAt)-new Date(b.createdAt));
  return list;
}

/* ============================================================
   REPORT ACTIONS (dismiss / remove / restrict / suspend / restore)
   ============================================================ */
function handleReportAction(reportId, act){
  const r = reportById(reportId);
  const c = contentById(r.contentId);
  const actions = {
    dismiss:{title:'Dismiss this report?', confirmLabel:'Dismiss report', destructive:false},
    remove:{title:'Remove this content?', body:'The content will be marked removed and the author notified.', confirmLabel:'Remove content', destructive:true},
    restrict:{title:'Restrict this user?', body:'Choose a duration and provide a reason. The user will be notified without your identity being shown.', confirmLabel:'Apply restriction', destructive:true},
    suspend:{title:'Suspend this user?', body:'This is a significant action — the user will lose posting access.', confirmLabel:'Suspend user', destructive:true},
    restore:{title:'Restore this content?', confirmLabel:'Restore content', destructive:false},
  };
  const cfg = actions[act];
  confirmAction({
    title:cfg.title, body:cfg.body, confirmLabel:cfg.confirmLabel, destructive:cfg.destructive,
    onConfirm:(reason)=>{
      if(act==='dismiss'){ setReportStatus(r,'Dismissed',reason,{actionLabel:'Report dismissed', result:'No action, report closed'}); toast('Report dismissed.','success'); }
      if(act==='remove'){ removeContent(c, reason); setReportStatus(r,'Action Taken',reason,{actionLabel:'Content removed', result:'Content removed'}); toast('Content marked for removal.','success'); }
      if(act==='restore'){ restoreContent(c, reason); toast('Content restored.','success'); }
      if(act==='restrict'){ restrictUser(r.reportedUser, r.caseId, 'Posting restricted', reason, 14); setReportStatus(r,'Action Taken',reason,{actionLabel:'User restricted', result:'Posting restricted 14 days'}); toast('User restriction created.','success'); }
      if(act==='suspend'){ const u=userById(r.reportedUser); u.status='suspended'; restrictUser(r.reportedUser, r.caseId, 'Account suspended', reason, 30); setReportStatus(r,'Action Taken',reason,{actionLabel:'User suspended', result:'Account suspended 30 days'}); toast('User suspended.','success'); }
      renderReportDetail(reportId);
      if(state.view==='reports') renderReports();
      renderSidebar();
    }
  });
}

function handleUserAction(userId, act){
  const u = userById(userId);
  const cfgs = {
    restrict:{title:`Restrict @${u.username}?`, confirmLabel:'Apply restriction', destructive:true},
    suspend:{title:`Suspend @${u.username}?`, confirmLabel:'Suspend account', destructive:true},
    restore:{title:`Restore @${u.username}?`, confirmLabel:'Restore account', destructive:false},
  };
  const cfg = cfgs[act];
  confirmAction({title:cfg.title, confirmLabel:cfg.confirmLabel, destructive:cfg.destructive, requireReason:act!=='restore', onConfirm:(reason)=>{
    const caseId = nextCaseId();
    if(act==='restrict'){ restrictUser(userId, caseId, 'Posting restricted', reason, 14); toast('User restriction created.','success'); }
    if(act==='suspend'){ u.status='suspended'; restrictUser(userId, caseId, 'Account suspended', reason, 30); toast('User suspended.','success'); }
    if(act==='restore'){ u.status='active'; RESTRICTIONS.filter(x=>x.userId===userId&&x.status==='active').forEach(x=>x.status='cancelled'); logAction({caseId, action:'User reinstated', targetUserId:userId, targetContentId:null, reason:reason||'Reinstated by moderator.', result:'Account restored'}); toast('User restored.','success'); }
    renderUserDetail(userId);
    if(state.view==='users') renderUsers();
  }});
}

      <b>Original reason</b><span>${esc(a.originalReason)}</span>
      <b>Moderator</b><span>${esc(modById(a.moderatorId).displayName)}</span>
      <b>Appeal date</b><span>${fmtDate(a.appealDate)}</span>
      <b>Status</b><span>${statusBadge(a.status)}</span>
    </div>
    <div class="content-preview-box"><b>User's appeal message:</b><br>${esc(a.message)}</div>
    <h4 style="font-size:13px; margin:14px 0 8px;">Review timeline</h4>
    <div class="timeline">${a.timeline.map(t=>`<div class="tl-item"><div class="tl-time">${fmtDate(t.at)}</div><div class="tl-body">${esc(t.who)}: ${esc(t.text)}</div></div>`).join('')}</div>
    ${(a.status==='Pending'||a.status==='Under Review')?`<hr class="divider"><div style="display:flex; gap:8px;">
      <button class="btn primary sm" data-appeal-act="approve" data-appeal-id="${a.id}">Approve appeal</button>
      <button class="btn danger sm" data-appeal-act="reject" data-appeal-id="${a.id}">Reject appeal</button>
    </div>`:''}
  `);
}
function handleAppealAction(appealId, act){
  const a = appealById(appealId);
  confirmAction({
    title: act==='approve' ? 'Approve this appeal?' : 'Reject this appeal?',
    body: act==='approve' ? 'The related restriction will be lifted.' : undefined,
    destructive: act==='reject', confirmLabel: act==='approve'?'Approve appeal':'Reject appeal',
    onConfirm:(reason)=>{
      a.status = act==='approve' ? 'Approved' : 'Rejected';
      a.timeline.push({who:currentModerator().displayName, text:reason, at:new Date().toISOString()});
      if(act==='approve'){
        const restr = RESTRICTIONS.find(x=>x.caseId===a.caseId);
        if(restr){ restr.status='cancelled'; const u=userById(restr.userId); if(u) u.status='active'; }
        logAction({caseId:a.caseId, action:'Appeal approved', targetUserId:a.userId, targetContentId:null, reason, result:'Restriction lifted'});
      } else {
        logAction({caseId:a.caseId, action:'Appeal rejected', targetUserId:a.userId, targetContentId:null, reason, result:'Original decision upheld'});
      }
      toast(act==='approve'?'Appeal approved.':'Appeal rejected.', 'success');
      renderAppealDetail(appealId);
      if(state.view==='appeals') renderAppeals();
    }
  });
}

/* ============================================================
   RENDER: MODERATION LOG
   ============================================================ */
function renderLog(){
  const root = $('#view-root');
  const list = [...AUDIT_LOG].sort((a,b)=>new Date(b.at)-new Date(a.at));
  root.innerHTML = `
    <div class="immutable-note">\uD83D\uDD12 This log is immutable — entries cannot be edited or deleted, by admins or moderators.</div>
    <div class="panel" style="padding:8px 12px;">
      ${list.length ? `<table class="dtable"><thead><tr><th>Case</th><th>Moderator</th><th>Action</th><th>Target user</th><th>Reason</th><th>Date</th><th>Result</th></tr></thead><tbody>
      ${list.map(l=>{
        const m = modById(l.moderatorId), u = l.targetUserId?userById(l.targetUserId):null;
        return `<tr data-open-case="${l.caseId}">
          <td class="caseid">${l.caseId}</td>
          <td>${esc(m.displayName)} ${m.role==='admin'?'<span class="badge ink" style="padding:1px 6px;">ADMIN</span>':'<span class="badge grey" style="padding:1px 6px;">MOD</span>'}</td>
          <td>${esc(l.action)}</td>
          <td>${u?'@'+esc(u.username):'\u2014'}</td>
          <td class="muted">${esc(l.reason||'')}</td>
          <td class="muted">${fmtDate(l.at)}</td>
          <td class="muted">${esc(l.result||'')}</td>
        </tr>`;
      }).join('')}</tbody></table>` : emptyState('No log entries', 'Every moderation action taken will be recorded here.')}
    </div>
  `;
}
function renderCaseTimeline(caseId){
  const entries = AUDIT_LOG.filter(l=>l.caseId===caseId).sort((a,b)=>new Date(a.at)-new Date(b.at));
  openDrawer(`
    <button class="iconbtn drawer-close" data-action="close-drawer">\u2715</button>
    <h2 style="font-size:18px;">Case timeline</h2>
    <div class="badge grey caseid" style="margin-bottom:14px;">${esc(caseId)}</div>
    ${entries.length ? `<div class="timeline">${entries.map(l=>`<div class="tl-item"><div class="tl-time">${fmtDate(l.at)}</div><div class="tl-body"><b>${esc(l.action)}</b> by ${esc(modById(l.moderatorId).displayName)}<br><span class="muted">${esc(l.reason||'')}</span></div></div>`).join('')}</div>` : emptyState('No entries', 'No log entries for this case yet.')}
  `);
}

/* ============================================================
   RENDER: MODERATORS (admin only)
   ============================================================ */
function renderModerators(){
  const root = $('#view-root');
  if(state.role!=='admin'){ root.innerHTML = emptyState('Admins only', 'You don\u2019t have access to this section.'); return; }
  root.innerHTML = `
    <div class="panel-head" style="margin-bottom:10px;"><div></div><button class="btn primary sm" id="add-mod-btn">+ Add moderator</button></div>
    <div class="panel" style="padding:8px 12px;">
      ${MODERATORS.length ? `<table class="dtable"><thead><tr><th>Moderator</th><th>Role</th><th>Status</th><th>Appointed</th><th>Cases handled</th><th>Actions</th></tr></thead><tbody>
      ${MODERATORS.map(m=>{
        const cases = AUDIT_LOG.filter(l=>l.moderatorId===m.id).length;
        return `<tr data-open-mod="${m.id}">
          <td class="name-cell"><span class="mini-av">${esc(m.displayName[0])}</span><span><b>${esc(m.displayName)}</b><br><span class="muted">@${esc(m.username)}</span></span></td>
          <td>${m.role==='admin'?'<span class="badge ink">Admin</span>':'<span class="badge grey">Moderator</span>'}</td>
          <td>${statusBadge(m.status)}</td>
          <td class="muted">${fmtDate(m.dateAppointed)}</td>
          <td>${cases}</td>
          <td onclick="event.stopPropagation()">
            ${m.id!=='m0' ? (m.status==='active' ? `<button class="btn ghost sm" data-mod-act="suspend" data-mod-id="${m.id}">Suspend</button> <button class="btn ghost sm" data-mod-act="remove" data-mod-id="${m.id}">Remove</button>` : `<button class="btn ghost sm" data-mod-act="reinstate" data-mod-id="${m.id}">Reinstate</button>`) : '<span class="muted">You</span>'}
          </td>
        </tr>`;
      }).join('')}</tbody></table>` : emptyState('No moderators yet', 'Add a moderator to get started.')}
    </div>
  `;
  $('#add-mod-btn').onclick = ()=>{
    openModal(`
      <h3>Add a moderator</h3>
      <p class="sub">Search for an existing user to promote (mock search).</p>
      <select class="search-mini" style="width:100%;" id="new-mod-select">
        ${USERS.filter(u=>!MODERATORS.find(m=>m.username===u.username)).map(u=>`<option value="${u.id}">@${esc(u.username)} \u2014 ${esc(u.displayName)}</option>`).join('')}
      </select>
      <div class="modal-actions">
        <button class="btn ghost sm" data-action="close-modal">Cancel</button>
        <button class="btn primary sm" id="confirm-add-mod">Add as moderator</button>
      </div>
    `);
    $('#confirm-add-mod').onclick = ()=>{
      const uid = $('#new-mod-select').value;
      const u = userById(uid);
      if(u){
        MODERATORS.push({id:'m'+(MODERATORS.length+1), username:u.username, displayName:u.displayName, role:'moderator', status:'active', dateAppointed:new Date().toISOString()});
        toast('Moderator added.','success');
      }
      closeModal();
      renderModerators();
    };
  };
}
function handleModAction(modId, act){
  const m = modById(modId);
  confirmAction({
    title: `${act[0].toUpperCase()+act.slice(1)} ${m.displayName}?`, requireReason:false,
    destructive: act!=='reinstate', confirmLabel: act[0].toUpperCase()+act.slice(1),
    onConfirm:()=>{
      if(act==='suspend') m.status='suspended';
      if(act==='remove'){ const i=MODERATORS.indexOf(m); if(i>-1) MODERATORS.splice(i,1); }
      if(act==='reinstate') m.status='active';
      toast('Moderator status updated.','success');
      renderModerators();
    }
  });
}
function renderModeratorActivity(modId){
  const m = modById(modId);
  const actions = AUDIT_LOG.filter(l=>l.moderatorId===modId);
  const restr = RESTRICTIONS.filter(x=>x.moderatorId===modId);
  const appealsFromActions = APPEALS.filter(a=>a.moderatorId===modId);
  openDrawer(`
    <button class="iconbtn drawer-close" data-action="close-drawer">\u2715</button>
    <div style="display:flex; align-items:center; gap:12px; margin-bottom:10px;">
      <span class="mini-av" style="width:44px; height:44px; font-size:17px;">${esc(m.displayName[0])}</span>
      <div><h2 style="font-size:18px;">${esc(m.displayName)}</h2><span class="muted">${m.role==='admin'?'Administrator':'Moderator'} \u00b7 ${statusBadge(m.status)}</span></div>
    </div>
    <div class="kv">
      <b>Appointed</b><span>${fmtDate(m.dateAppointed)}</span>
      <b>Cases handled</b><span>${actions.length}</span>
      <b>Active restrictions issued</b><span>${restr.filter(x=>x.status==='active').length}</span>
      <b>Appeals from actions</b><span>${appealsFromActions.length}</span>
    </div>
    <hr class="divider">
    <h4 style="font-size:13px; margin-bottom:8px;">Moderation timeline</h4>
    ${actions.length ? `<div class="timeline">${actions.map(l=>`<div class="tl-item"><div class="tl-time">${fmtDate(l.at)} \u00b7 ${esc(l.caseId)}</div><div class="tl-body">${esc(l.action)} \u2014 <span class="muted">${esc(l.reason||'')}</span></div></div>`).join('')}</div>` : emptyState('No activity yet', 'This moderator hasn\u2019t taken any actions yet.')}
  `);
}

/* ============================================================
   RENDER: SETTINGS (admin only)
   ============================================================ */
function renderSettings(){
  const root = $('#view-root');
  if(state.role!=='admin'){ root.innerHTML = emptyState('Admins only', 'You don\u2019t have access to this section.'); return; }
  const sections = [
    ['Community Guidelines','Edit the public guidelines shown to users and referenced in notifications.'],
    ['Moderation Rules','Define automated flags and escalation thresholds.'],
    ['Report Categories','Manage the list of reasons available when a reader reports content.'],
    ['Restriction Durations','Set default durations for warnings, restrictions, and suspensions.'],
    ['Notification Settings','Configure how and when affected users are notified.'],
    ['Platform Safety Settings','General safety and trust configuration for the platform.'],
  ];
  root.innerHTML = `<div class="two-col" style="grid-template-columns:1fr 1fr;">
    ${sections.map(([t,d])=>`<div class="panel"><h3 style="font-size:15px; margin-bottom:6px;">${t}</h3><p class="muted" style="font-size:12.5px; margin-bottom:12px;">${d}</p><button class="btn ghost sm" disabled style="opacity:.5;">Placeholder — not yet connected</button></div>`).join('')}
  </div>`;
}

/* ============================================================
   GLOBAL SEARCH
   ============================================================ */
function runGlobalSearch(q){
  q = q.toLowerCase().trim();
  if(!q) return null;
  const users = USERS.filter(u=>u.username.toLowerCase().includes(q)||u.displayName.toLowerCase().includes(q)).slice(0,4);
  const content = CONTENT.filter(c=>c.title.toLowerCase().includes(q)).slice(0,4);
  const reports = REPORTS.filter(r=>r.caseId.toLowerCase().includes(q)).slice(0,4);
  const cases = [...new Set([...REPORTS.map(r=>r.caseId), ...RESTRICTIONS.map(x=>x.caseId), ...APPEALS.map(a=>a.caseId)])].filter(c=>c.toLowerCase().includes(q)).slice(0,4);
  const mods = MODERATORS.filter(m=>m.username.toLowerCase().includes(q)||m.displayName.toLowerCase().includes(q)).slice(0,4);
  return {users, content, reports, cases, mods};
}
function renderGlobalSearchResults(q){
  const box = $('#gsearch-results');
  const res = runGlobalSearch(q);
  if(!res){ box.hidden = true; return; }
  const groups = [];
  if(res.users.length) groups.push(['Users', res.users.map(u=>`<div class="gsearch-item" data-gs-open="user" data-gs-id="${u.id}"><span class="mini-av">${esc(u.displayName[0])}</span><span><span class="t">${esc(u.displayName)}</span><br><span class="s">@${esc(u.username)}</span></span></div>`).join('')]);
  if(res.content.length) groups.push(['Content', res.content.map(c=>`<div class="gsearch-item" data-gs-open="content" data-gs-id="${c.id}"><span>\uD83D\uDCC4</span><span><span class="t">${esc(c.title)}</span><br><span class="s">${esc(c.type)}</span></span></div>`).join('')]);
  if(res.reports.length) groups.push(['Reports', res.reports.map(r=>`<div class="gsearch-item" data-gs-open="report" data-gs-id="${r.id}"><span>\uD83D\uDEA9</span><span><span class="t">${esc(r.caseId)}</span><br><span class="s">${esc(r.reason)}</span></span></div>`).join('')]);
  if(res.cases.length) groups.push(['Case IDs', res.cases.map(c=>`<div class="gsearch-item" data-gs-open="case" data-gs-id="${c}"><span>\uD83D\uDDC2\uFE0F</span><span class="t caseid">${esc(c)}</span></div>`).join('')]);
  if(res.mods.length) groups.push(['Moderators', res.mods.map(m=>`<div class="gsearch-item" data-gs-open="mod" data-gs-id="${m.id}"><span class="mini-av">${esc(m.displayName[0])}</span><span class="t">${esc(m.displayName)}</span></div>`).join('')]);
  box.innerHTML = groups.length ? groups.map(([label,html])=>`<div class="gsearch-group-label">${label}</div>${html}`).join('') : `<div style="padding:14px; text-align:center; color:var(--ink-faint); font-size:12.5px;">No matches for "${esc(q)}"</div>`;
  box.hidden = false;
}

/* ============================================================
   VIEW DISPATCH
   ============================================================ */
const VIEW_TITLES = {overview:'Overview', reports:'Reports', users:'Users', content:'Content', restrictions:'Restrictions', appeals:'Appeals', log:'Moderation Log', moderators:'Moderators', settings:'Settings'};
const VIEW_RENDERERS = {overview:renderOverview, reports:renderReports, users:renderUsers, content:renderContent, restrictions:renderRestrictions, appeals:renderAppeals, log:renderLog, moderators:renderModerators, settings:renderSettings};

function goto(view){
  if((view==='moderators'||view==='settings') && state.role!=='moderator'){ /* admin-only, allowed */ }
  if((view==='moderators'||view==='settings') && state.role==='moderator'){ toast('Admins only.','error'); return; }
  state.view = view;
  state.bulkSelection.clear();
  $('#view-title').textContent = VIEW_TITLES[view] || view;
  renderSidebar();
  (VIEW_RENDERERS[view]||renderOverview)();
  $('#sidebar').classList.remove('open');
}

/* ============================================================
   EVENT WIRING (delegated)
   ============================================================ */
document.addEventListener('click', (e)=>{
  const nav = e.target.closest('[data-nav]');
  if(nav){ goto(nav.dataset.nav); return; }

  const roleBtn = e.target.closest('#role-toggle button');
  if(roleBtn){
    state.role = roleBtn.dataset.role;
    if((state.view==='moderators'||state.view==='settings') && state.role==='moderator'){ state.view='overview'; }
    toast(`Switched to ${state.role==='admin'?'Admin':'Moderator'} preview.`);
    goto(state.view);
    return;
  }

  if(e.target.closest('[data-action="close-drawer"]')){ closeDrawer(); return; }
  if(e.target.closest('[data-action="close-modal"]')){ closeModal(); return; }
  if(e.target===$('#drawer-scrim')){ closeDrawer(); return; }
  if(e.target===$('#modal-scrim')){ closeModal(); return; }

  const openReport = e.target.closest('[data-open-report]');
  if(openReport){ renderReportDetail(openReport.dataset.openReport); return; }
  const openUser = e.target.closest('[data-open-user]');
  if(openUser){ renderUserDetail(openUser.dataset.openUser); return; }
  const openContent = e.target.closest('[data-open-content]');
  if(openContent){ renderContentDetail(openContent.dataset.openContent); return; }
  const openAppeal = e.target.closest('[data-open-appeal]');
  if(openAppeal){ renderAppealDetail(openAppeal.dataset.openAppeal); return; }
  const openCase = e.target.closest('[data-open-case]');
  if(openCase){ renderCaseTimeline(openCase.dataset.openCase); return; }
  const openMod = e.target.closest('[data-open-mod]');
  if(openMod){ renderModeratorActivity(openMod.dataset.openMod); return; }

  const reportFilter = e.target.closest('[data-report-filter]');
  if(reportFilter){ state.reportFilter = reportFilter.dataset.reportFilter; renderReports(); return; }
  const contentFilter = e.target.closest('[data-content-filter]');
  if(contentFilter){ state.contentFilter = contentFilter.dataset.contentFilter; renderContent(); return; }

  const setPriority = e.target.closest('[data-set-priority]');
  if(setPriority){
    const r = reportById(setPriority.dataset.reportId);
    r.priority = setPriority.dataset.setPriority;
    toast('Priority updated.','success');
    renderReportDetail(r.id);
    return;
  }

  const reportAct = e.target.closest('[data-report-act]');
  if(reportAct){ handleReportAction(reportAct.dataset.reportId, reportAct.dataset.reportAct); return; }
  const userAct = e.target.closest('[data-user-act]');
  if(userAct){ handleUserAction(userAct.dataset.userId, userAct.dataset.userAct); return; }
  const contentAct = e.target.closest('[data-content-act]');
  if(contentAct){ handleContentAction(contentAct.dataset.contentId, contentAct.dataset.contentAct); return; }
  const appealAct = e.target.closest('[data-appeal-act]');
  if(appealAct){ handleAppealAction(appealAct.dataset.appealId, appealAct.dataset.appealAct); return; }
  const modAct = e.target.closest('[data-mod-act]');
  if(modAct){ handleModAction(modAct.dataset.modId, modAct.dataset.modAct); return; }

  const bulkAction = e.target.closest('[data-bulk-action]');
  if(bulkAction){
    const action = bulkAction.dataset.bulkAction;
    if(action==='clear'){ state.bulkSelection.clear(); (VIEW_RENDERERS[state.view])(); return; }
    const kind = bulkAction.dataset.bulkKind;
    const ids = Array.from(state.bulkSelection);
    confirmAction({
      title:`${action==='dismiss'?'Dismiss':'Remove'} ${ids.length} selected ${kind}?`,
      destructive:true, confirmLabel:'Confirm bulk action',
      onConfirm:(reason)=>{
        ids.forEach(id=>{
          if(kind==='reports'){
            const r = reportById(id);
            if(action==='dismiss') setReportStatus(r,'Dismissed',reason,{actionLabel:'Report dismissed (bulk)', result:'No action, report closed'});
            if(action==='remove'){ const c = contentById(r.contentId); removeContent(c, reason); setReportStatus(r,'Action Taken',reason,{actionLabel:'Content removed (bulk)', result:'Content removed'}); }
          } else {
            const c = contentById(id);
            if(!c.caseId) c.caseId = nextCaseId();
            if(action==='remove') removeContent(c, reason);
          }
        });
        state.bulkSelection.clear();
        toast(`Bulk action applied to ${ids.length} item(s).`,'success');
        (VIEW_RENDERERS[state.view])();
      }
    });
    return;
  }

  const gsItem = e.target.closest('[data-gs-open]');
  if(gsItem){
    const kind = gsItem.dataset.gsOpen, id = gsItem.dataset.gsId;
    $('#gsearch-results').hidden = true; $('#gsearch-input').value='';
    if(kind==='user'){ goto('users'); renderUserDetail(id); }
    else if(kind==='content'){ goto('content'); renderContentDetail(id); }
    else if(kind==='report'){ goto('reports'); renderReportDetail(id); }
    else if(kind==='case'){ goto('log'); renderCaseTimeline(id); }
    else if(kind==='mod'){ goto('moderators'); if(state.role==='admin') renderModeratorActivity(id); }
    return;
  }

  if(!e.target.closest('.gsearch')) $('#gsearch-results').hidden = true;
});

document.addEventListener('change', (e)=>{
  if(e.target.id==='report-select-all'){
    const list = filteredReports();
    list.forEach(r=> e.target.checked ? state.bulkSelection.add(r.id) : state.bulkSelection.delete(r.id));
    renderReports();
  }
  if(e.target.id==='content-select-all'){
    const list = filteredContent();
    list.forEach(c=> e.target.checked ? state.bulkSelection.add(c.id) : state.bulkSelection.delete(c.id));
    renderContent();
  }
  if(e.target.classList.contains('bulk-check')){
    e.target.checked ? state.bulkSelection.add(e.target.dataset.bulkId) : state.bulkSelection.delete(e.target.dataset.bulkId);
    renderBulkBar('#bulk-bar-slot', filteredReports(), r=>r.id, 'reports');
  }
  if(e.target.classList.contains('bulk-check-content')){
    e.target.checked ? state.bulkSelection.add(e.target.dataset.bulkId) : state.bulkSelection.delete(e.target.dataset.bulkId);
    renderBulkBar('#content-bulk-slot', filteredContent(), c=>c.id, 'content');
  }
  if(e.target.id==='assign-select'){
    const r = reportById(e.target.dataset.reportId);
    r.assignedTo = e.target.value || null;
    r.assignedAt = e.target.value ? new Date().toISOString() : null;
    toast('Moderator assigned.','success');
    renderSidebar();
  }
});

$('#gsearch-input').addEventListener('input', e=> renderGlobalSearchResults(e.target.value));
$('#mobile-menu-btn').addEventListener('click', ()=> $('#sidebar').classList.toggle('open'));

/* ============================================================
   INIT
   ============================================================ */
goto('overview');

})();
</script>

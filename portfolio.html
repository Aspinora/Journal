<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Portfolio · Aspinora Writing</title>
<meta name="description" content="A writer's portfolio on Aspinora Writing.">
<link rel="icon" type="image/svg+xml" href="journal-logo.svg">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,400;0,9..144,500;0,9..144,600;0,9..144,700;1,9..144,400;1,9..144,500&family=Plus+Jakarta+Sans:ital,wght@0,400;0,500;0,600;0,700;0,800;1,500&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
:root{
  --cream:        #FBF5EA;
  --cream-deep:   #F4EBDA;
  --paper:        #FFFDF8;
  --ink:          #2B241C;
  --ink-soft:     #5B5347;
  --ink-faint:    #948B7C;
  --orange:       #F1631B;
  --orange-deep:  #D3510F;
  --orange-soft:  #FCEADC;
  --line:         rgba(43,36,28,0.10);
  --line-strong:  rgba(43,36,28,0.18);
  --shadow-soft:  0 4px 24px rgba(43,36,28,0.06);
  --shadow-mid:   0 12px 40px rgba(43,36,28,0.10);
  --shadow-deep:  0 24px 60px rgba(43,36,28,0.16);
  --font-display: 'Fraunces', Georgia, serif;
  --font-body:    'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
  --font-mono:    'Space Mono', 'SFMono-Regular', monospace;
  --container: 1160px;
  --radius-sm: 12px;
  --radius-md: 20px;
  --radius-lg: 28px;
  --ease: cubic-bezier(.22,.9,.32,1);
  --dur-fast: .18s;
}
*,*::before,*::after{ box-sizing:border-box; }
[hidden]{ display:none !important; }
html,body{ margin:0; padding:0; min-height:100%; }
body{ background:var(--cream); color:var(--ink); font-family:var(--font-body); font-size:16px; line-height:1.6; -webkit-font-smoothing:antialiased; }
img,svg{ max-width:100%; display:block; }
a{ color:inherit; text-decoration:none; }
button{ font-family:inherit; cursor:pointer; }
textarea,input,select{ font-family:inherit; font-size:inherit; color:inherit; }
h1,h2,h3{ font-family:var(--font-display); font-weight:600; line-height:1.15; margin:0; letter-spacing:-0.01em; }
.container{ max-width:var(--container); margin:0 auto; padding:0 24px; }

/* ============ HEADER (unchanged — do not restyle) ============ */
.navbar{ position:sticky; top:0; z-index:100; background:rgba(251,245,234,.92); backdrop-filter:blur(10px); border-bottom:1px solid var(--line); }
.nav-inner{ display:flex; align-items:center; justify-content:space-between; gap:20px; padding:14px 0; }
.nav-brand{ display:flex; align-items:center; gap:10px; }
.nav-logo{ width:36px; height:36px; border-radius:11px; overflow:hidden; flex-shrink:0; }
.nav-brand-text{ display:flex; flex-direction:column; line-height:1.15; }
.nav-brand-text .t1{ font-family:var(--font-display); font-weight:700; font-size:1.06rem; }
.nav-brand-text .t2{ font-family:var(--font-mono); font-size:10px; letter-spacing:.06em; color:var(--ink-faint); }
.nav-actions{ display:flex; align-items:center; gap:10px; }

.mobile-back-btn{
  display:none; position:fixed; top:14px; left:14px; z-index:120;
  width:40px; height:40px; border-radius:50%; border:none;
  background:rgba(43,36,28,.55); color:#fff; align-items:center; justify-content:center;
  backdrop-filter:blur(4px);
}

.btn{ position:relative; display:inline-flex; align-items:center; justify-content:center; gap:8px; padding:12px 22px; border-radius:999px; font-weight:700; font-size:.88rem; border:none; transition:transform var(--dur-fast) var(--ease), box-shadow var(--dur-fast) var(--ease), background var(--dur-fast) var(--ease); white-space:nowrap; }
.btn:disabled{ opacity:.5; cursor:not-allowed; }
.btn-primary{ background:var(--orange); color:#fff; box-shadow:0 8px 20px rgba(241,99,27,.30); }
.btn-primary:hover:not(:disabled){ transform:translateY(-1px); background:var(--orange-deep); }
.btn-secondary{ background:var(--paper); color:var(--ink); border:1.5px solid var(--line-strong); }
.btn-secondary:hover{ border-color:var(--orange); color:var(--orange-deep); }
.btn-sm{ padding:9px 16px; font-size:.8rem; }
.btn-follow.is-following{ background:var(--paper); color:var(--ink); border:1.5px solid var(--line-strong); box-shadow:none; }

.avatar{ display:inline-flex; align-items:center; justify-content:center; border-radius:50%; color:#fff; font-weight:700; font-family:var(--font-mono); flex-shrink:0; overflow:hidden; }
.avatar img{ width:100%; height:100%; object-fit:cover; }

/* ============================================================
   COVER HERO — sticks directly under the header, 3:1 on desktop
   ============================================================ */
.cover-wrap{
  position:relative; width:100%; aspect-ratio:3/1; overflow:hidden;
  background:var(--cream-deep);
}
.cover-img{ width:100%; height:100%; object-fit:cover; object-position:center; display:block; }
.cover-scrim{ position:absolute; inset:0; background:linear-gradient(180deg,rgba(43,36,28,.08),rgba(43,36,28,.32)); }
.cover-center{
  position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:6px;
  text-align:center; padding:16px;
}
.cover-avatar{ width:110px; height:110px; font-size:2.1rem; border:4px solid var(--paper); box-shadow:var(--shadow-mid); }
.cover-username{ margin-top:12px; font-family:var(--font-mono); font-weight:700; font-size:1.05rem; color:#fff; text-shadow:0 1px 6px rgba(0,0,0,.35); }
.cover-identities{ display:flex; gap:6px; flex-wrap:wrap; justify-content:center; margin-top:6px; }
.identity-badge{ padding:4px 12px; border-radius:999px; background:rgba(255,255,255,.9); color:var(--orange-deep); font-size:.72rem; font-weight:700; font-family:var(--font-mono); letter-spacing:.02em; }
.cover-stats{ display:flex; gap:28px; margin-top:16px; }
.cover-stat{ color:#fff; text-shadow:0 1px 6px rgba(0,0,0,.35); }
.cover-stat b{ display:block; font-family:var(--font-display); font-size:1.25rem; }
.cover-stat span{ font-size:.7rem; font-family:var(--font-mono); letter-spacing:.04em; opacity:.9; }
.cover-edit-fab{
  position:absolute; top:16px; right:16px; z-index:5;
  width:40px; height:40px; border-radius:50%; border:none;
  background:rgba(255,255,255,.92); color:var(--ink); display:flex; align-items:center; justify-content:center;
  box-shadow:var(--shadow-mid);
}
.cover-edit-fab:hover{ background:#fff; color:var(--orange-deep); }

/* ============================================================
   ACTION BAR — tabs (About / Works / Wall / Social) + Follow/Share
   ============================================================ */
.action-bar{
  display:flex; align-items:center; justify-content:space-between; gap:16px; flex-wrap:wrap;
  padding:18px 8px 10px; border-bottom:1px solid var(--line); margin-bottom:26px;
}
.underline-tabs{ display:flex; gap:26px; }
.underline-tabs button{
  background:none; border:none; padding:6px 0; font-weight:700; font-size:.92rem; color:var(--ink-faint);
  border-bottom:2px solid transparent; margin-bottom:-1px;
}
.underline-tabs button:hover{ color:var(--ink); }
.underline-tabs button.is-active{ color:var(--orange-deep); border-bottom-color:var(--orange-deep); }
.action-bar-right{ display:flex; align-items:center; gap:10px; flex-wrap:wrap; }
.portfolio-link{
  font-family:var(--font-mono); font-size:.76rem; color:var(--ink-faint); background:var(--cream-deep);
  padding:7px 12px; border-radius:999px; display:inline-flex; align-items:center; gap:6px;
}
.portfolio-link:hover{ color:var(--orange-deep); }

/* ============ tab panels ============ */
.tab-row{ display:flex; gap:8px; flex-wrap:wrap; margin:0 8px 22px; }
.chip-filter{ background:var(--paper); border:1.5px solid var(--line); padding:8px 15px; border-radius:999px; font-size:.82rem; font-weight:600; color:var(--ink-soft); }
.chip-filter.is-active{ background:var(--ink); color:var(--paper); border-color:var(--ink); }

.j-grid{ display:grid; grid-template-columns:repeat(3,1fr); gap:20px; padding:0 8px 60px; }
.j-card{ position:relative; background:var(--paper); border-radius:var(--radius-md); overflow:hidden; border:1px solid var(--line); box-shadow:var(--shadow-soft); transition:transform var(--dur-fast) var(--ease), box-shadow var(--dur-fast) var(--ease); display:flex; flex-direction:column; }
.j-card:hover{ transform:translateY(-4px); box-shadow:var(--shadow-mid); }
.j-cover{ position:relative; aspect-ratio:2/1; }
.j-cover .cat-pill{ position:absolute; left:14px; top:14px; }
.j-cover .vis-pill{ position:absolute; right:14px; top:14px; background:rgba(43,36,28,.72); color:#fff; }
.cat-pill{ display:inline-flex; align-items:center; gap:6px; padding:5px 12px; border-radius:999px; font-size:.72rem; font-weight:700; font-family:var(--font-mono); letter-spacing:.02em; background:rgba(255,255,255,.88); }
.j-body{ padding:18px 18px 20px; display:flex; flex-direction:column; gap:10px; flex:1; }
.j-body h3{ font-size:1.1rem; line-height:1.28; }
.j-excerpt{ color:var(--ink-soft); font-size:.88rem; line-height:1.5; margin:0; flex:1; }
.j-stats{ display:flex; justify-content:space-between; align-items:center; font-size:.76rem; color:var(--ink-faint); font-family:var(--font-mono); }
.j-owner-actions{ position:absolute; top:14px; right:14px; z-index:4; display:flex; gap:6px; }
.j-owner-actions button{
  width:30px; height:30px; border-radius:50%; border:none; background:rgba(255,255,255,.92); color:var(--ink);
  display:flex; align-items:center; justify-content:center; box-shadow:var(--shadow-soft);
}
.j-owner-actions button:hover{ background:#fff; color:var(--orange-deep); }
.j-owner-actions button.danger:hover{ color:#B3432B; }

.about-panel{ padding:4px 8px 60px; max-width:640px; }
.about-panel p{ color:var(--ink-soft); font-size:1.02rem; line-height:1.7; white-space:pre-wrap; }

.wall-grid{ display:grid; grid-template-columns:repeat(3,1fr); gap:16px; padding:0 8px 60px; }
.wall-note{ background:var(--paper); border:1px solid var(--line); border-radius:var(--radius-sm); padding:18px; box-shadow:var(--shadow-soft); display:flex; flex-direction:column; gap:10px; position:relative; }
.wall-note p{ margin:0; font-size:.9rem; line-height:1.55; color:var(--ink); font-family:var(--font-display); }
.wn-meta{ display:flex; justify-content:space-between; align-items:center; font-size:.74rem; color:var(--ink-faint); }

.social-panel{ padding:4px 8px 60px; display:flex; flex-direction:column; gap:10px; max-width:420px; }
.social-row{ display:flex; align-items:center; gap:12px; background:var(--paper); border:1px solid var(--line); border-radius:14px; padding:12px 16px; font-weight:700; font-size:.9rem; }
.social-row svg{ width:20px; height:20px; color:var(--orange-deep); flex-shrink:0; }

.empty-state{ text-align:center; padding:60px 20px; color:var(--ink-soft); }
.empty-state .empty-icon{ width:56px; height:56px; margin:0 auto 18px; border-radius:50%; background:var(--cream-deep); display:flex; align-items:center; justify-content:center; color:var(--ink-faint); }
.empty-state p{ font-size:1rem; max-width:340px; margin:0 auto 20px; }

.skeleton{ background:linear-gradient(90deg,var(--cream-deep) 25%,#EFE6D2 37%,var(--cream-deep) 63%); background-size:400% 100%; animation:shimmer 1.4s ease infinite; }
@keyframes shimmer{ 0%{background-position:100% 0;} 100%{background-position:0 0;} }
.private-tag{ font-family:var(--font-mono); font-size:.68rem; font-weight:700; letter-spacing:.04em; color:#B3432B; background:#FBEAE5; padding:3px 8px; border-radius:999px; }

.toast-stack{ position:fixed; bottom:22px; left:50%; transform:translateX(-50%); z-index:400; display:flex; flex-direction:column; gap:8px; }
.toast{ background:var(--ink); color:var(--paper); padding:11px 20px; border-radius:999px; font-size:.86rem; font-weight:600; box-shadow:var(--shadow-mid); }

/* ============================================================
   EDIT MODAL (owner-only)
   ============================================================ */
.modal-scrim{ position:fixed; inset:0; background:rgba(43,36,28,.45); z-index:400; display:none; align-items:flex-start; justify-content:center; padding:40px 20px; overflow-y:auto; }
.modal-scrim.open{ display:flex; }
.modal-box{ background:var(--paper); border-radius:var(--radius-lg); max-width:560px; width:100%; padding:32px; box-shadow:var(--shadow-deep); }
.modal-box h2{ font-size:1.4rem; margin-bottom:20px; }
.modal-close{ float:right; background:none; border:none; color:var(--ink-faint); width:30px; height:30px; }
.field{ margin-bottom:22px; }
.field label{ display:block; font-weight:700; font-size:.86rem; margin-bottom:8px; }
.field .hint{ font-size:.78rem; color:var(--ink-faint); margin-top:6px; }
.field .count{ font-family:var(--font-mono); font-size:.74rem; color:var(--ink-faint); float:right; font-weight:400; }
.input, .textarea{ width:100%; padding:13px 16px; border-radius:12px; border:1.5px solid var(--line); background:var(--paper); font-size:.95rem; color:var(--ink); }
.input:focus, .textarea:focus{ outline:none; border-color:var(--orange); }
.textarea{ resize:vertical; min-height:80px; }
.media-edit-row{ display:flex; gap:20px; align-items:center; }
.media-edit-col{ text-align:center; }
.media-edit-col .avatar{ width:76px; height:76px; font-size:1.5rem; margin:0 auto 8px; cursor:pointer; }
.cover-preview-box{ width:150px; aspect-ratio:3/1; border-radius:10px; overflow:hidden; background:var(--cream-deep); cursor:pointer; margin-bottom:8px; }
.cover-preview-box img{ width:100%; height:100%; object-fit:cover; }
.upload-hint-btn{ background:none; border:none; font-size:.76rem; font-weight:700; color:var(--orange-deep); }
.identity-grid{ display:flex; flex-wrap:wrap; gap:8px; }
.identity-btn{ padding:9px 15px; border-radius:999px; border:1.5px solid var(--line); background:var(--paper); font-weight:700; font-size:.84rem; color:var(--ink-soft); }
.identity-btn.is-active{ border-color:var(--orange); background:var(--orange-soft); color:var(--orange-deep); }
.social-edit-row{ display:flex; gap:8px; margin-bottom:8px; }
.social-edit-row select{ width:130px; padding:10px; border-radius:10px; border:1.5px solid var(--line); background:var(--paper); font-size:.84rem; }
.social-edit-row input{ flex:1; padding:10px 12px; border-radius:10px; border:1.5px solid var(--line); background:var(--paper); font-size:.86rem; }
.social-edit-row button{ background:none; border:none; color:var(--ink-faint); width:32px; }
.social-edit-row button:hover{ color:#B3432B; }
.add-social-btn{ background:none; border:1.5px dashed var(--line-strong); border-radius:10px; padding:9px; font-weight:700; font-size:.82rem; color:var(--ink-soft); width:100%; }
.error-msg{ color:#B3432B; font-size:.8rem; margin-top:6px; font-weight:600; }
.modal-actions{ display:flex; gap:10px; justify-content:flex-end; margin-top:8px; }
.spinner{ width:14px; height:14px; border-radius:50%; border:2px solid rgba(255,255,255,.4); border-top-color:#fff; animation:spin .7s linear infinite; }
@keyframes spin{ to{ transform:rotate(360deg); } }

.page-loader{ position:fixed; inset:0; z-index:600; display:flex; align-items:center; justify-content:center; background:var(--cream); transition:opacity .35s ease, visibility .35s ease; }
.page-loader.is-hidden{ opacity:0; visibility:hidden; pointer-events:none; }
.page-loader-mark{ position:relative; width:56px; height:56px; display:flex; align-items:center; justify-content:center; }
.page-loader-j{ font-family:var(--font-display); font-weight:700; font-size:1.9rem; color:var(--orange); }
.page-loader-ring{ position:absolute; inset:0; border-radius:50%; border:3px solid var(--line); border-top-color:var(--orange-deep); animation:page-loader-spin .8s linear infinite; }
@keyframes page-loader-spin{ to{ transform:rotate(360deg); } }

/* ============================================================
   MOBILE — no header, small back button, 1:1 cover, single column
   ============================================================ */
@media (max-width: 760px){
  .navbar{ display:none; }
  .mobile-back-btn{ display:flex; }
  .cover-wrap{ aspect-ratio:1/1; }
  .cover-avatar{ width:88px; height:88px; font-size:1.7rem; }
  .cover-stats{ gap:18px; }
  .action-bar{ flex-direction:column; align-items:stretch; gap:14px; }
  .underline-tabs{ gap:16px; overflow-x:auto; }
  .action-bar-right{ justify-content:space-between; }
  .j-grid{ grid-template-columns:1fr; }
  .wall-grid{ grid-template-columns:1fr; }
  .modal-box{ padding:22px; }
  .media-edit-row{ flex-direction:column; align-items:flex-start; }
}
@media (min-width:761px) and (max-width:980px){
  .j-grid{ grid-template-columns:repeat(2,1fr); }
  .wall-grid{ grid-template-columns:repeat(2,1fr); }
}
</style>
</head>
<body>

<div id="page-loader" class="page-loader">
  <div class="page-loader-mark"><span class="page-loader-j">J</span><span class="page-loader-ring"></span></div>
</div>

<button type="button" class="mobile-back-btn" id="mobile-back-btn" aria-label="Back">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="20" height="20"><path d="M15 18l-6-6 6-6" stroke-linecap="round" stroke-linejoin="round"/></svg>
</button>

<nav class="navbar" id="site-navbar">
  <div class="container nav-inner">
    <a class="nav-brand" href="userpostlogin.html" id="brand-link">
      <span class="nav-logo"><img src="journal-logo.svg" alt=""></span>
      <span class="nav-brand-text"><span class="t1">Aspinora</span><span class="t2">WRITING</span></span>
    </a>
    <div class="nav-actions" id="nav-actions"></div>
  </div>
</nav>

<main id="app">
  <div class="cover-wrap"><div class="skeleton" style="width:100%;height:100%;"></div></div>
</main>

<div class="modal-scrim" id="edit-modal">
  <div class="modal-box">
    <button type="button" class="modal-close" id="modal-close-btn">✕</button>
    <h2>Update Portfolio</h2>
    <form id="edit-form">
      <div class="field">
        <label>Photos</label>
        <div class="media-edit-row">
          <div class="media-edit-col">
            <span class="avatar" id="edit-avatar-preview" style="background:#F1631B;"></span>
            <button type="button" class="upload-hint-btn" id="pick-avatar-btn">Change avatar</button>
            <input type="file" accept="image/*" id="avatar-file-input" hidden>
            <p class="hint" style="max-width:110px;">Auto-cropped &amp; compressed to ~20KB</p>
          </div>
          <div class="media-edit-col">
            <div class="cover-preview-box" id="edit-cover-preview-box"><div class="skeleton" style="width:100%;height:100%;"></div></div>
            <button type="button" class="upload-hint-btn" id="pick-cover-btn">Change cover image</button>
            <input type="file" accept="image/*" id="cover-file-input" hidden>
            <p class="hint" style="max-width:170px;">Auto-cropped to 3:1 &amp; compressed to ~60KB</p>
          </div>
        </div>
      </div>

      <div class="field">
        <label>Creative Identity <span style="font-weight:400;color:var(--ink-faint);">(pick any that fit)</span></label>
        <div class="identity-grid" id="identity-grid"></div>
      </div>

      <div class="field">
        <label for="f-about">About <span class="count" id="about-count">0/100 words</span></label>
        <textarea class="textarea" id="f-about" placeholder="A few lines about you and what you write…"></textarea>
      </div>

      <div class="field">
        <label>Social Links</label>
        <div id="social-edit-list"></div>
        <button type="button" class="add-social-btn" id="add-social-btn">+ Add a link</button>
      </div>

      <p class="error-msg" id="form-error" hidden></p>
      <div class="modal-actions">
        <button type="button" class="btn btn-secondary" id="modal-cancel-btn">Cancel</button>
        <button type="submit" class="btn btn-primary" id="save-btn">Save Changes</button>
      </div>
    </form>
  </div>
</div>

<div class="toast-stack" id="toast-stack"></div>

<script>
/* ==================================================================
   SUPABASE — same project/keys as index.html & userpostlogin.html
   ================================================================== */
const SUPABASE_URL = 'https://txrtxienudcwpywfnqtj.supabase.co';
const SUPABASE_ANON_KEY = 'sb_publishable_IynOGfqeFgK0-orZTt5c5Q_gkG1aFJy';

try{
  if (window.supabase){
    supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY, {
      auth: { persistSession: true, autoRefreshToken: true, detectSessionInUrl: true }
    });
  }

const CATEGORIES = [
  { id:1, name:'Journals',  color:'#8A6B3D', soft:'#F3E7CE', icon:'<path d="M7 4.5h8A1.5 1.5 0 0 1 16.5 6v13.5A1.5 1.5 0 0 1 15 21H8.5A1.5 1.5 0 0 1 7 19.5V4.5Z" stroke-linejoin="round"/><rect x="10.2" y="7.2" width="3.6" height="2.6" rx="0.4"/><path d="M9.2 17.8v2.6l1.3-1 1.3 1v-2.6" stroke-linejoin="round"/>' },

/* ------------------------------------------------------------------
   Client-side "smart" image processing: centre-crops to the target
   aspect ratio (never stretches), then iterates JPEG quality/size
   downward until the file fits the byte budget while keeping
   resolution as high as it can.
   ------------------------------------------------------------------ */
function loadImageFile(file){
  return new Promise(function(resolve, reject){
    const img = new Image();
    img.onload = function(){ resolve(img); };
    img.onerror = reject;
    img.src = URL.createObjectURL(file);
  });
}
async function cropAndCompress(file, aspect, maxDim, maxBytes){
  const img = await loadImageFile(file);
  const srcRatio = img.width / img.height;
  let sx, sy, sw, sh;
  if (srcRatio > aspect){ sh = img.height; sw = sh * aspect; sx = (img.width - sw) / 2; sy = 0; }
  else { sw = img.width; sh = sw / aspect; sx = 0; sy = (img.height - sh) / 2; }

  let outW = maxDim;
  let outH = Math.round(maxDim / aspect);
  const canvas = document.createElement('canvas');
  const ctx = canvas.getContext('2d');
  let quality = 0.9;
  let blob = null;
  for (let attempt = 0; attempt < 14; attempt++){
    canvas.width = outW; canvas.height = outH;
    ctx.clearRect(0, 0, outW, outH);
    ctx.drawImage(img, sx, sy, sw, sh, 0, 0, outW, outH);
    blob = await new Promise(function(res){ canvas.toBlob(res, 'image/jpeg', quality); });
    if (blob.size <= maxBytes) break;
    if (quality > 0.5){ quality -= 0.1; }
    else { outW = Math.round(outW * 0.85); outH = Math.round(outH / aspect); quality = 0.75; }
  }
  URL.revokeObjectURL(img.src);
  return blob;
}

async function toggleFollow(profile){

  btn.disabled = true;
  if (state.isFollowing){
    const { error } = await supabaseClient.from('follows').delete().eq('follower_id', state.currentUser.id).eq('following_id', profile.id);
    if (!error){ state.isFollowing = false; btn.textContent = 'Follow'; btn.classList.remove('is-following'); updateFollowerCount(-1); }
  } else {
    const { error } = await supabaseClient.from('follows').insert({ follower_id: state.currentUser.id, following_id: profile.id });
    if (!error){ state.isFollowing = true; btn.textContent = 'Following'; btn.classList.add('is-following'); updateFollowerCount(1); }
  }
  btn.disabled = false;
}

async function saveProfileEdits(profile){
  const formError = document.getElementById('form-error');
  formError.hidden = true;
  const saveBtn = document.getElementById('save-btn');

  const about = document.getElementById('f-about').value.trim();
  if (wordCount(about) > 100){ formError.textContent = 'About needs to be 100 words or fewer.'; formError.hidden = false; return; }

  const identities = Array.prototype.map.call(document.querySelectorAll('#identity-grid .identity-btn.is-active'), function(b){ return b.getAttribute('data-identity'); });
  if (!identities.length){ formError.textContent = 'Pick at least one creative identity.'; formError.hidden = false; return; }

  const socialLinks = Array.prototype.map.call(document.querySelectorAll('#social-edit-list .social-edit-row'), function(row){
    return { platform: row.querySelector('select').value, url: row.querySelector('input').value.trim() };
  }).filter(function(l){ return l.url; });

  saveBtn.disabled = true;
  saveBtn.innerHTML = '<span class="spinner"></span> Saving…';

  try{
    const updates = { creative_identities: identities, bio: about || null, social_links: socialLinks, updated_at: new Date().toISOString() };

    // Fixed per-user filenames + upsert: a new upload replaces the
    // previous file at that path rather than accumulating orphans.
    if (state.pendingAvatarBlob){
      const path = profile.id + '/avatar.jpg';
      const { error: upErr } = await supabaseClient.storage.from('profile-media').upload(path, state.pendingAvatarBlob, { upsert: true, contentType: 'image/jpeg' });
      if (upErr) throw upErr;
      const { data: pub } = supabaseClient.storage.from('profile-media').getPublicUrl(path);
      updates.avatar_url = pub.publicUrl + '?v=' + Date.now();
    }
    if (state.pendingCoverBlob){
      const path = profile.id + '/cover.jpg';
      const { error: upErr } = await supabaseClient.storage.from('profile-media').upload(path, state.pendingCoverBlob, { upsert: true, contentType: 'image/jpeg' });
      if (upErr) throw upErr;
      const { data: pub } = supabaseClient.storage.from('profile-media').getPublicUrl(path);
      updates.cover_image_url = pub.publicUrl + '?v=' + Date.now();
    }

    const { error } = await supabaseClient.from('profiles').update(updates).eq('id', profile.id);
    if (error) throw error;

    showToast('Portfolio updated');
    closeEditModal();
    window.location.reload();
  } catch(err){
    formError.textContent = 'Couldn\'t save your changes. Please try again.';
    formError.hidden = false;
  } finally {
    saveBtn.disabled = false;
    saveBtn.textContent = 'Save Changes';
  }
}

    else window.location.href = state.currentUser ? 'userpostlogin.html' : 'index.html';
  });

  const params = new URLSearchParams(window.location.search);
  let username = params.get('u');
  if (!username){
    if (state.currentUser){
      username = state.currentUser.username;
      const url = new URL(window.location.href);
      url.searchParams.set('u', username);
      window.history.replaceState(null, '', url.toString());
    } else {
      document.getElementById('app').innerHTML = notFoundHTML();
      return;
    }
  }

  if (!supabaseClient){
    document.getElementById('app').innerHTML = '<div class="empty-state" style="padding:120px 20px;"><p>Couldn\'t connect right now. Please try again shortly.</p></div>';
    return;
  }

  const { data: profile, error } = await supabaseClient
    .from('profiles')
    .select('id,username,display_name,bio,avatar_color,avatar_url,cover_image_url,creative_identities,social_links,created_at')
    .eq('username', username)
    .maybeSingle();

  if (error || !profile){
    document.getElementById('app').innerHTML = notFoundHTML();
    return;
  }
  state.profile = profile;
  state.isOwner = !!(state.currentUser && state.currentUser.id === profile.id);

  const [{ data: rows }, { count: followerCount }, followingRow] = await Promise.all([
    supabaseClient.from('journals').select('id,title,excerpt,category_id,visibility,published_at,like_count,comment_count,read_count').eq('author_id', profile.id).eq('status', 'published').order('published_at', { ascending:false }),
    supabaseClient.from('follows').select('follower_id', { count:'exact', head:true }).eq('following_id', profile.id),
    state.currentUser && !state.isOwner
      ? supabaseClient.from('follows').select('follower_id').eq('follower_id', state.currentUser.id).eq('following_id', profile.id).maybeSingle()
      : Promise.resolve({ data:null })
  ]);

  state.works = (rows || []).filter(function(w){ return state.isOwner || w.visibility === 'public'; });
  state.isFollowing = !!(followingRow && followingRow.data);

  const { data: wallRows } = await supabaseClient
    .from('wall_posts')
    .select('id,body,category_id,likes,published_at')
    .eq('author_id', profile.id)
    .eq('status', 'published')
    .order('published_at', { ascending:false });
  state.wallPosts = wallRows || [];

  const app = document.getElementById('app');
  app.innerHTML = coverHeroHTML(profile, state.isOwner) + '<div class="container">' + actionBarHTML(profile, state.isOwner, state.isFollowing) + '</div>';

  const impressions = state.works.reduce(function(sum, w){ return sum + (w.read_count || 0); }, 0);
  document.getElementById('stat-works').textContent = state.works.length;
  document.getElementById('stat-impressions').textContent = impressions;
  document.getElementById('stat-followers').textContent = followerCount || 0;

  renderWorksPanel(state.isOwner);
  renderAboutPanel(profile);
  renderWallPanel(state.isOwner);
  renderSocialPanel(profile);
  switchTab('works');

  Array.prototype.forEach.call(document.querySelectorAll('#tab-row button'), function(btn){
    btn.addEventListener('click', function(){ switchTab(btn.getAttribute('data-tab')); });
  });

  const shareUrl = 'https://journal.aspinora.in/@' + profile.username;
  document.getElementById('share-btn').addEventListener('click', function(){
    if (navigator.clipboard) navigator.clipboard.writeText(shareUrl);
    showToast('Portfolio link copied');
  });
  document.getElementById('portfolio-link-text').addEventListener('click', function(){
    if (navigator.clipboard) navigator.clipboard.writeText(shareUrl);
    showToast('Portfolio link copied');
  });

  const followBtn = document.getElementById('follow-btn');
  if (followBtn) followBtn.addEventListener('click', function(){ toggleFollow(profile); });

  if (state.isOwner){
    document.getElementById('cover-edit-fab').addEventListener('click', function(){ openEditModal(profile); });
    document.getElementById('modal-close-btn').addEventListener('click', closeEditModal);
    document.getElementById('modal-cancel-btn').addEventListener('click', closeEditModal);
    document.getElementById('edit-modal').addEventListener('click', function(e){ if (e.target.id === 'edit-modal') closeEditModal(); });
    document.getElementById('add-social-btn').addEventListener('click', function(){ addSocialRow(); });

    document.getElementById('pick-avatar-btn').addEventListener('click', function(){ document.getElementById('avatar-file-input').click(); });
    document.getElementById('avatar-file-input').addEventListener('change', async function(e){
      const file = e.target.files[0]; if (!file) return;
      const blob = await cropAndCompress(file, 1, 480, 20 * 1024);
      state.pendingAvatarBlob = blob;
      document.getElementById('edit-avatar-preview').innerHTML = '<img src="' + URL.createObjectURL(blob) + '" alt="">';
    });
    document.getElementById('pick-cover-btn').addEventListener('click', function(){ document.getElementById('cover-file-input').click(); });
    document.getElementById('cover-file-input').addEventListener('change', async function(e){
      const file = e.target.files[0]; if (!file) return;
      const blob = await cropAndCompress(file, 3, 1500, 60 * 1024);
      state.pendingCoverBlob = blob;
      document.getElementById('edit-cover-preview-box').innerHTML = '<img src="' + URL.createObjectURL(blob) + '" alt="">';
    });

    document.getElementById('edit-form').addEventListener('submit', function(e){ e.preventDefault(); saveProfileEdits(profile); });
  }
}

init();
</script>
</body>
</html>

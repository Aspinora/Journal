<script>
// Same GitHub-Pages SPA redirect decode used on index.html/userpostlogin.html,
// so a 404-redirected path (e.g. /@username) is restored before anything
// below reads window.location.
(function(l){
  if (l.search[1] === '/'){
    var decoded = l.search.slice(1).split('&').map(function(s){ return s.replace(/~and~/g, '&'); }).join('?');
    window.history.replaceState(null, null, l.pathname.slice(0, -1) + decoded + l.hash);
  }
}(window.location));
</script>

}

h1,h2,h3{ font-family:var(--font-display); font-weight:600; line-height:1.15; margin:0; letter-spacing:-0.01em; }

/* ============ HEADER — structure/icons/logo untouched; only the
   background tint changes, driven by --header-tint (set from the
   cover image's average colour). The logo <img> never gets any
   filter/blend applied, only the bar behind it does. ============ */
.navbar{
  position:sticky; top:0; z-index:100;
  background:linear-gradient(rgba(var(--header-tint),.42),rgba(var(--header-tint),.42));
  backdrop-filter:blur(22px) saturate(180%); -webkit-backdrop-filter:blur(22px) saturate(180%);
  border-bottom:1px solid rgba(255,255,255,.25);
  box-shadow:0 1px 0 rgba(255,255,255,.35) inset;
  transition:background .5s ease;
}

}

.nav-dropdown{
  position:absolute; top:calc(100% + 10px); right:0; width:230px; background:var(--paper);
  border:1px solid var(--line); border-radius:var(--radius-sm); box-shadow:var(--shadow-mid);
  padding:8px; display:none; flex-direction:column; gap:2px;
}
.nav-dropdown.open{ display:flex; }
.nav-dropdown-name{ display:none; padding:8px 12px 10px; font-family:var(--font-display); font-weight:700; font-size:.98rem; color:var(--ink); border-bottom:1px solid var(--line); margin-bottom:4px; }
.nav-dropdown button{
  background:none; border:none; text-align:left; padding:10px 12px; border-radius:8px; font-size:.88rem;
  font-weight:600; color:var(--ink); display:flex; align-items:center; gap:10px;
}
.nav-dropdown button:hover{ background:var(--cream-deep); }
.nav-dropdown button.danger{ color:#B3432B; }
.nav-dropdown-icon{ width:20px; height:20px; border-radius:50%; flex-shrink:0; }

}

.nav-hamburger span, .nav-hamburger::before, .nav-hamburger::after{ content:''; display:block; width:20px; height:2px; background:var(--ink); border-radius:2px; }
.nav-hamburger{ flex-direction:column; gap:5px; }
.mobile-menu{

}

/* ============================================================

.pl-nav-inner{ display:grid; grid-template-columns:auto 1fr auto; align-items:center; gap:18px; padding:10px 0; }

.pl-nav-item.is-active{ color:var(--orange-deep); }

/* Desktop: a real, always-open search bar (not just an icon). */
.pl-search-bar-inline{
  display:flex; align-items:center; gap:8px; border:1px solid var(--line-strong); border-radius:999px;

.pl-search-panel{
  position:absolute; top:calc(100% + 10px); right:0; width:300px; z-index:210;

/* Mobile-only compact "Write something.." shortcut (hidden on desktop). */
.pl-cta-mini-mobile{ display:none; }

.pl-cta-bar{
  display:block; width:70%; margin:10px auto 0; background:#fff;
  border:1px solid var(--line); border-radius:var(--radius-sm); box-shadow:var(--shadow-mid);
  padding:12px 0; text-align:left; cursor:pointer;
  position:sticky; z-index:190;
  transform:translateY(0); transition:transform .22s ease, box-shadow .22s ease;
}
.pl-cta-bar.is-scrolled-hidden{ transform:translateY(-100%); box-shadow:none; }
.pl-cta-inner{
  display:flex; align-items:center; justify-content:center; gap:12px; color:var(--ink-faint); font-family:var(--font-display); font-size:1rem;
  width:100%; margin:0;
}
.pl-cta-icon{ display:inline-flex; width:30px; height:30px; align-items:center; justify-content:center; border-radius:50%; border:1.5px dashed var(--line-strong); color:var(--ink-faint); flex-shrink:0; }
.pl-cta-bar:hover .pl-cta-inner{ color:var(--ink); }

.pl-cta-bar[hidden]{ display:none; }
.pl-cta-section-label{ display:none; }

.mh-feed{ padding-top:28px; }

@media (max-width:760px){
  /* Facebook-style two-row header: brand + mini-CTA + Wall/search/avatar
     on row 1, the 7 section icons spanning the full width on row 2. */
  .pl-nav-inner{
    display:grid;
    grid-template-columns:auto 1fr auto;
    grid-template-rows:auto auto;
    align-items:center;
    row-gap:2px; column-gap:8px;
    padding:8px 0 4px;
  }
  .pl-brand{ grid-column:1; grid-row:1; margin-left:6px; }
  .pl-cta-mini-mobile{
    display:flex; align-items:center; gap:6px;
    grid-column:2; grid-row:1; justify-self:center;
    background:#fff; border:none; border-radius:999px; padding:7px 14px;
    color:var(--ink-soft); font-family:var(--font-body); font-size:.76rem; font-weight:700; white-space:nowrap;
  }
  .pl-cta-mini-mobile svg{ width:15px; height:15px; flex-shrink:0; }
  .pl-nav-right{ grid-column:3; grid-row:1; justify-self:end; gap:2px; margin-right:4px; }
  .pl-wall-btn{ padding:6px; }
  .pl-search-bar-inline{ display:none; }
  .pl-search-btn-mobile{ display:inline-flex; }
  .pl-search-panel{ display:block; }
  .pl-center-nav{
    grid-column:1 / -1; grid-row:2;
    width:100%; justify-content:space-between; gap:0;
    overflow-x:visible;
  }
  #pl-center-nav .pl-nav-item{ flex:1; padding:4px 2px 7px; }
  .pl-nav-item .pl-nav-label{ display:none; }
  .pl-nav-item svg{ width:27px; height:27px; }
  .pl-wall-icon-img{ width:27px; height:27px; }
  .pl-nav-item.is-active{ position:relative; }
  .pl-nav-item.is-active::after{
    content:''; position:absolute; left:22%; right:22%; bottom:0;
    height:3px; border-radius:3px; background:var(--orange-deep);
  }
  .nav-user-name{ display:none; }
  .nav-user-trigger{ padding:2px; border:none; background:none; }
  .nav-dropdown-name{ display:block; }
  .brand-logo-img{ height:28px; width:116px; }

  /* CTA bar becomes a plain, non-interactive section-name label on
     mobile — the mini "Write something.." button in the header row
     above is the write shortcut here instead. It blends into the
     page background rather than sitting on its own white strip. */
  .pl-cta-bar{ pointer-events:none; width:100%; margin:0; background:transparent; border:none; border-radius:0; box-shadow:none; padding:8px 0 10px; }
  .pl-cta-inner{ width:100%; margin:0; justify-content:flex-start; }
  .pl-cta-icon, #pl-cta-text{ display:none; }
  .pl-cta-section-label{ display:inline; font-family:var(--font-display); font-weight:700; font-size:.95rem; color:var(--ink); }
}
@media (max-width:520px){
  .pl-search-panel{ width:calc(100vw - 32px); right:-8px; }
}

.social-row{ display:flex; align-items:center; gap:12px; background:var(--paper); border:1px solid var(--line); border-radius:14px; padding:12px 16px; font-weight:700; font-size:.9rem; }
.social-row svg{ width:20px; height:20px; color:var(--orange-deep); flex-shrink:0; }

.empty-state{ text-align:center; padding:60px 20px; color:var(--ink-soft); }
.empty-state .empty-icon{ width:56px; height:56px; margin:0 auto 18px; border-radius:50%; background:var(--cream-deep); display:flex; align-items:center; justify-content:center; color:var(--ink-faint); }
.empty-state p{ font-size:1rem; max-width:340px; margin:0 auto 20px; }

.skeleton{ background:linear-gradient(90deg,var(--cream-deep) 25%,#EFE6D2 37%,var(--cream-deep) 63%); background-size:400% 100%; animation:shimmer 1.4s ease infinite; }
@keyframes shimmer{ 0%{background-position:100% 0;} 100%{background-position:0 0;} }
.private-tag{ font-family:var(--font-mono); font-size:.68rem; font-weight:700; letter-spacing:.04em; color:#B3432B; background:#FBEAE5; padding:3px 8px; border-radius:999px; }

.toast-stack{ position:fixed; bottom:22px; left:50%; transform:translateX(-50%); z-index:400; display:flex; flex-direction:column; gap:8px; }
.toast{ background:var(--ink); color:var(--paper); padding:11px 20px; border-radius:999px; font-size:.86rem; font-weight:600; box-shadow:var(--shadow-mid); }

/* ============================================================
   EDIT MODAL (owner-only)
   ============================================================ */
.modal-scrim{ position:fixed; inset:0; background:rgba(43,36,28,.45); z-index:400; display:none; align-items:flex-start; justify-content:center; padding:40px 20px; overflow-y:auto; }
.modal-scrim.open{ display:flex; }
.modal-box{ background:var(--paper); border-radius:var(--radius-lg); max-width:560px; width:100%; padding:32px; box-shadow:var(--shadow-deep); }
.modal-box h2{ font-size:1.4rem; margin-bottom:20px; }
.modal-close{ float:right; background:none; border:none; color:var(--ink-faint); width:30px; height:30px; }
.field{ margin-bottom:22px; }
.field label{ display:block; font-weight:700; font-size:.86rem; margin-bottom:8px; }
.field .hint{ font-size:.78rem; color:var(--ink-faint); margin-top:6px; }
.field .count{ font-family:var(--font-mono); font-size:.74rem; color:var(--ink-faint); float:right; font-weight:400; }
.input, .textarea{ width:100%; padding:13px 16px; border-radius:12px; border:1.5px solid var(--line); background:var(--paper); font-size:.95rem; color:var(--ink); }
.input:focus, .textarea:focus{ outline:none; border-color:var(--orange); }
.textarea{ resize:vertical; min-height:80px; }
.media-edit-row{ display:flex; gap:20px; align-items:center; flex-wrap:wrap; }
.media-edit-col{ text-align:center; }
.media-edit-col .avatar{ width:76px; height:76px; font-size:1.5rem; margin:0 auto 8px; cursor:pointer; }
.cover-preview-box{ position:relative; width:150px; aspect-ratio:3/1; border-radius:10px; overflow:hidden; background:var(--cream-deep); cursor:pointer; margin-bottom:8px; }
.cover-preview-box img{ position:absolute; inset:0; width:100%; height:100%; object-fit:cover; }
.upload-hint-btn{ background:none; border:none; font-size:.76rem; font-weight:700; color:var(--orange-deep); }
.identity-grid{ display:flex; flex-wrap:wrap; gap:8px; }
.identity-btn{ padding:9px 15px; border-radius:999px; border:1.5px solid var(--line); background:var(--paper); font-weight:700; font-size:.84rem; color:var(--ink-soft); }
.identity-btn.is-active{ border-color:var(--orange); background:var(--orange-soft); color:var(--orange-deep); }
.social-edit-row{ display:flex; gap:8px; margin-bottom:8px; align-items:center; }
.social-edit-row .social-icon-mini{ width:20px; height:20px; color:var(--orange-deep); flex-shrink:0; }
.social-edit-row select{ width:120px; padding:10px; border-radius:10px; border:1.5px solid var(--line); background:var(--paper); font-size:.82rem; }
.social-edit-row input{ flex:1; padding:10px 12px; border-radius:10px; border:1.5px solid var(--line); background:var(--paper); font-size:.86rem; }
.social-edit-row button{ background:none; border:none; color:var(--ink-faint); width:32px; }
.social-edit-row button:hover{ color:#B3432B; }
.add-social-btn{ background:none; border:1.5px dashed var(--line-strong); border-radius:10px; padding:9px; font-weight:700; font-size:.82rem; color:var(--ink-soft); width:100%; }
.error-msg{ color:#B3432B; font-size:.8rem; margin-top:6px; font-weight:600; }
.modal-actions{ display:flex; gap:10px; justify-content:flex-end; margin-top:8px; }
.spinner{ width:14px; height:14px; border-radius:50%; border:2px solid rgba(255,255,255,.4); border-top-color:#fff; animation:spin .7s linear infinite; }
@keyframes spin{ to{ transform:rotate(360deg); } }

/* ============================================================
   MANUAL CROPPER
   ============================================================ */
.cropper-box{ max-width:480px; }
.followers-box{ max-width:420px; }
.followers-search{ margin:16px 0 6px; }
.followers-list{ max-height:56vh; overflow-y:auto; margin-top:10px; }
.follower-row{ display:flex; align-items:center; gap:12px; padding:12px 4px; border-bottom:1px solid var(--line); }
.follower-row:last-child{ border-bottom:none; }
.follower-row .avatar{ width:44px; height:44px; font-size:.9rem; flex-shrink:0; }
.follower-row-name{ flex:1; min-width:0; }
.follower-row-name .fn{ font-weight:700; font-size:.92rem; display:block; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.follower-row-name .fu{ font-family:var(--font-mono); font-size:.76rem; color:var(--ink-faint); }
.follower-follow-btn{ padding:8px 14px; border-radius:999px; font-weight:700; font-size:.78rem; border:1.5px solid var(--line-strong); background:var(--paper); color:var(--ink); flex-shrink:0; }
.follower-follow-btn.is-following{ color:var(--ink-faint); }
.follower-follow-btn:not(.is-following){ background:var(--orange); color:#fff; border-color:var(--orange); }
.crop-frame{ position:relative; overflow:hidden; margin:0 auto 18px; background:#111; border-radius:12px; touch-action:none; cursor:grab; }
.crop-frame:active{ cursor:grabbing; }
.crop-frame img{ position:absolute; left:0; top:0; max-width:none; user-select:none; -webkit-user-drag:none; }
.crop-controls{ display:flex; align-items:center; gap:12px; margin-bottom:20px; }
.crop-controls svg{ width:16px; height:16px; color:var(--ink-faint); flex-shrink:0; }
.crop-controls input[type="range"]{ flex:1; }

.page-loader{ position:fixed; inset:0; z-index:600; display:flex; align-items:center; justify-content:center; background:var(--cream); transition:opacity .35s ease, visibility .35s ease; }
.page-loader.is-hidden{ opacity:0; visibility:hidden; pointer-events:none; }
.page-loader-mark{ position:relative; width:56px; height:56px; display:flex; align-items:center; justify-content:center; }
.page-loader-j{ font-family:var(--font-display); font-weight:700; font-size:1.9rem; color:var(--orange); }
.page-loader-ring{ position:absolute; inset:0; border-radius:50%; border:3px solid var(--line); border-top-color:var(--orange-deep); animation:page-loader-spin .8s linear infinite; }
@keyframes page-loader-spin{ to{ transform:rotate(360deg); } }

/* ============================================================
   MOBILE — no header, small back button, 1:1 cover, single column
   ============================================================ */
@media (max-width: 760px){
  .navbar{ display:none; }
  .cover-wrap{ aspect-ratio:1/1; margin-top:0; }
  :root{ --avatar-sz:88px; --avatar-font-sz:1.7rem; --avatar-top-pct:50%; }
  .cover-stats{ gap:18px; }
  .underline-tabs{ overflow-x:auto; }
  .share-tab-label{ display:none; }
  .j-grid{ grid-template-columns:1fr; }
  .wall-grid{ grid-template-columns:1fr; }
  .modal-box{ padding:22px; }
  .media-edit-row{ flex-direction:column; align-items:flex-start; }
  .crop-frame{ width:260px !important; height:260px !important; }
}
@media (min-width:761px) and (max-width:980px){
  .j-grid{ grid-template-columns:repeat(2,1fr); }
  .wall-grid{ grid-template-columns:repeat(2,1fr); }
}
</style>
</head>

<!-- Owner-only "update portfolio" modal -->
<div class="modal-scrim" id="edit-modal">
  <div class="modal-box">
    <button type="button" class="modal-close" id="modal-close-btn">✕</button>
    <h2>Update Portfolio</h2>
    <form id="edit-form">
      <div class="field">
        <label>Photos</label>
        <div class="media-edit-row">
          <div class="media-edit-col">
            <span class="avatar" id="edit-avatar-preview" style="background:#F1631B;"></span>
            <button type="button" class="upload-hint-btn" id="pick-avatar-btn">Change avatar</button>
            <input type="file" accept="image/*" id="avatar-file-input" hidden>
          </div>
          <div class="media-edit-col">
            <div class="cover-preview-box" id="edit-cover-preview-box"><div class="skeleton" style="width:100%;height:100%;"></div></div>
            <button type="button" class="upload-hint-btn" id="pick-cover-btn">Change cover image</button>
            <input type="file" accept="image/*" id="cover-file-input" hidden>
          </div>
        </div>
      </div>

      <div class="field">
        <label>Creative Identity <span style="font-weight:400;color:var(--ink-faint);">(pick any that fit)</span></label>
        <div class="identity-grid" id="identity-grid"></div>
      </div>

      <div class="field">
        <label for="f-about">About <span class="count" id="about-count">0/100 words</span></label>
        <textarea class="textarea" id="f-about" placeholder="A few lines about you and what you write…"></textarea>
      </div>

      <div class="field">
        <label>Social Links</label>
        <div id="social-edit-list"></div>
        <button type="button" class="add-social-btn" id="add-social-btn">+ Add a link</button>
      </div>

      <p class="error-msg" id="form-error" hidden></p>
      <div class="modal-actions">
        <button type="button" class="btn btn-secondary" id="modal-cancel-btn">Cancel</button>
        <button type="submit" class="btn btn-primary" id="save-btn">Save Changes</button>
      </div>
    </form>
  </div>
</div>

<!-- Followers list modal -->
<div class="modal-scrim" id="followers-modal">
  <div class="modal-box followers-box">
    <button type="button" class="modal-close" id="followers-close-btn">✕</button>
    <h2>Followers</h2>
    <input type="search" id="followers-search" class="input followers-search" placeholder="Search by name or @username">
    <div id="followers-list" class="followers-list"><div class="empty-state"><p>Loading…</p></div></div>
  </div>
</div>

<!-- Manual crop modal (shared for avatar + cover) -->
<div class="modal-scrim" id="crop-modal">
  <div class="modal-box cropper-box">
    <h2 id="crop-title">Position your photo</h2>
    <div class="crop-frame" id="crop-frame"><img id="crop-img" alt=""></div>
    <div class="crop-controls">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="10" cy="10" r="6"/><path d="M15 15l5 5" stroke-linecap="round"/></svg>
      <input type="range" id="crop-zoom" min="1" max="3" step="0.01" value="1">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="11" cy="11" r="8"/><path d="M8 11h6M11 8v6" stroke-linecap="round"/></svg>
    </div>
    <p class="hint">Drag to reposition, use the slider to zoom.</p>
    <div class="modal-actions">
      <button type="button" class="btn btn-secondary" id="crop-cancel-btn">Cancel</button>
      <button type="button" class="btn btn-primary" id="crop-apply-btn">Apply</button>
    </div>
  </div>
</div>

/* ------------------------------------------------------------------
   Header colour blend: samples the cover image's average colour and
   tints the (otherwise untouched) navbar background to match. The
   logo <img> itself is never filtered — only the bar's own
   background-color changes.
   ------------------------------------------------------------------ */
function tintHeaderFromImage(imgEl){
  try{
    const c = document.createElement('canvas');
    c.width = 24; c.height = 24;
    const ctx = c.getContext('2d');
    ctx.drawImage(imgEl, 0, 0, 24, 24);
    const data = ctx.getImageData(0, 0, 24, 24).data;
    let r=0,g=0,b=0,n=0;
    for (let i=0;i<data.length;i+=4){ r+=data[i]; g+=data[i+1]; b+=data[i+2]; n++; }
    r = Math.round(r/n); g = Math.round(g/n); b = Math.round(b/n);

    // Header tint: a LIGHTER shade of the cover colour, blended mostly
    // toward the cream base + a touch of white, so it reads as "the
    // same hue, just paler" rather than a saturated bar. The logo
    // itself is never touched — only this bar's background-color.
    const blend = function(c1, c2, amt){ return Math.round(c1*amt + c2*(1-amt)); };
    let tr = blend(r, 251, .22), tg = blend(g, 245, .22), tb = blend(b, 234, .22);
    tr = blend(255, tr, .18); tg = blend(255, tg, .18); tb = blend(255, tb, .18);
    document.documentElement.style.setProperty('--header-tint', tr + ',' + tg + ',' + tb);

    // Cover overlay text: switch between white and ink based on the
    // cover's actual luminance, so text is always legible against it.
    const lin = function(v){ v/=255; return v<=0.03928 ? v/12.92 : Math.pow((v+0.055)/1.055,2.4); };
    const luminance = 0.2126*lin(r) + 0.7152*lin(g) + 0.0722*lin(b);
    if (luminance > 0.62){
      document.documentElement.style.setProperty('--cover-fg', '#2B241C');
      document.documentElement.style.setProperty('--cover-fg-shadow', '0 1px 10px rgba(255,255,255,.55)');
    } else {
      document.documentElement.style.setProperty('--cover-fg', '#FFFFFF');
      document.documentElement.style.setProperty('--cover-fg-shadow', '0 1px 8px rgba(0,0,0,.4)');
    }
  }catch(e){ /* canvas read can fail on cross-origin images — fall back to defaults */ }
}

/* ------------------------------------------------------------------
   Manual cropper (shared for avatar 1:1 and cover 3:1)
   ------------------------------------------------------------------ */
let cropState = null;
function openCropper(file, aspect, outW, outH, maxBytes, title, onDone){
  const modal = document.getElementById('crop-modal');
  const frame = document.getElementById('crop-frame');
  const img = document.getElementById('crop-img');
  const zoom = document.getElementById('crop-zoom');
  document.getElementById('crop-title').textContent = title;

  const frameW = aspect >= 1 ? 300 : Math.round(300 * aspect);
  const frameH = Math.round(frameW / aspect);
  frame.style.width = frameW + 'px';
  frame.style.height = frameH + 'px';

  const url = URL.createObjectURL(file);
  img.src = url;
  img.onload = function(){
    const baseScale = Math.max(frameW / img.naturalWidth, frameH / img.naturalHeight);
    cropState = { frameW:frameW, frameH:frameH, baseScale:baseScale, scale:1, natW:img.naturalWidth, natH:img.naturalHeight, tx:0, ty:0, dragging:false, lastX:0, lastY:0 };
    zoom.value = 1;
    centreImage();
    applyImageTransform();
  };

  function centreImage(){
    const w = cropState.natW * cropState.baseScale * cropState.scale;
    const h = cropState.natH * cropState.baseScale * cropState.scale;
    cropState.tx = (frameW - w) / 2;
    cropState.ty = (frameH - h) / 2;
  }
  function clamp(){
    const w = cropState.natW * cropState.baseScale * cropState.scale;
    const h = cropState.natH * cropState.baseScale * cropState.scale;
    cropState.tx = Math.min(0, Math.max(frameW - w, cropState.tx));
    cropState.ty = Math.min(0, Math.max(frameH - h, cropState.ty));
  }
  function applyImageTransform(){
    const w = cropState.natW * cropState.baseScale * cropState.scale;
    const h = cropState.natH * cropState.baseScale * cropState.scale;
    img.style.width = w + 'px';
    img.style.height = h + 'px';
    img.style.transform = 'translate(' + cropState.tx + 'px,' + cropState.ty + 'px)';
  }

  function pointerDown(e){
    cropState.dragging = true;
    const p = e.touches ? e.touches[0] : e;
    cropState.lastX = p.clientX; cropState.lastY = p.clientY;
  }
  function pointerMove(e){
    if (!cropState || !cropState.dragging) return;
    const p = e.touches ? e.touches[0] : e;
    cropState.tx += p.clientX - cropState.lastX;
    cropState.ty += p.clientY - cropState.lastY;
    cropState.lastX = p.clientX; cropState.lastY = p.clientY;
    clamp(); applyImageTransform();
  }
  function pointerUp(){ if (cropState) cropState.dragging = false; }

  frame.onmousedown = pointerDown;
  window.onmousemove = pointerMove;
  window.onmouseup = pointerUp;
  frame.ontouchstart = pointerDown;
  frame.ontouchmove = function(e){ pointerMove(e); e.preventDefault(); };
  frame.ontouchend = pointerUp;

  zoom.oninput = function(){
    const before = cropState.scale;
    cropState.scale = parseFloat(zoom.value);
    // keep the crop centred on the frame while zooming
    const cx = frameW/2, cy = frameH/2;
    const ratio = cropState.scale / before;
    cropState.tx = cx - (cx - cropState.tx) * ratio;
    cropState.ty = cy - (cy - cropState.ty) * ratio;
    clamp(); applyImageTransform();
  };

  document.getElementById('crop-cancel-btn').onclick = function(){ modal.classList.remove('open'); URL.revokeObjectURL(url); };
  document.getElementById('crop-apply-btn').onclick = async function(){
    const applyBtn = document.getElementById('crop-apply-btn');
    applyBtn.disabled = true;
    const totalScale = cropState.baseScale * cropState.scale;
    const sx = -cropState.tx / totalScale;
    const sy = -cropState.ty / totalScale;
    const sw = frameW / totalScale;
    const sh = frameH / totalScale;
    const source = new Image();
    source.onload = async function(){
      // Exactly the crop the user positioned — resized/compressed
      // silently in the background to fit the size budget, quality
      // reduced only as a last resort (dimensions shrink first, which
      // preserves visible quality far better than crushing JPEG quality).
      const blob = await renderCropToBudget(source, sx, sy, sw, sh, outW, outH, maxBytes);
      modal.classList.remove('open');
      applyBtn.disabled = false;
      URL.revokeObjectURL(url);
      onDone(blob);
    };
    source.src = url;
  };

  modal.classList.add('open');
}

/* Renders the chosen crop at up to outW×outH and nudges quality/size
   downward only as needed to land under maxBytes — dimensions are
   reduced in small steps before quality ever drops much, so the
   result stays visually sharp rather than blocky. */
function renderCropToBudget(source, sx, sy, sw, sh, outW, outH, maxBytes){
  return new Promise(function(resolve){
    const canvas = document.createElement('canvas');
    const ctx = canvas.getContext('2d');
    let w = outW, h = outH, quality = 0.95;
    let blob = null;

    function attempt(){
      canvas.width = w; canvas.height = h;
      ctx.clearRect(0, 0, w, h);
      ctx.drawImage(source, sx, sy, sw, sh, 0, 0, w, h);
      canvas.toBlob(function(b){
        blob = b;
        if (blob.size <= maxBytes || (quality <= 0.72 && w <= outW * 0.5)){
          resolve(blob);
          return;
        }
        if (quality > 0.72){
          quality -= 0.06;
        } else {
          w = Math.round(w * 0.9);
          h = Math.round(h * 0.9);
          quality = 0.9;
        }
        attempt();
      }, 'image/jpeg', quality);
    }
    attempt();
  });
}

function switchTab(tab, shouldScroll){
  state.activeTab = tab;
  Array.prototype.forEach.call(document.querySelectorAll('#tab-row button[data-tab]'), function(b){ b.classList.toggle('is-active', b.getAttribute('data-tab') === tab); });
  document.getElementById('works-panel').hidden = tab !== 'works';
  document.getElementById('about-panel').hidden = tab !== 'about';
  document.getElementById('wall-panel').hidden = tab !== 'wall';
  document.getElementById('social-panel').hidden = tab !== 'social';
  if (shouldScroll){
    // A small nudge downward on tab switch, not a full jump — settle
    // just past the action bar so the newly-shown panel is in view.
    const bar = document.querySelector('.action-bar');
    if (bar){
      const top = bar.getBoundingClientRect().top + window.scrollY - 12;
      window.scrollTo({ top: Math.max(0, top), behavior:'smooth' });
    }
  }
}

async function toggleFollow(profile){
  if (!state.currentUser){ window.location.href = 'index.html'; return; }
  const btn = document.getElementById('follow-btn');
  btn.disabled = true;
  if (state.isFollowing){
    const { error } = await supabaseClient.from('follows').delete().eq('follower_id', state.currentUser.id).eq('following_id', profile.id);
    if (!error){ state.isFollowing = false; btn.textContent = 'Follow'; btn.classList.remove('is-following'); updateFollowerCount(-1); }
  } else {
    const { error } = await supabaseClient.from('follows').insert({ follower_id: state.currentUser.id, following_id: profile.id });
    if (!error){ state.isFollowing = true; btn.textContent = 'Following'; btn.classList.add('is-following'); updateFollowerCount(1); }
  }
  btn.disabled = false;
}
function updateFollowerCount(delta){
  const el = document.getElementById('stat-followers');
  el.textContent = Math.max(0, parseInt(el.textContent, 10) + delta);
}

async function openFollowersModal(profile){
  const modal = document.getElementById('followers-modal');
  const list = document.getElementById('followers-list');
  const searchInput = document.getElementById('followers-search');
  searchInput.value = '';
  list.innerHTML = '<div class="empty-state"><p>Loading…</p></div>';
  modal.classList.add('open');

  const { data: rows, error } = await supabaseClient
    .from('follows')
    .select('follower_id, profiles!follows_follower_id_fkey(id, username, display_name, avatar_url, avatar_color)')
    .eq('following_id', profile.id);

  if (error || !rows || !rows.length){
    list.innerHTML = '<div class="empty-state"><p>No followers yet.</p></div>';
    return;
  }
  const followers = rows.map(function(r){ return r.profiles; }).filter(Boolean);

  let myFollowingIds = [];
  if (state.currentUser){
    const { data: mine } = await supabaseClient.from('follows').select('following_id').eq('follower_id', state.currentUser.id).in('following_id', followers.map(function(f){ return f.id; }));
    myFollowingIds = (mine || []).map(function(r){ return r.following_id; });
  }

  function renderList(items){
    if (!items.length){
      list.innerHTML = '<div class="empty-state"><p>No one matches that search.</p></div>';
      return;
    }
    list.innerHTML = items.map(function(f){ return followerRowHTML(f, myFollowingIds.indexOf(f.id) !== -1); }).join('');
    wireFollowerButtons();
  }

  function wireFollowerButtons(){
    Array.prototype.forEach.call(list.querySelectorAll('.follower-follow-btn'), function(btn){
      btn.addEventListener('click', async function(){
        if (!state.currentUser){ window.location.href = 'index.html'; return; }
        const targetId = btn.getAttribute('data-target');
        const nowFollowing = btn.classList.contains('is-following');
        btn.disabled = true;
        if (nowFollowing){
          const { error: delErr } = await supabaseClient.from('follows').delete().eq('follower_id', state.currentUser.id).eq('following_id', targetId);
          if (!delErr){
            btn.classList.remove('is-following'); btn.textContent = 'Follow';
            myFollowingIds = myFollowingIds.filter(function(id){ return id !== targetId; });
            if (targetId === profile.id) updateFollowerCount(-1);
          }
        } else {
          const { error: insErr } = await supabaseClient.from('follows').insert({ follower_id: state.currentUser.id, following_id: targetId });
          if (!insErr){
            btn.classList.add('is-following'); btn.textContent = 'Following';
            myFollowingIds.push(targetId);
            if (targetId === profile.id) updateFollowerCount(1);
          }
        }
        btn.disabled = false;
      });
    });
  }

  renderList(followers);

  searchInput.oninput = function(){
    const q = searchInput.value.trim().toLowerCase();
    if (!q){ renderList(followers); return; }
    renderList(followers.filter(function(f){
      return (f.username || '').toLowerCase().indexOf(q) !== -1 || (f.display_name || '').toLowerCase().indexOf(q) !== -1;
    }));
  };
}

async function saveProfileEdits(profile){
  const formError = document.getElementById('form-error');
  formError.hidden = true;
  const saveBtn = document.getElementById('save-btn');

  const about = document.getElementById('f-about').value.trim();
  if (wordCount(about) > 100){ formError.textContent = 'About needs to be 100 words or fewer.'; formError.hidden = false; return; }

  const identities = Array.prototype.map.call(document.querySelectorAll('#identity-grid .identity-btn.is-active'), function(b){ return b.getAttribute('data-identity'); });
  if (!identities.length){ formError.textContent = 'Pick at least one creative identity.'; formError.hidden = false; return; }

  const socialLinks = Array.prototype.map.call(document.querySelectorAll('#social-edit-list .social-edit-row'), function(row){
    return { platform: row.querySelector('select').value, url: row.querySelector('input').value.trim() };
  }).filter(function(l){ return l.url; });

  saveBtn.disabled = true;
  saveBtn.innerHTML = '<span class="spinner"></span> Saving…';

  try{
    const updates = { creative_identities: identities, bio: about || null, social_links: socialLinks, updated_at: new Date().toISOString() };

    if (state.pendingAvatarBlob){
      const path = profile.id + '/avatar.jpg';
      const { error: upErr } = await supabaseClient.storage.from('profile-media').upload(path, state.pendingAvatarBlob, { upsert: true, contentType: 'image/jpeg' });
      if (upErr) throw upErr;
      const { data: pub } = supabaseClient.storage.from('profile-media').getPublicUrl(path);
      updates.avatar_url = pub.publicUrl + '?v=' + Date.now();
    }
    if (state.pendingCoverBlob){
      const path = profile.id + '/cover.jpg';
      const { error: upErr } = await supabaseClient.storage.from('profile-media').upload(path, state.pendingCoverBlob, { upsert: true, contentType: 'image/jpeg' });
      if (upErr) throw upErr;
      const { data: pub } = supabaseClient.storage.from('profile-media').getPublicUrl(path);
      updates.cover_image_url = pub.publicUrl + '?v=' + Date.now();
    }

    const { error } = await supabaseClient.from('profiles').update(updates).eq('id', profile.id);
    if (error) throw error;

    showToast('Portfolio updated');
    closeEditModal();
    window.location.reload();
  } catch(err){
    formError.textContent = 'Couldn\'t save your changes. Please try again.';
    formError.hidden = false;
  } finally {
    saveBtn.disabled = false;
    saveBtn.textContent = 'Save Changes';
  }
}

   Init

async function init(){
  try{ await initPortfolio(); } finally {
    const loader = document.getElementById('page-loader');
    if (loader) loader.classList.add('is-hidden');
  }
}

async function initPortfolio(){
  state.currentUser = await loadCurrentUser();
  wireHeader();

  const params = new URLSearchParams(window.location.search);
  let username = params.get('u');
  if (!username){
    const path = window.location.pathname.replace(/^\/+|\/+$/g, '');
    const segs = path.split('/').filter(Boolean);
    const last = segs[segs.length - 1];
    if (last && last.toLowerCase() !== 'portfolio.html') username = last.replace(/^@/, '');
  }
  if (!username){
    if (state.currentUser){
      username = state.currentUser.username;
      const url = new URL(window.location.href);
      url.searchParams.set('u', username);
      window.history.replaceState(null, '', url.toString());
    } else {
      document.getElementById('app').innerHTML = notFoundHTML();
      return;
    }
  }

  if (!supabaseClient){
    document.getElementById('app').innerHTML = '<div class="empty-state" style="padding:120px 20px;"><p>Couldn\'t connect right now. Please try again shortly.</p></div>';
    return;
  }

  const { data: profile, error } = await supabaseClient
    .from('profiles')
    .select('id,username,display_name,bio,avatar_color,avatar_url,cover_image_url,creative_identities,social_links,created_at')
    .eq('username', username)
    .maybeSingle();

  if (error || !profile){
    document.getElementById('app').innerHTML = notFoundHTML();
    return;
  }
  state.profile = profile;
  state.isOwner = !!(state.currentUser && state.currentUser.id === profile.id);

  const [{ data: rows }, { count: followerCount }, followingRow] = await Promise.all([
    supabaseClient.from('journals').select('id,title,excerpt,category_id,visibility,published_at,like_count,comment_count,read_count').eq('author_id', profile.id).eq('status', 'published').order('published_at', { ascending:false }),
    supabaseClient.from('follows').select('follower_id', { count:'exact', head:true }).eq('following_id', profile.id),
    state.currentUser && !state.isOwner
      ? supabaseClient.from('follows').select('follower_id').eq('follower_id', state.currentUser.id).eq('following_id', profile.id).maybeSingle()
      : Promise.resolve({ data:null })
  ]);

  state.works = (rows || []).filter(function(w){ return state.isOwner || w.visibility === 'public'; });
  state.isFollowing = !!(followingRow && followingRow.data);

  const { data: wallRows } = await supabaseClient
    .from('wall_posts')
    .select('id,body,category_id,likes,published_at')
    .eq('author_id', profile.id)
    .eq('status', 'published')
    .order('published_at', { ascending:false });
  state.wallPosts = wallRows || [];

  const app = document.getElementById('app');
  app.innerHTML = coverHeroHTML(profile, state.isOwner, state.isFollowing) + '<div class="container">' + actionBarHTML() + '</div>';

  // Impressions = total likes across the writer's works (as defined by the user).
  const impressions = state.works.reduce(function(sum, w){ return sum + (w.like_count || 0); }, 0);
  document.getElementById('stat-works').textContent = state.works.length;
  document.getElementById('stat-impressions').textContent = impressions;
  document.getElementById('stat-followers').textContent = followerCount || 0;

  const coverImgEl = document.getElementById('cover-img-el');
  if (coverImgEl){
    if (coverImgEl.complete) tintHeaderFromImage(coverImgEl);
    else coverImgEl.addEventListener('load', function(){ tintHeaderFromImage(coverImgEl); });
  }

  renderWorksGrid(state.isOwner);
  renderAboutPanel(profile);
  renderWallPanel(state.isOwner);
  renderSocialPanel(profile);
  switchTab('works');

  Array.prototype.forEach.call(document.querySelectorAll('#tab-row button[data-tab]'), function(btn){
    btn.addEventListener('click', function(){ switchTab(btn.getAttribute('data-tab'), true); });
  });

  const realUrl = computePortfolioUrl(profile.username);
  const displayUrl = realUrl.replace(/^https?:\/\//, '');
  const shareBtn = document.getElementById('share-btn');
  shareBtn.title = displayUrl;
  shareBtn.addEventListener('click', async function(){
    if (navigator.share){
      try{
        await navigator.share({ title: (profile.display_name || profile.username) + ' on Aspinora Writing', url: realUrl });
        return;
      }catch(e){ /* user cancelled the share sheet — fall through to copy */ if (e && e.name === 'AbortError') return; }
    }
    if (navigator.clipboard) navigator.clipboard.writeText(realUrl);
    showToast('Portfolio link copied');
  });

  const followBtn = document.getElementById('follow-btn');
  if (followBtn) followBtn.addEventListener('click', function(){ toggleFollow(profile); });

  document.getElementById('stat-works-btn').addEventListener('click', function(){ switchTab('works', true); });
  document.getElementById('stat-followers-btn').addEventListener('click', function(){ openFollowersModal(profile); });
  document.getElementById('followers-close-btn').addEventListener('click', function(){ document.getElementById('followers-modal').classList.remove('open'); });
  document.getElementById('followers-modal').addEventListener('click', function(e){ if (e.target.id === 'followers-modal') e.target.classList.remove('open'); });

  if (state.isOwner){
    document.getElementById('cover-edit-fab').addEventListener('click', function(){ openEditModal(profile); });
    document.getElementById('modal-close-btn').addEventListener('click', closeEditModal);
    document.getElementById('modal-cancel-btn').addEventListener('click', closeEditModal);
    document.getElementById('edit-modal').addEventListener('click', function(e){ if (e.target.id === 'edit-modal') closeEditModal(); });
    document.getElementById('add-social-btn').addEventListener('click', function(){ addSocialRow(); });

    document.getElementById('pick-avatar-btn').addEventListener('click', function(){ document.getElementById('avatar-file-input').click(); });
    document.getElementById('avatar-file-input').addEventListener('change', function(e){
      const file = e.target.files[0]; if (!file) return;
      openCropper(file, 1, 480, 480, 20 * 1024, 'Position your avatar', function(blob){
        state.pendingAvatarBlob = blob;
        document.getElementById('edit-avatar-preview').innerHTML = '<img src="' + URL.createObjectURL(blob) + '" alt="">';
      });
      e.target.value = '';
    });
    document.getElementById('pick-cover-btn').addEventListener('click', function(){ document.getElementById('cover-file-input').click(); });
    document.getElementById('cover-file-input').addEventListener('change', function(e){
      const file = e.target.files[0]; if (!file) return;
      openCropper(file, 3, 1500, 500, 60 * 1024, 'Position your cover image', function(blob){
        state.pendingCoverBlob = blob;
        document.getElementById('edit-cover-preview-box').innerHTML = '<img src="' + URL.createObjectURL(blob) + '" alt="">';
      });
      e.target.value = '';
    });

    document.getElementById('edit-form').addEventListener('submit', function(e){ e.preventDefault(); saveProfileEdits(profile); });
  }
}

init();
</script>
</body>
</html>

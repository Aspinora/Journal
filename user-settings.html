<!DOCTYPE html>
<html lang="en" data-th="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Settings · Journals</title>
<link rel="icon" type="image/png" href="/favicon.png">
<link rel="apple-touch-icon" href="/favicon.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Abril+Fatface&family=Figtree:wght@400;500;600;700&family=Jost:wght@300;400&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&display=swap">
<style>
:root{--bg:#FBFAF8;--s1:#fff;--s2:#F2F0EC;--ink:#232323;--mut:#66635D;--ln:#E3E0DA;--ac:#FF7F00;--ok:#2B7A4B;--dg:#B3261E;--rp:14px;--rv:56px;--uf:Figtree,system-ui,sans-serif}
[data-th=dark]{--bg:#141417;--s1:#1C1C20;--s2:#27272C;--ink:#ECE8E1;--mut:#A5A19A;--ln:#34343B;--ok:#6CCB91;--dg:#FF8F86}
[data-hc=on]{--ln:var(--ink);--mut:var(--ink)}
[data-den=c]{--rv:44px;--rp:10px}
*{box-sizing:border-box;margin:0}
html{font-size:16px;-webkit-text-size-adjust:100%}[data-lg=on]{font-size:18px}
html,body{height:100%}
body{font-family:var(--uf);background:var(--bg);color:var(--ink);line-height:1.45;padding-bottom:env(safe-area-inset-bottom,0);overflow-x:hidden}
button,input{font:inherit;color:inherit}button{cursor:pointer;background:none;border:0;text-align:left}
:focus-visible{outline:2px solid var(--ac);outline-offset:2px}[data-kbd=on] :focus{outline:2px solid var(--ac);outline-offset:2px}
[data-rm=on] *{transition:none!important;animation:none!important}
.logo{display:inline-flex;align-items:flex-start;line-height:1;font-family:'Abril Fatface',Georgia,serif;font-size:var(--ls,30px);user-select:none}
.logo .J{font-size:1.9em;color:#FF7F00;line-height:.8;margin-right:-.03em}
.logo .rt{display:flex;flex-direction:column;margin-top:.55em}.logo .o{color:var(--ink);font-size:1em}
.logo .tg{font:300 .2em/1 Jost,sans-serif;letter-spacing:.34em;color:var(--ink);margin-top:.3em;white-space:nowrap}
.lg{display:block;height:auto}.lgd,[data-th=dark] .lgl{display:none}[data-th=dark] .lgd{display:block}.slogo{margin:4px 6px 14px}.bkj{display:block;padding:9px 12px;border-radius:10px;min-height:40px;color:var(--mut);text-decoration:none;margin-bottom:12px;border-bottom:1px solid var(--ln)}.bkj:hover{background:var(--s2);color:var(--ink)}
.app{display:grid;grid-template-columns:minmax(0,1fr);min-height:100%}
.side{display:none}
.main{min-width:0}
.top{position:sticky;top:0;z-index:5;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(10px);padding:calc(env(safe-area-inset-top,0) + 8px) 12px 8px;display:flex;align-items:center;gap:8px;border-bottom:1px solid var(--ln);min-height:56px}
.top h2{font-size:1.05rem;font-weight:600;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ib2{min-width:44px;height:44px;border-radius:22px;display:grid;place-items:center;font-size:1.2rem}.ib2:hover{background:var(--s2)}
.sf{display:none;flex:1;position:relative}.sf input{width:100%;height:44px;border-radius:22px;border:1px solid var(--ln);background:var(--s1);padding:0 40px 0 16px}
.sf .x{position:absolute;right:4px;top:0;height:44px;width:40px;text-align:center}
.top.so .sf{display:block}.top.so h2,.top.so .sbtn{display:none}
#sv{font-size:.8rem;color:var(--ok);opacity:0;transition:opacity .3s;white-space:nowrap}#sv.on{opacity:1}
.wrap{max-width:700px;margin:0 auto;padding:20px 16px 80px}
.view{animation:in .28s ease}@keyframes in{from{opacity:0;transform:translateX(14px)}}[data-tr=off] .view{animation:none}
h1{font:400 2.1rem/1.1 'Abril Fatface',Georgia,serif;letter-spacing:.005em}
.sub{color:var(--mut);margin:6px 0 22px}
h3{font-size:.95rem;font-weight:600;margin:28px 0 4px}.gn{color:var(--mut);font-size:.88rem;margin-bottom:8px}
.grp{background:var(--s1);border-block:1px solid var(--ln);margin:8px -16px}
.row{display:flex;align-items:center;gap:14px;padding:10px 16px;min-height:var(--rv);width:100%;border-bottom:1px solid var(--ln);position:relative}
.row:last-child{border-bottom:0}
.row.col{flex-direction:column;align-items:stretch;gap:10px;padding:12px 16px}
.tx{flex:1;min-width:0}.tx b{display:block;font-weight:500}.tx small{display:block;color:var(--mut);font-size:.86rem}
.val{color:var(--mut);font-size:.92rem;text-align:right}
a.row,button.row:hover{background:color-mix(in srgb,var(--ink) 4%,transparent)}
.flash{animation:fl 1.6s}@keyframes fl{0%,60%{background:color-mix(in srgb,var(--ac) 20%,transparent)}}
.sw{width:52px;height:32px;border-radius:16px;background:var(--s2);border:1px solid var(--ln);position:relative;flex:none;transition:background .2s}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;box-shadow:0 1px 3px #0004;transition:transform .2s}
.sw[aria-checked=true]{background:var(--ac);border-color:var(--ac)}.sw[aria-checked=true]::after{transform:translateX(20px)}
.sw[aria-disabled=true]{opacity:.55;cursor:not-allowed}
.seg{display:flex;background:var(--s2);border-radius:12px;padding:3px;gap:2px}
.seg button{flex:1;text-align:center;padding:10px 6px;border-radius:9px;font-size:.92rem;min-height:44px}
.seg button[aria-checked=true]{background:var(--s1);box-shadow:0 1px 3px #0003;font-weight:600}
[data-th=dark] .seg button[aria-checked=true]{background:var(--ac);color:#1a1000}
.chips{display:flex;flex-wrap:wrap;gap:8px}.chip{padding:9px 14px;border:1px solid var(--ln);border-radius:20px;min-height:40px;font-size:.92rem}
.chip[aria-pressed=true]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.sw2{width:36px;height:36px;border-radius:50%;border:2px solid var(--ln)}.sw2[aria-pressed=true]{outline:2px solid var(--ink);outline-offset:2px}
input[type=range]{width:100%;accent-color:var(--ac);height:32px}
.badge{font-size:.72rem;border:1px solid var(--ln);border-radius:10px;padding:2px 8px;color:var(--mut)}
.mx{display:flex;gap:10px;flex-wrap:wrap}.mx div{display:flex;align-items:center;gap:8px;font-size:.84rem;color:var(--mut);margin-right:10px}
.off{opacity:.45;pointer-events:none}
.btn{padding:11px 18px;border-radius:12px;border:1px solid var(--ln);font-weight:500;min-height:44px;text-align:center}
.btn.p{background:var(--ink);color:var(--bg);border-color:var(--ink)}.btn.d{background:var(--dg);color:#fff;border-color:var(--dg)}.btn:disabled{opacity:.4}
.dg{color:var(--dg)}
.card{border:1px solid var(--ln);border-radius:var(--rp);background:var(--s1);padding:16px;margin:12px 0}
.me{display:flex;align-items:center;gap:14px}.av{width:56px;height:56px;border-radius:50%;background:color-mix(in srgb,var(--ac) 25%,var(--s2));display:grid;place-items:center;font:1.5rem 'Abril Fatface',serif;flex:none}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--ok);margin-right:6px}
.sum{display:grid;grid-template-columns:1fr 1fr;gap:0;border-top:1px solid var(--ln);margin-top:6px}
.sum button{padding:14px 4px;border-bottom:1px solid var(--ln)}.sum button:nth-child(odd){padding-right:12px}.sum button:nth-child(even){padding-left:12px;border-left:1px solid var(--ln)}
.sum small{color:var(--mut);display:block;font-size:.82rem}.sum b{font-weight:600}
.alert{border-left:3px solid var(--ac);padding:12px 14px;background:color-mix(in srgb,var(--ac) 10%,var(--s1));border-radius:0 var(--rp) var(--rp) 0;margin:14px 0;display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.bar{display:flex;gap:4px;margin:10px 0}.bar i{flex:1;height:6px;border-radius:3px;background:var(--s2)}.bar i.on{background:var(--ok)}
mark{background:color-mix(in srgb,var(--ac) 35%,transparent);color:inherit;border-radius:3px;padding:0 1px}
.nt{padding:0 16px 12px;color:var(--mut);font-size:.86rem}.ibn{width:32px;height:32px;color:var(--mut);flex:none}
.note{font-size:.86rem;color:var(--mut);padding:10px 14px;background:var(--s2);border-radius:10px;margin:10px 0}
.pv{border-radius:var(--rp);padding:20px;margin:12px 0;border:1px solid var(--ln)}
.mnav .row{font-weight:500}
.ft{margin-top:36px;font-size:.8rem;color:var(--mut);display:flex;gap:10px;align-items:center;flex-wrap:wrap}.ft button{text-decoration:underline;padding:10px 0;min-height:44px}
#ov{position:fixed;inset:0;background:#0007;z-index:20;display:none;align-items:flex-end;justify-content:center}
#ov.on{display:flex}
.dlg{background:var(--s1);width:100%;max-height:86vh;overflow:auto;border-radius:20px 20px 0 0;padding:20px 20px calc(20px + env(safe-area-inset-bottom,0));animation:up .25s ease}@keyframes up{from{transform:translateY(40px);opacity:0}}
.dlg h4{font:400 1.4rem 'Abril Fatface',serif;margin-bottom:8px}.dlg p{color:var(--mut);margin-bottom:14px}
.dlg .acts{display:flex;gap:10px;justify-content:flex-end;margin-top:16px;flex-wrap:wrap}.dlg .acts .btn{flex:1}
.dlg input[type=text],.dlg input[type=password],.dlg input[type=email]{width:100%;height:48px;border:1px solid var(--ln);background:var(--bg);border-radius:12px;padding:0 14px;margin-bottom:10px}
.opt{display:flex;justify-content:space-between;align-items:center;width:100%;min-height:52px;padding:8px 4px;border-bottom:1px solid var(--ln)}
@media(min-width:700px){.grp{margin:8px 0;border:1px solid var(--ln);border-radius:var(--rp)}.wrap{padding:28px 28px 80px}
#ov{align-items:center}.dlg{max-width:440px;border-radius:18px}h1{font-size:2.5rem}}
@media(min-width:900px){.app{grid-template-columns:272px minmax(0,1fr)}
.side{display:block;position:sticky;top:0;height:100vh;overflow:auto;padding:24px 14px;border-right:1px solid var(--ln)}
.side .logo{margin:4px 10px 26px}.side button{display:block;width:100%;padding:9px 12px;border-radius:10px;min-height:40px;color:var(--mut)}
.side button:hover{background:var(--s2)}.side button[aria-current=page]{background:var(--s2);color:var(--ink);font-weight:600;box-shadow:inset 3px 0 var(--ac)}
.sf{display:block;max-width:420px}.sbtn,.bk,.top h2,.mnav,.mlogo{display:none!important}.top{padding-inline:28px}}
@media(max-width:899px){.bk{display:grid}}
@media(min-width:900px){.sum{grid-template-columns:1fr 1fr 1fr}.sum button:nth-child(n){border-left:0;padding-left:0}.sum button:nth-child(3n+2),.sum button:nth-child(3n){padding-left:14px;border-left:1px solid var(--ln)}}
@media(min-width:1500px){.wrap{max-width:760px}html{font-size:17px}}
</style>
</head>

function peopleList(k,t){const L=()=>st[k].map(u=>`<div class="opt"><span>${u}</span><button class="btn" data-rm="${u}">Remove</button></div>`).join('')||'<p>Nobody here.</p>';dlg(`<h4>${t}</h4><div id="pl">${L()}</div><div class="acts"><button class="btn p" data-x>Done</button></div>`);
$('#pl').onclick=e=>{const u=e.target.dataset.rm;if(u){st[k]=st[k].filter(x=>x!==u);save();saved();$('#pl').innerHTML=L();render()}}}
const ACT={
email(){dlg(`<h4>Change email</h4><p>We would send a confirmation code. Demo only.</p><input type="email" id="em" aria-label="New email" value="${esc(st.email)}"><div class="acts"><button class="btn" data-x>Cancel</button><button class="btn p" id="sv2">Save</button></div>`,'#em');$('#sv2').onclick=()=>{const v=$('#em').value.trim();if(!/^\S+@\S+\.\S+$/.test(v)){$('#em').style.borderColor='var(--dg)';return}close();set('email',v,'Email address updated')}},
pw(){dlg(`<h4>Change password</h4><input type="password" id="p1" aria-label="Current password" placeholder="Current password"><input type="password" id="p2" aria-label="New password" placeholder="New password (8+ characters)"><p id="pe" style="color:var(--dg)" aria-live="polite"></p><div class="acts"><button class="btn" data-x>Cancel</button><button class="btn p" id="sv2">Update password</button></div>`,'#p1');$('#sv2').onclick=()=>{if(!$('#p1').value||$('#p2').value.length<8){$('#pe').textContent='Enter your current password and a new one with at least 8 characters.';return}close();set('pw','just now','Password changed')}},
deact(){confirm('Deactivate your account?','Your profile and works will be hidden from everyone. Messages stay private. Sign in at any time to reactivate. This is a demo, so nothing will change.','Deactivate',()=>info('Demo only','In the live product your account would now be deactivated.'))},
del(){confirm('Delete your account permanently?','All your works, drafts, comments and messages would be removed after 30 days, and your username released. This cannot be undone. Demo only, so nothing is deleted.','Delete account',()=>info('Demo only','No account was deleted.'),1,'DELETE')},
blocked(){peopleList('blocked','Blocked accounts')},muted(){peopleList('muted','Muted accounts')},
resetrec(){confirm('Reset your recommendations?','Discover will forget what it has learned from your past activity and rebuild from what you do next. Your interests and settings stay as they are.','Reset recommendations',()=>{saved();info('Recommendations reset','Discover will start learning again from your next activity. (Demo)')})},
outall(){confirm('Log out all other devices?','Every device except this one will be signed out and will need to sign in again.','Log out others',()=>{st.sess=st.sess.filter(s=>s.cur);save();saved();render()},1)},
review(){set('rev','today','Security review completed');info('Review complete','Your security checks were reviewed. Turn on two-factor authentication to finish.')},
exp(){info('Export requested','In the live product we would email you a download link when your export is ready. Demo only, no file is created.')},
resetall(){confirm('Reset all demo settings?','This clears everything saved in this browser for the Settings demo and restores the defaults.','Reset',()=>{LS.x('jd_s');LS.x('jd_rc');st=clone(DEF);rc=[{l:'Reading font: Source Serif',a:'2 days ago'}];apply();saved();render()})}};
$('#m').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;const d=b.dataset;
if(d.go)return go(d.go,d.fk);
if(d.t){if(b.getAttribute('aria-disabled'))return;const it=itemByKey(d.t),l=(it?it.l:'Setting')+': ';const v=!st[d.t];return set(d.t,v,(it?it.l:d.t.startsWith('n_')?'Notification':'Setting')+(v?' on':' off'))}
if(d.g)return set(d.g,d.v,itemByKey(d.g).l+': '+d.v);if(d.s)return sheet(d.s);
if(d.c){const a=st[d.c],v=a.includes(d.v)?a.filter(x=>x!==d.v):[...a,d.v];return set(d.c,v,itemByKey(d.c).l+' updated')}
if(d.ac)return set('ac',d.ac,'Accent colour changed');if(d.i){const n=$('#n_'+d.i);n.hidden=!n.hidden;return}
if(d.out)return confirm('Log out this device?','It will be signed out and need to sign in again.','Log out',()=>{st.sess=st.sess.filter(s=>s.id!=d.out);save();saved();render()},1);
if(d.a){const a=d.a;if(a.startsWith('go:'))return go(a.slice(3));if(a.startsWith('link:'))return info(a.slice(5),'This opens the live Journals page. Links are not connected in the demo.');if(a.startsWith('list:')){const[,t,l]=a.split(':');return info(t,l.split('|').join('<br>'))}ACT[a]&&ACT[a]()}});
$('#m').addEventListener('input',e=>{const k=e.target.dataset.n;if(k){st[k]=+e.target.value;save();apply();$$('.val',e.target.closest('.row')).forEach(v=>v.textContent=st[k]+itemByKey(k).u);const p=$('.pv');if(p&&k==='rsize'||k==='rlh'){const t=$('#m .pv');if(t&&t.parentElement){const old=t;old.outerHTML=row({t:'rp'})}}}});
$('#m').addEventListener('change',e=>{if(e.target.dataset.n){saved();rc=rc.filter(r=>r.k!==e.target.dataset.n);rc.unshift({k:e.target.dataset.n,l:itemByKey(e.target.dataset.n).l+': '+st[e.target.dataset.n],t:Date.now()});LS.s('jd_rc',rc.slice(0,4))}});
$('#nav').addEventListener('click',e=>{const b=e.target.closest('button');b&&go(b.dataset.go)});
$('#ov').addEventListener('click',e=>{if(e.target.id==='ov'||e.target.closest('[data-x]'))close()});
addEventListener('keydown',e=>{if(e.key==='Escape'){if($('#ov').classList.contains('on'))close();else if(q){go(route())}}if(e.key==='Tab'&&$('#ov').classList.contains('on')){const f=$$('#dl button:not(:disabled),#dl input');if(!f.length)return;const i=f.indexOf(document.activeElement);if(e.shiftKey&&i<=0){e.preventDefault();f[f.length-1].focus()}else if(!e.shiftKey&&i===f.length-1){e.preventDefault();f[0].focus()}}});
$('#q').addEventListener('input',e=>{q=e.target.value;$('#qx').hidden=!q;render()});
$('#qx').onclick=()=>{go(route());$('#q').focus()};
$('#sb').onclick=()=>{$('#top').classList.add('so');$('#q').focus()};
$('#bk').onclick=()=>{if(q||$('#top').classList.contains('so'))go(route());else if(route()==='home')location.href='userpostlogin.html';else go('home')};
$('#sl').innerHTML=LOGO(200);apply();render();
</script>
</body>
</html>

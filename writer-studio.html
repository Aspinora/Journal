/* ---------- Header (home page only) ---------- */
.hdr{position:sticky;top:0;z-index:40;padding-top:env(safe-area-inset-top,0px);background:var(--panel);border-bottom:1px solid var(--line);flex:none}
.hdr__in{display:flex;align-items:center;gap:6px;height:60px;max-width:1180px;margin:0 auto;width:100%;padding:0 max(clamp(14px,3vw,28px),env(safe-area-inset-left,0px)) 0 max(clamp(14px,3vw,28px),env(safe-area-inset-right,0px))}
.hdr .brand{--logo-h:38px;margin-left:2px}
.hdr__ctx{display:none;align-items:center;gap:16px;margin-left:18px;font:600 13px var(--ui);letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.hdr__ctx::before{content:"";width:1px;height:26px;background:var(--line)}
@media (min-width:640px){.hdr__ctx{display:flex}}
.hdr__sp{flex:1;min-width:0}
.hdr__tools{display:flex;align-items:center;gap:6px;margin-left:auto}
button{font:inherit;color:inherit;cursor:pointer}
input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
[hidden]{display:none!important}
svg.i{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
#app{position:fixed;left:0;right:0;top:var(--app-top,0px);height:var(--app-h,100dvh);display:flex;flex-direction:column;overflow:hidden}
.view{flex:1;min-height:0;display:none;flex-direction:column}
.view.on{display:flex}

/* generic controls */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:36px;padding:0 14px;border-radius:var(--r);border:1px solid var(--line);background:var(--panel-2);white-space:nowrap;font-weight:500}
.btn:hover{background:var(--line-2)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.primary:hover{background:var(--accent-2)}
.btn.danger{background:var(--danger);border-color:var(--danger);color:#fff}
.btn.ghost{border-color:transparent;background:transparent}
.btn.ghost:hover{background:rgba(20,30,40,.07)}
.btn[disabled]{opacity:.45;pointer-events:none}
.btn.sm{min-height:30px;padding:0 10px;font-size:13px}
.ib{display:inline-flex;align-items:center;justify-content:center;width:36px;height:36px;border-radius:var(--r);border:0;background:transparent;color:var(--ink);flex:none;position:relative}
.ib:hover{background:rgba(20,30,40,.08)}
.ib[aria-pressed=true],.ib.on{background:var(--accent-soft);color:var(--accent-2)}
.ib[disabled]{opacity:.35;pointer-events:none}
.muted{color:var(--muted)} .faint{color:var(--faint)} .small{font-size:12.5px}
.pill{display:inline-block;padding:1px 8px;border-radius:99px;font-size:12px;background:var(--line-2);color:var(--muted);font-weight:500}
.pill.published,.pill.ongoing{background:var(--ok-soft);color:var(--ok)} .pill.draft{background:var(--line-2)} .pill.completed{background:var(--accent-soft);color:var(--accent-2)} .pill.hiatus{background:var(--warn-soft);color:var(--warn)}
.sep{width:1px;height:22px;background:var(--line);margin:0 4px;flex:none}
.spacer{flex:1}
.spin{width:16px;height:16px;border:2px solid var(--line);border-top-color:var(--accent);border-radius:50%;animation:sp .8s linear infinite;display:inline-block}
@keyframes sp{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.spin{animation-duration:2s}}

/* library */
#viewLibrary{overflow:auto}
.lib-head{display:flex;align-items:center;gap:12px;padding:20px 28px 8px;max-width:1180px;width:100%;margin:0 auto}
.lib-head h1{font:600 26px/1.2 "Source Serif 4",Georgia,serif;margin:0}
.lib-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:20px;padding:16px 28px 60px;max-width:1180px;width:100%;margin:0 auto}
.card{background:var(--panel-2);border:1px solid var(--line);border-radius:var(--r-lg);overflow:hidden;cursor:pointer;display:flex;flex-direction:column;text-align:left;padding:0}
.card:hover{border-color:var(--accent-line)}
.card .cv{aspect-ratio:3/2;background:linear-gradient(135deg,#27414A,#1D6B73 60%,#5A9BA1);display:flex;align-items:flex-end;padding:12px;color:#fff;font:600 20px/1.2 "Source Serif 4",Georgia,serif;position:relative}
.card .cv img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.card__more{position:absolute;top:6px;right:6px;background:rgba(10,14,18,.55);color:#fff;backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px)}
.card__more:hover{background:rgba(10,14,18,.78)}
.card__more[aria-expanded="true"]{background:rgba(10,14,18,.78)}
.card .bd{padding:12px 14px 14px;display:flex;flex-direction:column;gap:6px}
.card .bd b{font-weight:600}
.card.new{border-style:dashed;align-items:center;justify-content:center;min-height:220px;color:var(--accent-2);gap:8px;background:transparent}
.empty{padding:48px 24px;text-align:center;color:var(--muted);max-width:420px;margin:0 auto}

/* studio topbar */
#topbar{height:54px;display:flex;align-items:center;gap:6px;padding:0 10px;background:var(--panel);border-bottom:1px solid var(--line);flex:none}
#crumb{min-width:0;display:flex;flex-direction:column;line-height:1.2;padding:0 6px}
#crumb b{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:34vw}
#crumb span{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:34vw}
.seg{display:inline-flex;background:var(--line-2);border-radius:var(--r);padding:3px;gap:2px}
.seg button{border:0;background:transparent;border-radius:6px;padding:5px 14px;font-weight:600;font-size:13px;color:var(--muted);letter-spacing:.02em}
.seg button[aria-pressed=true]{background:var(--panel-2);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.12)}
#saveStatus{font-size:13px;color:var(--muted);display:inline-flex;align-items:center;gap:6px;white-space:nowrap;min-width:92px;justify-content:flex-end}
#saveStatus.err{color:var(--danger)} #saveStatus .dot{width:8px;height:8px;border-radius:50%;background:var(--ok)}
#saveStatus.busy .dot{background:var(--warn)} #saveStatus.err .dot{background:var(--danger)}
#workspace{flex:1;min-height:0;display:flex;position:relative}
#left{width:292px;flex:none;background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0}

#center{flex:1;min-width:0;display:flex;flex-direction:column;background:var(--bg);position:relative}
.panel-head{display:flex;align-items:center;gap:6px;padding:10px 12px;border-bottom:1px solid var(--line-2);font-weight:600}
.panel-body{flex:1;min-height:0;overflow:auto;padding:8px}

/* tree */
.t-story{display:flex;gap:10px;align-items:center;padding:8px;border-radius:var(--r);margin-bottom:4px}
.t-story .th{width:54px;aspect-ratio:3/2;border-radius:6px;background:linear-gradient(135deg,#27414A,#5A9BA1);overflow:hidden;flex:none}
.t-story .th img{width:100%;height:100%;object-fit:cover;display:block}
.t-story b{display:block;font-weight:600;line-height:1.25}
.t-row{display:flex;align-items:center;gap:2px;min-height:38px;border-radius:var(--r);padding:0 2px 0 4px;cursor:pointer;user-select:none}
.t-row:hover{background:rgba(20,30,40,.06)}
.t-row.active{background:var(--accent-soft);color:var(--accent-2)}
.t-row .lbl{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.t-row .lbl small{color:var(--muted);margin-left:6px}
.t-row.vol{font-weight:600}
.t-row .chev{width:26px;height:26px;display:inline-flex;align-items:center;justify-content:center;flex:none;transition:none}
.t-row .chev svg{width:16px;height:16px}
.t-row .sdot{width:7px;height:7px;border-radius:50%;background:var(--line);margin:0 6px;flex:none}
.t-row .sdot.published{background:var(--ok)}
.t-kids{margin-left:14px;border-left:1px solid var(--line-2);padding-left:4px}
.t-add{display:flex;gap:6px;padding:8px 4px;flex-wrap:wrap}

/* toolbar (desktop) */
#toolbar{display:flex;align-items:center;gap:2px;padding:6px 10px;background:var(--panel);border-bottom:1px solid var(--line);flex:none;flex-wrap:wrap;row-gap:4px}
.tg{display:flex;align-items:center;gap:1px}
.tsel{display:inline-flex;align-items:center;gap:6px;height:34px;padding:0 8px;border:1px solid var(--line);background:var(--panel-2);border-radius:var(--r);min-width:0}
.tsel:hover{border-color:var(--faint)}
.tsel .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#fontBtn{width:170px;justify-content:space-between}
.size{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:var(--r);background:var(--panel-2);height:34px}
.size button{width:28px;height:32px;border:0;background:transparent;display:inline-flex;align-items:center;justify-content:center}
.size button:hover{background:rgba(20,30,40,.08)}
.size .sv{min-width:38px;text-align:center;border:0;background:transparent;height:32px;font-weight:500;padding:0}
.ttxt{font-weight:700;font-size:16px;line-height:1}
.tcolor{position:absolute;left:9px;right:9px;bottom:5px;height:3px;border-radius:2px;background:var(--ink)}

/* writing area */
#writeArea{flex:1;min-height:0;display:flex;flex-direction:column}
#scroller{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;background:var(--bg);overscroll-behavior:contain;-webkit-overflow-scrolling:touch;scroll-behavior:auto}
#sheet{max-width:820px;margin:22px auto 0;background:var(--paper);border:1px solid var(--line-2);border-radius:6px;box-shadow:0 1px 3px rgba(20,30,40,.06);position:relative;padding:44px 64px calc(var(--app-h,100dvh)*.45)}
#chHead{margin-bottom:18px}
#chNum{color:var(--muted);font-size:13.5px;font-weight:500}
#chTitle{display:block;width:100%;border:0;outline:0;background:transparent;font:600 32px/1.2 var(--doc-font);padding:2px 0;color:var(--doc-ink);text-overflow:ellipsis}
#chTitle::placeholder{color:var(--faint)}
#chTitle:focus{box-shadow:0 2px 0 var(--accent-line)}
#counts{font-size:12.5px;color:var(--faint);margin-top:6px}
#editorWrap{position:relative}
#editor{outline:none;font-family:var(--doc-font);font-size:var(--doc-size);line-height:1.75;color:var(--doc-ink);caret-color:var(--accent);overflow-wrap:anywhere;min-height:40vh;-webkit-user-modify:read-write;white-space:normal}
#editor p,#editor li{margin:0 0 .9em}
#editor h1{font-size:1.85em;line-height:1.25;margin:1.1em 0 .5em;font-weight:700}
#editor h2{font-size:1.4em;line-height:1.3;margin:1em 0 .45em;font-weight:600}
#editor blockquote{margin:1em 0;padding:.1em 0 .1em 1.1em;border-left:3px solid var(--accent-line);color:var(--muted);font-style:italic}
#editor ul,#editor ol{margin:0 0 .9em;padding-left:1.6em}
#editor a{color:var(--accent-2);text-decoration:underline}
#editor hr.scene-break,.reader hr.scene-break{border:0;height:2.2em;margin:.9em 0;position:relative;background:linear-gradient(var(--line),var(--line)) 0 50%/calc(50% - 24px) 1px no-repeat,linear-gradient(var(--line),var(--line)) 100% 50%/calc(50% - 24px) 1px no-repeat}
#editor hr.scene-break::before,.reader hr.scene-break::before{content:"";position:absolute;left:50%;top:50%;width:7px;height:7px;background:var(--faint);transform:translate(-50%,-50%) rotate(45deg)}
#editor figure,.reader figure{margin:1.2em auto;text-align:center;max-width:100%}
#editor figure img,.reader figure img{max-width:100%;height:auto;border-radius:4px;display:inline-block}
#editor figure.sel img{outline:3px solid var(--accent-line)}
#editor[data-empty="1"]>p:first-child::before{content:attr(data-ph);color:var(--faint);pointer-events:none;position:absolute}
#editor ::selection{background:var(--accent-soft)}
#gutter{position:absolute;left:0;top:0;width:100%;height:0;pointer-events:none;z-index:2}
#gutter>*{pointer-events:auto}
.addp{position:absolute;left:-46px;width:26px;height:26px;border-radius:50%;border:1px solid var(--line);background:var(--panel-2);color:var(--accent-2);display:flex;align-items:center;justify-content:center;opacity:.0;padding:0;box-shadow:0 1px 3px rgba(0,0,0,.1)}
.addp svg{width:15px;height:15px}
.addp.show{opacity:.85} .addp:hover{opacity:1;background:var(--accent-soft)}
#statusbar{display:flex;gap:14px;align-items:center;padding:6px 14px;font-size:12.5px;color:var(--muted);background:var(--panel);border-top:1px solid var(--line);flex:none}

/* preview */
#preview{flex:1;min-height:0;overflow:auto;background:var(--bg);padding:22px 12px 60px}
.pv-tools{display:flex;justify-content:center;gap:10px;margin-bottom:14px;align-items:center}
.reader{margin:0 auto;background:var(--paper);border:1px solid var(--line);border-radius:8px;padding:38px 40px 48px;font-family:var(--doc-font);font-size:19px;line-height:1.8;color:var(--doc-ink);width:100%;max-width:680px;position:relative}
.reader.phone{max-width:390px;padding:26px 20px 34px;font-size:17px}
.reader.tablet{max-width:640px}
.reader .rk{font:500 13px var(--ui);color:var(--muted)}
.reader h3.rt{font:700 30px/1.25 var(--doc-font);margin:.2em 0 1em}
.reader p,.reader li{margin:0 0 .9em}
.reader h1{font-size:1.7em;line-height:1.25;margin:1em 0 .5em}.reader h2{font-size:1.3em;margin:1em 0 .45em}
.reader blockquote{margin:1em 0;padding-left:1em;border-left:3px solid var(--accent-line);font-style:italic}

/* right panel */
.tabs{display:flex;border-bottom:1px solid var(--line-2);padding:0 6px}
.tabs button{border:0;background:transparent;padding:11px 12px;font-weight:600;color:var(--muted);border-bottom:2px solid transparent;font-size:14px}
.tabs button[aria-selected=true]{color:var(--accent-2);border-color:var(--accent)}
.field{display:flex;flex-direction:column;gap:5px;margin-bottom:14px}
.field>label,.field>.lb{font-weight:600;font-size:13.5px}
.field .hint{font-size:12px;color:var(--faint)}
.inp{width:100%;min-height:38px;padding:7px 10px;border:1px solid var(--line);border-radius:var(--r);background:var(--panel-2);outline:0}
.inp:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
textarea.inp{resize:vertical;min-height:76px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:14px}
.kv dt{color:var(--muted)} .kv dd{margin:0;text-align:right}
.note{display:flex;gap:8px;align-items:flex-start;padding:8px 10px;background:var(--panel-2);border:1px solid var(--line);border-radius:8px;margin-bottom:8px}
.note.done .tx{text-decoration:line-through;color:var(--faint)}
.note .tx{flex:1;white-space:pre-wrap;overflow-wrap:anywhere;padding-top:2px}
.note input[type=checkbox]{margin-top:5px;width:16px;height:16px;accent-color:var(--accent)}

/* popovers, modals, toasts */
#popLayer{position:fixed;inset:0;z-index:95;pointer-events:none}
.pop{position:fixed;pointer-events:auto;background:var(--panel-2);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);max-height:min(70vh,560px);overflow:auto;min-width:180px;padding:6px}
.menu-i{display:flex;align-items:center;gap:10px;width:100%;min-height:38px;padding:0 10px;border:0;background:transparent;border-radius:8px;text-align:left}
.menu-i:hover,.menu-i.on{background:var(--accent-soft)}
.menu-i.danger{color:var(--danger)} .menu-i[disabled]{opacity:.4;pointer-events:none}
.menu-i .k{margin-left:auto;color:var(--faint);font-size:12px}
.menu-h{padding:8px 10px 4px;font-size:12px;color:var(--faint);font-weight:600}
.menu-sep{height:1px;background:var(--line-2);margin:4px 0}
.chips{display:flex;flex-wrap:wrap;gap:6px;padding:4px}
.chip{border:1px solid var(--line);background:var(--panel-2);border-radius:99px;padding:3px 11px;font-size:13px;min-height:28px}
.chip[aria-pressed=true],.chip.on{background:var(--accent);border-color:var(--accent);color:#fff}
.swatches{display:grid;grid-template-columns:repeat(8,1fr);gap:6px;padding:6px}
.sw{width:100%;aspect-ratio:1;min-width:26px;border-radius:6px;border:1px solid rgba(0,0,0,.18);padding:0}
.sw.auto{background:repeating-linear-gradient(45deg,var(--panel-2),var(--panel-2) 4px,var(--line-2) 4px,var(--line-2) 8px);position:relative}
.sw:hover{transform:scale(1.08)}
.fontpick{width:330px;display:flex;flex-direction:column;max-height:440px}
.fontpick .flist{overflow:auto;flex:1;min-height:0}
.frow{display:flex;flex-direction:column;align-items:flex-start;width:100%;border:0;background:transparent;text-align:left;padding:7px 10px;border-radius:8px;gap:0}
.frow:hover,.frow.on{background:var(--accent-soft)}
.frow .fn{font-size:20px;line-height:1.25} .frow .fs{font-size:12px;color:var(--faint);font-family:var(--ui)}
.frow[disabled]{opacity:.45}
.modal-back{position:fixed;inset:0;background:rgba(15,25,35,.5);z-index:80;display:flex;align-items:center;justify-content:center;padding:16px}
.modal{background:var(--panel-2);border-radius:16px;box-shadow:var(--shadow);width:min(560px,100%);max-height:100%;display:flex;flex-direction:column;overflow:hidden}
.modal.wide{width:min(760px,100%)}
.modal-h{display:flex;align-items:center;padding:14px 16px 10px;gap:8px}
.modal-h h2{margin:0;font:600 19px/1.2 "Source Serif 4",Georgia,serif;flex:1}
.modal-b{padding:6px 18px 12px;overflow:auto;flex:1;min-height:0}
.modal-f{display:flex;gap:8px;justify-content:flex-end;align-items:center;padding:12px 16px;border-top:1px solid var(--line-2);background:var(--panel)}
.banner{display:flex;gap:8px;align-items:flex-start;padding:9px 12px;border-radius:8px;font-size:14px;margin:6px 0 10px}
.banner.err{background:var(--danger-soft);color:#7C231C} .banner.warn{background:var(--warn-soft);color:#5E3D00} .banner.ok{background:var(--ok-soft);color:#1C5634}
#toasts{position:fixed;left:0;right:0;bottom:84px;display:flex;flex-direction:column;align-items:center;gap:8px;z-index:90;pointer-events:none;padding:0 12px}
.toast{background:#1D2731;color:#fff;padding:9px 14px;border-radius:10px;box-shadow:var(--shadow);max-width:520px;font-size:14px;pointer-events:auto}
.toast.err{background:#8E2E27}

/* cover field */
.cover-field{display:flex;gap:16px;align-items:flex-start;flex-wrap:wrap}
.cover-drop{position:relative;border:2px dashed var(--line);border-radius:10px;background:var(--line-2);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:4px;color:var(--muted);overflow:hidden;padding:8px;cursor:pointer}
.cover-drop.landscape{width:240px;aspect-ratio:3/2} .cover-drop.portrait{width:150px;aspect-ratio:2/3}
.cover-drop:hover,.cover-drop.over{border-color:var(--accent);background:var(--accent-soft)}
.cover-drop.has{border-style:solid;border-color:var(--line);padding:0;background:#000}
.cover-drop img{width:100%;height:100%;object-fit:cover;display:block}
.cover-drop b{color:var(--ink);font-size:14px}
.cover-meta{display:flex;flex-direction:column;gap:8px;align-items:flex-start;padding-top:2px}
.cover-hint{font-size:12px;color:var(--faint);margin-top:6px}

/* cropper */
.modal.crop{width:min(860px,100%);height:min(760px,100%)}
.crop-stage{position:relative;flex:1;min-height:240px;background:#12171B}
.crop-stage canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none;cursor:grab;display:block}
.crop-stage canvas:active{cursor:grabbing}
.crop-ctl{display:flex;align-items:center;gap:8px;padding:10px 16px;flex-wrap:wrap;border-top:1px solid var(--line-2)}
.crop-ctl input[type=range]{flex:1;min-width:120px;accent-color:var(--accent)}
.crop-prev{border:1px solid var(--line);border-radius:6px;background:#000;flex:none}
.final-prev{flex:1;min-height:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:16px;background:#12171B;color:#fff}
.final-prev img{max-width:100%;max-height:100%;min-height:0;object-fit:contain;border-radius:4px;box-shadow:0 4px 24px rgba(0,0,0,.5)}

/* dock (portrait) */
#dock{display:none;flex:none;background:var(--panel);border-top:1px solid var(--line)}

  const art = h('article', { class: 'reader ' + (this.previewWidth === 'desktop' ? '' : this.previewWidth) + (Kind.lineMode(s) ? ' line-mode' : '') + ' k-' + kd }, ...head, h('h3', { class: 'rt' }, Kind.storyLike(s) ? (f.chapter.title || 'Chapter ' + f.chapter.number) : heading), body);
  const dev = (k, ic, l) => h('button', { class: 'chip', type: 'button', 'aria-pressed': String(this.previewWidth === k), onclick: () => { this.previewWidth = k; art.className = 'reader ' + (k === 'desktop' ? '' : k); $$('.pv-tools .chip', pv).forEach(c => c.setAttribute('aria-pressed', String(c.dataset.k === k))); } }, l); 
  const tools = h('div', { class: 'pv-tools' }, ...[['phone', 'phone', 'Phone'], ['tablet', 'tablet', 'Tablet'], ['desktop', 'desk', 'Desktop']].map(([k, ic, l]) => { const b = dev(k, ic, l); b.dataset.k = k; return b; }));
  pv.replaceChildren(tools, art); pv.scrollTop = 0;
};

(async function boot() {

<!DOCTYPE html>
<html lang="en" data-theme="classic">
<head>
<meta charset="UTF-8">

<title>Journals — Reader</title>
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:ital,wght@0,400;0,600;1,400&family=Lora:ital,wght@0,400;0,600;1,400&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --serif-lit:'Source Serif 4',Georgia,serif;
  --serif-mod:'Lora',Georgia,serif;
  --sans:'Inter',-apple-system,sans-serif;
}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;height:100%;background:var(--env);font-family:var(--sans);overflow:hidden}

/* ---------- THEMES ---------- */
:root[data-theme="classic"]{--env:#e9e3d3;--env2:#ded5bf;--paper:#f7f3ea;--paper2:#f1ead9;--ink:#2b2620;--soft:#6b6252;--border:rgba(43,38,32,.12);--shadow:rgba(43,38,32,.28);--accent:#8a5a3b;--fold-hi:rgba(255,255,255,.55);--fold-lo:rgba(0,0,0,.28);}
:root[data-theme="ivory"]{--env:#f0ece2;--env2:#e6e0d1;--paper:#fbf8f2;--paper2:#f5efe2;--ink:#2e2a24;--soft:#786f5f;--border:rgba(46,42,36,.10);--shadow:rgba(46,42,36,.22);--accent:#9c6b3f;--fold-hi:rgba(255,255,255,.6);--fold-lo:rgba(0,0,0,.22);}
:root[data-theme="oldschool"]{--env:#cdb98c;--env2:#bfa877;--paper:#e9dcc0;--paper2:#e0cfab;--ink:#3a2c18;--soft:#6e5a3c;--border:rgba(58,44,24,.18);--shadow:rgba(35,25,10,.4);--accent:#7a4a24;--fold-hi:rgba(255,247,220,.5);--fold-lo:rgba(20,12,2,.4);}
:root[data-theme="dark"]{--env:#171310;--env2:#0f0c0a;--paper:#2a231b;--paper2:#241e17;--ink:#ece3d2;--soft:#b7ab93;--border:rgba(236,227,210,.10);--shadow:rgba(0,0,0,.6);--accent:#d9a45c;--fold-hi:rgba(255,235,200,.12);--fold-lo:rgba(0,0,0,.55);}
:root[data-theme="midnight"]{--env:#090b0f;--env2:#05060a;--paper:#161a21;--paper2:#12151b;--ink:#e6e9ee;--soft:#97a1ad;--border:rgba(230,233,238,.08);--shadow:rgba(0,0,0,.7);--accent:#7fb0ff;--fold-hi:rgba(180,210,255,.10);--fold-lo:rgba(0,0,0,.6);}
:root[data-theme="minimal"]{--env:#f2f2f0;--env2:#e9e9e6;--paper:#ffffff;--paper2:#fafafa;--ink:#171717;--soft:#6b6b6b;--border:rgba(0,0,0,.08);--shadow:rgba(0,0,0,.15);--accent:#171717;--fold-hi:rgba(255,255,255,.7);--fold-lo:rgba(0,0,0,.14);}

body{background:radial-gradient(ellipse at 50% -10%, var(--env2), var(--env));color:var(--ink);transition:background .35s ease,color .35s ease}

/* ---------- SHELL ---------- */
.app-shell{position:relative;height:100vh;height:100dvh;display:flex;flex-direction:column;overflow:hidden}
.topbar{position:relative;z-index:40;display:flex;align-items:center;justify-content:space-between;padding:calc(env(safe-area-inset-top,0px) + 14px) 18px 10px;font-family:var(--sans)}
.iconbtn{display:inline-flex;align-items:center;gap:7px;background:transparent;border:none;color:var(--soft);font-size:13px;font-family:var(--sans);letter-spacing:.02em;cursor:pointer;padding:8px 10px;border-radius:8px;transition:color .2s,background .2s}
.iconbtn:hover{color:var(--ink);background:var(--border)}
.iconbtn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.progressline{position:absolute;left:0;right:0;top:calc(env(safe-area-inset-top,0px) + 2px);height:2px;background:var(--border)}
.progressfill{height:100%;background:var(--accent);width:0%;transition:width .35s ease}

.theme-pop{position:absolute;top:100%;right:18px;margin-top:6px;background:var(--paper);border:1px solid var(--border);border-radius:12px;padding:10px;display:none;gap:8px;box-shadow:0 10px 30px var(--shadow);z-index:50}
.theme-pop.open{display:flex}
.swatch{width:26px;height:26px;border-radius:50%;border:2px solid transparent;cursor:pointer;position:relative}
.swatch[data-t="classic"]{background:#f7f3ea}
.swatch[data-t="ivory"]{background:#fbf8f2}
.swatch[data-t="oldschool"]{background:#e9dcc0}
.swatch[data-t="dark"]{background:#2a231b}
.swatch[data-t="midnight"]{background:#161a21}
.swatch[data-t="minimal"]{background:#ffffff}
.swatch.active{border-color:var(--accent)}

/* ---------- STAGE ---------- */
.stage{position:relative;flex:1;min-height:0;display:flex;align-items:center;justify-content:center;padding:6px 0 18px}
.book-wrap{position:relative;width:min(860px,94vw);height:100%;max-height:calc(100% - 4px);perspective:1800px;touch-action:pan-y}
.book-wrap.gesture-lock{-webkit-user-select:none;user-select:none}

.page{position:absolute;inset:0;background:var(--paper);border-radius:2px;box-shadow:0 1px 2px var(--shadow),0 26px 64px -22px var(--shadow);overflow:hidden;will-change:transform,clip-path}
.page.behind{z-index:5;filter:brightness(.94)}
.page.front{z-index:10}
.page::before{content:"";position:absolute;inset:0;pointer-events:none;background:repeating-linear-gradient(0deg,rgba(0,0,0,.012) 0 1px,transparent 1px 3px);mix-blend-mode:multiply;opacity:.5;z-index:1}
.page::after{content:"";position:absolute;left:0;top:0;bottom:0;width:22px;pointer-events:none;background:linear-gradient(to right, var(--fold-lo) 0%, transparent 100%);opacity:.35;z-index:1}
.page-scroll{position:relative;height:100%;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;scrollbar-width:thin}
.page-scroll:focus{outline:none}

.cover{position:relative;width:100%;aspect-ratio:3/2;overflow:hidden}
@media (orientation:landscape) and (min-width:700px){
 .cover{max-height:30vh;width:auto;max-width:100%;margin:0 auto}
}
.cover img,.cover .grad{width:100%;height:100%;object-fit:cover;display:block}
.cover .grad{display:flex;align-items:flex-end;padding:18px;font-family:var(--serif-lit);font-style:italic;color:rgba(255,255,255,.92);font-size:15px}
.cover .type-chip{position:absolute;top:14px;left:14px;font-family:var(--sans);font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:#fff;background:rgba(0,0,0,.32);backdrop-filter:blur(2px);padding:5px 10px;border-radius:20px}

.meta{padding:22px 26px 0}
h1.title{font-family:var(--serif-lit);font-weight:600;font-size:clamp(24px,4vw,32px);line-height:1.18;margin:2px 0 6px;color:var(--ink)}
.subtitle{font-family:var(--serif-mod);font-style:italic;color:var(--soft);font-size:15px;line-height:1.5;margin:0 0 16px}
.byline{display:flex;align-items:center;gap:10px;padding-bottom:14px;border-bottom:1px solid var(--border);margin-bottom:18px}
.meta-divider{height:1px;background:var(--border);margin:16px 0 18px}
.avatar{width:36px;height:36px;border-radius:50%;flex:none;display:flex;align-items:center;justify-content:center;color:#fff;font-family:var(--serif-mod);font-size:13px}
.byline-id{flex:1;min-width:0}
.byline-name{font-size:13.5px;font-weight:600;color:var(--ink);line-height:1.3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.byline-uname{font-size:12px;color:var(--soft);line-height:1.3}
.byline-sub{font-size:11px;color:var(--soft);opacity:.85;margin-top:2px}
.byline-dot{opacity:.5;margin:0 4px}
.followbtn{flex:none;font-family:var(--sans);font-size:11.5px;font-weight:600;color:var(--accent);background:transparent;border:1px solid var(--accent);border-radius:20px;padding:6px 13px;cursor:pointer;letter-spacing:.02em;transition:background .18s,color .18s}
.followbtn:hover{background:var(--accent);color:var(--paper)}
.followbtn.following{color:var(--soft);border-color:var(--border);background:transparent}
.followbtn.following:hover{background:var(--border);color:var(--ink)}

.article{padding:0 26px;font-family:var(--serif-mod);font-size:17.5px;line-height:1.85;color:var(--ink)}
.article p{margin:0 0 1.15em}
.article .dropcap{float:left;font-family:var(--serif-lit);font-weight:600;font-size:2.7em;line-height:.74;margin:.03em .05em 0 0;padding:0;color:var(--accent)}
.article .rt-h{font-family:var(--serif-lit);font-weight:600;color:var(--ink);line-height:1.28;margin:1em 0 .5em}
.article h2.rt-h{font-size:1.35em}
.article h3.rt-h{font-size:1.15em}
.article h4.rt-h{font-size:1em;text-transform:uppercase;letter-spacing:.04em;color:var(--soft)}
.article .rt-quote{margin:1em 0;padding:.2em 0 .2em 1.1em;border-left:2px solid var(--accent);font-style:italic;color:var(--soft)}
.article .rt-list{margin:0 0 1.15em;padding-left:1.3em}
.article .rt-list li{margin:0 0 .4em}
.article mark{background:transparent;color:var(--accent);font-weight:600;background-image:linear-gradient(transparent 62%, var(--fold-hi) 62%)}
.article a{color:var(--accent);text-decoration:underline;text-underline-offset:2px}
.article.poetry{font-style:italic;font-family:var(--serif-lit)}
.article.poetry p{margin:0 0 .9em}
.article.short{display:flex;align-items:center;min-height:38vh;font-size:20px;text-align:center;justify-content:center;font-style:italic}

.tags{display:flex;flex-wrap:wrap;gap:8px;padding:6px 26px 4px}
.tag{font-family:var(--sans);font-size:11.5px;color:var(--soft);border:1px solid var(--border);padding:4px 11px;border-radius:20px}

.actionbar{display:flex;align-items:center;gap:4px;padding:16px 20px;margin:14px 26px 6px;border-top:1px solid var(--border);border-bottom:1px solid var(--border)}
.act{display:flex;align-items:center;gap:6px;background:none;border:none;color:var(--soft);font-family:var(--sans);font-size:12.5px;cursor:pointer;padding:8px 10px;border-radius:8px;transition:color .18s}
.act:hover{color:var(--ink)}
.act svg{width:17px;height:17px;stroke:currentColor;fill:none;stroke-width:1.6;transition:transform .18s ease}
.act.liked{color:#c0563f}
.act.liked svg{fill:#c0563f;stroke:#c0563f;transform:scale(1.12)}
.act.saved{color:var(--accent)}
.act.saved svg{fill:var(--accent);stroke:var(--accent)}
.actionbar .spacer{flex:1}
.ribbon{position:absolute;top:0;right:22px;width:20px;height:0;background:var(--accent);clip-path:polygon(0 0,100% 0,100% 100%,50% 78%,0 100%);transition:height .25s cubic-bezier(.2,.9,.3,1.2);z-index:20}
.page.saved .ribbon{height:46px}

.comments{padding:6px 26px 40px;font-family:var(--sans)}
.comments h3{font-size:12.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--soft);font-weight:600;margin:10px 0 14px}
.newcomment{display:flex;gap:10px;margin-bottom:18px}
.newcomment textarea{flex:1;resize:none;border:1px solid var(--border);background:var(--paper2);color:var(--ink);border-radius:10px;padding:9px 11px;font-family:var(--sans);font-size:13px;min-height:38px;line-height:1.4}
.newcomment button{align-self:flex-end;border:none;background:var(--accent);color:var(--paper);font-size:12px;font-weight:600;padding:9px 14px;border-radius:8px;cursor:pointer}
.comment{display:flex;gap:10px;margin-bottom:16px}
.comment .avatar{width:28px;height:28px;font-size:11px}
.c-body{flex:1;min-width:0}
.c-head{font-size:12.5px}
.c-head b{color:var(--ink);font-weight:600}
.c-head .t{color:var(--soft);margin-left:6px}
.c-text{font-size:13.5px;line-height:1.55;color:var(--ink);margin:3px 0 6px}
.c-actions{display:flex;gap:14px;font-size:11.5px;color:var(--soft)}
.c-actions button{background:none;border:none;color:inherit;cursor:pointer;font:inherit;padding:0}
.c-actions button:hover{color:var(--ink)}
.replies{margin-top:10px;padding-left:16px;border-left:1px solid var(--border)}
.creport-menu{margin-top:8px;padding:5px;border:1px solid var(--border);border-radius:9px;background:var(--paper2);display:flex;flex-direction:column;gap:1px;max-width:240px}
.creport-menu[hidden]{display:none}
.creport-menu button{width:100%;text-align:left;background:none;border:none;color:var(--ink);font-size:11.5px;padding:6px 8px;border-radius:6px;cursor:pointer;font-family:var(--sans)}
.creport-menu button:hover{background:var(--border)}
.no-comments{color:var(--soft);font-size:13px;font-style:italic;padding:10px 0}

/* ---------- MORE / REPORT MENU ---------- */
.morewrap{position:relative;display:inline-block}
.moremenu{position:absolute;bottom:calc(100% + 6px);right:0;width:250px;max-height:62vh;overflow-y:auto;background:var(--paper);border:1px solid var(--border);border-radius:12px;padding:6px;box-shadow:0 14px 40px var(--shadow);display:none;z-index:60;font-family:var(--sans)}
.moremenu.open{display:block}
.moremenu button{width:100%;text-align:left;background:none;border:none;color:var(--ink);font-size:13px;padding:9px 10px;border-radius:8px;cursor:pointer;font-family:var(--sans)}
.moremenu button:hover{background:var(--border)}
.moremenu .mm-label{font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--soft);padding:8px 10px 4px;font-weight:600}
.moremenu .mm-div{height:1px;background:var(--border);margin:4px 2px}
.moremenu .mm-copyright{color:var(--accent)}
.moremenu .mm-copyright-note{font-size:11px;color:var(--soft);padding:0 10px 6px;line-height:1.4}

/* fold shadow overlay drawn on front page while dragging */
.foldshadow{position:absolute;inset:0;pointer-events:none;z-index:12;opacity:0}

.boundary-hint{position:absolute;left:50%;bottom:10px;transform:translateX(-50%);font-family:var(--sans);font-size:11px;color:var(--soft);opacity:0;transition:opacity .3s;pointer-events:none}
.boundary-hint.show{opacity:.8}

@media(prefers-color-scheme:dark){}
::selection{background:var(--accent);color:var(--paper)}
.page-scroll::-webkit-scrollbar{width:6px}
.page-scroll::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px}

.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0)}
</style>
</head>

 {id:1,type:"Journal",title:"Notes from a Slow Morning",subtitle:"On the quiet discipline of paying attention.",author:"Meera Kapoor",username:"meerawrites",avatar:"#8a5a3b",date:"Sep 12",read:"6 min",tags:["morning pages","noticing","slow living"],grad:"linear-gradient(135deg,#d9c2a0,#8a6a4a)",kind:"long",
 body:`The kettle takes four minutes, and I have decided this is the correct length of a morning. Long enough to watch the light change on the wall opposite the window; short enough that I haven't yet started performing the day for anyone.

There is a specific kind of attention that only shows up *before* the phone is unlocked. It is thinner than concentration and slower than daydreaming — closer to the way you'd look at a stranger's garden while walking past it, curious but undemanding.

> I used to think journaling was for solving things. Lately it feels more like sweeping a floor that will get dusty again tomorrow.

Not less worth doing. Just not a task with an end. A few things I keep coming back to:

- Write before the phone, not after
- Let the paragraph be ==bad== on purpose
- Stop at "enough," not at "finished"

By the time the kettle clicks off, I've usually written a paragraph I'll never reread and noticed one true thing about the room. Some days that's the whole harvest, and **it's enough**. More on this slow-morning practice at [my notes archive](https://example.com/notes).`,

 {id:5,type:"Story",title:"The Cartographer of Small Rooms",subtitle:"A short story about a woman who maps apartments no one remembers living in.",author:"Selin Aydın",username:"selin.a",avatar:"#8a4a3b",date:"Sep 5",read:"9 min",tags:["fiction","short story","memory"],grad:"linear-gradient(135deg,#8a4a3b,#3a1a12)",kind:"long",
 body:`Rosa mapped the apartment on Calle Verde from memory, though she'd never lived there. That was the job: to draw the floor plans of rooms whose tenants had died without heirs, using nothing but the water stains, the nail holes, the worn patches in the carpet where a chair had sat for thirty years.

She started with the kitchen, always. Kitchens told the truth fastest — how many plates in the drying rack's memory, whether the stove had cooked for one or for a family that had thinned over time.

In the second bedroom of Calle Verde, she found a rectangle of unfaded paint on the wall, exactly the size of a crib. No crib in the records. No child in the city's registry. She drew it anyway, labeled it *'absence, approx. 90x50cm,'* and moved to the hallway.

 body:`Every writing workshop eventually arrives at the same confession: someone has spent forty minutes on a single opening sentence while the rest of the piece sits blank beneath it, waiting.

The instinct isn't laziness. It's a kind of misplaced faith — the idea that if the first sentence is correct, everything after it will follow with less friction. In practice, the opposite tends to happen.

### Why momentum matters more than polish

Momentum is a resource, and first drafts spend it fastest when they're allowed to be provisional. The ugly draft, written quickly and revised later with the whole shape visible, nearly always beats the beautiful paragraph written in isolation. A few things that help:

1. Write the whole shape before fixing any sentence
2. Let the opening line stay wrong until the ending exists
3. Revise structure before you revise words

None of this makes perfectionism irrational. It's a reasonable response to the fear of wasted effort. But writing, like most crafts, rewards a specific kind of **recklessness**: the willingness to be wrong at speed, so that later you have something concrete enough to fix.`,
 likes:876,saved:false,liked:false,comments:[
  {id:601,user:"Grace L.",avatar:"#6a3a5a",time:"12h",text:"\"Reckless at speed\" is now taped above my desk.",likes:22,replies:[]}
 ]}
];

/* ============ 2. STATE ============ */
const S = {
 idx: 0,
 state: "idle", // idle -> dragging(peeking) -> completing|cancelling -> idle
 dir: 0,        // 1 = next, -1 = prev
 frac: 0,       // 0..1 curl / peek progress
 dragStartX: 0, dragStartY: 0, lastX:0, lastT:0, vel:0,
 pointerId: null,
 candidate: null, // {dir,startX,startY,pointerId,committed} - pending zone gesture not yet confirmed horizontal
 reduced: window.matchMedia("(prefers-reduced-motion: reduce)").matches,
 saved: new Set(JSON.parse(localStorage.getItem("journals_saved")||"[]")),
 liked: new Set(JSON.parse(localStorage.getItem("journals_liked")||"[]")),
 positions: JSON.parse(localStorage.getItem("journals_positions")||"{}")
};
POSTS.forEach(p=>{ if(S.saved.has(p.id)) p.saved=true; if(S.liked.has(p.id)) p.liked=true; });

const el = {
 pageFront: document.getElementById("pageFront"),
 pageBehind: document.getElementById("pageBehind"),
 foldShadow: document.getElementById("foldShadow"),
 bookWrap: document.getElementById("bookWrap"),
 progress: document.getElementById("progressFill"),
 hint: document.getElementById("boundaryHint"),
 live: document.getElementById("liveRegion"),
 themeBtn: document.getElementById("themeBtn"),
 themePop: document.getElementById("themePop"),
 backBtn: document.getElementById("backBtn")
};

/* ============ 3. RENDER ============ */
function renderPost(post){
 const wrap = document.createElement("div");
 wrap.className = "page-scroll";
 wrap.tabIndex = -1;
 const initials = post.author.split(" ").map(w=>w[0]).slice(0,2).join("");
 const artClass = post.kind==="poem" ? "article poetry" : post.kind==="short" ? "article short" : "article";
 wrap.innerHTML = `
  <div class="cover"><span class="type-chip">${post.type}</span>
    <div class="grad" style="background:${post.grad}"></div>
  </div>
  <div class="ribbon"></div>
  <div class="meta">
    <h1 class="title">${esc(post.title)}</h1>
    ${post.subtitle?`<p class="subtitle">${esc(post.subtitle)}</p>`:""}
    <div class="meta-divider"></div>
    <div class="byline">
      <div class="avatar" style="background:${post.avatar}">${initials}</div>
      <div class="byline-id">
        <div class="byline-name">${esc(post.author)}</div>
        <div class="byline-uname">@${post.username}</div>
        <div class="byline-sub">${post.date}<span class="byline-dot">·</span>${post.read} read</div>
      </div>
      <button class="followbtn ${post.following?'following':''}" data-act="follow">${post.following?'Following':'Follow'}</button>
    </div>
  </div>
  <div class="${artClass}" data-kind="${post.kind}">${renderRich(post.body)}</div>
  <div class="tags">${post.tags.map(t=>`<span class="tag">#${esc(t)}</span>`).join("")}</div>
  <div class="actionbar">
    <button class="act ${post.liked?'liked':''}" data-act="like" aria-label="Impression" title="Impression"><svg viewBox="0 0 24 24"><path d="M20.8 4.6a5.5 5.5 0 00-7.8 0L12 5.6l-1-1a5.5 5.5 0 00-7.8 7.8l1 1L12 21l7.8-7.6 1-1a5.5 5.5 0 000-7.8z"/></svg><span class="cnt">${post.likes + (post.liked?1:0)}</span></button>
    <button class="act" data-act="comment" aria-label="Respond" title="Respond"><svg viewBox="0 0 24 24"><path d="M21 11.5a8.38 8.38 0 01-8.5 8.5 8.5 8.5 0 01-4-1L3 20l1-5.5A8.38 8.38 0 0112.5 3 8.38 8.38 0 0121 11.5z"/></svg><span class="cnt">${post.comments.length}</span></button>
    <button class="act ${post.saved?'saved':''}" data-act="save" aria-label="Save" title="Save"><svg viewBox="0 0 24 24"><path d="M19 21l-7-5-7 5V5a2 2 0 012-2h10a2 2 0 012 2z"/></svg></button>
    <span class="spacer"></span>
    <button class="act" data-act="share" aria-label="Share" title="Share"><svg viewBox="0 0 24 24"><path d="M4 12v7a2 2 0 002 2h12a2 2 0 002-2v-7M16 6l-4-4-4 4M12 2v14"/></svg></button>
    <div class="morewrap">
      <button class="act" data-act="more" aria-haspopup="true" aria-expanded="false" aria-label="More actions" title="More"><svg viewBox="0 0 24 24"><circle cx="5" cy="12" r="1.6" fill="currentColor" stroke="none"/><circle cx="12" cy="12" r="1.6" fill="currentColor" stroke="none"/><circle cx="19" cy="12" r="1.6" fill="currentColor" stroke="none"/></svg></button>
      <div class="moremenu" role="menu">
        <div class="mm-label">Report</div>
        <button class="mm-copyright" data-report="copyright">Copyright / IP concern</button>
        <div class="mm-copyright-note">Routes to Journals' copyright review pathway.</div>
        <button data-report="plagiarism">Plagiarism or infringement</button>
        <button data-report="inappropriate">Inappropriate or prohibited content</button>
        <button data-report="harassment">Harassment or abusive content</button>
        <button data-report="spam">Spam</button>
        <button data-report="misleading">Misleading or deceptive content</button>
        <button data-report="privacy">Privacy concern</button>
        <button data-report="broken">Broken or missing content</button>
        <button data-report="other">Other</button>
      </div>
    </div>
  </div>
  <div class="comments">
    <h3>Marginalia · ${post.comments.length}</h3>
    <div class="newcomment"><textarea rows="1" placeholder="Leave a response in the margin…" aria-label="Add a response"></textarea><button data-act="post-comment">Respond</button></div>
    <div class="clist">${post.comments.length? post.comments.map(c=>renderComment(c)).join("") : '<div class="no-comments">No responses yet — be the first to write in the margin.</div>'}</div>
  </div>
 `;
 if(post.saved) wrap.parentElement; // ribbon toggled via class on .page below
 applyDropCap(wrap.querySelector(".article"), post.kind);
 wireActions(wrap, post);
 return wrap;
}
function renderComment(c){
 const initials = c.user.split(" ").map(w=>w[0]).slice(0,2).join("");
 const reasons = ["Harassment / Bullying","Hate or Discrimination","Sexual / Explicit Content","Violence / Dangerous Content","Spam / Misleading","Privacy Violation","Copyright / Intellectual Property","Other"];
 return `<div class="comment">
   <div class="avatar" style="background:${c.avatar}">${initials}</div>
   <div class="c-body">
     <div class="c-head"><b>${esc(c.user)}</b><span class="t">${c.time}</span></div>
     <div class="c-text">${esc(c.text)}</div>
     <div class="c-actions"><button>♡ ${c.likes}</button><button data-reply>Reply</button>${c.replies&&c.replies.length?`<button data-toggle>${c.replies.length} repl${c.replies.length>1?'ies':'y'}</button>`:''}<button data-creport-toggle aria-haspopup="true">Report</button></div>
     <div class="creport-menu" hidden role="menu">${reasons.map(r=>`<button data-creport="${r}">${r}</button>`).join("")}</div>
     ${c.replies&&c.replies.length?`<div class="replies" style="display:none">${c.replies.map(r=>renderComment(r)).join("")}</div>`:''}
   </div>
 </div>`;
}
function esc(s){ const d=document.createElement("div"); d.textContent=s; return d.innerHTML; }

/* Safe rich-text renderer: escapes all text first, then builds a whitelisted
   set of structural/inline tags from a small markdown-like syntax. Never
   injects raw/arbitrary HTML. Compatible with Writer Studio's markdown output. */
function renderRich(src){
 if(!src) return "";
 const blocks = src.split(/\n{2,}/);
 return blocks.map(raw=>{
  const block = raw.trim();
  if(!block) return "";
  let m = block.match(/^(#{1,3})\s+(.*)$/);
  if(m){ const lvl = m[1].length===1?2:(m[1].length===2?3:4); return `<h${lvl} class="rt-h">${inline(m[2])}</h${lvl}>`; }
  if(/^>\s?/.test(block)){
   const text = block.split("\n").map(l=>l.replace(/^>\s?/,"")).join("\n");
   return `<blockquote class="rt-quote">${inline(text).replace(/\n/g,"<br>")}</blockquote>`;
  }
  if(/^(-|\*)\s+/.test(block)){
   const items = block.split("\n").filter(Boolean).map(l=>`<li>${inline(l.replace(/^(-|\*)\s+/,""))}</li>`).join("");
   return `<ul class="rt-list">${items}</ul>`;
  }
  if(/^\d+\.\s+/.test(block)){
   const items = block.split("\n").filter(Boolean).map(l=>`<li>${inline(l.replace(/^\d+\.\s+/,""))}</li>`).join("");
   return `<ol class="rt-list">${items}</ol>`;
  }
  let align = "";
  const am = block.match(/^\{(center|right)\}\s*/);
  let body = block;
  if(am){ align = ` style="text-align:${am[1]}"`; body = block.slice(am[0].length); }
  return `<p${align}>${inline(body).replace(/\n/g,"<br>")}</p>`;
 }).join("");
}
function inline(text){
 let s = esc(text);
 s = s.replace(/\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)/g, (_,t,u)=>`<a href="${u}" target="_blank" rel="noopener noreferrer nofollow">${t}</a>`);
 s = s.replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>");
 s = s.replace(/==([^=]+)==/g, "<mark>$1</mark>");
 s = s.replace(/(^|[^*_])[*_]([^*_]+)[*_](?!\*|_)/g, "$1<em>$2</em>");
 return s;
}
/* Controlled drop cap: pulls the first character into its own span rather than
   relying on ::first-letter, so spacing is explicit and consistent everywhere. */
function applyDropCap(articleEl, kind){
 if(kind !== "long") return;
 const p = articleEl.querySelector("p");
 if(!p) return;
 const walker = document.createTreeWalker(p, NodeFilter.SHOW_TEXT);
 const node = walker.nextNode();
 if(!node || !node.textContent.trim()) return;
 const text = node.textContent;
 const m = text.match(/^(\s*)(\S)/);
 if(!m) return;
 const cut = m[0].length;
 const frag = document.createDocumentFragment();
 if(text.slice(0,cut-1)) frag.appendChild(document.createTextNode(text.slice(0,cut-1)));
 const span = document.createElement("span");
 span.className = "dropcap"; span.textContent = text[cut-1];
 frag.appendChild(span);
 frag.appendChild(document.createTextNode(text.slice(cut)));
 node.replaceWith(frag);
}

function wireActions(scope, post){
 scope.querySelector('[data-act="like"]').addEventListener("click", e=>{
  post.liked = !post.liked;
  if(post.liked) S.liked.add(post.id); else S.liked.delete(post.id);
  localStorage.setItem("journals_liked", JSON.stringify([...S.liked]));
  const btn = e.currentTarget;
  btn.classList.toggle("liked", post.liked);
  btn.querySelector(".cnt").textContent = post.likes + (post.liked?1:0);
 });
 function doSave(){
  post.saved = !post.saved;
  if(post.saved) S.saved.add(post.id); else S.saved.delete(post.id);
  localStorage.setItem("journals_saved", JSON.stringify([...S.saved]));
  scope.querySelectorAll('[data-act="save"]').forEach(b=>{ b.classList.toggle("saved", post.saved); if(b.closest(".moremenu")) b.textContent = post.saved?'Remove from shelf':'Save to shelf'; });
  scope.closest(".page").classList.toggle("saved", post.saved);
  announce(post.saved ? "Saved to your shelf" : "Removed from your shelf");
 }
 async function doShare(){
  const url = location.href.split("#")[0] + "#post-" + post.id;
  try{ await navigator.clipboard.writeText(url); announce("Link copied"); }catch(e){ announce("Copy this link: "+url); }
 }
 scope.querySelectorAll('[data-act="save"]').forEach(b=> b.addEventListener("click", ()=>{ doSave(); closeMore(scope); }));
 scope.querySelectorAll('[data-act="share"]').forEach(b=> b.addEventListener("click", ()=>{ doShare(); closeMore(scope); }));
 scope.querySelector('[data-act="comment"]').addEventListener("click", ()=>{
  scope.querySelector(".comments").scrollIntoView({behavior: S.reduced?"auto":"smooth", block:"start"});
 });
 scope.querySelector('[data-act="follow"]').addEventListener("click", e=>{
  post.following = !post.following;
  e.currentTarget.classList.toggle("following", post.following);
  e.currentTarget.textContent = post.following?'Following':'Follow';
  announce(post.following?`Following ${post.author}`:`Unfollowed ${post.author}`);
 });
 const moreBtn = scope.querySelector('[data-act="more"]');
 const moreMenu = scope.querySelector(".moremenu");
 moreBtn.addEventListener("click", e=>{
  e.stopPropagation();
  const open = moreMenu.classList.toggle("open");
  moreBtn.setAttribute("aria-expanded", open);
 });
 scope.querySelectorAll('[data-report]').forEach(b=>{
  b.addEventListener("click", ()=>{
   announce("Report submitted: " + b.textContent + ". Our team will review it.");
   closeMore(scope);
  });
 });
 const ta = scope.querySelector(".newcomment textarea");
 scope.querySelector('[data-act="post-comment"]').addEventListener("click", ()=>{
  const val = ta.value.trim(); if(!val) return;
  const c = {id:Date.now(),user:"You",avatar:"#666",time:"now",text:val,likes:0,replies:[]};
  post.comments.unshift(c);
  ta.value = "";
  const list = scope.querySelector(".clist");
  list.innerHTML = post.comments.map(renderComment).join("");
  scope.querySelector(".comments h3").textContent = "Marginalia · " + post.comments.length;
  wireCommentToggles(scope);
 });
 wireCommentToggles(scope);
 scope.addEventListener("click", e=>{
  const toggleBtn = e.target.closest("[data-creport-toggle]");
  if(toggleBtn){
   const menu = toggleBtn.closest(".c-body").querySelector(".creport-menu");
   if(menu){
    const willOpen = menu.hidden;
    scope.querySelectorAll(".creport-menu").forEach(m=>{ if(m!==menu) m.hidden = true; });
    menu.hidden = !willOpen;
   }
   return;
  }
  const reasonBtn = e.target.closest("[data-creport]");
  if(reasonBtn){
   announce("Comment reported: " + reasonBtn.dataset.creport + ". Our team will review it.");
   reasonBtn.closest(".creport-menu").hidden = true;
  }
 });
 scope.addEventListener("scroll", ()=>{
  S.positions[post.id] = scope.scrollTop;
  localStorage.setItem("journals_positions", JSON.stringify(S.positions));
 }, {passive:true});
 if(S.positions[post.id]) requestAnimationFrame(()=>{ scope.scrollTop = S.positions[post.id]; });
}
function wireCommentToggles(scope){
 scope.querySelectorAll("[data-toggle]").forEach(btn=>{
  btn.onclick = ()=>{
   const rep = btn.closest(".c-body").querySelector(".replies");
   if(rep){ const open = rep.style.display !== "none"; rep.style.display = open? "none":"block"; }
  };
 });
 scope.querySelectorAll("[data-reply]").forEach(btn=>{
  btn.onclick = ()=> announce("Reply composer would open here");
 });
}
function announce(msg){ el.live.textContent = msg; }
function closeMore(scope){
 const m = scope.querySelector(".moremenu"); const b = scope.querySelector('[data-act="more"]');
 if(m){ m.classList.remove("open"); } if(b){ b.setAttribute("aria-expanded","false"); }
}
document.addEventListener("click", e=>{
 if(!e.target.closest(".morewrap")){
  document.querySelectorAll(".moremenu.open").forEach(m=>{ m.classList.remove("open"); const b=m.previousElementSibling; if(b) b.setAttribute("aria-expanded","false"); });
 }
});

/* mount initial pages */
function mountPage(container, post, cls){
 container.className = "page " + cls + (post.saved?" saved":"");
 container.innerHTML = "";
 container.appendChild(renderPost(post));
}
mountPage(el.pageFront, POSTS[S.idx], "front");
updateProgress();

function updateProgress(){
 el.progress.style.width = ((S.idx+1)/POSTS.length*100) + "%";
}

/* ============ 4. PHYSICS / STATE MACHINE ============ */
const NOTCH = 26; // px fold notch depth
function setCurl(dir, frac){
 // clip-path on front page revealing behind page, with a folded notch + shadow/highlight
 const pct = frac*100;
 let clip;
 if(dir === 1){ // turning to next: reveal from right
  clip = `polygon(0 0, calc(100% - ${pct}%) 0, calc(100% - ${pct}% - ${NOTCH}px) 50%, calc(100% - ${pct}%) 100%, 0 100%)`;
 } else if(dir === -1){ // turning to prev: reveal from left
  clip = `polygon(${pct}% 0, 100% 0, 100% 100%, ${pct}% 100%, calc(${pct}% + ${NOTCH}px) 50%)`;
 } else { clip = "none"; }
 el.pageFront.style.clipPath = clip;
 const angle = frac*6*dir;
 el.pageFront.style.transform = `perspective(1800px) rotateY(${-angle}deg)`;
 // fold shadow/highlight overlay
 const edgePct = dir===1 ? (100-pct) : (pct);
 el.foldShadow.style.opacity = frac>0.002 ? 1 : 0;
 const w = 70;
 if(dir===1){
  el.foldShadow.style.background = `linear-gradient(to left, ${hex(pctToLo(frac))} 0%, transparent ${w}px)`;
  el.foldShadow.style.left = `calc(${edgePct}% - ${w}px)`; el.foldShadow.style.right = "auto"; el.foldShadow.style.width = w+"px";
 } else if(dir===-1){
  el.foldShadow.style.background = `linear-gradient(to right, ${hex(pctToLo(frac))} 0%, transparent ${w}px)`;
  el.foldShadow.style.right = `calc(${100-edgePct}% - ${w}px)`; el.foldShadow.style.left="auto"; el.foldShadow.style.width = w+"px";
 }
}
function pctToLo(f){ return getComputedStyle(document.documentElement).getPropertyValue('--fold-lo').trim() || "rgba(0,0,0,.3)"; }
function hex(v){ return v; }
function resetCurl(){
 el.pageFront.style.clipPath = "none";
 el.pageFront.style.transform = "none";
 el.foldShadow.style.opacity = 0;
}

function canGo(dir){
 return dir===1 ? S.idx < POSTS.length-1 : S.idx > 0;
}
function showBoundary(dir){
 el.hint.textContent = dir===1 ? "The end of this collection" : "The beginning of this collection";
 el.hint.classList.add("show");
 clearTimeout(showBoundary._t);
 showBoundary._t = setTimeout(()=> el.hint.classList.remove("show"), 900);
}

function beginDrag(dir, x, y){
 if(S.state !== "idle") return;
 S.state = "dragging"; S.dir = dir; S.dragStartX = x; S.dragStartY = y; S.lastX = x; S.lastT = performance.now();
 el.bookWrap.classList.add("gesture-lock");
 if(canGo(dir)) mountPage(el.pageBehind, POSTS[S.idx+dir], "behind"); else el.pageBehind.innerHTML="";
}
function updateDrag(x){
 if(S.state !== "dragging") return;
 const width = el.bookWrap.clientWidth || 860;
 const dx = x - S.dragStartX;
 // direction follows the live swipe, not the starting side: left = next, right = previous
 const liveDir = dx < 0 ? 1 : (dx > 0 ? -1 : S.dir);
 if(liveDir !== S.dir){
  S.dir = liveDir;
  if(canGo(liveDir)) mountPage(el.pageBehind, POSTS[S.idx+liveDir], "behind"); else el.pageBehind.innerHTML="";
 }
 let raw = Math.abs(dx) / width;
 const boundary = !canGo(S.dir);
 let frac = boundary ? Math.min(raw*0.35, 0.09) : Math.min(raw, 1);
 const now = performance.now();
 const dt = Math.max(now - S.lastT, 1);
 S.vel = (x - S.lastX) / dt; S.lastX = x; S.lastT = now;
 S.frac = frac;
 if(S.reduced){ return; } // no visual curl in reduced motion; commit on release only
 setCurl(S.dir, frac);
}
function endDrag(){
 if(S.state !== "dragging") return;
 const boundary = !canGo(S.dir);
 if(boundary){
  S.state = "cancelling";
  animateTo(0, ()=>{ resetCurl(); S.state="idle"; S.frac=0; el.bookWrap.classList.remove("gesture-lock"); showBoundary(S.dir); });
  return;
 }
 const speedCommit = Math.abs(S.vel) > 0.9 && S.frac > 0.06;
 const commit = S.frac > 0.38 || speedCommit;
 if(commit){
  S.state = "completing";
  animateTo(1, ()=> completeTurn(S.dir));
 } else {
  S.state = "cancelling";
  animateTo(0, ()=>{ resetCurl(); S.state="idle"; S.frac=0; el.bookWrap.classList.remove("gesture-lock"); });
 }
}
function animateTo(target, done){
 if(S.reduced){
  if(target===1){ done(); } else { S.state="idle"; S.frac=0; done && done(); }
  return;
 }
 const start = S.frac, t0 = performance.now(), dur = 260;
 function step(now){
  const p = Math.min((now-t0)/dur, 1);
  const eased = 1 - Math.pow(1-p, 3);
  S.frac = start + (target-start)*eased;
  setCurl(S.dir, S.frac);
  if(p < 1) requestAnimationFrame(step); else done && done();
 }
 requestAnimationFrame(step);
}
function completeTurn(dir){
 S.idx += dir;
 resetCurl();
 el.pageFront.className = "page front" + (POSTS[S.idx].saved?" saved":"");
 el.pageFront.innerHTML = "";
 el.pageFront.appendChild(renderPost(POSTS[S.idx]));
 el.pageBehind.innerHTML = "";
 S.state = "idle"; S.frac = 0;
 el.bookWrap.classList.remove("gesture-lock");
 updateProgress();
 announce(`${POSTS[S.idx].type} by ${POSTS[S.idx].author}`);
}

function goTo(dir){
 if(S.state !== "idle") return;
 if(!canGo(dir)){ showBoundary(dir); return; }
 beginDrag(dir, 0, 0);
 S.state = "completing";
 animateTo(1, ()=> completeTurn(dir));
}

/* ---- gesture wiring: whole page supports horizontal turning; axis-lock arbitrates vs vertical scroll ---- */
const NO_TURN_SEL = 'button, a, textarea, input, .tag, .comments, .morewrap, [role="menu"]';
function onPointerDown(e){
 if(S.state !== "idle" || S.candidate) return;
 if(e.pointerType === "mouse" && e.button !== 0) return;
 if(e.target.closest(NO_TURN_SEL)) return; // interactive elements & comments never arm a page turn
 S.candidate = {startX:e.clientX, startY:e.clientY, pointerId:e.pointerId, committed:false};
}
function onPointerMove(e){
 if(!S.candidate || e.pointerId !== S.candidate.pointerId) return;
 const dx = e.clientX - S.candidate.startX, dy = e.clientY - S.candidate.startY;
 if(!S.candidate.committed){
  if(Math.abs(dx) > 10 && Math.abs(dx) > Math.abs(dy)*1.2){
   S.candidate.committed = true;
   const dir = dx < 0 ? 1 : -1; // left = next, right = previous
   beginDrag(dir, S.candidate.startX, S.candidate.startY);
  } else if(Math.abs(dy) > 10){
   S.candidate = null; return; // vertical intent confirmed: hand off to native scroll entirely
  } else return; // ambiguous yet — don't touch scroll or turn
 }
 if(S.candidate && S.candidate.committed){
  e.preventDefault();
  updateDrag(e.clientX);
 }
}
function onPointerUp(e){
 if(!S.candidate || e.pointerId !== S.candidate.pointerId){ return; }
 const wasCommitted = S.candidate.committed;
 S.candidate = null;
 if(wasCommitted) endDrag();
}
el.bookWrap.addEventListener("pointerdown", onPointerDown);
window.addEventListener("pointermove", onPointerMove, {passive:false});
window.addEventListener("pointerup", onPointerUp);
window.addEventListener("pointercancel", onPointerUp);

/* keyboard */
window.addEventListener("keydown", e=>{
 const tag = (document.activeElement && document.activeElement.tagName) || "";
 if(tag==="TEXTAREA" || tag==="INPUT") return;
 if(e.key==="ArrowRight" || e.key===" "){ e.preventDefault(); goTo(1); }
 else if(e.key==="ArrowLeft"){ e.preventDefault(); goTo(-1); }
});

/* wheel-at-boundary */
let wheelLock = false;
el.bookWrap.addEventListener("wheel", e=>{
 const scroller = el.pageFront.querySelector(".page-scroll");
 if(!scroller) return;
 const atBottom = scroller.scrollTop + scroller.clientHeight >= scroller.scrollHeight - 4;
 const atTop = scroller.scrollTop <= 2;
 if(e.deltaY > 12 && atBottom && !wheelLock){ wheelLock=true; goTo(1); setTimeout(()=>wheelLock=false, 500); }
 else if(e.deltaY < -12 && atTop && !wheelLock){ wheelLock=true; goTo(-1); setTimeout(()=>wheelLock=false, 500); }
}, {passive:true});

/* resize / orientation safety: cancel any in-progress gesture or animation cleanly.
   NOTE: mobile Chrome fires window "resize" mid-touch when its URL bar collapses
   on the very first scroll/drag sample (height-only change) — that used to abort
   every page-turn gesture before it could complete, which is why dragging appeared
   broken specifically on mobile Chrome. Our curl math only depends on width, so we
   now only cancel on an actual width change (rotation/real resize), not on the
   address-bar-driven height change. */
let __lastVpWidth = window.innerWidth;
window.addEventListener("resize", ()=>{
 const w = window.innerWidth;
 if(Math.abs(w - __lastVpWidth) < 2){ return; } // height-only change (e.g. mobile Chrome URL bar) — ignore
 __lastVpWidth = w;
 if(S.state!=="idle"){ resetCurl(); S.state="idle"; S.frac=0; S.candidate=null; el.pageBehind.innerHTML=""; }
});

/* ============ 5. THEME ============ */
const THEME_KEY = "journals_theme";
function applyTheme(t){
 document.documentElement.setAttribute("data-theme", t);
 localStorage.setItem(THEME_KEY, t);
 document.querySelectorAll(".swatch").forEach(s=> s.classList.toggle("active", s.dataset.t===t));
}
applyTheme(localStorage.getItem(THEME_KEY) || "classic");
el.themeBtn.addEventListener("click", ()=>{
 const open = el.themePop.classList.toggle("open");
 el.themeBtn.setAttribute("aria-expanded", open);
});
document.querySelectorAll(".swatch").forEach(s=>{
 s.addEventListener("click", ()=>{
  if(S.state !== "idle") return; // don't switch mid-transition
  applyTheme(s.dataset.t);
 });
});
document.addEventListener("click", e=>{
 if(!el.themePop.contains(e.target) && e.target!==el.themeBtn && !el.themeBtn.contains(e.target)){
  el.themePop.classList.remove("open"); el.themeBtn.setAttribute("aria-expanded","false");
 }
});

el.backBtn.addEventListener("click", ()=>{ announce("Returning to Discover"); });

})();
</script>

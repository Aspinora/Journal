<!DOCTYPE html>
<html lang="en" data-theme="classic">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Journals — Reader</title>
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:ital,wght@0,400;0,600;1,400&family=Lora:ital,wght@0,400;0,600;1,400&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.1"></script>
<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --serif-lit:'Source Serif 4',Georgia,serif;
  --serif-mod:'Lora',Georgia,serif;
  --sans:'Inter',-apple-system,sans-serif;
}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;height:100%;background:var(--env);font-family:var(--sans);overflow:hidden}

/* ---------- THEMES ---------- */
:root[data-theme="classic"]{--env:#e9e3d3;--env2:#ded5bf;--paper:#f7f3ea;--paper2:#f1ead9;--ink:#2b2620;--soft:#6b6252;--border:rgba(43,38,32,.12);--shadow:rgba(43,38,32,.28);--accent:#8a5a3b;--fold-hi:rgba(255,255,255,.55);--fold-lo:rgba(0,0,0,.28);}
:root[data-theme="ivory"]{--env:#f0ece2;--env2:#e6e0d1;--paper:#fbf8f2;--paper2:#f5efe2;--ink:#2e2a24;--soft:#786f5f;--border:rgba(46,42,36,.10);--shadow:rgba(46,42,36,.22);--accent:#9c6b3f;--fold-hi:rgba(255,255,255,.6);--fold-lo:rgba(0,0,0,.22);}
:root[data-theme="oldschool"]{--env:#cdb98c;--env2:#bfa877;--paper:#e9dcc0;--paper2:#e0cfab;--ink:#3a2c18;--soft:#6e5a3c;--border:rgba(58,44,24,.18);--shadow:rgba(35,25,10,.4);--accent:#7a4a24;--fold-hi:rgba(255,247,220,.5);--fold-lo:rgba(20,12,2,.4);}
:root[data-theme="dark"]{--env:#171310;--env2:#0f0c0a;--paper:#2a231b;--paper2:#241e17;--ink:#ece3d2;--soft:#b7ab93;--border:rgba(236,227,210,.10);--shadow:rgba(0,0,0,.6);--accent:#d9a45c;--fold-hi:rgba(255,235,200,.12);--fold-lo:rgba(0,0,0,.55);}
:root[data-theme="midnight"]{--env:#090b0f;--env2:#05060a;--paper:#161a21;--paper2:#12151b;--ink:#e6e9ee;--soft:#97a1ad;--border:rgba(230,233,238,.08);--shadow:rgba(0,0,0,.7);--accent:#7fb0ff;--fold-hi:rgba(180,210,255,.10);--fold-lo:rgba(0,0,0,.6);}
:root[data-theme="minimal"]{--env:#f2f2f0;--env2:#e9e9e6;--paper:#ffffff;--paper2:#fafafa;--ink:#171717;--soft:#6b6b6b;--border:rgba(0,0,0,.08);--shadow:rgba(0,0,0,.15);--accent:#171717;--fold-hi:rgba(255,255,255,.7);--fold-lo:rgba(0,0,0,.14);}

body{background:radial-gradient(ellipse at 50% -10%, var(--env2), var(--env));color:var(--ink);transition:background .35s ease,color .35s ease}

/* ---------- SHELL ---------- */
.app-shell{position:relative;height:100vh;height:100dvh;display:flex;flex-direction:column;overflow:hidden}
.topbar{position:relative;z-index:40;display:flex;align-items:center;justify-content:space-between;padding:calc(env(safe-area-inset-top,0px) + 14px) 18px 10px;font-family:var(--sans)}
.iconbtn{display:inline-flex;align-items:center;gap:7px;background:transparent;border:none;color:var(--soft);font-size:13px;font-family:var(--sans);letter-spacing:.02em;cursor:pointer;padding:8px 10px;border-radius:8px;transition:color .2s,background .2s}
.iconbtn:hover{color:var(--ink);background:var(--border)}
.iconbtn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.progressline{position:absolute;left:0;right:0;top:calc(env(safe-area-inset-top,0px) + 2px);height:2px;background:var(--border)}
.progressfill{height:100%;background:var(--accent);width:0%;transition:width .35s ease}

.theme-pop{position:absolute;top:100%;right:18px;margin-top:6px;background:var(--paper);border:1px solid var(--border);border-radius:12px;padding:10px;display:none;gap:8px;box-shadow:0 10px 30px var(--shadow);z-index:50}
.theme-pop.open{display:flex}
.swatch{width:26px;height:26px;border-radius:50%;border:2px solid transparent;cursor:pointer;position:relative}
.swatch[data-t="classic"]{background:#f7f3ea}
.swatch[data-t="ivory"]{background:#fbf8f2}
.swatch[data-t="oldschool"]{background:#e9dcc0}
.swatch[data-t="dark"]{background:#2a231b}
.swatch[data-t="midnight"]{background:#161a21}
.swatch[data-t="minimal"]{background:#ffffff}
.swatch.active{border-color:var(--accent)}

/* ---------- STAGE ---------- */
.stage{position:relative;flex:1;min-height:0;display:flex;align-items:center;justify-content:center;padding:6px 0 18px}
.book-wrap{position:relative;width:min(860px,94vw);height:100%;max-height:calc(100% - 4px);perspective:1800px;touch-action:pan-y}
.book-wrap.gesture-lock{-webkit-user-select:none;user-select:none}

.page{position:absolute;inset:0;background:var(--paper);border-radius:2px;box-shadow:0 1px 2px var(--shadow),0 26px 64px -22px var(--shadow);overflow:hidden;will-change:transform,clip-path}
.page.behind{z-index:5;filter:brightness(.94)}
.page.front{z-index:10}
.page::before{content:"";position:absolute;inset:0;pointer-events:none;background:repeating-linear-gradient(0deg,rgba(0,0,0,.012) 0 1px,transparent 1px 3px);mix-blend-mode:multiply;opacity:.5;z-index:1}
.page::after{content:"";position:absolute;left:0;top:0;bottom:0;width:22px;pointer-events:none;background:linear-gradient(to right, var(--fold-lo) 0%, transparent 100%);opacity:.35;z-index:1}
.page-scroll{position:relative;height:100%;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;scrollbar-width:thin}
.page-scroll:focus{outline:none}

.cover{position:relative;width:100%;aspect-ratio:3/2;overflow:hidden}
@media (orientation:landscape) and (min-width:700px){
 .cover{max-height:30vh;width:auto;max-width:100%;margin:0 auto}
}
.cover img,.cover .grad{width:100%;height:100%;object-fit:cover;display:block}
.cover .grad{display:flex;align-items:flex-end;padding:18px;font-family:var(--serif-lit);font-style:italic;color:rgba(255,255,255,.92);font-size:15px}
.cover .type-chip{position:absolute;top:14px;left:14px;font-family:var(--sans);font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:#fff;background:rgba(0,0,0,.32);backdrop-filter:blur(2px);padding:5px 10px;border-radius:20px}

.meta{padding:22px 26px 0}
h1.title{font-family:var(--serif-lit);font-weight:600;font-size:clamp(24px,4vw,32px);line-height:1.18;margin:2px 0 6px;color:var(--ink)}
.subtitle{font-family:var(--serif-mod);font-style:italic;color:var(--soft);font-size:15px;line-height:1.5;margin:0 0 16px}
.byline{display:flex;align-items:center;gap:10px;padding-bottom:14px;border-bottom:1px solid var(--border);margin-bottom:18px}
.meta-divider{height:1px;background:var(--border);margin:16px 0 18px}
.avatar{width:36px;height:36px;border-radius:50%;flex:none;display:flex;align-items:center;justify-content:center;color:#fff;font-family:var(--serif-mod);font-size:13px}
.byline-id{flex:1;min-width:0}
.byline-name{font-size:13.5px;font-weight:600;color:var(--ink);line-height:1.3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.byline-uname{font-size:12px;color:var(--soft);line-height:1.3}
.byline-sub{font-size:11px;color:var(--soft);opacity:.85;margin-top:2px}
.byline-dot{opacity:.5;margin:0 4px}
.followbtn{flex:none;font-family:var(--sans);font-size:11.5px;font-weight:600;color:var(--accent);background:transparent;border:1px solid var(--accent);border-radius:20px;padding:6px 13px;cursor:pointer;letter-spacing:.02em;transition:background .18s,color .18s}
.followbtn:hover{background:var(--accent);color:var(--paper)}
.followbtn.following{color:var(--soft);border-color:var(--border);background:transparent}
.followbtn.following:hover{background:var(--border);color:var(--ink)}

.article{padding:0 26px;font-family:var(--serif-mod);font-size:17.5px;line-height:1.85;color:var(--ink)}
.article p{margin:0 0 1.15em}
.article .dropcap{float:left;font-family:var(--serif-lit);font-weight:600;font-size:2.7em;line-height:.74;margin:.03em .05em 0 0;padding:0;color:var(--accent)}
.article .rt-h{font-family:var(--serif-lit);font-weight:600;color:var(--ink);line-height:1.28;margin:1em 0 .5em}
.article h2.rt-h{font-size:1.35em}
.article h3.rt-h{font-size:1.15em}
.article h4.rt-h{font-size:1em;text-transform:uppercase;letter-spacing:.04em;color:var(--soft)}
.article .rt-quote{margin:1em 0;padding:.2em 0 .2em 1.1em;border-left:2px solid var(--accent);font-style:italic;color:var(--soft)}
.article .rt-list{margin:0 0 1.15em;padding-left:1.3em}
.article .rt-list li{margin:0 0 .4em}
.article mark{background:transparent;color:var(--accent);font-weight:600;background-image:linear-gradient(transparent 62%, var(--fold-hi) 62%)}
.article a{color:var(--accent);text-decoration:underline;text-underline-offset:2px}
.article.poetry{font-style:italic;font-family:var(--serif-lit)}
.article.poetry p{margin:0 0 .9em}
.article.short{display:flex;align-items:center;min-height:38vh;font-size:20px;text-align:center;justify-content:center;font-style:italic}

.tags{display:flex;flex-wrap:wrap;gap:8px;padding:6px 26px 4px}
.tag{font-family:var(--sans);font-size:11.5px;color:var(--soft);border:1px solid var(--border);padding:4px 11px;border-radius:20px}

.actionbar{display:flex;align-items:center;gap:4px;padding:16px 20px;margin:14px 26px 6px;border-top:1px solid var(--border);border-bottom:1px solid var(--border)}
.act{display:flex;align-items:center;gap:6px;background:none;border:none;color:var(--soft);font-family:var(--sans);font-size:12.5px;cursor:pointer;padding:8px 10px;border-radius:8px;transition:color .18s}
.act:hover{color:var(--ink)}
.act svg{width:17px;height:17px;stroke:currentColor;fill:none;stroke-width:1.6;transition:transform .18s ease}
.act.liked{color:#c0563f}
.act.liked svg{fill:#c0563f;stroke:#c0563f;transform:scale(1.12)}
.act.saved{color:var(--accent)}
.act.saved svg{fill:var(--accent);stroke:var(--accent)}
.actionbar .spacer{flex:1}
.ribbon{position:absolute;top:0;right:22px;width:20px;height:0;background:var(--accent);clip-path:polygon(0 0,100% 0,100% 100%,50% 78%,0 100%);transition:height .25s cubic-bezier(.2,.9,.3,1.2);z-index:20}
.page.saved .ribbon{height:46px}

.comments{padding:6px 26px 40px;font-family:var(--sans)}
.comments h3{font-size:12.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--soft);font-weight:600;margin:10px 0 14px}
.newcomment{display:flex;gap:10px;margin-bottom:18px}
.newcomment textarea{flex:1;resize:none;border:1px solid var(--border);background:var(--paper2);color:var(--ink);border-radius:10px;padding:9px 11px;font-family:var(--sans);font-size:13px;min-height:38px;line-height:1.4}
.newcomment button{align-self:flex-end;border:none;background:var(--accent);color:var(--paper);font-size:12px;font-weight:600;padding:9px 14px;border-radius:8px;cursor:pointer}
.comment{display:flex;gap:10px;margin-bottom:16px}
.comment .avatar{width:28px;height:28px;font-size:11px}
.c-body{flex:1;min-width:0}
.c-head{font-size:12.5px}
.c-head b{color:var(--ink);font-weight:600}
.c-head .t{color:var(--soft);margin-left:6px}
.c-text{font-size:13.5px;line-height:1.55;color:var(--ink);margin:3px 0 6px}
.c-actions{display:flex;gap:14px;font-size:11.5px;color:var(--soft)}
.c-actions button{background:none;border:none;color:inherit;cursor:pointer;font:inherit;padding:0}
.c-actions button:hover{color:var(--ink)}
.replies{margin-top:10px;padding-left:16px;border-left:1px solid var(--border)}
.creport-menu{margin-top:8px;padding:5px;border:1px solid var(--border);border-radius:9px;background:var(--paper2);display:flex;flex-direction:column;gap:1px;max-width:240px}
.creport-menu[hidden]{display:none}
.creport-menu button{width:100%;text-align:left;background:none;border:none;color:var(--ink);font-size:11.5px;padding:6px 8px;border-radius:6px;cursor:pointer;font-family:var(--sans)}
.creport-menu button:hover{background:var(--border)}
.no-comments{color:var(--soft);font-size:13px;font-style:italic;padding:10px 0}

/* ---------- MORE / REPORT MENU ---------- */
.morewrap{position:relative;display:inline-block}
.moremenu{position:absolute;bottom:calc(100% + 6px);right:0;width:250px;max-height:62vh;overflow-y:auto;background:var(--paper);border:1px solid var(--border);border-radius:12px;padding:6px;box-shadow:0 14px 40px var(--shadow);display:none;z-index:60;font-family:var(--sans)}
.moremenu.open{display:block}
.moremenu button{width:100%;text-align:left;background:none;border:none;color:var(--ink);font-size:13px;padding:9px 10px;border-radius:8px;cursor:pointer;font-family:var(--sans)}
.moremenu button:hover{background:var(--border)}
.moremenu .mm-label{font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--soft);padding:8px 10px 4px;font-weight:600}
.moremenu .mm-div{height:1px;background:var(--border);margin:4px 2px}
.moremenu .mm-copyright{color:var(--accent)}
.moremenu .mm-copyright-note{font-size:11px;color:var(--soft);padding:0 10px 6px;line-height:1.4}

/* fold shadow overlay drawn on front page while dragging */
.foldshadow{position:absolute;inset:0;pointer-events:none;z-index:12;opacity:0}

.boundary-hint{position:absolute;left:50%;bottom:10px;transform:translateX(-50%);font-family:var(--sans);font-size:11px;color:var(--soft);opacity:0;transition:opacity .3s;pointer-events:none}
.boundary-hint.show{opacity:.8}

@media(prefers-color-scheme:dark){}
::selection{background:var(--accent);color:var(--paper)}
.page-scroll::-webkit-scrollbar{width:6px}
.page-scroll::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px}

.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0)}

/* ---------- live-data additions ---------- */
.avatar img{width:100%;height:100%;object-fit:cover;border-radius:50%;display:block}
.byline-id, .byline-name, .c-head, .c-head b{min-width:0}
a.byline-link{display:flex;align-items:center;gap:10px;flex:1;min-width:0;color:inherit;text-decoration:none}
.followbtn:disabled{opacity:.55;cursor:default}
.article figure.body-img-16x9{margin:1.3em 0;aspect-ratio:16/9;overflow:hidden;border-radius:6px}
.article figure.body-img-16x9 img{width:100%;height:100%;object-fit:cover;display:block}
.load-state{display:flex;align-items:center;justify-content:center;height:100%;padding:40px;font-family:var(--serif-mod);font-style:italic;color:var(--soft);text-align:center}
.load-state a{color:var(--accent);text-decoration:underline}
.newcomment textarea:disabled{opacity:.6}
.guest-note{font-size:11.5px;color:var(--soft);padding:0 0 10px}
.guest-note a{color:var(--accent);text-decoration:underline}
</style>
</head>
<body>
<div class="app-shell" id="app">
  <div class="progressline"><div class="progressfill" id="progressFill"></div></div>
  <header class="topbar">
    <button class="iconbtn" id="backBtn" aria-label="Back to Discover">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 18l-6-6 6-6"/></svg>
      Discover
    </button>
    <div style="position:relative">
      <button class="iconbtn" id="themeBtn" aria-haspopup="true" aria-expanded="false" aria-label="Reading theme">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M12 3a9 9 0 000 18z" fill="currentColor" stroke="none"/></svg>
        Theme
      </button>
      <div class="theme-pop" id="themePop" role="menu">
        <button class="swatch" data-t="classic" title="Classic Paper" aria-label="Classic Paper"></button>
        <button class="swatch" data-t="ivory" title="Ivory" aria-label="Ivory"></button>
        <button class="swatch" data-t="oldschool" title="Old School" aria-label="Old School"></button>
        <button class="swatch" data-t="dark" title="Dark Paper" aria-label="Dark Paper"></button>
        <button class="swatch" data-t="midnight" title="Midnight" aria-label="Midnight"></button>
        <button class="swatch" data-t="minimal" title="Minimal" aria-label="Minimal"></button>
      </div>
    </div>
  </header>

  <div class="stage" id="stage">
    <div class="book-wrap" id="bookWrap">
      <div class="page behind" id="pageBehind"></div>
      <div class="page front" id="pageFront"></div>
      <div class="foldshadow" id="foldShadow"></div>
      <div class="boundary-hint" id="boundaryHint">The beginning of this collection</div>
    </div>
  </div>
</div>
<div class="sr-only" role="status" aria-live="polite" id="liveRegion"></div>
<div class="sr-only">Turn pages by dragging from the left or right edge of the page, or with the arrow keys.</div>

<script>
(function(){
"use strict";

/* ============ 0. SUPABASE + SHARED HELPERS ============
   Same project/keys as index.html, userpostlogin.html, portfolio.html.
   This file is a completely independent page — it never shares a
   process with userpostlogin.html, so every piece of data it needs
   (session, journal, comments, likes, follows) is fetched here. */
const SUPABASE_URL = 'https://txrtxienudcwpywfnqtj.supabase.co';
const SUPABASE_ANON_KEY = 'sb_publishable_IynOGfqeFgK0-orZTt5c5Q_gkG1aFJy';
let supabaseClient = null;
try{
  if (window.supabase){
    supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY, {
      auth: { persistSession: true, autoRefreshToken: true, detectSessionInUrl: true }
    });
  }
}catch(e){ console.warn('Supabase client not initialised:', e); }

const CATEGORIES = [
  { id:1, name:'Journals',  color:'#8A6B3D' },
  { id:2, name:'Stories',   color:'#3D5A73' },
  { id:3, name:'Poetry',    color:'#5B4A7A' },
  { id:4, name:'Shayari',   color:'#8A3A45' },
  { id:5, name:'Thoughts',  color:'#7A6B2E' },
  { id:6, name:'Articles',  color:'#3D5A73' }
];
function categoryById(id){ return CATEGORIES.find(function(c){ return c.id === id; }) || CATEGORIES[0]; }

const AVATAR_PALETTE = ['#F1631B','#A79BD1','#7FB8D9','#7FC8A9','#D4A24C','#FF8B6B'];
function avatarColor(seed){
  seed = String(seed || '');
  let hash = 0;
  for (let i=0;i<seed.length;i++){ hash = (hash * 31 + seed.charCodeAt(i)) >>> 0; }
  return AVATAR_PALETTE[hash % AVATAR_PALETTE.length];
}
function esc(s){ const d = document.createElement('div'); d.textContent = (s==null ? '' : String(s)); return d.innerHTML; }
function initialsOf(name){
  if (!name) return '?';
  return name.trim().split(/\s+/).map(function(w){ return w[0]; }).join('').slice(0,2).toUpperCase();
}
function wordCount(text){ const t=(text||'').trim(); return t ? t.split(/\s+/).length : 0; }
function readingTimeMinutes(words){ return Math.max(1, Math.round(words/200)); }
function formatDateShort(iso){ return iso ? new Date(iso).toLocaleDateString(undefined,{month:'short',day:'numeric'}) : ''; }
function formatRelTime(iso){
  const then = new Date(iso).getTime(), now = Date.now();
  const diffSec = Math.max(1, Math.round((now-then)/1000));
  const mins=Math.round(diffSec/60), hrs=Math.round(diffSec/3600), days=Math.round(diffSec/86400);
  if (diffSec<60) return 'just now';
  if (mins<60) return mins+(mins===1?' minute ago':' minutes ago');
  if (hrs<24) return hrs+(hrs===1?' hour ago':' hours ago');
  if (days<7) return days+(days===1?' day ago':' days ago');
  return new Date(iso).toLocaleDateString(undefined,{month:'short',day:'numeric',year:'numeric'});
}

/* Inline + block Markdown -> safe HTML. Ported verbatim from
   userpostlogin.html's markdownToHtml()/inlineMd() so a Work reads
   identically here as it does anywhere else in the app (same
   headings/quotes/lists/16:9 paragraph-image syntax/line breaks). */
function inlineMd(text){
  text = text.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
  text = text.replace(/(^|[^*])\*(?!\s)(.+?)(?!\s)\*(?!\*)/g, '$1<em>$2</em>');
  text = text.replace(/\[(.+?)\]\((https?:\/\/[^\s)]+)\)/g, '<a href="$2" target="_blank" rel="noopener noreferrer">$1</a>');
  return text;
}
function markdownToHtml(md){
  if (!md) return '';
  let src = esc(md).replace(/\r\n/g, '\n');
  const lines = src.split('\n');
  let html = '';
  let inList = null;
  let paragraph = [];
  function flushParagraph(){
    if (paragraph.length){ html += '<p>' + paragraph.map(inlineMd).join('<br>') + '</p>'; paragraph = []; }
  }
  function closeList(){ if (inList){ html += '</' + inList + '>'; inList = null; } }
  lines.forEach(function(line){
    const trimmed = line.trim();
    if (trimmed === ''){ flushParagraph(); closeList(); return; }
    if (/^---+$/.test(trimmed)){ flushParagraph(); closeList(); html += '<hr>'; return; }
    let m;
    if ((m = trimmed.match(/^(#{1,3})\s+(.*)$/))){
      flushParagraph(); closeList();
      const level = m[1].length === 1 ? 'h2' : 'h3';
      html += '<' + level + '>' + inlineMd(m[2]) + '</' + level + '>';
      return;
    }
    if ((m = trimmed.match(/^>\s?(.*)$/))){
      flushParagraph(); closeList();
      html += '<blockquote>' + inlineMd(m[1]) + '</blockquote>';
      return;
    }
    if ((m = trimmed.match(/^!\[(.*?)\]\((https?:\/\/[^\s)]+)\)$/))){
      flushParagraph(); closeList();
      html += '<figure class="body-img-16x9"><img src="' + m[2] + '" alt="' + m[1] + '" loading="lazy" decoding="async"></figure>';
      return;
    }
    if ((m = trimmed.match(/^[-*]\s+(.*)$/))){
      flushParagraph();
      if (inList !== 'ul'){ closeList(); html += '<ul>'; inList = 'ul'; }
      html += '<li>' + inlineMd(m[1]) + '</li>';
      return;
    }
    if ((m = trimmed.match(/^\d+\.\s+(.*)$/))){
      flushParagraph();
      if (inList !== 'ol'){ closeList(); html += '<ol>'; inList = 'ol'; }
      html += '<li>' + inlineMd(m[1]) + '</li>';
      return;
    }
    closeList();
    paragraph.push(trimmed);
  });
  flushParagraph(); closeList();
  return html;
}

async function rpcByUsernameSlug(username, slug){
  const { data, error } = await supabaseClient.rpc('get_journal_by_username_slug', { p_username: username, p_slug: slug });
  if (error) throw error;

async function rpcById(id){

  if (error) throw error;
  return data || null;

function findComment(post, id){
  id = String(id);
  function walk(list){
    for (let i=0;i<list.length;i++){
      const c = list[i];
      if (String(c.id) === id) return c;
      if (c.replies && c.replies.length){ const f = walk(c.replies); if (f) return f; }
    }
    return null;
  }
  return walk(post.comments);
}
function removeCommentFromTree(post, id){
  id = String(id);
  post.comments = post.comments.filter(function(c){ return String(c.id) !== id; });
  post.comments.forEach(function(c){ if (c.replies) c.replies = c.replies.filter(function(r){ return String(r.id) !== id; }); });
}
async function fetchMyCommentLikes(ids){
  if (!ids.length || !S.me) return new Set();
  const { data } = await supabaseClient.from('comment_likes').select('comment_id').eq('user_id', S.me.id).in('comment_id', ids);
  return new Set((data||[]).map(function(r){ return r.comment_id; }));
}
async function fetchCommentsTree(journalId){
  const { data, error } = await supabaseClient.from('comments')
    .select('id, journal_id, parent_id, author_id, body, created_at, likes, status, profiles!comments_author_id_fkey(display_name, username, avatar_url)')
    .eq('journal_id', journalId).eq('status', 'visible')
    .order('created_at', { ascending: true });
  if (error){ console.error(error); return []; }
  const likedSet = await fetchMyCommentLikes(data.map(function(c){ return c.id; }));
  const byId = {};
  data.forEach(function(c){ c.replies = []; c.likedByMe = likedSet.has(c.id); byId[c.id] = c; });
  const roots = [];
  data.forEach(function(c){
    if (c.parent_id && byId[c.parent_id]) byId[c.parent_id].replies.push(c);
    else if (!c.parent_id) roots.push(c);
  });
  return roots;
}

  const post = {
    id: row.id, slug: row.slug, authorId: row.author_id,
    type: cat.name, title: row.title, subtitle: row.subtitle || '',
    author: authorName, username: authorUsername, avatarColorHex: avatarColor(row.author_id), avatarUrl: authorAvatarUrl,
    date: formatDateShort(row.published_at), publishedAt: row.published_at, read: readingTimeMinutes(words) + ' min',
    tags: row.tags || [], coverUrl: row.cover_url || null,

    isOwn: !!(S.me && S.me.id === row.author_id),

  };
  if (S.me && !post.isOwn){
    const [likeRes, bmRes, folRes] = await Promise.all([

      supabaseClient.from('bookmarks').select('journal_id').eq('journal_id', post.id).eq('user_id', S.me.id).maybeSingle(),
      supabaseClient.from('follows').select('follower_id').eq('follower_id', S.me.id).eq('following_id', post.authorId).maybeSingle()
    ]);
    post.liked = !!(likeRes && likeRes.data);
    post.saved = !!(bmRes && bmRes.data);
    post.following = !!(folRes && folRes.data);
  } else if (S.me && post.isOwn){
    const [likeRes, bmRes] = await Promise.all([
      supabaseClient.from('journal_likes').select('journal_id').eq('journal_id', post.id).eq('user_id', S.me.id).maybeSingle(),
      supabaseClient.from('bookmarks').select('journal_id').eq('journal_id', post.id).eq('user_id', S.me.id).maybeSingle()
    ]);
    post.liked = !!(likeRes && likeRes.data);
    post.saved = !!(bmRes && bmRes.data);
  }
  post.comments = await fetchCommentsTree(post.id);
  return post;
}
async function fetchAdjacentRef(post, dir){
  if (!post || !post.publishedAt) return null;
  let q = supabaseClient.from('journals')
    .select('id, slug, title, category_id, cover_url, author_id, published_at, profiles!journals_author_id_fkey(display_name, username)')
    .eq('status','published').eq('visibility','public');
  if (dir === 1) q = q.lt('published_at', post.publishedAt).order('published_at', {ascending:false}).order('id', {ascending:false});
  else q = q.gt('published_at', post.publishedAt).order('published_at', {ascending:true}).order('id', {ascending:true});
  const { data, error } = await q.limit(1);
  if (error || !data || !data.length) return null;
  const row = data[0];
  const cat = categoryById(row.category_id);
  return {
    id: row.id, slug: row.slug, title: row.title, type: cat.name,
    coverUrl: row.cover_url || null, grad: 'linear-gradient(135deg,' + cat.color + ',#20140c)',
    authorId: row.author_id, author: (row.profiles && row.profiles.display_name) || 'Aspinora Member',
    username: (row.profiles && row.profiles.username) || '', publishedAt: row.published_at
  };
}
async function loadNeighbors(post){
  const results = await Promise.all([ fetchAdjacentRef(post, -1), fetchAdjacentRef(post, 1) ]);
  // Guard against a slower neighbour lookup landing after the reader
  // has already turned again — only apply it if we're still on the
  // post it was computed for.
  if (!S.post || S.post.id !== post.id) return;
  S.prevRef = results[0]; S.nextRef = results[1];
}

function applyDropCap(articleEl, kind){
  if (kind !== "long" || !articleEl) return;
  const p = articleEl.querySelector("p");
  if (!p) return;
  const walker = document.createTreeWalker(p, NodeFilter.SHOW_TEXT);
  const node = walker.nextNode();
  if (!node || !node.textContent.trim()) return;
  const text = node.textContent;
  const m = text.match(/^(\s*)(\S)/);
  if (!m) return;
  const cut = m[0].length;
  const frag = document.createDocumentFragment();
  if (text.slice(0,cut-1)) frag.appendChild(document.createTextNode(text.slice(0,cut-1)));
  const span = document.createElement("span");
  span.className = "dropcap"; span.textContent = text[cut-1];
  frag.appendChild(span);
  frag.appendChild(document.createTextNode(text.slice(cut)));
  node.replaceWith(frag);
}

function wireActions(scope, post){
  const likeBtn = scope.querySelector('[data-act="like"]');
  likeBtn.addEventListener("click", function(){
    guardAuth(async function(){
      const was = post.liked;
      post.liked = !was; post.likes += was?-1:1;
      likeBtn.classList.toggle("liked", post.liked);
      likeBtn.querySelector(".cnt").textContent = post.likes;
      try{
        if (was) await supabaseClient.from('journal_likes').delete().eq('journal_id', post.id).eq('user_id', S.me.id);
        else await supabaseClient.from('journal_likes').insert({ journal_id: post.id, user_id: S.me.id });
      }catch(e){
        console.error(e);
        post.liked = was; post.likes += was?1:-1;
        likeBtn.classList.toggle("liked", post.liked);
        likeBtn.querySelector(".cnt").textContent = post.likes;
      }
    });
  });
  function doSave(){
    guardAuth(async function(){
      const btn = scope.querySelector('[data-act="save"]');
      const was = post.saved;
      post.saved = !was;
      btn.classList.toggle("saved", post.saved);
      const pageEl = scope.closest(".page"); if (pageEl) pageEl.classList.toggle("saved", post.saved);
      announce(post.saved ? "Saved to your shelf" : "Removed from your shelf");
      try{
        if (was) await supabaseClient.from('bookmarks').delete().eq('journal_id', post.id).eq('user_id', S.me.id);
        else await supabaseClient.from('bookmarks').insert({ journal_id: post.id, user_id: S.me.id });
      }catch(e){ console.error(e); post.saved = was; btn.classList.toggle("saved", post.saved); }
    });
  }
  function shareUrlFor(p){
    const qs = p.username ? ('?u='+encodeURIComponent(p.username)+'&s='+encodeURIComponent(p.slug)) : ('?id='+encodeURIComponent(p.id));
    return window.location.origin + window.location.pathname + qs;
  }
  async function doShare(){
    const url = shareUrlFor(post);
    if (navigator.share){
      try{ await navigator.share({ title: post.title, url: url }); return; }
      catch(e){ if (e && e.name === "AbortError") return; }
    }
    try{ await navigator.clipboard.writeText(url); announce("Link copied"); }
    catch(e){ announce("Copy this link: " + url); }
  }
  scope.querySelectorAll('[data-act="save"]').forEach(function(b){ b.addEventListener("click", function(){ doSave(); closeMore(scope); }); });
  scope.querySelectorAll('[data-act="share"]').forEach(function(b){ b.addEventListener("click", function(){ doShare(); closeMore(scope); }); });

  });

          else await supabaseClient.from('follows').insert({ follower_id: S.me.id, following_id: post.authorId });
          post.following = !was;
          followBtn.classList.toggle("following", post.following);
          followBtn.textContent = post.following ? 'Following' : 'Follow';
          announce(post.following ? ('Following '+post.author) : ('Unfollowed '+post.author));
        }catch(e){ console.error(e); }
        followBtn.disabled = false;
      });
    });

  });
  const ta = scope.querySelector(".newcomment textarea");
  const postCommentBtn = scope.querySelector('[data-act="post-comment"]');
  if (ta && postCommentBtn){
    postCommentBtn.addEventListener("click", function(){
      const val = ta.value.trim(); if (!val) return;

        postCommentBtn.disabled = true; ta.disabled = true;
        try{
          const { data, error } = await supabaseClient.from('comments').insert({
            journal_id: post.id, author_id: S.me.id, body: val, parent_id: null, status: 'visible'
          }).select('id, journal_id, parent_id, author_id, body, created_at, likes, status').single();
          if (error) throw error;
          data.profiles = { display_name: S.me.display_name, username: S.me.username, avatar_url: S.me.avatar_url };
          data.replies = []; data.likedByMe = false;
          post.comments.unshift(data);
          post.commentCount++;
          ta.value = "";
          refreshCommentsList(scope, post);
        }catch(e){ console.error(e); announce("Couldn't post your response — try again."); }
        postCommentBtn.disabled = false; ta.disabled = false;
      });
    });
  }
  wireCommentToggles(scope);
  scope.addEventListener("click", function(e){
    const likeBtn2 = e.target.closest("[data-clike]");
    if (likeBtn2){
      guardAuth(async function(){
        const id = likeBtn2.getAttribute("data-clike");
        const c = findComment(post, id); if (!c) return;
        const was = c.likedByMe;
        c.likedByMe = !was; c.likes = (c.likes||0) + (was?-1:1);
        likeBtn2.classList.toggle("is-liked", c.likedByMe);
        likeBtn2.textContent = "♡ " + c.likes;
        try{
          if (was) await supabaseClient.from('comment_likes').delete().eq('comment_id', id).eq('user_id', S.me.id);
          else await supabaseClient.from('comment_likes').insert({ comment_id: id, user_id: S.me.id });
        }catch(err){
          console.error(err);
          c.likedByMe = was; c.likes += was?1:-1;
          likeBtn2.classList.toggle("is-liked", c.likedByMe);
          likeBtn2.textContent = "♡ " + c.likes;
        }
      });
      return;
    }
    const editBtn = e.target.closest("[data-cedit]");
    if (editBtn){
      const id = editBtn.getAttribute("data-cedit");
      const c = findComment(post, id); if (!c) return;
      const textEl = editBtn.closest(".c-body").querySelector("[data-comment-text]");
      const current = c.body;
      const next = window.prompt("Edit your response:", current);
      if (next == null || !next.trim() || next === current) return;
      textEl.textContent = next.trim();
      (async function(){
        try{
          await supabaseClient.from('comments').update({ body: next.trim(), updated_at: new Date().toISOString() }).eq('id', id).eq('author_id', S.me.id);
          c.body = next.trim();
        }catch(err){ console.error(err); textEl.textContent = current; announce("Couldn't save the edit."); }
      })();
      return;
    }
    const delBtn = e.target.closest("[data-cdel]");
    if (delBtn){
      const id = delBtn.getAttribute("data-cdel");
      if (!window.confirm("Delete this response?")) return;
      (async function(){
        try{
          await supabaseClient.from('comments').delete().eq('id', id).eq('author_id', S.me.id);
          removeCommentFromTree(post, id);
          post.commentCount = Math.max(0, post.commentCount - 1);
          refreshCommentsList(scope, post);
        }catch(err){ console.error(err); announce("Couldn't delete — try again."); }
      })();
      return;
    }
    const replyBtn = e.target.closest("[data-reply]");
    if (replyBtn){
      guardAuth(async function(){
        const parentId = replyBtn.getAttribute("data-reply");
        const name = replyBtn.getAttribute("data-reply-name");
        const val = window.prompt("Reply to " + name + ":");
        if (!val || !val.trim()) return;
        try{
          const { data, error } = await supabaseClient.from('comments').insert({
            journal_id: post.id, author_id: S.me.id, body: val.trim(), parent_id: parentId, status: 'visible'
          }).select('id, journal_id, parent_id, author_id, body, created_at, likes, status').single();
          if (error) throw error;
          data.profiles = { display_name: S.me.display_name, username: S.me.username, avatar_url: S.me.avatar_url };
          data.replies = []; data.likedByMe = false;
          const parent = findComment(post, parentId);
          if (parent){ parent.replies = parent.replies || []; parent.replies.push(data); }
          post.commentCount++;
          refreshCommentsList(scope, post);
        }catch(err){ console.error(err); announce("Couldn't post your reply — try again."); }
      });
      return;
    }
    const reportToggle = e.target.closest("[data-creport-toggle]");
    if (reportToggle){
      const menu = reportToggle.closest(".c-body").querySelector(".creport-menu");
      if (menu){
        const willOpen = menu.hidden;
        scope.querySelectorAll(".creport-menu").forEach(function(m){ if (m!==menu) m.hidden = true; });
        menu.hidden = !willOpen;
      }
      return;
    }
    const reasonBtn = e.target.closest("[data-creport]");
    if (reasonBtn){
      announce("Comment reported: " + reasonBtn.dataset.creport + ". Our team will review it.");
      reasonBtn.closest(".creport-menu").hidden = true;
    }
  });
}
function wireCommentToggles(scope){
  scope.querySelectorAll("[data-toggle]").forEach(function(btn){
    btn.onclick = function(){
      const rep = btn.closest(".c-body").querySelector(".replies");
      if (rep){ const open = rep.style.display !== "none"; rep.style.display = open ? "none" : "block"; }
    };
  });
}

/* ============ 6. LOADING / OPENING A POST ============ */
function showLoadError(msg){
  el.pageFront.className = "page front";
  el.pageFront.innerHTML = '<div class="load-state">' + esc(msg) + '<br><br><a href="userpostlogin.html">Back to Discover</a></div>';
}
function flashProgress(){
  el.progress.style.transitionDuration = "0s";
  el.progress.style.width = "0%";
  requestAnimationFrame(function(){
    el.progress.style.transitionDuration = ".25s";
    el.progress.style.width = "100%";
    setTimeout(function(){ el.progress.style.transitionDuration = ".4s"; el.progress.style.width = "0%"; }, 500);
  });
}
function syncUrl(post){
  const qs = post.username ? ('?u='+encodeURIComponent(post.username)+'&s='+encodeURIComponent(post.slug)) : ('?id='+encodeURIComponent(post.id));
  const url = location.pathname + qs;
  if (firstUrlSync){ history.replaceState({ id: post.id }, '', url); firstUrlSync = false; }
  else history.pushState({ id: post.id }, '', url);
}
async function openPost(identifier){
  try{
    const row = (identifier.username && identifier.slug)
      ? await rpcByUsernameSlug(identifier.username, identifier.slug)
      : await rpcById(identifier.id);
    if (!row){ showLoadError("This Work couldn't be found — it may have been removed or made private."); return; }
    const post = await normalizePost(row);
    S.post = post; S.prevRef = null; S.nextRef = null;
    mountPage(el.pageFront, post, "front");
    flashProgress();
    syncUrl(post);
    announce(post.type + " by " + post.author);
    loadNeighbors(post);
  }catch(err){
    console.error(err);
    showLoadError("Something went wrong loading this Work.");
  }
}
window.addEventListener('popstate', function(){
  const p = new URLSearchParams(location.search);
  const u = p.get('u'), s = p.get('s'), id = p.get('id');
  if (!u && !s && !id) return;
  firstUrlSync = true;
  openPost(u && s ? { username:u, slug:s } : { id: id });
});

/* ============ 7. PHYSICS / STATE MACHINE (unchanged mechanics,
   driven by S.prevRef/S.nextRef instead of a fixed POSTS array) ============ */
const NOTCH = 26;
function setCurl(dir, frac){
  const pct = frac*100;
  let clip;
  if (dir === 1){ clip = `polygon(0 0, calc(100% - ${pct}%) 0, calc(100% - ${pct}% - ${NOTCH}px) 50%, calc(100% - ${pct}%) 100%, 0 100%)`; }
  else if (dir === -1){ clip = `polygon(${pct}% 0, 100% 0, 100% 100%, ${pct}% 100%, calc(${pct}% + ${NOTCH}px) 50%)`; }
  else { clip = "none"; }
  el.pageFront.style.clipPath = clip;
  const angle = frac*6*dir;
  el.pageFront.style.transform = `perspective(1800px) rotateY(${-angle}deg)`;
  const edgePct = dir===1 ? (100-pct) : (pct);
  el.foldShadow.style.opacity = frac>0.002 ? 1 : 0;
  const w = 70;
  if (dir===1){
    el.foldShadow.style.background = `linear-gradient(to left, ${foldLo()} 0%, transparent ${w}px)`;
    el.foldShadow.style.left = `calc(${edgePct}% - ${w}px)`; el.foldShadow.style.right = "auto"; el.foldShadow.style.width = w+"px";
  } else if (dir===-1){
    el.foldShadow.style.background = `linear-gradient(to right, ${foldLo()} 0%, transparent ${w}px)`;
    el.foldShadow.style.right = `calc(${100-edgePct}% - ${w}px)`; el.foldShadow.style.left="auto"; el.foldShadow.style.width = w+"px";
  }
}
function foldLo(){ return getComputedStyle(document.documentElement).getPropertyValue('--fold-lo').trim() || "rgba(0,0,0,.3)"; }
function resetCurl(){
  el.pageFront.style.clipPath = "none";
  el.pageFront.style.transform = "none";
  el.foldShadow.style.opacity = 0;
}
function canGo(dir){ return dir===1 ? !!S.nextRef : !!S.prevRef; }
function showBoundary(dir){
  el.hint.textContent = dir===1 ? "You've reached the oldest Work" : "You're already at the newest Work";
  el.hint.classList.add("show");
  clearTimeout(showBoundary._t);
  showBoundary._t = setTimeout(function(){ el.hint.classList.remove("show"); }, 900);
}
function beginDrag(dir, x, y){
  if (S.state !== "idle") return;
  S.state = "dragging"; S.dir = dir; S.dragStartX = x; S.dragStartY = y; S.lastX = x; S.lastT = performance.now();
  el.bookWrap.classList.add("gesture-lock");
  if (canGo(dir)) mountPeek(el.pageBehind, dir===1?S.nextRef:S.prevRef, "behind"); else el.pageBehind.innerHTML = "";
}
function updateDrag(x){
  if (S.state !== "dragging") return;
  const width = el.bookWrap.clientWidth || 860;
  const dx = x - S.dragStartX;
  const liveDir = dx < 0 ? 1 : (dx > 0 ? -1 : S.dir);
  if (liveDir !== S.dir){
    S.dir = liveDir;
    if (canGo(liveDir)) mountPeek(el.pageBehind, liveDir===1?S.nextRef:S.prevRef, "behind"); else el.pageBehind.innerHTML = "";
  }
  let raw = Math.abs(dx) / width;
  const boundary = !canGo(S.dir);
  let frac = boundary ? Math.min(raw*0.35, 0.09) : Math.min(raw, 1);
  const now = performance.now();
  const dt = Math.max(1, now - S.lastT); S.vel = (frac - S.frac) / dt * 16; S.lastX = x; S.lastT = now;
  S.frac = frac; setCurl(S.dir, frac);
}
function endDrag(){
  const boundary = !canGo(S.dir);
  if (boundary){
    S.state = "cancelling";
    animateTo(0, function(){ resetCurl(); S.state="idle"; S.frac=0; el.bookWrap.classList.remove("gesture-lock"); showBoundary(S.dir); });
    return;
  }
  const speedCommit = Math.abs(S.vel) > 0.9 && S.frac > 0.06;
  const distCommit = S.frac > 0.42;
  if (speedCommit || distCommit){
    S.state = "completing";
    animateTo(1, function(){ completeTurn(S.dir); });
  } else {
    S.state = "cancelling";
    animateTo(0, function(){ resetCurl(); S.state="idle"; S.frac=0; el.bookWrap.classList.remove("gesture-lock"); });
  }
}
function animateTo(target, done){
  const start = S.frac, dur = S.reduced ? 1 : 260, t0 = performance.now();
  function step(now){
    const p = Math.min(1, (now-t0)/dur);
    const eased = 1-Math.pow(1-p, 3);
    S.frac = start + (target-start)*eased;
    setCurl(S.dir, S.frac);
    if (p < 1) requestAnimationFrame(step); else done && done();
  }
  requestAnimationFrame(step);
}
async function completeTurn(dir){
  const ref = dir===1 ? S.nextRef : S.prevRef;
  resetCurl();
  el.bookWrap.classList.remove("gesture-lock");
  if (!ref){ S.state = "idle"; S.frac = 0; return; }
  // Promote the already-rendered peek instantly (no blank flash), then
  // hydrate it with the full interactive post once it's fetched.
  el.pageFront.className = "page front";
  el.pageFront.innerHTML = el.pageBehind.innerHTML;
  el.pageBehind.innerHTML = ""; el.pageBehind.className = "page behind";
  S.state = "idle"; S.frac = 0;
  flashProgress();
  await openPost({ id: ref.id, username: ref.username, slug: ref.slug });
}
function goTo(dir){
  if (S.state !== "idle") return;
  if (!canGo(dir)){ showBoundary(dir); return; }
  beginDrag(dir, 0, 0);
  S.state = "completing";
  animateTo(1, function(){ completeTurn(dir); });
}

/* ---- gesture wiring: whole page supports horizontal turning; axis-lock arbitrates vs vertical scroll ---- */
const NO_TURN_SEL = 'button, a, textarea, input, .tag, .comments, .morewrap, [role="menu"]';
function onPointerDown(e){
  if (S.state !== "idle" || S.candidate) return;
  if (e.pointerType === "mouse" && e.button !== 0) return;
  if (e.target.closest(NO_TURN_SEL)) return;
  S.candidate = { startX: e.clientX, startY: e.clientY, pointerId: e.pointerId, committed: false };
}
function onPointerMove(e){
  if (!S.candidate || e.pointerId !== S.candidate.pointerId) return;
  const dx = e.clientX - S.candidate.startX, dy = e.clientY - S.candidate.startY;
  if (!S.candidate.committed){
    if (Math.abs(dx) > 10 && Math.abs(dx) > Math.abs(dy)*1.2){
      S.candidate.committed = true;
      const dir = dx < 0 ? 1 : -1;
      beginDrag(dir, S.candidate.startX, S.candidate.startY);
    } else if (Math.abs(dy) > 10){ S.candidate = null; return; }
    else return;
  }
  if (S.candidate && S.candidate.committed){ e.preventDefault(); updateDrag(e.clientX); }
}
function onPointerUp(e){
  if (!S.candidate || e.pointerId !== S.candidate.pointerId){ return; }
  const wasCommitted = S.candidate.committed;
  S.candidate = null;
  if (wasCommitted) endDrag();
}
el.bookWrap.addEventListener("pointerdown", onPointerDown);
window.addEventListener("pointermove", onPointerMove, {passive:false});
window.addEventListener("pointerup", onPointerUp);
window.addEventListener("pointercancel", onPointerUp);

window.addEventListener("keydown", function(e){
  const tag = (document.activeElement && document.activeElement.tagName) || "";
  if (tag==="TEXTAREA" || tag==="INPUT") return;
  if (e.key==="ArrowRight" || e.key===" "){ e.preventDefault(); goTo(1); }
  else if (e.key==="ArrowLeft"){ e.preventDefault(); goTo(-1); }
});

let wheelLock = false;
el.bookWrap.addEventListener("wheel", function(e){
  const scroller = el.pageFront.querySelector(".page-scroll");
  if (!scroller) return;
  const atBottom = scroller.scrollTop + scroller.clientHeight >= scroller.scrollHeight - 4;
  const atTop = scroller.scrollTop <= 2;
  if (e.deltaY > 12 && atBottom && !wheelLock){ wheelLock=true; goTo(1); setTimeout(function(){wheelLock=false;}, 500); }
  else if (e.deltaY < -12 && atTop && !wheelLock){ wheelLock=true; goTo(-1); setTimeout(function(){wheelLock=false;}, 500); }
}, {passive:true});

let __lastVpWidth = window.innerWidth;
window.addEventListener("resize", function(){
  const w = window.innerWidth;
  if (Math.abs(w - __lastVpWidth) < 2){ return; }
  __lastVpWidth = w;
  if (S.state!=="idle"){ resetCurl(); S.state="idle"; S.frac=0; S.candidate=null; el.pageBehind.innerHTML=""; }
});

/* ============ 8. THEME ============ */
const THEME_KEY = "journals_theme";
function applyTheme(t){
  document.documentElement.setAttribute("data-theme", t);
  localStorage.setItem(THEME_KEY, t);
  document.querySelectorAll(".swatch").forEach(function(s){ s.classList.toggle("active", s.dataset.t===t); });
}
applyTheme(localStorage.getItem(THEME_KEY) || "classic");
el.themeBtn.addEventListener("click", function(){
  const open = el.themePop.classList.toggle("open");
  el.themeBtn.setAttribute("aria-expanded", open);
});
document.querySelectorAll(".swatch").forEach(function(s){
  s.addEventListener("click", function(){
    if (S.state !== "idle") return;
    applyTheme(s.dataset.t);
  });
});
document.addEventListener("click", function(e){
  if (!el.themePop.contains(e.target) && e.target!==el.themeBtn && !el.themeBtn.contains(e.target)){
    el.themePop.classList.remove("open"); el.themeBtn.setAttribute("aria-expanded","false");
  }
});

el.backBtn.addEventListener("click", function(){ window.location.href = "userpostlogin.html"; });

/* ============ 9. BOOT ============ */
async function boot(){
  el.pageFront.className = "page front";
  el.pageFront.innerHTML = '<div class="load-state">Opening this Work…</div>';
  updateProgressIndeterminate();
  if (!supabaseClient){ showLoadError("Couldn't connect — please refresh."); return; }
  try{
    const { data } = await supabaseClient.auth.getSession();
    const session = data && data.session;
    if (session){
      const { data: profile } = await supabaseClient.from('profiles').select('id, username, display_name, avatar_url').eq('id', session.user.id).single();
      S.me = profile || { id: session.user.id, username:'', display_name:'You', avatar_url:null };
    }
  }catch(e){ console.warn('Session restore failed:', e); }
  if (!P_USERNAME && !P_SLUG && !P_ID){ showLoadError("No Work was specified."); return; }
  await openPost(P_USERNAME && P_SLUG ? { username:P_USERNAME, slug:P_SLUG } : { id:P_ID });
}
function updateProgressIndeterminate(){
  el.progress.style.transitionDuration = "0s";
  el.progress.style.width = "40%";
}
boot();

})();

</script>

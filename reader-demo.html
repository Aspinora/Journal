<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Reading — Aspinora</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,340;0,9..144,480;0,9..144,600;1,9..144,420;1,9..144,500&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);

  --paper:#FBF4E4;
  --paper-edge:#E7D9B8;
  --ink:#2A2118;
  --ink-soft:#5B4E3B;
  --ink-faint:#96876C;
  --rule:#D9C9A3;
  --oxblood:#8C3A2E;
  --gilt:#A9863F;
  --stamp-ink:#5B4E3B;
  --shadow:0 30px 70px -20px rgba(30,20,10,.35), 0 2px 0 rgba(30,20,10,.08);
}
:root:not([data-theme="light"]){
  @media (prefers-color-scheme: dark){
    --paper:#1E1811;
    --paper-edge:#0F0C08;
    --ink:#EBE0C8;
    --ink-soft:#C3B396;
    --ink-faint:#7D6F58;
    --rule:#3B3223;
    --oxblood:#C4655A;
    --gilt:#C8A363;
    --stamp-ink:#C3B396;
    --shadow:0 30px 80px -20px rgba(0,0,0,.65), 0 2px 0 rgba(0,0,0,.3);
  }
}
:root[data-theme="dark"]{
  --paper:#1E1811; --paper-edge:#0F0C08; --ink:#EBE0C8; --ink-soft:#C3B396;
  --ink-faint:#7D6F58; --rule:#3B3223; --oxblood:#C4655A; --gilt:#C8A363; --stamp-ink:#C3B396;
  --shadow:0 30px 80px -20px rgba(0,0,0,.65), 0 2px 0 rgba(0,0,0,.3);
}
*{box-sizing:border-box;}
html,body{height:100%;}
body{
  margin:0; background:var(--paper-edge);
  font-family:'Fraunces',Georgia,serif;
  color:var(--ink);
  display:flex; align-items:center; justify-content:center;
  min-height:100%;
  padding:26px 14px calc(26px + env(safe-area-inset-bottom,0px));
  transition:background .4s ease;
  overflow-x:hidden;
}

/* ---------- chrome: back link + theme switch ---------- */
.chrome{
  position:fixed; top:calc(18px + env(safe-area-inset-top,0px)); left:0; right:0;
  display:flex; align-items:center; justify-content:space-between;
  padding:0 20px; z-index:50; pointer-events:none;
}
.back-link{
  pointer-events:auto;
  font-family:'Space Mono',monospace; font-size:12.5px; letter-spacing:.03em;
  color:var(--ink-soft); text-decoration:none; background:none; border:none; cursor:pointer;
  display:flex; align-items:center; gap:7px; padding:8px 10px; border-radius:20px;
  transition:color .2s ease;
}
.back-link:hover{ color:var(--oxblood); }
.back-link svg{ width:14px; height:14px; }

.theme-switch{
  pointer-events:auto; width:46px; height:25px; border-radius:20px; position:relative;
  background:var(--ink-faint); border:1px solid var(--rule); cursor:pointer; padding:0;
  transition:background .3s ease;
}
.theme-switch::after{
  content:'☀'; font-size:12px; line-height:19px; text-align:center;
  position:absolute; top:2px; left:2px; width:19px; height:19px; border-radius:50%;
  background:var(--paper); color:var(--gilt);
  transition:transform .3s cubic-bezier(.6,.2,.2,1);
  box-shadow:0 1px 3px rgba(0,0,0,.3);
}
[data-theme="dark"] .theme-switch::after{ content:'☾'; transform:translateX(21px); }

/* ---------- the book ---------- */
.stage{ perspective:2400px; width:min(560px,94vw); }
.book{
  position:relative; background:var(--paper);
  border-radius:3px; box-shadow:var(--shadow);
  min-height:min(78vh,680px); max-height:88vh;
  transform-style:preserve-3d;
}
.book::before{ /* gutter shadow, spine feel */
  content:''; position:absolute; inset:0 0 0 0; pointer-events:none; border-radius:3px;
  background:linear-gradient(90deg, rgba(0,0,0,.08), transparent 5%, transparent 95%, rgba(0,0,0,.08)),
             radial-gradient(circle at 8% 4%, rgba(0,0,0,.05), transparent 40%);
  z-index:3;
}
.grain{ position:absolute; inset:0; border-radius:3px; pointer-events:none; z-index:2; opacity:.5; mix-blend-mode:multiply;
  background-image:radial-gradient(circle, rgba(90,70,40,.5) .5px, transparent .5px);
  background-size:3px 3px;
}
[data-theme="dark"] .grain{ mix-blend-mode:screen; opacity:.06; background-image:radial-gradient(circle, rgba(255,240,210,.6) .5px, transparent .5px); }

.leaf{
  position:relative; z-index:4; height:100%; padding:52px 44px 34px;
  overflow-y:auto; backface-visibility:hidden; transform-origin:right center;
  transform:rotateY(0deg); opacity:1;
  scrollbar-width:thin;
}
.leaf::-webkit-scrollbar{ width:6px; }
.leaf::-webkit-scrollbar-thumb{ background:var(--rule); border-radius:10px; }

.kind{ font-family:'Space Mono',monospace; font-size:11px; letter-spacing:.14em; color:var(--oxblood); text-transform:uppercase; }
.title{ font-size:clamp(1.7rem,5vw,2.35rem); font-weight:600; line-height:1.14; margin:8px 0 4px; letter-spacing:-.01em; }
.subtitle{ font-style:italic; color:var(--ink-soft); font-size:1rem; margin:0 0 18px; line-height:1.5; }

.byline{ display:flex; align-items:center; gap:12px; padding:16px 0; margin-bottom:20px; border-top:1px solid var(--rule); border-bottom:1px solid var(--rule); }
.avatar{
  width:38px; height:38px; border-radius:50%; flex-shrink:0; object-fit:cover;
  filter:grayscale(1) sepia(.5) contrast(1.05) brightness(.98);
  border:1px solid var(--rule);
}
.byline-text .name{ font-weight:600; font-size:.98rem; font-style:italic; }
.byline-text .meta{ font-family:'Space Mono',monospace; font-size:10.5px; color:var(--ink-faint); margin-top:2px; letter-spacing:.02em; }
.orn{ color:var(--gilt); margin:0 6px; }

.body-text{ font-size:1.05rem; line-height:1.85; text-align:justify; hyphens:auto; color:var(--ink); }
.body-text p{ margin:0 0 1.15em; }
.body-text p:first-of-type::first-letter{
  font-family:'Fraunces',serif; font-weight:600; font-size:3.6em; float:left; line-height:.82;
  padding:.04em .08em 0 0; color:var(--oxblood);
}

.tags{ margin-top:22px; font-family:'Space Mono',monospace; font-size:11px; color:var(--ink-faint); }
.tags span{ color:var(--ink-soft); }

.engage{ display:flex; gap:14px; align-items:center; margin:30px 0 6px; }
.stamp{
  border:1.5px solid var(--stamp-ink); color:var(--stamp-ink); background:none; border-radius:50%;
  width:56px; height:56px; font-family:'Space Mono',monospace; font-size:9.5px; letter-spacing:.02em;
  display:flex; flex-direction:column; align-items:center; justify-content:center; gap:1px;
  cursor:pointer; transform:rotate(-3deg); opacity:.82; transition:transform .18s ease, opacity .18s ease, background .18s ease, color .18s ease;
}
.stamp b{ font-size:14px; font-family:'Fraunces',serif; font-weight:600; }
.stamp:hover{ opacity:1; transform:rotate(-3deg) scale(1.05); }
.stamp.active{ background:var(--oxblood); border-color:var(--oxblood); color:var(--paper); transform:rotate(-3deg) scale(.94); }
.stamp:nth-of-type(2){ transform:rotate(2deg); }
.stamp:nth-of-type(2):hover{ transform:rotate(2deg) scale(1.05); }

.catalog{ margin-top:30px; }
.catalog-h{ font-family:'Space Mono',monospace; font-size:10.5px; letter-spacing:.12em; color:var(--ink-faint); text-transform:uppercase; margin-bottom:10px; }
.card{ border:1px dashed var(--rule); padding:12px 14px; margin-bottom:10px; border-radius:2px; }
.card .who{ font-style:italic; font-weight:600; font-size:.9rem; }
.card .when{ font-family:'Space Mono',monospace; font-size:9.5px; color:var(--ink-faint); float:right; }
.card p{ margin:6px 0 0; font-size:.92rem; line-height:1.55; color:var(--ink-soft); }

.folio{
  position:fixed; bottom:calc(14px + env(safe-area-inset-bottom,0px)); left:0; right:0; text-align:center;
  font-family:'Space Mono',monospace; font-size:11px; color:var(--ink-faint); letter-spacing:.04em; z-index:20; pointer-events:none;
}

.turn{
  position:fixed; top:50%; transform:translateY(-50%); z-index:30;
  width:42px; height:42px; border-radius:50%; border:1px solid var(--rule); background:var(--paper);
  color:var(--ink-soft); font-size:18px; cursor:pointer; box-shadow:0 6px 16px rgba(0,0,0,.15);
  display:flex; align-items:center; justify-content:center; transition:opacity .2s ease, transform .2s ease;
}
.turn:hover{ color:var(--oxblood); }
.turn-prev{ left:max(14px, calc(50% - 340px)); }
.turn-next{ right:max(14px, calc(50% - 340px)); }
@media (max-width:760px){ .turn{ width:36px; height:36px; } .turn-prev{ left:6px; } .turn-next{ right:6px; } }
</style>
</head>
<body>

<div class="chrome">
  <button class="back-link" id="backBtn">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M15 18l-6-6 6-6"/></svg>
    Back to Discover
  </button>
  <button class="theme-switch" id="themeBtn" aria-label="Toggle dark mode"></button>
</div>

<button class="turn turn-prev" id="prevBtn" aria-label="Previous">‹</button>
<button class="turn turn-next" id="nextBtn" aria-label="Next">›</button>

<div class="stage">
  <div class="book" id="book">
    <div class="grain"></div>
    <div class="leaf" id="leaf"></div>
  </div>
</div>

<div class="folio" id="folio"></div>

<script>
const POSTS = [
  {
    kind:'Journal', title:'Salt Air, Late September',
    subtitle:'On the strange comfort of a town that empties out after summer.',
    name:'Aariv Kapoor', date:'Sept 12, 2026', time:'6 min read',
    avatar:'https://api.dicebear.com/7.x/lorelei/svg?seed=Aariv&backgroundType=solid&backgroundColor=e8d9b8',
    tags:['travel','solitude','coast'],
    paras:[
      'The boardwalk stalls are shuttered by the second week of September, and the town gives itself back to the people who actually live here. I like it best this way — half the lights off, half the noise gone, the sea doing most of the talking.',
      'There is a particular kind of quiet that only shows up once the tourists leave: the quiet of a place remembering its own rhythm. Somebody sweeps sand off their porch each morning like clockwork. A dog that is not mine follows me two blocks and then turns back, satisfied.',
      'I keep thinking I came here to write, and instead I have mostly just been listening. Maybe that counts as the same thing.'
    ],
    likes:284, notes:19
  },
  {
    kind:'Shayari', title:'Iss Shehar Mein',
    subtitle:'A short couplet on cities that keep our names longer than our people do.',
    name:'Naila Farooqui', date:'Sept 9, 2026', time:'2 min read',
    avatar:'https://api.dicebear.com/7.x/lorelei/svg?seed=Naila&backgroundType=solid&backgroundColor=e8d9b8',
    tags:['shayari','longing','urdu'],
    paras:[
      'Iss shehar mein har gali ne mera naam seekh liya,\nmagar jab tumhein pukaara, kisi ne suna hi nahi.',
      'Roshni to har chaurahe pe thi, phir bhi\nraasta bhoolne ka ilzaam mujh par hi kyun tha?',
      '— an old grief, dressed up in a new address.'
    ],
    likes:512, notes:41
  },
  {
    kind:'Thought', title:'The Museum of Unsent Texts',
    subtitle:'What we almost say, and why we keep drafting it anyway.',
    name:'Devika Rao', date:'Sept 5, 2026', time:'4 min read',
    avatar:'https://api.dicebear.com/7.x/lorelei/svg?seed=Devika&backgroundType=solid&backgroundColor=e8d9b8',
    tags:['relationships','thoughts'],
    paras:[
      'Somewhere there ought to be an archive for every message typed and deleted before it was sent — the apology composed at 2 a.m., the confession trimmed down to nothing, the "I miss you" that got backspaced into "hope you\'re well."',
      'We treat the unsent draft as failure, proof we lost our nerve. I have started to think of it differently: as a private ledger of who we almost let ourselves be, kept safe from the versions of us that would have to answer for it.',
      'Not every feeling needs a recipient to be true.'
    ],
    likes:398, notes:27
  },
  {
    kind:'Poem', title:'Instructions for Folding a Paper Boat',
    subtitle:'A small poem for anyone still learning how to let a thing go gently.',
    name:'Samuel Oduya', date:'Aug 30, 2026', time:'3 min read',
    avatar:'https://api.dicebear.com/7.x/lorelei/svg?seed=Samuel&backgroundType=solid&backgroundColor=e8d9b8',
    tags:['poetry','grief','water'],
    paras:[
      'Take the squarest piece you have —\nnot the whole grief, just a corner of it.\nCrease it hard enough to remember,\nsoft enough to still call it paper.',
      'Fold twice toward the middle\nthe way you once folded toward safety.\nOpen it like a mouth deciding\nwhether to say the thing at all.',
      'Set it on the water. Do not name it.\nWatch how far a small, brave shape\ncan travel before it asks you\nto follow.'
    ],
    likes:663, notes:58
  }
];

const catalogNotes = [
  ['R. Mehta', '2d ago', 'Read this twice already. The second paragraph undid me a little.'],
  ['T. Chen', '5d ago', 'The kind of piece you bookmark and reread on a bad week.']
];

let i = 0;
let liked = new Set();
const leaf = document.getElementById('leaf');
const folio = document.getElementById('folio');

function render(idx){
  const p = POSTS[idx];
  const isLiked = liked.has(idx);
  leaf.innerHTML = `
    <div class="kind">${p.kind}</div>
    <h1 class="title">${p.title}</h1>
    <p class="subtitle">${p.subtitle}</p>
    <div class="byline">
      <img class="avatar" src="${p.avatar}" alt="">
      <div class="byline-text">
        <div class="name">${p.name}</div>
        <div class="meta">${p.date} <span class="orn">✦</span> ${p.time}</div>
      </div>
    </div>
    <div class="body-text">${p.paras.map(t=>`<p>${t.replace(/\n/g,'<br>')}</p>`).join('')}</div>
    <div class="tags">Filed under: ${p.tags.map(t=>`<span>§ ${t}</span>`).join('  ')}</div>
    <div class="engage">
      <button class="stamp ${isLiked?'active':''}" id="likeStamp"><b>${p.likes + (isLiked?1:0)}</b>IMPRESSION</button>
      <button class="stamp">${p.notes}<b>&nbsp;</b>NOTES</button>
      <button class="stamp">✉<b>&nbsp;</b>SHARE</button>
    </div>
    <div class="catalog">
      <div class="catalog-h">Marginalia — reader notes</div>
      ${catalogNotes.map(c=>`<div class="card"><span class="when">${c[1]}</span><span class="who">${c[0]}</span><p>${c[2]}</p></div>`).join('')}
    </div>
  `;
  document.getElementById('likeStamp').onclick = () => {
    if (liked.has(idx)) liked.delete(idx); else liked.add(idx);
    render(idx);
  };
  folio.textContent = `Page ${idx+1} of ${POSTS.length} · Similar Works`;
  leaf.scrollTop = 0;
}

function turn(dir){
  const nextIdx = dir === 'next' ? (i+1) % POSTS.length : (i-1+POSTS.length) % POSTS.length;
  leaf.style.transition = 'transform .34s cubic-bezier(.5,0,.5,1), opacity .34s ease';
  leaf.style.transform = `rotateY(${dir==='next'?-92:92}deg)`;
  leaf.style.opacity = '0.15';
  setTimeout(() => {
    i = nextIdx;
    render(i);
    leaf.style.transition = 'none';
    leaf.style.transform = `rotateY(${dir==='next'?92:-92}deg)`;
    leaf.style.opacity = '0.15';
    // eslint-disable-next-line no-unused-expressions
    leaf.offsetHeight;
    leaf.style.transition = 'transform .34s cubic-bezier(.2,.6,.3,1), opacity .3s ease';
    leaf.style.transform = 'rotateY(0deg)';
    leaf.style.opacity = '1';
  }, 340);
}

document.getElementById('nextBtn').onclick = () => turn('next');
document.getElementById('prevBtn').onclick = () => turn('prev');

let touchX = null;
document.getElementById('book').addEventListener('touchstart', e => touchX = e.touches[0].clientX);
document.getElementById('book').addEventListener('touchend', e => {
  if (touchX === null) return;
  const dx = e.changedTouches[0].clientX - touchX;
  if (Math.abs(dx) > 60) turn(dx < 0 ? 'next' : 'prev');
  touchX = null;
});

const html = document.documentElement;
const themeBtn = document.getElementById('themeBtn');
try {
  const saved = localStorage.getItem('aspinora-theme-demo');
  if (saved) html.setAttribute('data-theme', saved);
} catch(e) {}
themeBtn.onclick = () => {
  const now = html.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
  html.setAttribute('data-theme', now);
  try { localStorage.setItem('aspinora-theme-demo', now); } catch(e) {}
};

document.getElementById('backBtn').onclick = () => alert('This would return to the Discover feed.');

render(0);
</script>
</body>
</html>

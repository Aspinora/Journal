<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" role="img" aria-labelledby="title desc" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title id="title">Journals — creative writing illustration</title>
<desc id="desc">A lightweight vector scene representing Journals categories: Journals, Stories, Poetry, Shayari, Thoughts, Articles, The Wall and Updates.</desc>
<defs>
 <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FFFDF8"/><stop offset="1" stop-color="#FFF5E8"/></linearGradient>
 <linearGradient id="orange" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FF8A24"/><stop offset="1" stop-color="#E85D00"/></linearGradient>
 <filter id="shadow"><feDropShadow dx="0" dy="10" stdDeviation="14" flood-opacity=".11"/></filter>
 <style>
 .ink{fill:#30302E}.muted{fill:#77736B}.line{stroke:#30302E;stroke-linecap:round;stroke-linejoin:round}
 .float{animation:f 5s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
 .float2{animation:g 6s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
 .pulse{animation:p 3.5s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
 @keyframes f{0%,100%{transform:translateY(0)}50%{transform:translateY(-9px)}}
 @keyframes g{0%,100%{transform:rotate(0)}50%{transform:translate(6px,-7px) rotate(-2deg)}}
 @keyframes p{0%,100%{opacity:.65;transform:scale(1)}50%{opacity:1;transform:scale(1.07)}}
 </style>
</defs>

<rect width="1200" height="900" rx="42" fill="url(#bg)"/>
<circle cx="1030" cy="125" r="165" fill="#FFE7C6" opacity=".45"/>
<circle cx="125" cy="160" r="105" fill="#FFF0D9"/>
<path d="M75 590C300 565 475 592 650 570S980 568 1125 545" fill="none" stroke="#E8D9C7" stroke-width="3"/>

<!-- THE WALL -->
<g filter="url(#shadow)">
 <rect x="575" y="70" width="550" height="445" rx="32" fill="#FBF9F4" stroke="#E6DCCF" stroke-width="3"/>
</g>
<text x="620" y="125" font-family="Georgia,serif" font-size="31" class="ink">the wall</text>
<text x="620" y="151" font-family="Arial,sans-serif" font-size="12" letter-spacing="2" class="muted">small thoughts • shared moments</text>
<circle cx="1065" cy="119" r="8" fill="#E85D00" class="pulse"/>

<!-- WALL CARDS -->
<g class="float" filter="url(#shadow)">
 <rect x="620" y="185" width="190" height="125" rx="18" fill="#FFF0D6" transform="rotate(-3 715 247)"/>
 <circle cx="715" cy="178" r="7" fill="#E85D00"/>
 <text x="650" y="220" font-family="Georgia,serif" font-size="17" class="ink">Thoughts</text>
 <path d="M650 248h125M650 270h96M650 290h110" stroke="#8A806F" stroke-width="6" stroke-linecap="round" opacity=".55"/>
</g>
<g class="float2" filter="url(#shadow)">
 <rect x="845" y="175" width="205" height="145" rx="18" fill="#EAF0DE" transform="rotate(4 948 247)"/>
 <circle cx="948" cy="171" r="7" fill="#8C9A67"/>
 <text x="875" y="215" font-family="Georgia,serif" font-size="17" class="ink">Stories</text>
 <path d="M875 244h135M875 267h108M875 290h128" stroke="#687052" stroke-width="6" stroke-linecap="round" opacity=".55"/>
 <path d="M1010 300c-12-15-31-5-31 9 0 17 31 31 31 31s31-14 31-31c0-14-19-24-31-9Z" fill="#D98A6A" opacity=".7"/>
</g>
<g class="float2" filter="url(#shadow)">
 <rect x="635" y="345" width="195" height="115" rx="18" fill="#F0E7F4" transform="rotate(3 732 402)"/>
 <circle cx="733" cy="340" r="7" fill="#9B82AE"/>
 <text x="667" y="382" font-family="Georgia,serif" font-size="17" class="ink">Poetry</text>
 <path d="M667 410h128M667 431h92" stroke="#78677F" stroke-width="6" stroke-linecap="round" opacity=".55"/>
 <path d="M760 421q20-30 40 0q-20 32-40 0Z" fill="none" stroke="#9B82AE" stroke-width="3"/>
</g>
<g class="float" filter="url(#shadow)">
 <rect x="865" y="350" width="205" height="110" rx="18" fill="#E4EEF7" transform="rotate(-3 967 405)"/>
 <circle cx="967" cy="345" r="7" fill="#6D9DBB"/>
 <text x="897" y="387" font-family="Georgia,serif" font-size="17" class="ink">Articles</text>
 <path d="M897 415h138M897 436h115" stroke="#587B91" stroke-width="6" stroke-linecap="round" opacity=".55"/>
</g>

<!-- floating category labels -->
<g class="float2">
 <rect x="520" y="190" width="42" height="42" rx="12" fill="#E85D00" opacity=".12"/>
 <path d="M531 214h20M531 222h15M531 206h20" stroke="#E85D00" stroke-width="3" stroke-linecap="round"/>
</g>
<g class="pulse">
 <circle cx="1090" cy="490" r="12" fill="#E85D00" opacity=".75"/>
</g>

<!-- BOOK STACK: all major categories -->
<g filter="url(#shadow)">
 <rect x="90" y="570" width="345" height="52" rx="10" fill="#30302E"/>
 <rect x="110" y="622" width="365" height="54" rx="10" fill="#9A654B"/>
 <rect x="85" y="676" width="385" height="57" rx="10" fill="url(#orange)"/>
 <rect x="125" y="733" width="370" height="55" rx="10" fill="#68745E"/>
 <rect x="105" y="788" width="400" height="52" rx="10" fill="#7A6B5D"/>
</g>
<g font-family="Arial,sans-serif" font-size="13" letter-spacing="2" fill="#FFF8ED">
 <text x="125" y="602">THOUGHTS</text>
 <text x="145" y="656">STORIES</text>
 <text x="125" y="711">JOURNALS</text>
 <text x="160" y="768">POETRY</text>
 <text x="137" y="821">ARTICLES</text>
</g>

<!-- SHAYARI card -->
<g class="float" filter="url(#shadow)">
 <rect x="400" y="455" width="185" height="128" rx="20" fill="#FFE8D8" transform="rotate(-5 492 519)"/>
 <circle cx="493" cy="445" r="7" fill="#E85D00"/>
 <text x="432" y="495" font-family="Georgia,serif" font-size="19" class="ink">Shayari</text>
 <path d="M432 520h115M432 542h98" stroke="#9A7762" stroke-width="6" stroke-linecap="round" opacity=".55"/>
 <path d="M542 558c-8-11-23-5-23 7 0 15 23 26 23 26s23-11 23-26c0-12-15-18-23-7Z" fill="#E85D00" opacity=".65"/>
</g>

<!-- UPDATES note -->
<g class="float2" filter="url(#shadow)">
 <rect x="915" y="555" width="165" height="102" rx="17" fill="#F4EEDB"/>
 <circle cx="945" cy="580" r="8" fill="#D2A34E"/>
 <text x="965" y="587" font-family="Arial,sans-serif" font-size="15" font-weight="600" class="ink">Updates</text>
 <path d="M940 612h105M940 633h80" stroke="#847963" stroke-width="6" stroke-linecap="round" opacity=".55"/>
</g>

<!-- OPEN JOURNAL -->
<g filter="url(#shadow)">
 <path d="M75 585Q250 530 420 595L448 795Q275 745 95 798Z" fill="#FFFDF8"/>
 <path d="M448 795Q600 745 755 795L730 590Q585 535 420 595Z" fill="#FFFDF8"/>
 <path d="M420 595Q440 690 448 795" fill="none" stroke="#C5B29C" stroke-width="5"/>
</g>
<g stroke="#777064" stroke-width="5" stroke-linecap="round" opacity=".6">
 <path d="M135 635h215M130 659h240M140 683h185M150 707h205"/>
 <path d="M495 635h165M485 659h195M500 683h145M495 707h175"/>
</g>
<!-- journal category constellation -->
<g font-family="Georgia,serif" class="ink" font-size="15">
 <text x="165" y="748">Journals</text>
 <text x="505" y="748">write freely</text>
</g>
<path d="M570 765q22-36 45 0q22-36 45 0q-22 48-45 48q-23 0-45-48Z" fill="none" stroke="#E85D00" stroke-width="4" opacity=".7"/>

<!-- PEN -->
<g transform="rotate(-8 510 842)">
 <rect x="320" y="830" width="330" height="18" rx="9" fill="#30302E"/>
 <rect x="380" y="830" width="145" height="18" rx="9" fill="url(#orange)"/>
 <path d="M650 830l43 9-43 9Z" fill="#B8A998"/>
</g>

<!-- floating leaves/paper -->
<g class="float">
 <path d="M180 280q-35-35 10-62q25 35-10 62Z" fill="#A7B286"/>
 <path d="M1090 270q-30-28 8-50q22 29-8 50Z" fill="#D5A15C"/>
 <path d="M510 90l45 12-22 42-42-15Z" fill="#FFF" stroke="#E6D9C8" stroke-width="2"/>
</g>

</svg>
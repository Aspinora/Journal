function confirmDialog(o){
  return new Promise(res=>{
    const prev=document.activeElement,sc=document.createElement('div');sc.className='modal-scrim';
    sc.innerHTML=`<div class="modal" role="alertdialog" aria-modal="true" aria-labelledby="mT" aria-describedby="mB"><h2 id="mT">${esc(o.title)}</h2><p id="mB">${esc(o.body)}</p><div class="row"><button class="btn btn--ghost btn--sm" data-m="no">Cancel</button><button class="btn btn--danger btn--sm" data-m="yes">${esc(o.confirm)}</button></div></div>`;
    document.body.appendChild(sc);
    const btns=$$('button',sc);btns[0].focus();
    const done=v=>{sc.remove();document.removeEventListener('keydown',kd,true);prev&&prev.focus&&prev.focus({preventScroll:true});res(v)};
    const kd=e=>{
      if(e.key==='Escape'){e.stopPropagation();done(false)}
      else if(e.key==='Tab'){e.preventDefault();const i=btns.indexOf(document.activeElement);btns[(i+(e.shiftKey?-1:1)+btns.length)%btns.length].focus()}
    };
    document.addEventListener('keydown',kd,true);
    sc.addEventListener('click',e=>{const b=e.target.closest('[data-m]');if(b)done(b.dataset.m==='yes');else if(e.target===sc)done(false)});
  });
}

/* =========================================================
   EVENTS
   ========================================================= */
document.addEventListener('pointerdown',e=>{
  const t=e.target;
  if(MENU&&!MENU.el.contains(t)&&!MENU.btn.contains(t))closeMenu();
  if(POP.kind&&!$('#pop').contains(t)&&!(POP.trigger&&POP.trigger.contains(t)))closePop(false);
});
document.addEventListener('click',e=>{
  const t=e.target;
  const m=t.closest('[data-mact]');if(m&&MENU){handleMenu(m.dataset.mact);return}
  const s=t.closest('[data-set]');if(s){handleSetBtn(s);return}
  const a=t.closest('[data-action]');if(!a)return;
  const act=a.dataset.action;
  switch(act){
    case'exit':if(CONFIG.overviewUrl)location.href=CONFIG.overviewUrl;else toast('In the full site this returns to the Story Overview.');break;
    case'theme-toggle':setTheme(THEME_NEXT[root.dataset.theme]||'sepia');break;
    case'settings':openPop('settings',a);break;
    case'bookmarks':openPop('bookmarks',a);break;
    case'close-pop':closePop();break;
    case'bm-toggle':toggleBookmark();break;
    case'contents':saveReadingState();go('#/');break;
    case'comments':openCP(a.dataset.pid,a);break;
    case'close-comments':closeCP();break;
    case'reply':startReply(a.dataset.id);break;
    case'like':toggleLike(a);break;
    case'menu':{const c=cms.items.find(x=>x.id===a.dataset.id);if(c){if(MENU&&MENU.btn===a)closeMenu();else openMenu(a,c)}break}
    case'cm-send':sendComment();break;
    case'clear-reply':CP.reply=null;updateCompose();$('#cpInput').focus();break;
    case'cm-cancel-edit':CP.edit=null;renderCP(true);break;
    case'cm-save-edit':{const c=cms.items.find(x=>x.id===CP.edit),v=$('#cmEdit').value.trim();if(c&&v){c.body=v;c.edited=true;saveCms()}CP.edit=null;renderCP(true);break}
    case'toggle-vol':{const v=a.closest('.vol'),box=$('.vol__contents',v),open=a.getAttribute('aria-expanded')==='true';a.setAttribute('aria-expanded',String(!open));box.hidden=open;break}
    case'goto-bm':closePop(false);go('#/read/'+a.dataset.ch+(a.dataset.pid?'?p='+a.dataset.pid:''));break;
    case'rm-bm':{data.bookmarks=data.bookmarks.filter(b=>b.id!==a.dataset.id);saveData();$('#pop').innerHTML=bookmarksHTML();updateBookmarkBtn();
      const bb=$('[data-action="bookmarks"]');if(bb){const n=data.bookmarks.length;bb.setAttribute('aria-label',`Bookmarks, ${n} saved`);const bd=$('.badge',bb);if(bd){if(n)bd.textContent=n;else bd.remove()}}
      const f=$('#pop button');f&&f.focus();break}
    case'reset-prefs':withAnchor(()=>{prefs=cleanPrefs({theme:prefs.theme});savePrefs();applyPrefs()});syncSettings();break;
    case'reset-demo':ls.del(kData());ls.del(kCm());initState();LAST_READ=null;toast('Demo data reset');render();break;
    case'stories':openPop('stories',a);break;
    case'switch-demo':switchDemo(+a.dataset.i);break;
    case'retry':render();break;
    case'skip':{const b=$('#chBody');window.scrollTo(0,Math.max(0,absTop(b)-headerH()-16));b.setAttribute('tabindex','-1');b.focus({preventScroll:true});break}
  }
});
document.addEventListener('input',e=>{
  const t=e.target;
  if(t.id==='cpInput'){t.style.height='auto';t.style.height=Math.min(t.scrollHeight,132)+'px';updateCompose()}
  else if(t.dataset&&t.dataset.range){
    const k=t.dataset.range;
    withAnchor(()=>{prefs[k]=+t.value;prefs=cleanPrefs(prefs);savePrefs();applyPrefs()});
    if(k==='size')$('#oSize').textContent=prefs.size+' px';else $('#oLs').textContent=prefs.ls.toFixed(3).replace(/0$/,'')+' em';
  }
});
document.addEventListener('keydown',e=>{
  if(e.key==='Enter'&&(e.metaKey||e.ctrlKey)&&e.target.id==='cpInput'){e.preventDefault();sendComment();return}
  if(e.key==='Escape'){
    if(MENU){closeMenu();return}
    if(POP.kind){closePop();return}
    if(cpOpen())closeCP();
  }
  if(MENU&&(e.key==='ArrowDown'||e.key==='ArrowUp')){
    e.preventDefault();const bs=$$('button:not([disabled])',MENU.el),i=bs.indexOf(document.activeElement);
    bs[(i+(e.key==='ArrowDown'?1:-1)+bs.length)%bs.length].focus();
  }
});
let ticking=false;
addEventListener('scroll',()=>{if(!R||ticking)return;ticking=true;requestAnimationFrame(()=>{ticking=false;updateScroll()})},{passive:true});
['wheel','touchstart','keydown','mousedown'].forEach(t=>addEventListener(t,()=>{if(R)R.touched=true},{passive:true}));
addEventListener('pagehide',()=>{if(R)saveReadingState()});
document.addEventListener('visibilitychange',()=>{if(document.hidden&&R)saveReadingState()});

/* =========================================================
   ROUTER
   ========================================================= */
function parseHash(){
  const m=(location.hash||'#/').match(/^#\/read\/([A-Za-z0-9_-]+)(?:\?p=([A-Za-z0-9_-]+))?/);
  return m?{view:'reader',chId:m[1],pid:m[2]||null}:{view:'structure'};
}
async function render(){
  let r=parseHash();
  closeMenu();closePop(false);
  if(R){saveReadingState();teardownReader()}
  if(STORY.single&&FLAT.length&&!STORY.unavailable)r={view:'reader',chId:FLAT[0].id,pid:r.view==='reader'&&r.chId===FLAT[0].id?r.pid:null}; // one-piece works always open straight into the text
  if(r.view==='reader'&&!byId[r.chId]&&FLAT.length&&!STORY.single)r={view:'structure'};   // unpublished / unknown chapter → contents
  if(r.view==='reader'&&byId[r.chId]&&!STORY.unavailable){document.body.dataset.view='reader';await mountReader(r)}
  else{document.body.dataset.view='structure';mountStructure()}
}
addEventListener('hashchange',render);
applyPrefs();setTheme(prefs.theme,{instant:true});
render();
/* Test/integration hook: swap in another work (same shape as the Writing Studio's) without touching the page. */
window.__reader={chapters:CHAPTERS,images:IMG,demos:DEMOS,switchDemo,loadWork(w){PARSED.clear();loadWork(w);data=emptyData();cms=emptyCms();render()},get story(){return STORY}};

})();
</script>
